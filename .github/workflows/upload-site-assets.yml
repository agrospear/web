name: Upload site assets to R2

on:
  workflow_dispatch:
  # 资源源文件不在 Git 中；通过 workflow_dispatch 在持有本地/受控源文件的环境中上传。

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; skipping asset upload."
          fi

      - name: Upload site assets to R2 when present
        if: steps.guard.outputs.enabled == 'true' && hashFiles('public/assets/videos/**', 'public/assets/quality/**', 'public/assets/products/**', 'public/downloads/**') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: agrospear-files-prod
        run: node scripts/upload-site-assets.mjs --http --missing

      - name: Report external asset source
        if: steps.guard.outputs.enabled == 'false' || hashFiles('public/assets/videos/**', 'public/assets/quality/**', 'public/assets/products/**', 'public/downloads/**') == ''
        run: echo "::notice::No Git-managed assets found. Production assets must already exist in R2 or be uploaded from the approved external source environment."
