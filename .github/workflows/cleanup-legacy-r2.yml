name: Clean up legacy R2 objects

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Set to "yes" to permanently delete objects (dry-run by default)'
        required: false
        default: 'no'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - if: steps.guard.outputs.enabled == 'true'
        name: List legacy objects (dry-run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: agrospear-files-prod
        run: node scripts/delete-legacy-r2-objects.mjs --dry-run

      - if: steps.guard.outputs.enabled == 'true' && inputs.confirm == 'yes'
        name: Delete legacy objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: agrospear-files-prod
        run: node scripts/delete-legacy-r2-objects.mjs --confirm

      - if: steps.guard.outputs.enabled == 'true' && inputs.confirm != 'yes'
        name: Summary
        run: echo "::notice::Dry-run complete. Re-run with confirm=yes to permanently delete the listed objects."
