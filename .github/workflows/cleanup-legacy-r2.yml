name: Clean up legacy R2 objects

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Set to "yes" to permanently delete objects (dry-run by default)'
        required: false
        default: 'no'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.guard.outputs.enabled == 'true'
        name: List legacy objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET="agrospear-files-prod"
          echo "=== R2 Legacy Object Scan ==="
          echo "Bucket: $BUCKET"
          echo ""

          for PREFIX in "site/products" "site/videos"; do
            echo "--- $PREFIX/ ---"
            npx wrangler r2 object list "$BUCKET" --prefix "$PREFIX" --page-size 1000 2>&1 | head -50
            echo ""
          done

      - if: steps.guard.outputs.enabled == 'true' && inputs.confirm == 'yes'
        name: Delete legacy objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET="agrospear-files-prod"
          echo "=== Deleting legacy objects from $BUCKET ==="

          for PREFIX in "site/products" "site/videos"; do
            echo "--- Deleting $PREFIX/ ---"
            KEYS=$(npx wrangler r2 object list "$BUCKET" --prefix "$PREFIX" --page-size 1000 2>&1 | grep -oP '(?<=Key: )\S+' || true)
            COUNT=$(echo "$KEYS" | grep -c . || true)
            echo "  Found $COUNT objects"

            if [ "$COUNT" -gt 0 ]; then
              echo "$KEYS" | while read -r KEY; do
                [ -z "$KEY" ] && continue
                npx wrangler r2 object delete "$BUCKET/$KEY" 2>&1
              done
              echo "  Deleted $COUNT objects from $PREFIX/"
            fi
            echo ""
          done

      - if: steps.guard.outputs.enabled == 'true' && inputs.confirm != 'yes'
        name: Summary
        run: echo "::notice::Dry-run complete. Re-run with confirm=yes to permanently delete the listed objects."
