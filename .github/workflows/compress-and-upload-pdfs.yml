name: Compress & upload PDFs to R2

# Compresses PDF files using Ghostscript (CI), then uploads the smaller
# versions to Cloudflare R2 so the website can serve them via CDN.
#
# Workflow:
#   1. Downloads existing PDFs from R2 (source_prefix) if present
#   2. Compresses them with Ghostscript
#   3. Uploads compressed versions to R2 (target_prefix)
#   4. Optionally deletes the original uncompressed objects
#
# PDFs in public/downloads/ are committed so this workflow can process them directly.
# Set source_prefix when reprocessing PDFs that already exist in R2.

on:
  workflow_dispatch:
    inputs:
      source_prefix:
        description: 'Optional R2 prefix to download PDFs from; leave empty to use public/downloads from checkout'
        required: false
        default: ''
      quality:
        description: 'Compression quality: screen (72dpi/small), ebook (150dpi/balanced), printer (300dpi/high)'
        required: false
        default: 'ebook'
        type: choice
        options:
          - screen
          - ebook
          - printer
      target_prefix:
        description: 'R2 prefix to upload compressed PDFs to'
        required: false
        default: 'site/downloads/qcqa'
      dry_run:
        description: 'Preview only — compress but do not upload to R2'
        required: false
        default: 'false'
        type: boolean
      delete_originals:
        description: 'After upload, delete original (uncompressed) objects from R2'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Ghostscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript
          gs --version

      - name: Download PDFs from R2
        if: inputs.source_prefix != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CF_PROD_R2_BUCKET || 'agrospear-files-prod' }}
        run: |
          SOURCE_PREFIX="${{ inputs.source_prefix }}"
          DEST_DIR="dist/source-pdfs"
          mkdir -p "$DEST_DIR"

          echo "=== Downloading PDFs from R2: ${SOURCE_PREFIX}/ ==="

          # List objects using wrangler
          KEYS=$(npx wrangler r2 object list "$R2_BUCKET" --prefix "$SOURCE_PREFIX" --page-size 1000 2>&1 | grep -oP '(?<=Key: )\S+\.pdf' || true)

          if [ -z "$KEYS" ]; then
            echo "::warning::No PDFs found at ${SOURCE_PREFIX}/ in R2."
            echo "If this is the first upload, use the upload-site-assets workflow first."
            exit 1
          fi

          DOWNLOADED=0
          FAILED=0
          while IFS= read -r KEY; do
            [ -z "$KEY" ] && continue
            FILENAME=$(basename "$KEY")
            HTTP_CODE=$(curl -s -o "${DEST_DIR}/${FILENAME}" -w "%{http_code}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${KEY}")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✓ ${FILENAME}"
              DOWNLOADED=$((DOWNLOADED + 1))
            else
              echo "  ✗ ${FILENAME} (HTTP ${HTTP_CODE})"
              rm -f "${DEST_DIR}/${FILENAME}"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$KEYS"

          echo ""
          echo "Downloaded ${DOWNLOADED} PDF(s), ${FAILED} failed"

      - name: Compress PDFs
        run: |
          echo "=== PDF Compression ==="
          echo "Quality: ${{ inputs.quality }}"
          echo "Output: dist/compressed"
          echo ""

          # Determine source: downloaded from R2 or committed local directory
          if [ -d "dist/source-pdfs" ] && [ "$(find dist/source-pdfs -type f -iname '*.pdf' 2>/dev/null | wc -l)" -gt 0 ]; then
            SOURCE="dist/source-pdfs"
          elif [ -d "public/downloads" ] && [ "$(find public/downloads -type f -iname '*.pdf' 2>/dev/null | wc -l)" -gt 0 ]; then
            SOURCE="public/downloads"
          else
            echo "::error::No PDF files found in dist/source-pdfs or public/downloads"
            exit 1
          fi

          echo "Source: $SOURCE"
          echo ""

          node scripts/compress-pdfs.mjs \
            --src "$SOURCE" \
            --out dist/compressed \
            --quality "${{ inputs.quality }}"

      - name: Show compression summary
        run: |
          echo "=== Compressed files ==="
          find dist/compressed -name "*.pdf" -exec ls -lh {} \;
          echo ""
          echo "=== Manifest ==="
          cat dist/compressed/manifest.json 2>/dev/null || echo "No manifest"

      - name: Upload compressed PDFs to R2
        if: inputs.dry_run != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CF_PROD_R2_BUCKET || 'agrospear-files-prod' }}
        run: |
          TARGET_PREFIX="${{ inputs.target_prefix }}"
          TARGET_PREFIX="${TARGET_PREFIX%/}"
          UPLOADED=0
          FAILED=0
          TOTAL=0

          while IFS= read -r file; do
            TOTAL=$((TOTAL + 1))
            REL_PATH="${file#dist/compressed/}"
            R2_KEY="${TARGET_PREFIX}/${REL_PATH}"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/pdf" \
              -H "Cache-Control: public, max-age=31536000, immutable" \
              --data-binary "@${file}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${R2_KEY}")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "  ✓ ${R2_KEY}"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "  ✗ ${R2_KEY} (HTTP ${HTTP_CODE})"
              FAILED=$((FAILED + 1))
            fi
          done < <(find dist/compressed -name "*.pdf" | sort)

          echo ""
          echo "Upload complete: ${UPLOADED}/${TOTAL} uploaded, ${FAILED} failed"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} PDF(s) failed to upload"
            exit 1
          fi

      - name: Delete original (uncompressed) PDFs from R2
        if: inputs.dry_run != 'true' && inputs.delete_originals == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CF_PROD_R2_BUCKET || 'agrospear-files-prod' }}
        run: |
          SOURCE_PREFIX="${{ inputs.source_prefix }}"
          TARGET_PREFIX="${{ inputs.target_prefix }}"

          if [ -z "$SOURCE_PREFIX" ]; then
            echo "No R2 source_prefix supplied; local checkout was used, so there are no downloaded originals to delete."
            exit 0
          fi

          if [ "$SOURCE_PREFIX" = "$TARGET_PREFIX" ]; then
            echo "Source and target prefixes are the same — skipping delete to avoid removing compressed files."
            echo "To replace originals, run with source_prefix != target_prefix, then delete originals."
            exit 0
          fi

          echo "=== Deleting original PDFs from ${SOURCE_PREFIX}/ ==="
          KEYS=$(npx wrangler r2 object list "$R2_BUCKET" --prefix "$SOURCE_PREFIX" --page-size 1000 2>&1 | grep -oP '(?<=Key: )\S+\.pdf' || true)

          if [ -z "$KEYS" ]; then
            echo "No objects to delete."
            exit 0
          fi

          DELETED=0
          while IFS= read -r KEY; do
            [ -z "$KEY" ] && continue
            npx wrangler r2 object delete "$R2_BUCKET/$KEY" 2>&1
            DELETED=$((DELETED + 1))
          done <<< "$KEYS"

          echo "Deleted ${DELETED} object(s) from ${SOURCE_PREFIX}/"

      - name: Dry-run summary
        if: inputs.dry_run == 'true'
        run: |
          echo "=== DRY RUN — PDFs compressed but not uploaded ==="
          echo ""
          echo "Compression completed without upload. Re-run with dry_run=true only for a preview."
          echo "To delete old originals, set delete_originals=true"
          echo "  (requires source_prefix != target_prefix)"

      - name: Upload compressed PDFs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compressed-pdfs-${{ inputs.quality }}
          path: dist/compressed/
          retention-days: 7
