faqs:
  - q: Where is your company and factory located?
    a: >-
      We are based in Qingdao, China. Agrospear is the B2B manufacturing brand operated by Qingdao Vatrad Group Co., Ltd.,
      the manufacturing division of Qingdao Vatrad Group Co., Ltd. — a
      20,000 m² agrochemical formulation plant in the Laixi Economic
      Development Zone, producing since 2012. Sales and technical support are
      global; production is in Qingdao, China.
  - q: Does Agrospear provide OEM/ODM services for agrochemical formulations?
    a: >-
      Yes. Agrospear (backed by Qingdao Vatrad Group Co., Ltd.) offers full-scale
      OEM and ODM customization — from formulation design and active ingredient
      selection to bulk production for global brands. We handle private labeling,
      custom packaging, and compliance documentation for ICAMA, FAO/WHO, and other registrations.
  - q: What certifications does Agrospear hold for agrochemical manufacturing?
    a: >-
      Agrospear's factory holds ISO 9001, ISO 14001, and BSCI certification. ICAMA
      registration applies to formulations destined for China and export markets; scope
      is confirmed per project and varies by target market and product configuration.
      REACH and FAO/WHO compliance documentation is available on request.
  - q: What is the minimum order quantity (MOQ) for OEM agrochemical formulations?
    a: >-
      MOQ is confirmed by project configuration rather than a fixed number: every
      project moves through sample (1–4 tons) and pilot (5 tons) stages,
      with standard volume production running 20+ tons per batch. Co-branding
      starts at lower quantities. See our MOQ & Flexible Branding Guide for the
      full calculation logic.
  - q: Which formulations does Agrospear specialize in?
    a: >-
      We specialize in SC (Suspension Concentrate), EC (Emulsifiable Concentrate),
      WP (Wettable Powder), WDG (Water Dispersible Granule), SL (Soluble Liquid),
      ME (Microemulsion), CS (Capsule Suspension), and FS (Flowable Concentrate
      for Seed Treatment). Raw materials are sourced from certified suppliers and
      tested for active content, impurity profile, and physical-chemical properties
      before production.
  - q: Can Agrospear handle large-volume wholesale orders for international buyers?
    a: >-
      Yes. Our 20,000 m² factory produces over 50,000+ tons annually with a
      dedicated team of 200+ skilled workers. We ship to 50+ countries and
      manage logistics including FOB Qingdao, CIF major ports, and door-to-door
      delivery through our freight partners.
  - q: What is the lead time for OEM agrochemical production?
    a: >-
      Standard OEM production lead time is 25–35 days from confirmed PO and
      deposit. Custom formulation development adds 15–20 days for lab work and
      stability testing, and prototype samples ship within 7–14 days. Rush orders
      available for established partners with confirmed raw material stock.
  - q: Does Agrospear supply high-purity technical grade active ingredients?
    a: >-
      Yes. Our technical grade active ingredients meet FAO/WHO specifications
      with purity levels exceeding 95%. Each batch undergoes HPLC/GC analysis
      for active content, impurity profiling, and physical-chemical property
      verification — meeting the factory's quality integrity standard.
  - q: How does Agrospear ensure the stability and shelf life of its formulations?
    a: >-
      Every formulation undergoes accelerated stability testing at 54°C for 14 days
      and long-term stability at ambient conditions before shipment; batches exceeding
      the permissible degradation range are auto-rejected. Physical-chemical properties
      are validated via HPLC, GC, and laser particle size analysis. Our formulations
      include stabilizers and anti-settling agents for long-term storage durability.
  - q: Can Agrospear help with packaging design and private-label branding?
    a: >-
      Yes. We offer turnkey private-label packaging: custom-designed drums,
      bottles, and bags with your brand artwork. Our in-house design team can
      develop full-brand visual identity for new market entrants — from label
      design to regulatory compliance artwork.
  - q: Does Agrospear accept factory audits from international buyers?
    a: >-
      Absolutely. We welcome on-site and third-party factory audits including
      BSCI, SMETA, and customer-specific quality inspections. Our 20,000 m²
      facility is audit-ready with documented QC processes, material
      traceability, and worker health & safety records. Virtual factory tours
      available for initial qualification.
  - q: What formulation technologies does Agrospear use?
    a: >-
      Agrospear specializes in advanced formulation technologies including high-shear
      milling for SC/FS, emulsification systems for EC/ME, spray drying for WDG, and
      air-flow milling for WP. Our SC formulations use proprietary anti-settling
      systems for superior suspension stability vs. conventional formulations.
  - q: What crops do your formulations target?
    a: >-
      Buyers typically start with row crop formulations (corn, soybean, wheat, rice)
      that are versatile for broad-acre application. We also configure fruit tree
      and vegetable programs for specialty crops. Formulation selection is reviewed
      against your target crops and pest spectrum before sampling.
  - q: What application methods do your formulations support?
    a: >-
      Agrospear formulations are built for foliar spray, soil application, seed
      treatment, and chemigation. SC and EC formulations handle standard spray
      equipment, and all formulations meet WHO hazard class requirements for
      operator safety. For specific application methods, we recommend the
      standard dilution and application guidance supplied with each order.
  - q: Do you supply adjuvants and spray additives for commercial programs?
    a: >-
      Yes. Commercial programs include surfactants, stickers, and drift control
      agents compatible with our formulations. Adjuvant selection, spray equipment
      recommendations, and mixing instructions are confirmed as part of the
      technical specification for each project.
  - q: How are formulations packed for shipping and delivery?
    a: >-
      Volume production ships in 200L HDPE drums, 20L jerry cans, or custom
      packaging per market. For retail programs we provide branded labels,
      safety data sheets, barcode and carton marking per market, and can
      stage palletized shipments so every delivery arrives with consistent
      packaging.
  - q: What is the shelf life of your formulations?
    a: >-
      Standard formulations maintain specification for 24 months from
      manufacture when stored as directed. SC formulations maintain
      suspensibility below 5% sediment; EC formulations maintain emulsion
      stability. Shelf life and storage conditions are specified per
      formulation in the technical datasheet before you commit to a run.
  - q: What does a complete OEM program include?
    a: >-
      A complete program typically includes the formulated product, private-label
      packaging, safety data sheets, certificate of analysis, and ICAMA/FAO
      registration documentation, with optional adjuvant and application
      equipment recommendations. Program contents are locked in the customer
      approval specification so sample and volume production match exactly.
  - q: Can you bundle formulations, adjuvants and packaging into one program?
    a: >-
      Yes. Multi-SKU programs cover formulations, adjuvants and retail packaging
      under one factory contract — shared registration documentation reduces
      per-SKU cost, one quality system keeps standards consistent, and a single
      quality owner handles warranty claims. This is how our distributors and
      partners run complete agrochemical lines.
  - q: What is the difference between OEM, ODM and private label?
    a: >-
      OEM means we manufacture to your approved specification — your active
      ingredients, formulation type, concentration and packaging. You own the
      registration and intellectual property. ODM means our R&D team develops
      the formulation from your brief — whether a market concept, target pest
      or adaptation of a proven platform — and you approve before production.
      Private label means your brand, labels and packaging on an existing
      validated formulation with no compositional changes. Most projects land
      between these modes, and we quote the configuration that matches how
      much of the product design you want to own.
  - q: How much does a prototype sample cost, and can the fee be applied to the order?
    a: >-
      Sample pricing follows the project configuration: active ingredient,
      formulation type, packaging and artwork all affect the quote. For
      projects that move to volume production, the sample fee is typically
      credited against the first production order — the credit terms are
      confirmed in writing at quotation stage so there are no surprises later.
  - q: How many drums of formulated product fit in a 20ft container?
    a: >-
      On standard 200L HDPE drums, a 20ft container typically carries
      80–100 drums — the exact count depends on formulation density,
      packaging type and pallet configuration. Our logistics team calculates
      the load plan from your actual bill of materials, so the number you
      plan against is the number that ships.
  - q: What do your wholesale quotes include — FOB or CIF?
    a: >-
      Quotations are itemized: product, standard packaging and freight under
      your chosen incoterm. FOB Qingdao is the default basis, with CIF to
      major ports and door-to-door delivery available through our freight
      partners. Every quote states the exact scope of what is included, so
      you are not comparing apples to oranges across suppliers.
  - q: Do you charge development fees for custom formulations?
    a: >-
      Formulation development is quoted per project; lab work, stability
      testing and pilot batches are itemized at quotation stage. Where
      development fees apply, the cost is typically amortized across the
      first production run rather than charged as a one-off surprise.
  - q: What payment terms do you apply to production orders?
    a: >-
      Standard terms are a deposit to lock production, with the balance due
      before shipment. The deposit percentage and balance timing are agreed
      per order and stated in the contract. Established partners with
      consistent order history can discuss extended terms — we prefer a few
      honest terms over complicated financing structures.
  - q: What warranty do you provide on bulk orders?
    a: >-
      Every batch undergoes quality analysis with Certificate of Analysis
      before shipment, and warranty terms are written into each order
      contract — they cover manufacturing defects such as active content
      deviation, physical property failure, and packaging integrity,
      and exclude storage-related degradation. The warranty period and
      claim procedure are confirmed on the purchase order, not discovered
      later.
  - q: What happens if products arrive damaged or with quality issues?
    a: >-
      Report the issue within the agreed window (typically 7–14 days of
      arrival) with photos or lab test results. We assess against the
      pre-shipment analysis certificate kept for your batch, then rework,
      replace or credit accordingly. The documented QC records of your
      stock make this fast and fair for both sides.
  - q: How is custom artwork approved before production?
    a: >-
      Labels and packaging go through a controlled approval chain: digital
      mockup, printed proof, first article inspection on the production
      batch, then volume production. Each step is checked against your
      signed artwork, which is why label design, hazard symbols and
      regulatory text match your brand file when the products land.
  - q: What spare materials do you supply for ongoing programs?
    a: >-
      Partners can order replacement labels, empty drums, and supplementary
      documentation with their production or on reorders: blank labels,
      safety data sheets, certificate of analysis templates, and the most
      commonly reordered packaging. Spare materials ship alongside production
      or as small consignments, so a missing component never holds up
      delivery.
  - q: What information should I prepare before requesting a quote?
    a: >-
      The better the brief, the faster the quote: target market and crop,
      desired specifications (active ingredient, formulation type,
      concentration), quantity and target price, branding and packaging
      needs, and your launch timeline. Our inquiry form collects exactly
      this list — sharing it saves quotation rounds and gets you a firmer
      estimate on the first pass.
  - q: How long does sampling take before production?
    a: >-
      Prototype samples ship within 7–14 days once the formulation
      specification is frozen. Add review time for your testing and any
      revision round — most projects complete sampling in about two to
      three weeks. Production starts after sample approval, so the sample
      stage is the one place where extra care pays off in time saved later.
