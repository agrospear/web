faqs:
  - q: ¿Dónde están ubicadas su empresa y su fábrica?
    a: >-
      Estamos en Qingdao, China. Agrospear es la marca B2B de fabricación operada por Qingdao Vatrad Group Co., Ltd., la
      división de fabricación de Qingdao Vatrad Group Co., Ltd. — una planta
      de formulación agroquímica de 20.000 m² en la Zona de Desarrollo
      Económico de Laixi, en producción desde 2012. El soporte comercial y
      técnico es global; la producción está en Qingdao, China.
  - q: ¿Proporciona Agrospear servicios OEM/ODM para formulaciones agroquímicas?
    a: >-
      Sí. Agrospear (respaldo de Qingdao Vatrad Group Co., Ltd.) ofrece
      personalización OEM y ODM a gran escala — desde diseño de formulación y
      selección de ingrediente activo hasta la producción en volumen para marcas
      globales. Gestionamos la etiqueta privada, el embalaje personalizado y la
      documentación de cumplimiento para ICAMA, FAO/OMS y otros registros.
  - q: ¿Qué certificaciones mantiene Agrospear para la fabricación agroquímica?
    a: >-
      La fábrica de Agrospear cuenta con certificación ISO 9001, ISO 14001 y
      BSCI. El registro ICAMA aplica a formulaciones destinadas a China y mercados
      de exportación; el alcance se confirma por proyecto y varía según mercado
      objetivo y configuración del producto. Documentación de cumplimiento REACH
      y FAO/OMS disponible bajo petición.
  - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para formulaciones agroquímicas OEM?
    a: >-
      El MOQ se confirma según la configuración del proyecto, no con un número
      fijo: cada proyecto pasa por las etapas de muestra (1–4 toneladas) y
      piloto (5 toneladas), con una producción de volumen estándar de 20+
      toneladas por lote. El co-branding parte de cantidades menores. Consulta
      nuestra Guía de MOQ y Branding Flexible para la lógica de cálculo completa.
  - q: ¿En qué formulaciones se especializa Agrospear?
    a: >-
      Nos especializamos en SC (Concentrado en Suspensión), EC (Concentrado
      Emulsionable), WP (Polvo Mojable), WDG (Gránulo Dispersable en Agua),
      SL (Líquido Soluble), ME (Microemulsión), CS (Suspensión de Cápsulas) y
      FS (Concentrado Fluidificable para Tratamiento de Semillas). Las materias
      primas se obtienen de proveedores certificados y se analizan en cuanto a
      contenido activo, perfil de impurezas y propiedades fisicoquímicas antes
      de la producción.
  - q: ¿Puede Agrospear gestionar pedidos mayoristas de gran volumen para compradores internacionales?
    a: >-
      Sí. Nuestra fábrica de 20.000 m² produce más de 20.000 toneladas al año con
      un equipo dedicado de más de 350 trabajadores cualificados. Enviamos a más de
      50 países y gestionamos la logística, incluidos FOB Qingdao, CIF a los
      principales puertos y la entrega puerta a puerta a través de nuestros socios
      de transporte.
  - q: ¿Cuál es el plazo de entrega para la producción OEM agroquímica?
    a: >-
      El plazo estándar de producción OEM es de 25–35 días desde la confirmación
      del pedido y el depósito. El desarrollo de formulación personalizada añade
      15–20 días para trabajo de laboratorio y pruebas de estabilidad, y las
      muestras de prototipo se envían en 7–14 días. Pedidos urgentes disponibles
      para socios establecidos con stock de materia prima confirmado.
  - q: ¿Suministra Agrospear ingredientes activos técnicos de alta pureza?
    a: >-
      Sí. Nuestros ingredientes activos técnicos cumplen las especificaciones
      FAO/OMS con niveles de pureza superiores al 95%. Cada lote se analiza por
      HPLC/GC para contenido activo, perfil de impurezas y verificación de
      propiedades fisicoquímicas — cumpliendo el estándar de integridad de
      calidad de la fábrica.
  - q: ¿Cómo garantiza Agrospear la estabilidad y la vida útil de sus formulaciones?
    a: >-
      Cada formulación se somete a pruebas de estabilidad acelerada a 54 °C
      durante 14 días y estabilidad a largo plazo en condiciones ambientales
      antes del envío; los lotes que superan el rango de degradación permisible
      se rechazan automáticamente. Las propiedades fisicoquímicas se validan
      mediante HPLC, GC y análisis de tamaño de partícula por láser. Nuestras
      formulaciones incluyen estabilizantes y agentes anti-sedimentación para
      una durabilidad de almacenamiento a largo plazo.
  - q: ¿Puede Agrospear ayudar con el diseño del embalaje y la marca de etiqueta privada?
    a: >-
      Sí. Ofrecemos embalaje de etiqueta privada llave en mano: tambores,
      bidones y bolsas de diseño personalizado con el arte de tu marca. Nuestro
      equipo de diseño interno puede desarrollar una identidad visual completa
      para nuevos entrantes al mercado — desde el diseño de etiquetas hasta el
      arte de cumplimiento reglamentario.
  - q: ¿Acepta Agrospear auditorías de fábrica de compradores internacionales?
    a: >-
      Por supuesto. Damos la bienvenida a las auditorías de fábrica in situ y de
      terceros, incluidas BSCI, SMETA e inspecciones de calidad específicas del
      cliente. Nuestra instalación de 20.000 m² está lista para auditorías con
      procesos de control de calidad documentados, trazabilidad de materiales y
      registros de salud y seguridad de los trabajadores. Visitas virtuales a
      la fábrica disponibles para la cualificación inicial.
  - q: ¿Qué tecnologías de formulación utiliza Agrospear?
    a: >-
      Agrospear se especializa en tecnologías de formulación avanzadas, incluidas
      molienda de alto corte para SC/FS, sistemas de emulsificación para EC/ME,
      secado por atomización para WDG y molienda por flujo de aire para WP.
      Nuestras formulaciones SC utilizan sistemas anti-sedimentación
      patentados para una estabilidad de suspensión superior frente a las
      formulaciones convencionales.
  - q: ¿Qué cultivos abordan sus formulaciones?
    a: >-
      Los compradores suelen empezar con formulaciones para cultivos extensivos
      (maíz, soja, trigo, arroz) versátiles para aplicación en gran escala.
      También configuramos programas para frutales y hortalizas de cultivos
      especiales. La selección de formulación se revisa contra tus cultivos
      objetivo y espectro de plagas antes del muestreo.
  - q: ¿Qué métodos de aplicación admiten sus formulaciones?
    a: >-
      Las formulaciones Agrospear están diseñadas para aspersión foliar,
      aplicación al suelo, tratamiento de semillas y quimigación. Las
      formulaciones SC y EC son compatibles con equipos de aspersión estándar,
      y todas las formulaciones cumplen los requisitos de clase de peligro de la
      OMS para la seguridad del operador. Para métodos de aplicación específicos,
      recomendamos la guía estándar de dilución y aplicación que acompaña cada
      pedido.
  - q: ¿Suministran coadyuvantes y aditivos de aspersión para programas comerciales?
    a: >-
      Sí. Los programas comerciales incluyen surfactantes, adherentes y agentes
      de control de deriva compatibles con nuestras formulaciones. La selección
      de coadyuvantes, las recomendaciones de equipos de aspersión y las
      instrucciones de mezcla se confirman como parte de la especificación
      técnica de cada proyecto.
  - q: ¿Cómo se empaquetan las formulaciones para el envío y la entrega?
    a: >-
      La producción en volumen se envía en tambores de PEAD de 200 L, bidones
      de 20 L o embalaje personalizado según mercado. Para programas minoristas
      proporcionamos etiquetas con marca, fichas de datos de seguridad, código
      de barras y marcado de cartón por mercado, y podemos preparar envíos
      paletizados para que cada entrega llegue con embalaje consistente.
  - q: ¿Cuál es la vida útil de sus formulaciones?
    a: >-
      Las formulaciones estándar mantienen la especificación durante 24 meses
      desde la fabricación cuando se almacenan según las indicaciones. Las
      formulaciones SC mantienen la suspensibilidad por debajo del 5 % de
      sedimento; las formulaciones EC mantienen la estabilidad de la emulsión.
      La vida útil y las condiciones de almacenamiento se especifican por
      formulación en la ficha técnica antes de comprometer una serie de
      producción.
  - q: ¿Qué incluye un programa OEM completo?
    a: >-
      Un programa completo incluye normalmente el producto formulado, embalaje
      de etiqueta privada, fichas de datos de seguridad, certificado de análisis
      y documentación de registro ICAMA/FAO, con opciones de coadyuvantes y
      recomendaciones de equipos de aplicación. El contenido del programa queda
      fijado en la especificación aprobada para que la muestra y la producción
      en volumen coincidan exactamente.
  - q: ¿Pueden combinar formulaciones, coadyuvantes y embalaje en un solo programa?
    a: >-
      Sí. Los programas multi-SKU cubren formulaciones, coadyuvantes y embalaje
      minorista bajo un único contrato de fábrica — la documentación de registro
      compartida reduce el coste por SKU, un único sistema de calidad mantiene
      la coherencia de estándares y un único responsable de calidad gestiona las
      reclamaciones de garantía. Así es como nuestros distribuidores y socios
      gestionan líneas agroquímicas completas.
  - q: ¿Cuál es la diferencia entre OEM, ODM y etiqueta privada?
    a: >-
      OEM significa que fabricamos según tu especificación aprobada — tus
      ingredientes activos, tipo de formulación, concentración y embalaje. Tú
      eres propietario del registro y la propiedad intelectual. ODM significa
      que nuestro equipo de I+D desarrolla la formulación a partir de tu brief —
      ya sea un concepto de mercado, plaga objetivo o adaptación de una
      plataforma probada — y tú apruebas antes de la producción. Etiqueta
      privada significa tu marca, etiquetas y embalaje en una formulación
      existente validada sin cambios de composición. La mayoría de los proyectos
      se sitúa entre estos modos, y presupuestamos la configuración que encaja
      con cuánto del diseño del producto quieres mantener en tu control.
  - q: ¿Cuánto cuesta una muestra de prototipo y se puede descontar del pedido?
    a: >-
      El precio de la muestra sigue la configuración del proyecto: ingrediente
      activo, tipo de formulación, embalaje y arte afectan a la cotización.
      Para proyectos que pasan a producción en volumen, la cuota de muestra
      suele acreditarse contra el primer pedido de producción — las condiciones
      del crédito se confirman por escrito en la fase de cotización para que no
      haya sorpresas después.
  - q: ¿Cuántos tambores de producto formulado caben en un contenedor de 20 pies?
    a: >-
      Con tambores estándar de PEAD de 200 L, un contenedor de 20 pies
      transporta típicamente entre 80 y 100 tambores — el número exacto depende
      de la densidad de la formulación, el tipo de embalaje y la configuración
      del palet. Nuestro equipo de logística calcula el plan de carga a partir
      de tu lista de materiales real, de modo que el número con el que
      planificas es el número que se envía.
  - q: ¿Qué incluyen sus cotizaciones mayoristas — FOB o CIF?
    a: >-
      Las cotizaciones están desglosadas: producto, embalaje estándar y flete
      bajo tu incoterm elegido. FOB Qingdao es la base por defecto, con CIF a
      los principales puertos y entrega puerta a puerta disponibles a través de
      nuestros socios de transporte. Cada cotización indica el alcance exacto de
      lo que incluye, de modo que no compares ofertas de proveedores distintos
      con criterios diferentes.
  - q: ¿Cobran tarifas de desarrollo para formulaciones personalizadas?
    a: >-
      El desarrollo de formulación se cotiza por proyecto; el trabajo de
      laboratorio, las pruebas de estabilidad y los lotes piloto se detallan en
      la fase de cotización. Cuando aplican tarifas de desarrollo, el coste se
      amortiza normalmente en la primera serie de producción en lugar de
      cobrarse como un cargo puntual inesperado.
  - q: ¿Qué condiciones de pago aplican a los pedidos de producción?
    a: >-
      Las condiciones estándar son un depósito para fijar la producción, con el
      saldo pagadero antes del envío. El porcentaje del depósito y el calendario
      del saldo se acuerdan por pedido y se indican en el contrato. Los socios
      establecidos con historial de pedidos constante pueden hablar de
      condiciones ampliadas — preferimos pocas condiciones claras antes que
      estructuras financieras complicadas.
  - q: ¿Qué garantía ofrecen en pedidos por volumen?
    a: >-
      Cada lote se analiza con Certificado de Análisis antes del envío, y las
      condiciones de garantía se escriben en cada contrato de pedido — cubren
      defectos de fabricación como desviación del contenido activo, fallos de
      propiedades físicas e integridad del embalaje, y excluyen la degradación
      por almacenamiento. El período de garantía y el procedimiento de
      reclamación se confirman en la orden de compra, no se descubren después.
  - q: ¿Qué pasa si los productos llegan dañados o con problemas de calidad?
    a: >-
      Informa del problema dentro del plazo acordado (normalmente 7–14 días
      desde la llegada) con fotos o resultados de laboratorio. Evaluamos la
      reclamación contra el certificado de análisis pre-envío de tu lote y luego
      se re-elabora, repone o abona en consecuencia. Los registros documentados
      de control de calidad de tu stock hacen que este proceso sea rápido y
      justo para ambas partes.
  - q: ¿Cómo se aprueba el arte personalizado antes de la producción?
    a: >-
      Las etiquetas y el embalaje pasan por una cadena de aprobación controlada:
      mockup digital, prueba impresa, inspección de primeras piezas sobre el
      lote de producción y después la producción en serie. Cada paso se comprueba
      contra tu arte firmado, por eso el diseño de etiquetas, los símbolos de
      peligro y el texto reglamentario coinciden con tu archivo de marca cuando
      llegan los productos.
  - q: ¿Qué materiales de repuesto suministran para programas continuos?
    a: >-
      Los socios pueden pedir etiquetas de repuesto, tambores vacíos y
      documentación complementaria con su producción o en pedidos de reorden:
      etiquetas en blanco, fichas de datos de seguridad, plantillas de
      certificado de análisis y el embalaje más habitual en reorden. Los
      materiales de repuesto se envían junto con la producción o como pequeños
      envíos, de modo que un componente faltante nunca retrase la entrega.
  - q: ¿Qué información debería preparar antes de solicitar una cotización?
    a: >-
      Cuanto mejor sea el brief, más rápida la cotización: mercado objetivo y
      cultivo, especificaciones deseadas (ingrediente activo, tipo de
      formulación, concentración), cantidad y precio objetivo, necesidades de
      marca y embalaje, y tu calendario de lanzamiento. Nuestro formulario de
      consulta recoge exactamente esta lista — compartirla ahorra rondas de
      cotización y te da una estimación más firme a la primera.
  - q: ¿Cuánto tarda el muestreo antes de la producción?
    a: >-
      Las muestras de prototipo se envían en 7–14 días desde que se congela la
      especificación de formulación. Añade el tiempo de revisión para tus
      pruebas y cualquier ronda de ajustes — la mayoría de los proyectos
      completan el muestreo en unas dos o tres semanas. La producción comienza
      tras la aprobación de la muestra, así que la fase de muestras es el lugar
      donde el cuidado extra se traduce en tiempo ahorrado más adelante.
