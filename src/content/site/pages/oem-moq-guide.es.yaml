moq_stages:
  tagline: Muestra · Piloto · Volumen
  title: 'Tres Etapas de Cantidad Distintas'
  subtitle: 'Las cantidades de muestra, piloto y producción de volumen son diferentes. Cada proyecto se clasifica en tres niveles distintos para que valides antes de comprometerte.'
  steps:
    - step: '01'
      title: 'Desarrollo de Muestra (1–4 toneladas)'
      desc: 'Confirmación física de la composición de la formulación, la precisión de la etiqueta, el ajuste del embalaje y las propiedades físicas antes de cualquier compromiso financiero. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - step: '02'
      title: 'Pedido Piloto (5 toneladas)'
      desc: 'Pruebas comerciales de pretemporada y validación de mercado regional usando plataformas de formulación existentes, materias primas de stock y empaque simplificado para minimizar la fricción de preparación.'
    - step: '03'
      title: 'Producción de Volumen (20+ toneladas)'
      desc: 'Confirmada tras la BOM congelada, el arte de etiqueta finalizado, el empaque personalizado y los planes de entrega programados — series completas de producción, concentraciones a medida, empaque exclusivo, descuentos por volumen y trazabilidad completa de lote.'

moq_factors:
  tagline: Qué Define Tu MOQ
  title: 'Por Qué el MOQ Totalmente Personalizado Siempre Es Específico del Proyecto'
  subtitle: 'Para la fabricación 100% a medida, el MOQ se calcula a partir de la arquitectura completa del producto — estos cuatro componentes se evalúan juntos antes de cotizar.'
  headers:
    component: Componente del Proyecto
    driver: Factor de Fabricación
    impact: Impacto en la Cantidad Mínima
  rows:
    - component: 'Tipo de Formulación y Desarrollo'
      driver: 'Plataformas existentes de fábrica vs desarrollo de formulación I+D a medida y validación de estabilidad'
      impact: 'Plataformas existentes: pedidos piloto desde 5 toneladas. Formulaciones a medida: requiere desarrollo dedicado y mínimos de materia prima.'
    - component: 'Concentración y Materias Primas'
      driver: 'Activos de grado técnico estándar vs concentración propietaria y mezclas de co-formulantes a medida'
      impact: 'Las mezclas de materia prima personalizadas requieren corridas de adquisición dedicadas con cantidades mínimas independientes.'
    - component: 'Embalaje con Marca'
      driver: 'Tambores genéricos con etiquetas de código de barras vs tambores impresos a todo color y juegos de etiquetas con marca'
      impact: 'Los tambores impresos personalizados tienen un mínimo de impresión independiente (típicamente más de 500 unidades).'
    - component: 'Paquetes de Etiquetas y Documentación'
      driver: 'Etiquetas de cumplimiento estándar vs juegos de etiquetas regulatorias multi-mercado y documentación por país'
      impact: 'La documentación regulatoria totalmente personalizada sigue los requisitos de registro de cada mercado.'

