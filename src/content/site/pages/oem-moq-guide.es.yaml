moq_faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre el MOQ'
  items:
    - q: '¿El MOQ se calcula por pedido, por formulación o por concentración?'
      a: 'El MOQ puede aplicarse por formulación, concentración, versión de etiqueta, configuración de empaque o pedido total. Debido a que los distintos tipos de formulación (SC vs EC vs WDG) y las concentraciones provienen de series de producción diferentes, pedir 10 toneladas divididas en 5 formulaciones crea 5 requisitos de producción separados. Confirmamos el cálculo exacto contra tu matriz de SKU antes de cotizar para que planifiques tu mezcla con claridad.'
    - q: '¿Puedo pedir una muestra antes de la producción en masa?'
      a: 'Sí. El desarrollo de muestras (1–4 toneladas) verifica la composición de la formulación, la precisión de la etiqueta, el ajuste del embalaje y las propiedades físicas antes del lanzamiento de producción. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - q: '¿Por qué el empaque impreso personalizado tiene un MOQ independiente?'
      a: 'La impresión personalizada de tambores requiere una preparación mínima de más de 500 unidades. Ofrecemos una Solución de Almacenamiento de Empaque Híbrido: producimos los 500 tambores impresos, almacenamos el excedente en nuestro almacén limpio y los liberamos en lotes a través de tus envíos programados — así un pedido menor también puede enviarse con empaque totalmente personalizado.'
    - q: '¿Por qué el MOQ estándar de volumen es de 20+ toneladas?'
      a: 'El MOQ de volumen estándar sigue la economía de producción: un lote completo de producción para una formulación agroquímica estándar rinde 20+ toneladas. Correr lotes completos elimina el riesgo de contaminación cruzada, asegura la consistencia por lote y amortiza las 2–4 horas de calibración de las líneas de mezcla y llenado — logrando el menor costo por tonelada posible.'
    - q: '¿Una cantidad mayor reduce el costo unitario?'
      a: 'En la mayoría de los proyectos, sí. Las cantidades mayores mejoran el rendimiento de materia prima, distribuyen los costos fijos de preparación de la línea entre más toneladas y reducen los costos unitarios de empaque.'
    - q: '¿Las tarifas de plancha del co-branding se aplican de nuevo en los re-pedidos?'
      a: 'No. Las tarifas de plancha de impresión de etiqueta se cobran una sola vez en la configuración inicial y se eximen en re-pedidos que usen la misma dimensión de arte. Solo pagas la tarifa de manejo e impresión de $1.00 USD por tambor.'
    - q: '¿Solicitar orientación de MOQ me compromete con un pedido?'
      a: 'No. Solicitar orientación de MOQ simplemente permite que nuestro equipo de ingeniería en Qingdao Vatrad Group Co., Ltd. revise tu brief técnico y aconseje la ruta de producción más rentable. Hay disponible un Acuerdo de No Divulgación (NDA) antes de compartir especificaciones técnicas o datos de formulación de propiedad.'

