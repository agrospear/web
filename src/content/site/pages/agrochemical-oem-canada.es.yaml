why_canada:
  tagline: 'Por qué los compradores en Canadá'
  title: 'Diseñada para las importaciones canadienses'
  subtitle: 'La fábrica responde a las preguntas que plantean las marcas y minoristas canadienses antes de su primer contenedor — cumplimiento PMRA y etiquetado bilingüe primero.'
  items:
    - title: 'Soporte de registro PMRA'
      description: 'La Agencia Reguladora de Gestión de Plagas (PMRA) exige el registro del producto bajo la Ley de Productos de Control de Plagas antes de su importación y venta en Canadá. Agrospear proporciona documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo y archivos completos de composición de formulación para respaldar tu presentación PMRA y tu registro canadiense.'
    - title: 'DDP para un coste total predecible'
      description: 'El DDP incluye despacho de aduanas y entrega en tu almacén — aranceles, impuestos y flete en un solo total en CAD o USD. La opción más elegida por los importadores noveles.'
    - title: 'Rutas por las dos costas'
      description: 'Cotizamos flete marítimo a Vancouver o a Toronto y Montreal por la ruta de Suez — la que mejor equilibre tu tiempo de tránsito y tu coste total.'
    - title: 'Archivos de producto listos para bilingüe'
      description: 'La documentación ICAMA, FAO/OMS y aduanera se prepara para tus mercados objetivo, de modo que tu ficha de producto sirva para requisitos de etiquetado en inglés y francés bajo las directrices PMRA.'
    - title: 'Una fábrica, un sistema de calidad'
      description: 'Desarrollo, muestreo, producción y control de calidad ocurren dentro de la planta de 12.500 m² — sin intermediarios, sin muestras que la producción no pueda igualar.'

process_notes:
  tagline: 'Cómo funciona'
  title: 'De la especificación al contenedor'
  subtitle: 'Las mismas seis etapas compres dos o veinte contenedores al año: especificación, I+D, muestreo, pruebas, desarrollo de formulación, producción — y después entrega FOB, CIF o DDP.'
  items:
    - title: '1. Envía tu especificación'
      description: 'Basta con un producto de referencia, un brief técnico o una especificación de la competencia. La revisión de I+D y el presupuesto llegan en un día laborable.'
    - title: '2. Aprueba la muestra'
      description: 'Tu primera muestra física sale en 7–12 días con una hoja de aprobación que cubre composición, propiedades físicas y resultados de ensayos de estabilidad — más documentación lista para PMRA.'
    - title: '3. Producción y exportación'
      description: 'Las tiradas se completan en 25–35 días con puntos de control de calidad en proceso. La lista de empaque, la factura y el conocimiento de embarque viajan antes que el buque.'
    - title: '4. Entrega en tu almacén'
      description: '4–6 semanas de flete marítimo a Vancouver, Toronto o Montreal — con DDP gestionamos el despacho y la entrega hasta tu puerta.'

faq_section:
  tagline: 'Preguntas frecuentes'
  title: 'Preguntas sobre la importación en Canadá'
  questions:
    - q: ¿Agrospear proporciona documentación de registro PMRA?
      a: 'Sí. Agrospear proporciona documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo y archivos completos de composición de formulación para respaldar tu registro de producto ante la PMRA bajo la Ley de Productos de Control de Plagas. Tu consultor regulatorio canadiense utiliza estos archivos para preparar la presentación PMRA.'
    - q: ¿Qué requisitos de datos PMRA soporta Agrospear?
      a: 'Agrospear suministra el paquete de datos técnicos que respalda el registro PMRA: composición de formulación, datos de propiedades físicas y químicas, resúmenes toxicológicos, datos de residuos y especificaciones del producto. Estudios adicionales pueden coordinarse a través de laboratorios externos cuando se requieran.'
    - q: ¿Cuánto tarda el flete marítimo a Canadá?
      a: 'Cuenta con 4–6 semanas desde el puerto de Qingdao a los puertos canadienses — Vancouver en la costa oeste, Toronto y Montreal en el este — según destino y calendario de salidas. Los proyectos DDP incluyen el plazo completo puerta a puerta.'
    - q: ¿Enviáis con DDP a Canadá?
      a: 'Sí. El DDP incluye flete marítimo, despacho de aduanas, aranceles e impuestos, y entrega en tu almacén — un precio total predecible. También ofrecemos FOB Qingdao y CIF.'
    - q: ¿Cuál es el MOQ para importar agroquímicos de marca privada?
      a: 'MOQ confirmado por configuración del proyecto: las muestras cubren 1–4 toneladas, los lotes piloto corren 5 toneladas sobre plataformas existentes, y la producción de volumen estándar corre 20+ toneladas por lote.'
    - q: ¿Soportáis etiquetado en inglés y francés?
      a: 'Sí. Nuestro equipo de preprensa prepara los datos de etiqueta para los idiomas y normativas de tus mercados objetivo — incluido el etiquetado bilingüe EN/FR requerido por la PMRA para el mercado canadiense.'
    - q: ¿Cómo empiezo un proyecto desde Canadá?
      a: 'Envía un producto de referencia, un brief técnico o una especificación. La revisión de I+D y el presupuesto llegan en un día laborable, y se firma un NDA antes de cualquier intercambio de archivos.'

