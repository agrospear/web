faqs:
  tagline: FAQ
  title: 'Markets — Frequently Asked Questions'
  items:
    - q: 'Which markets do you supply?'
      a: 'We supply OEM agrochemical products to distributors and importers across Sub-Saharan Africa, Southeast Asia, Latin America, the Middle East and South Asia. Our products are registered or in registration in 40+ countries.'
    - q: 'Do you provide registration support?'
      a: 'Yes. We provide pre-registration dossiers including GLP toxicity studies, residue data, formulation analysis and five-batch analysis reports. Our regulatory team supports local registration submissions in target markets.'
    - q: 'Can you adapt formulations for specific regional needs?'
      a: 'Yes. We adjust AI concentration, dosage form, adjuvant package and packaging size for regional crop profiles, climate conditions and regulatory requirements. Custom formulation development typically takes 35–55 days.'
    - q: 'What is the minimum order quantity for a new market?'
      a: 'Standard MOQ is 1,000 L or 1,000 kg per SKU for existing formulations. New formulations or custom packaging may have higher MOQs, confirmed per project based on your market entry plan.'

