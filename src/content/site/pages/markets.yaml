hero:
  tagline: 'Markets'
  title: 'Regional Markets'
  subtitle: 'OEM agrochemical manufacturing and export solutions tailored to Africa, Southeast Asia, Latin America and emerging crop protection markets worldwide.'

answer:
  label: 'Straight answer'
  text: 'We supply OEM agrochemical products to distributors and importers across Africa, Southeast Asia, Latin America and the Middle East. Each market has distinct regulatory requirements, crop profiles and packaging preferences — we tailor formulation, registration support, packaging and documentation to meet regional demands.'
  verified: '2026-08'

intro:
  - Every agrochemical market is different. Africa demands cost-effective broad-spectrum products with local registration support. Southeast Asia needs tropical-climate formulations and smallholder-friendly packaging. Latin America requires large-scale agricultural solutions with fast-turnaround OEM service.
  - We adapt our manufacturing, documentation and logistics to each region — not a one-size-fits-all export model, but market-specific solutions built on 15+ years of regional experience.

