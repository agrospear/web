answer:
  label: 'Straight answer'
  text: 'Custom crop protection formulations are designed in-house with systematic active ingredient selection, co-formulant screening, and particle size optimization — every formulation is tested for suspensibility, emulsion stability, and pH compliance with a mandatory specification window before pilot batching. A custom formulation takes 7–14 days to prototype; full production validation adds 15–20 days to the 25–35 day production lead time, with MOQ confirmed by project configuration (see our MOQ guide).'
  verified: '2026-08'

intro: 'The formulation of a crop protection product — its active ingredient ratio, co-formulant package, particle size distribution, and rheology profile — determines how it performs, disperses, and delivers efficacy in the field. At {SITE.name}, our Formulation Engineering Studio combines active ingredient screening, co-formulant optimization, particle size engineering, and production experience to deliver formulations optimised for their intended use: foliar spray, seed treatment, or soil application. Every custom formulation starts from your specification, not a generic recipe from a catalogue.'

content_html: |
  <h2>Where efficacy meets physical stability</h2>
  <p>An agrochemical formulation is a dispersion system: active ingredient particles are suspended or dissolved within a carefully balanced matrix of co-formulants, holding the product stable at specification concentration while the rheology and particle size distribution control how the product disperses and performs in the spray tank. We design the formulation, simulate the stability profile, and validate the result in-house before a single pilot batch is produced.</p>

  <h2>Design tools and standards</h2>
  <p>Our formulation engineering environment includes:</p>
  <table>
    <thead><tr><th>Capability</th><th>Instrument / Method</th><th>Application</th></tr></thead>
    <tbody>
      <tr><td>Active content analysis</td><td>HPLC / GC (CIPAC methods)</td><td>Active ingredient quantification, impurity profiling, batch consistency</td></tr>
      <tr><td>Particle size engineering</td><td>Laser particle size analyser (Malvern)</td><td>D50/D90 control, suspensibility prediction, milled particle distribution</td></tr>
      <tr><td>Rheology profiling</td><td>Rotational viscometer (Brookfield)</td><td>Viscosity at shear rates, thixotropy, pourability, sprayability</td></tr>
      <tr><td>Co-formulant screening</td><td>Design of Experiments (DoE)</td><td>Surfactant selection, dispersant optimization, stabiliser package</td></tr>
      <tr><td>Stability simulation</td><td>54 °C accelerated stability chambers</td><td>Shelf life prediction, sedimentation rate, phase separation</td></tr>
    </tbody>
  </table>

  <h2>Our engineering workflow</h2>
  <p>Every formulation design, whether a standard model or a fully custom project, follows a rigorous five-stage process:</p>
  <ol>
    <li><strong>Concept &amp; requirements gathering</strong> — We define target crop and pest spectrum, application method (foliar, seed treatment, soil), target active ingredient content, formulation type (SC, EC, WP, WDG, SL, ME, CS, FS), and any special requirements (rainfastness, drift control, tank-mix compatibility).</li>
    <li><strong>Co-formulant screening &amp; DoE</strong> — The surfactant, dispersant, wetting agent, and stabiliser candidates are screened in a fractional-factorial design. suspensibility, emulsion stability, and viscosity are measured for each combination.</li>
    <li><strong>Particle size optimisation</strong> — The milled suspension is analysed by laser diffraction. D50 and D90 targets are set per formulation type (e.g., SC: D50 &lt; 3 µm, D90 &lt; 8 µm). Milling parameters are iteratively adjusted.</li>
    <li><strong>Rheology &amp; stability validation</strong> — Viscosity is measured at multiple shear rates. Accelerated stability at 54 °C for 14 days is performed; suspensibility ≥ 90 % and no sedimentation are mandatory.</li>
    <li><strong>Design review &amp; release</strong> — The complete formulation package (active content certificate, particle size report, stability data, rheology profile, co-formulant bill of materials) is reviewed by our senior formulation chemist before release to the pilot plant.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Stability Results — 25% SC A.I. Formulation (14 Days at 54 °C)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">98.2 %</span>
        <span class="text-gray-500">Active content retention after 14 days at 54 °C</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">0 mm</span>
        <span class="text-gray-500">Sediment at 54 °C — no settling observed</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">94.5 %</span>
        <span class="text-gray-500">Suspensibility after 14 days at 54 °C</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">pH 6.8</span>
        <span class="text-gray-500">pH within specification range — stable formulation</span>
      </div>
    </div>
  </div>

  <h2>Customisation: your formulation, your rules</h2>
  <p>No two brands have identical requirements. A broad-acre herbicide needs a stable SC with low viscosity for aerial spraying; a vegetable fungicide needs a WDG with excellent wetting for backpack application; a seed treatment line needs an FS with film-forming and colourant compatibility. We do not force your range into pre-existing recipes — we design from your specification upward.</p>
  <p>Examples of recent custom formulation engineering projects:</p>
  <ul>
    <li>A 240 g/L SC herbicide for a broad-acre brand, with a custom dispersant package achieving 96 % suspensibility and 18-month shelf stability.</li>
    <li>A 80 % WP fungicide for a vegetable crop portfolio, with optimised wetting agents for backpack spray application at 200 L/ha.</li>
    <li>A 350 g/L FS seed treatment for a cereal programme, with film-forming polymers and red colourant for planting visibility.</li>
  </ul>

  <h2>Our engineers</h2>
  <p>The studio is led by a senior formulation chemist with 14 years of experience in agrochemical formulation development, supported by two chemists specialised in particle size engineering and rheology. All three hold advanced degrees in chemistry or chemical engineering from internationally recognised universities, and the team works directly with our production floor to ensure every formulation is manufacturable at container scale.</p>

  <h2>Partner with us on your next formulation</h2>
  <p>From the first active ingredient selection to the final stability report, our Formulation Engineering Studio is your partner in creating a crop protection product that is not just mixed — but engineered. We invest the optimisation hours upfront so that every co-formulant, every milling pass, and every viscosity measurement is there for a reason.</p>
  <p>Whether you need a minor modification to an existing formulation or a completely clean-sheet design, we are ready to discuss your requirements.</p>

