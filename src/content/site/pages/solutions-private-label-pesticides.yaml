process_steps:
  tagline: The Process
  title: 'From Brand Concept to First Shipment'
  subtitle: 'A streamlined process designed for speed — no R&D stage means faster time to market.'
  steps:
    - step: '01'
      title: 'Select Your Platform'
      desc: "Choose from Agrospear's proven formulation platforms — herbicides, insecticides, fungicides or PGRs. We recommend the best match for your target market and crop segments."
    - step: '02'
      title: 'Brand & Packaging Design'
      desc: 'Provide your label artwork and packaging specifications, or work with our in-house design team. Multi-language GHS-compliant labels included.'
    - step: '03'
      title: 'Sample & Approval (7–12 Days)'
      desc: 'A physical sample batch with your branding is produced for your review. Label accuracy, packaging fit and product quality verified before production commitment.'
    - step: '04'
      title: 'Production & QC (25–35 Days)'
      desc: 'Manufacturing through the 7-stage inspection gate system. Pilot batches from 5 tons, standard volume 20+ tons per formulation.'
    - step: '05'
      title: 'Packing & Shipment'
      desc: 'Export packing with your branded documentation and COA. Shipped to 50+ countries with FOB, CIF or DDP terms.'

faqs:
  tagline: FAQ
  title: 'Private Label Manufacturing — Frequently Asked Questions'
  items:
    - q: 'How is private label different from OEM manufacturing?'
      a: 'OEM manufacturing produces from your existing formulation specification — you own the IP. Private label puts your brand on a proven Agrospear platform — no R&D stage, lower MOQ and faster time to market. See our OEM vs Private Label comparison for details.'
    - q: 'What is the MOQ for private label?'
      a: 'Pilot batches start at 5 tons on existing platforms. Standard volume production runs 20+ tons per batch. No formulation development fee since the platform is already proven.'
    - q: 'Can I customize the label and packaging?'
      a: 'Yes — fully custom labels with your logo, brand colors and product names. Multi-language GHS-compliant labels, branded packaging and custom drum specifications. Our design team can assist.'
    - q: 'How long does it take to get my first shipment?'
      a: 'Without an R&D stage, the timeline is shorter: sample in 7–12 days, then 25–35 days production from confirmed PO. Total timeline from first contact to first shipment is typically 6–8 weeks.'
    - q: 'Do you provide regulatory documentation?'
      a: 'Yes. ICAMA registration data, FAO/WHO specifications and per-market compliance documentation are included with every private label order.'

