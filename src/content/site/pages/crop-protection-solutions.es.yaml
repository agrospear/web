    - question: ¿Qué materias primas utiliza Agrospear para las formulaciones de protección de cultivos?
      answer: 'Adquirimos ingredientes activos de sintetizadores globales de reconocido prestigio y utilizamos coformulantes, adyuvantes y soportes de alta pureza seleccionados por su eficacia, estabilidad y cumplimiento regulatorio. Todas las materias primas se someten a una rigurosa inspección de entrada.'
    - question: ¿Agrospear proporciona documentación ICAMA y FAO/OMS para las formulaciones de protección de cultivos?
