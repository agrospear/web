    - question: ¿Cuál es la garantía de calidad de las formulaciones de protección de cultivos de Agrospear?
      answer: 'Las formulaciones agroquímicas de Agrospear están garantizadas con un contenido de ingrediente activo dentro de ±5% del valor declarado durante toda la vida útil, con un Certificado de Análisis proporcionado para cada lote. Soporte de calidad extendido disponible para socios de distribución.'
body: |
  <h2>El estándar de Agrospear — el compromiso con una artesanía agroquímica impecable</h2>
  <p>En el exigente mundo de la agricultura moderna, la formulación agroquímica es el eslabón crítico entre la química del ingrediente activo y la protección de cultivos a nivel de campo. Desde las aplicaciones de herbicidas preemergentes en cultivos extensivos hasta las pulverizaciones de fungicidas foliares en cereales, las formulaciones agroquímicas cumplen múltiples propósitos esenciales.</p>
  <p>Sin embargo, no todas las formulaciones son iguales. La verdadera medida de una formulación agroquímica no está solo en su ingrediente activo, sino en la integridad de su ingeniería, la calidad de sus coformulantes y la precisión de su fabricación. Agrospear se distingue como formulador y fabricante de primer nivel, produciendo productos agroquímicos diseñados para la excelencia en cada segmento de protección de cultivos.</p>

  <h2>La ciencia de la formulación: el fundamento de la eficacia</h2>
  <p>La elección del tipo de formulación y del sistema de coformulantes es el factor más crítico para determinar la eficacia y la estabilidad de un producto agroquímico. Agrospear invierte recursos considerables en identificar, probar y adquirir los mejores ingredientes activos y coformulantes disponibles a nivel mundial.</p>
  <ul>
    <li><strong>Abastecimiento de ingredientes activos superiores:</strong> Ingredientes activos técnicos de alta pureza de sintetizadores de reconocido prestigio, seleccionados por su contenido consistente y sus perfiles de impurezas.</li>
    <li><strong>Tecnología SC (Concentrado en Suspensión):</strong> Partículas molidas en húmedo en suspensión acuosa con reología anti-sedimentación — no inflamable, fácil de medir y versátil en múltiples cultivos.</li>
    <li><strong>Homogeneización de alto cizallamiento:</strong> Vasoques de mezcla industrial con D90 por debajo de 5 μm de tamaño de partícula, produciendo suspensiones uniformes que cumplen las especificaciones FAO/OMS lote tras lote.</li>
    <li><strong>Ingeniería de estabilidad extendida:</strong> Formulaciones diseñadas para 2 años de vida útil con estabilidad verificada mediante ensayos acelerados a 54 °C / 14 días según CIPAC MT 46.</li>
  </ul>

  <h2>Filosofía de diseño: ingeniería de precisión para cada segmento</h2>
  <p>Nuestro equipo de formulación reúne químicos experimentados e ingenieros de proceso que utilizan métodos analíticos avanzados y ensayos de campo reales para crear formulaciones biológicamente eficaces, físicamente estables y comercialmente competitivas.</p>

  <h3>Programas de herbicidas</h3>
  <p>Diseñados para el control de malezas pre y posemergente en cultivos extensivos y cereales. Las configuraciones de formulación incluyen SC para actividad residual de amplio espectro, EC para acción de contacto de acción rápida y WDG para manipulación sin polvo en mercados regulados.</p>

  <h3>Programas de insecticidas</h3>
  <p>Formulaciones EC para derribe rápido y acción sistémica; SC y ME para opciones de reducción de disolventes, fáciles de usar. WDG para aplicaciones en invernadero y campo donde la manipulación sin polvo es esencial.</p>

  <h3>Programas de fungicidas y reguladores de crecimiento</h3>
  <p>SC y WDG para manejo protector y curativo de enfermedades; SL y SC para aplicación precisa de reguladores de crecimiento a dosis bajas. WP para programas de amplio alcance con sensibilidad al coste.</p>

  <h3>Programas de tratamiento de semillas</h3>
  <p>Formulaciones FS para tratamiento de semillas en recubrimiento por película y en pasta — proporcionando protección fungicida e insecticida en la siembra. Encapsulación CS y ME para liberación controlada del ingrediente activo durante las primeras etapas de crecimiento de las plántulas.</p>

  <h2>Excelencia de fabricación: precisión en cada paso</h2>
  <p>Agrospear emplea técnicos altamente especializados, maestros en su oficio. Nuestra instalación de producción está equipada con maquinaria de última generación, incluyendo homogeneizadores de alto cizallamiento, líneas de llenado controladas por CNC, granuladores de lecho fluido e instrumentos analíticos. Cada lote sigue procedimientos documentados con trazabilidad completa.</p>
  <p>Nuestro sistema de control de calidad en varias capas incluye comprobaciones rigurosas en cada paso de la fabricación y culmina en la prueba integral de cada lote antes del envío. Este compromiso con la calidad se integra desde el principio, no se verifica solo al final.</p>

  <h2>Control de calidad y pruebas</h2>
  <ul>
    <li><strong>Análisis del 100% del contenido activo:</strong> Cada lote se analiza para determinar el contenido de ingrediente activo según métodos CIPAC.</li>
    <li><strong>Verificación de propiedades físicas:</strong> Tasa de suspensión, estabilidad de emulsión, humectabilidad y dispersibilidad probadas según especificaciones FAO/OMS.</li>
    <li><strong>Ensayo de estabilidad acelerada:</strong> 54 °C / 14 días según CIPAC MT 46 en cada lote de producción.</li>
    <li><strong>Verificación de precisión de llenado:</strong> Precisión de peso y volumen comprobada por unidad frente a las especificaciones.</li>
    <li><strong>Comprobación completa del sistema:</strong> Cada lote pasa inspección final y generación de CoA antes de aprobar el envío.</li>
  </ul>

  <h2>Por qué elegir a Agrospear para tu suministro de protección de cultivos</h2>
  <p>Con nuestra fábrica de 20.000 m² certificada ISO 9001 en Qingdao (China), Agrospear ofrece a distribuidores, minoristas agrícolas y marcas de protección de cultivos un socio de fabricación fiable. Nuestros servicios OEM/ODM incluyen personalización de marca, marca privada, documentación regulatoria y soporte logístico. MOQ de volumen estándar desde 20+ toneladas por lote (lotes piloto desde 5 toneladas) con plazos de entrega de 25–35 días.</p>
  <p>Cada formulación de Agrospear es una inversión en calidad, estabilidad y eficacia sin igual — para que tus clientes logren resultados de protección de cultivos consistentes temporada tras temporada.</p>

