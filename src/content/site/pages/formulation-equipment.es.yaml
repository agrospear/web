intro: 'Una formulación agroquímica vale tanto como su homogeneización. Un solo bolsillo sin mezclar o un llenado desigual puede comprometer un lote entero — y en el campo, un contenido inconsistente de ingrediente activo no es un inconveniente: es una infracción regulatoria y un riesgo para la seguridad del cultivo. En {SITE.name}, hemos invertido en un Centro de Mezcla y Envasado dedicado que combina equipos de homogeneización y envasado de calidad industrial con un control riguroso del proceso y ensayos posteriores al llenado. Cada lote que producimos queda documentado, es trazable y está certificado para cumplir o superar los requisitos de las especificaciones FAO/OMS y las normas de registro ICAMA.'

content_html: |
  <h2>La ciencia que hay detrás de la mezcla</h2>
  <p>La mezcla agroquímica utiliza energía mecánica de alto cizallamiento para reducir las partículas del ingrediente activo a una distribución de tamaño controlada y distribuirlas uniformemente por todo el líquido portador. A diferencia de una simple agitación, la homogeneización de alto cizallamiento crea una verdadera suspensión o emulsión en la que cada mililitro de producto contiene la misma concentración de ingrediente activo — produciendo un lote homogéneo del primero al último envase.</p>

  <h2>Equipos de mezcla y control del proceso</h2>
  <p>Nuestro centro de mezcla y envasado está equipado con:</p>
  <table>
    <thead><tr><th>Equipo</th><th>Capacidad / Especificación</th><th>Aplicación</th></tr></thead>
    <tbody>
      <tr><td>Homogeneizador de alto cizallamiento 1</td><td>5.000 L, D90 &lt; 5 μm</td><td>Mezcla principal de lotes SC, molienda húmeda de ingrediente activo</td></tr>
      <tr><td>Homogeneizador de alto cizallamiento 2</td><td>2.000 L, D90 &lt; 3 μm</td><td>Preparación de ME y microemulsiones, mezcla de adyuvantes</td></tr>
      <tr><td>Línea de envasado con control CNC</td><td>100–1.000 mL/min, precisión ±0,5%</td><td>Envasado de líquidos en tambores, botellas y garrafas; verificación de peso por unidad</td></tr>
      <tr><td>Línea de granulación WDG</td><td>Lote de 500–2.000 kg, secador de lecho fluido</td><td>Granulación húmeda, secado, clasificación de gránulos dispersables en agua</td></tr>
    </tbody>
  </table>
  <p>Cada vasija de mezcla dispone de monitorización de bucle cerrado de temperatura y viscosidad. Los parámetros de proceso — velocidad de cizallamiento, tiempo de mezcla, temperatura de enfriamiento, volumen de llenado — se programan por tipo de formulación y se registran en nuestro Sistema de Ejecución de Fabricación (MES) para una trazabilidad total.</p>

  <h2>Ensayos de calidad del lote — cada lote, cada partida</h2>
  <p>La integridad del lote se verifica con un protocolo obligatorio de cuatro ensayos:</p>
  <ol>
    <li><strong>Inspección visual</strong> — Se inspecciona visualmente el 100 % de las unidades envasadas para detectar contaminación, separación de fases, nivel de llenado incorrecto o defectos de embalaje. Umbral de rechazo: 0,3 % de las unidades.</li>
    <li><strong>Análisis de contenido de ingrediente activo</strong> — Se analiza una muestra de cada lote según métodos CIPAC. Rango aceptable: ±5% del contenido declarado para la mayoría de los tipos de formulación.</li>
    <li><strong>Pruebas de estabilidad</strong> — Cada lote se somete a almacenamiento acelerado a 54 °C durante 14 días según CIPAC MT 46. El contenido activo debe mantenerse dentro de la especificación tras el estrés térmico.</li>
    <li><strong>Verificación de propiedades físicas</strong> — Tasa de suspensión (SC), estabilidad de emulsión (EC), humectabilidad y dispersibilidad (WDG/WP), y vertibilidad se ensayan según métodos CIPAC y se comparan con la muestra de referencia aprobada.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribución de Tamaño de Partícula — Alto cizallamiento frente a mezcla convencional (SC 250 g/L)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-28 text-xs font-medium">Alto cizallamiento</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:95%"></div>
        </div>
        <span class="text-xs font-bold w-20 text-right">D90 3,2 μm</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-28 text-xs font-medium">Convencional</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:60%"></div>
        </div>
        <span class="text-xs font-bold w-20 text-right">D90 8,5 μm</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-28 text-xs font-medium">Espec. FAO/OMS</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:45%"></div>
        </div>
        <span class="text-xs font-bold w-20 text-right">D90 &lt; 5 μm</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">La homogeneización de alto cizallamiento alcanza de forma regular el 90-95 % del tamaño de partículas objetivo, muy dentro de las especificaciones FAO/OMS para concentrados en suspensión.</p>
  </div>

  <h2>Experiencia profesional</h2>
  <p>Nuestro equipo de mezcla está dirigido por un ingeniero de procesos senior con 11 años de experiencia en formulación y homogeneización agroquímica. Cada operario completa un programa de certificación interna de 6 meses antes de poder gestionar lotes de producción. La recertificación se exige anualmente, incluida una prueba práctica de mezcla y llenado evaluada contra nuestro estándar interno de Grado A (contenido activo dentro de ±2% del objetivo).</p>

  <h2>Soluciones de mezcla a medida para requisitos especiales</h2>
  <p>Entendemos que una misma especificación de mezcla no sirve para todas las formulaciones. Nuestro Centro de Mezcla y Envasado desarrolla de forma habitual parámetros de procesado personalizados para clientes con necesidades concretas:</p>
  <ul>
    <li><strong>Formulaciones SC de alta carga</strong> — para formulaciones por encima de 500 g/L de contenido activo, validamos los parámetros de homogeneización a viscosidad elevada y documentamos los límites del proceso en el registro de lote.</li>
    <li><strong>Ingredientes activos termosensibles</strong> — para activos que se degradan por encima de 40 °C, implementamos protocolos de enfriamiento en bucle cerrado y cizallamiento reducido que mantienen el tamaño de partículas sin exposición térmica.</li>
    <li><strong>Mezclas de tanque multicomponente</strong> — las formulaciones que requieren la mezcla en línea de dos o más ingredientes activos se homogeneizan con protocolos de adición secuencial para evitar la precipitación o la incompatibilidad.</li>
  </ul>

  <h2>Nuestro compromiso contigo</h2>
  <p>Cada lote que entregamos incluye nuestra garantía de calidad: si algún lote falla el análisis de contenido o las pruebas de estabilidad en almacenamiento normal dentro de la vida útil, reemplazamos el lote afectado sin coste y realizamos una investigación de causa raíz para evitar que se repita. Esto no es solo una garantía: es un compromiso de mejora continua impulsado por los datos reales de los lotes.</p>
  <p>Cuando eliges {SITE.name}, eliges unas formulaciones que están diseñadas, ensayadas y documentadas, no solo mezcladas. Esa es la diferencia entre un producto que se pulveriza y un producto que rinde.</p>

