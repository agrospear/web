faqs:
  - question: '¿Qué diferencias hay entre las formulaciones FS, CS y ME para semillas?'
    answer: 'FS (flowable for seed treatment) es una suspensión concentrada diseñada para adherirse uniformemente a la superficie de la semilla; CS (suspensión encapsulada) libera el ingrediente activo de forma gradual tras la siembra; ME (microemulsión) penetra la testa y proporciona acción rápida. La elección depende del patógeno o plaga diana, la duración de protección requerida y la compatibilidad con el equipo de tratamiento.'
  - question: '¿Pueden fabricar combinaciones insecticida+fungicida en una sola formulación?'
    answer: 'Sí. Las combinaciones multi-IA son una de nuestras especialidades. Formulamos productos que integran un insecticida sistémico (neonicotinoide o butenoloide) con uno o dos fungicidas de distintos grupos FRAC en una sola presentación FS o CS. Esto simplifica la operación de tratamiento, reduce la manipulación de la semilla y garantiza una distribución homogénea de ambos ingredientes activos.'
  - question: '¿Qué es un sistema film-former y por qué es importante?'
    answer: 'El film-former es un polímero que se aplica junto con el producto fitosanitario y forma una película flexible sobre la semilla. Evita el desprendimiento de polvo durante el manejo y la siembra —reduciendo la exposición del operario—, mejora la adherencia del tratamiento y puede incorporar colorantes para identificación visual. Agrospear ofrece sistemas film-former compatibles con todas nuestras formulaciones FS y CS.'
  - question: '¿Cuánto dura la protección del tratamiento de semillas?'
    answer: 'Depende de la formulación y los ingredientes activos. Las formulaciones FS proporcionan protección durante 3-6 semanas desde la germinación; las CS, gracias a la liberación controlada, pueden extender la protección hasta 8 semanas. Para plagas de suelo persistentes o enfermedades de post-emergencia temprana, las formulaciones CS son la opción más robusta.'
body: |
  <h2>Formulaciones FS, CS y ME para tratamiento de semillas</h2>
  <p>El tratamiento de semillas es la intervención fitosanitaria más eficiente: coloca el ingrediente activo exactamente donde se necesita, en la semilla, antes de la siembra. Agrospear domina las tres formulaciones principales para este uso. La FS (flowable for seed treatment) es una suspensión de partículas finas en medio acuoso que se adhiere uniformemente a la superficie seminal sin afectar la germinabilidad. Es la formulación más extendida en el mercado y la base de la mayoría de los tratamientos fungicidas.</p>
  <p>La CS (suspensión encapsulada) incorpora microcápsulas de polímero que liberan el ingrediente activo de forma sostenida tras la siembra. Esta tecnología es especialmente valiosa para insecticidas sistémicos que deben proteger la plántula durante las primeras semanas, cuando el sistema radicular aún no ha alcanzado su pleno desarrollo. Las microemulsiones (ME), por su parte, permiten una penetración parcial en la testa de la semilla, proporcionando una barrera interna contra patógenos transmitidos por semilla como Fusarium, Aspergillus y Tilletia.</p>

  <h2>Combinaciones insecticida+fungicida y protección integrada</h2>
  <p>Las combinaciones multi-IA en tratamiento de semillas representan la estrategia más eficiente de protección temprana. Agrospear formula productos que integran un insecticida sistémico —imidacloprid, thiamethoxam, clothianidin o flupyradifurone— con uno o dos fungicidas de distintos grupos FRAC, como metalaxil-M (grupo 4), fludioxonil (grupo 12) o sedaxane (grupo 7). Esta combinación protege la semilla y la plántula simultáneamente de insectos de suelo, pulgones vectores y patógenos de marchitez y damping-off.</p>
  <p>La ventaja de la combinación en una sola formulación frente a la mezcla en tanque es significativa: garantiza una distribución homogénea de cada ingrediente activo sobre la superficie de la semilla, elimina riesgos de incompatibilidad física o química entre productos, y simplifica la logística del tratamiento. El productor recibe un solo envase con la protección completa, reduciendo errores de dosificación y tiempos de operación en la planta de tratamiento.</p>

  <h2>Sistemas film-former y recubrimiento de alta precisión</h2>
  <p>El film-former es un componente esencial del tratamiento moderno de semillas. Agrospear desarrolla polímeros acrílicos y a base de almidón modificado que forman una película elástica sobre la semilla, evitando el desprendimiento de polvo durante el transporte, la carga de la sembradora y la siembra neumática. El desprendimiento de polvo no solo reduce la eficacia del tratamiento sino que representa un riesgo para la salud del operario y para insectos benéficos en el entorno del campo.</p>
  <p>Nuestros sistemas film-former son compatibles con colorantes y marcadores fluorescentes, lo que permite la identificación visual de la semilla tratada y la verificación de la cobertura bajo luz UV. También pueden incorporar micronutrientes (zinc, manganeso, molibdeno) y promotores de radicación, creando un recubrimiento multifuncional que protege, nutre y estimula la emergencia uniforme del cultivo.</p>

  <div class="cta">
    <h3>Proteja sus semillas con formulaciones OEM de Agrospear</h3>
    <p>Con certificaciones ISO 9001/14001, GMP, BSCI e ICAMA, Agrospear fabrica formulaciones para tratamiento de semillas bajo su marca. Desde FS de un solo ingrediente activo hasta combinaciones CS insecticida+fungicida con film-former integrado, ofrecemos la tecnología y la capacidad que su mercado necesita.</p>
