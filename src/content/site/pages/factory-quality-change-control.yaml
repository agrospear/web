cc_intro:
  tagline: Scope & Policy
  title: Core Governance Principles
  body: |
    **Document:** QMS-SOP-QC-CC-001 — *Rework Process Parameter Change Control Standard* (Rev 2.0, Official Release). **Manufacturer:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Standard reference:** ISO 9001:2015 Quality Management Systems.

    - **No uncontrolled changes.** Rework parameter changes must be routed through formal change control. On-site operators, shift leaders or a single department are never allowed to modify approved rework parameters by verbal agreement or handwriting on a rework record.
    - **Full-element coverage.** The controlled scope covers active content, suspensibility, particle size, viscosity, pH, emulsion stability, labeling, filling parameters, and stability testing — every parameter that can influence product quality, regulatory compliance, appearance, customer acceptance or traceability.
    - **Customer approval bottom line.** Any change that moves a product away from the customer-approved sample, technical specification, BOM, formulation, packaging requirement or acceptance criteria is implemented only with written customer approval. Without it, the batch is reworked per the original requirement, replaced or rejected — never "relaxed" by the factory alone.

cc_scope:
  tagline: Risk Classification
  title: Change Scope & Risk Classification
  subtitle: Any of the following triggers formal change control — it is never handled by writing a note in the rework record. Risk level drives who approves and how much validation is required.
  headers:
    category: Change Category
    examples: Typical Examples
    risk: Risk
    requirements: Control & Approval Requirements
  rows:
    - category: 'Rework Materials'
      examples: 'Adjuvant, dispersant, solvent, carrier, or supplier change'
      risk: 'High'
      requirements: 'Cross-department review + material compatibility & stability validation + customer sign-off where applicable'
    - category: 'Process Conditions'
      examples: 'Mixing speed, milling time, temperature, humidity, hold duration'
      risk: 'High'
      requirements: 'Engineering + Quality approval with defined process window validation'
    - category: 'Tooling & Gauges'
      examples: 'HPLC columns, particle size analyzers, filling machines, test software'
      risk: 'Medium/High'
      requirements: 'Calibration validity check + equipment suitability assessment'
    - category: 'Defect Scope'
      examples: 'Rework area expansion; minor specification deviation growing into critical zone'
      risk: 'High'
      requirements: 'Specification-critical parameters: mandatory stop and re-assessment'
    - category: 'Inspection Methods'
      examples: 'Analytical method, test temperature (54°C), hold duration (14 days)'
      risk: 'High'
      requirements: 'Quality approval + customer technical agreement confirmation'
    - category: 'Documentation & Authorization'
      examples: 'Rework instruction, inspection sheets, NCR disposition logic, operator qualification'
      risk: 'Medium'
      requirements: 'Controlled document revision (Rev A → Rev B) + training records'

cc_containment:
  tagline: Hard Stop Rule
  title: Immediate Containment When Conditions Get Serious
  body: |
    > "The existing rework method shall be placed under review and shall not be applied to additional affected product until the change is assessed and authorized, unless a documented temporary deviation is approved by Quality and Engineering."

    The current rework method must be suspended immediately when rework re-inspection keeps failing, when the defect involves specification-critical parameters (active content, suspensibility, particle size), when a substitute material is not yet validated, or when current parameters conflict with the customer-approved specification.

    Temporary deviations never become permanent practice: each one carries a defined validity window, applicable batch scope, quantity cap, validation requirements and an automatic expiration mechanism. A verbal exception is not an exception — if it is not documented with its expiry, it does not exist.

cc_flow:
  tagline: Standard 9-Step Closed-Loop
  title: From Change Request to Closure & Retention
  subtitle: 'One documented loop for every parameter change: propose, screen, assess, approve, validate, pilot, verify, revise, close.'
  steps:
    - step: '01'
      title: Change Request (ECR)
      desc: 'Any department may raise a request, but Engineering, Quality or Production management sponsors it. The ECR answers why the change is proposed, what changes, what is affected and how it will be verified — with change control number, related NCR/CAPA, current vs proposed parameter, affected batches and temporary/permanent classification.'
    - step: '02'
      title: Initial Screening & Containment
      desc: 'The request is screened first for immediate containment: does the current method have to stop now? If a temporary deviation is allowed, it is bounded by validity window, batch scope, quantity cap and automatic expiry.'
    - step: '03'
      title: Impact & Risk Assessment
      desc: 'Engineering, Quality, Production, Procurement/Supply Chain and Project assess product performance, acceptance criteria, material compatibility, appearance, process capability, equipment and gauges, personnel qualification, customer requirements, compliance and traceability scope.'
    - step: '04'
      title: Joint Review & Approval
      desc: 'Approval follows the fixed authorization matrix — not "whoever speaks loudest". High-risk changes require cross-departmental approval and, where required, written customer approval before any trial.'
    - step: '05'
      title: Validation Plan
      desc: 'For high-risk changes, an approved validation plan is required before routine application: representative sample batches, current vs proposed method, test methods, acceptance criteria, inspection stages, responsible persons and schedule.'
    - step: '06'
      title: Controlled Pilot & Implementation
      desc: 'New documents are released and obsolete versions withdrawn and marked OBSOLETE; new materials and gauges are verified and calibrated; operators are trained and qualified; the first batch runs under tightened inspection with clear status identification.'
    - step: '07'
      title: Re-Inspection & Effectiveness Review
      desc: 'First-pass rework rate, re-inspection pass rate, recurrence rate and specification acceptance are measured and reviewed before the change can be considered effective — one repaired batch is never treated as process validation.'
    - step: '08'
      title: Document Revision & Training
      desc: 'Work instructions, inspection sheets, NCR disposition options, parameter cards and training materials are updated to the new revision with recorded hands-on training and operator qualification.'
    - step: '09'
      title: Closure & Record Retention
      desc: 'The change is closed only after validation evidence, document updates, training records and implementation effectiveness are reviewed and approved. If the intended result is not achieved, the change is revised, extended, suspended or withdrawn.'

