cc_validation:
  tagline: Engineering Validation
  title: Validation & Acceptance Protocol — Evidence Over Statements
  body: |
    Vague acceptance wording such as *"the repaired batch must be good"* is not accepted. The controlled wording is:

    > "The reworked sample shall meet the same applicable active content, specification, labeling and project-specific acceptance criteria as a conforming batch, unless a customer-approved deviation specifically defines an alternative criterion."

    Validation evidence is quantitative, and the engineering baseline for specification rework includes:

    - **Active content verification.** The original deviation is corrected; the batch meets the specification active content by HPLC/GC within ±2%, with stability verified at 54°C for 14 days per CIPAC MT 46.
    - **Suspensibility & emulsion stability.** Suspensibility ≥90% per CIPAC MT 15; emulsion stability per CIPAC MT 36 with no separation or creaming.
    - **Particle size & physical properties.** Particle size distribution within specification (D50 within ±10% of target); pH and viscosity within specification range.
    - **Appearance & labeling.** No sedimentation, no phase separation, no container damage, and no label shift or batch code errors.

cc_engineering:
  tagline: Engineering Execution Matrix
  title: Quantified Parameters for the Four Core Rework Processes
  subtitle: 'Each controlled rework process carries defined parameters, methodology and acceptance criteria — the same numbers our operators follow and our customers can verify during audits.'
  headers:
    process: Rework Process
    parameters: Controlled Parameters
    methodology: Test Methodology
    acceptance: Acceptance Criteria
  rows:
    - process: 'Active Content Adjustment'
      parameters: 'Re-analyze by HPLC/GC; adjust with approved technical-grade AI; mix at controlled speed 500–1000 rpm for 30 min'
      methodology: 'HPLC/GC active content analysis per CIPAC method; duplicate injection verification'
      acceptance: 'Active content within ±2% of specification; no impact on impurity profile'
    - process: 'Suspensibility / Particle Size Rework'
      parameters: 'Re-mill through sand mill at defined speed and media load; environment 22–28°C, ≤ 65% RH'
      methodology: 'Particle size analysis by laser diffraction; suspensibility per CIPAC MT 15; 54°C 7-day stability check'
      acceptance: 'D50 within ±10% of target; suspensibility ≥90%; no sedimentation after 54°C hold'
    - process: 'pH / Viscosity Adjustment'
      parameters: 'Add approved buffer or viscosity modifier; controlled mixing speed and duration; verify after 2 h equilibration'
      methodology: 'pH meter per CIPAC MT 75; viscometer per CIPAC MT 22; 7-day stability at 54°C'
      acceptance: 'pH within specification range; viscosity within specification; no change after 54°C hold'
    - process: 'Final 14-Day Stability Test'
      parameters: '54°C ± 2°C per CIPAC MT 46; calibrated temperature logger; ambient humidity recorded'
      methodology: 'HPLC/GC active content before and after; physical stability observation; suspensibility re-check'
      acceptance: 'Active content within ±2% of initial after 14 days; no sedimentation, phase separation or physical change'

