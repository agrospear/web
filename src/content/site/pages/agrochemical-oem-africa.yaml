faqs:
  - question: 'Does Agrospear provide registration documentation for African markets?'
    answer: "Yes. Agrospear prepares documentation aligned with the African Union's Continental Plant Protection Regulatory framework, WAEMU/CILLS harmonized registration dossiers for West African Economic and Monetary Union countries, and individual national regulator packages for East African markets such as KEPHIS in Kenya, TPRI in Tanzania and NARL in Uganda. ICAMA registration data, FAO/WHO specification sheets, active ingredient certificates and five-batch analysis reports are included."
  - question: 'What formulations does Agrospear recommend for fall armyworm control in Africa?'
    answer: "For fall armyworm (Spodoptera frugiperda) on maize and sorghum, Agrospear recommends SC formulations of emamectin benzoate or chlorantraniliprole for foliar application, FS seed treatment formulations of clothianidin or thiamethoxam for early-stage protection, and WDG formulations of indoxacarb for resistance-management rotation programs. All formulations are tested for stability in tropical storage conditions above 35°C."
  - question: 'How long does shipping take to African ports?'
    answer: "Sea freight from Qingdao to Mombasa, Lagos or Durban typically takes 5–7 weeks depending on the destination and sailing schedule. DDP delivery includes customs clearance and inland transport to your warehouse. FOB Qingdao and CIF terms are also available for importers with their own logistics networks."
  - question: 'Can Agrospear formulate for cocoa crop protection?'
    answer: "Yes. Agrospear manufactures WP and SC formulations effective against cocoa black pod (Phytophthora palmivora and P. megakarya), mirid bugs (Sahlbergella singularis) and capsids. Formulations are designed for compatibility with COLEACP Good Practices protocols required for export-grade cocoa production in West Africa."
  - question: 'What is the minimum order quantity for African OEM projects?'
    answer: "MOQ is confirmed by project configuration: sample development covers 1–4 tons, pilot batches run 5 tons on existing platforms, and standard volume production runs 20+ tons per batch. For first-time African market entries, a 5-ton pilot on an existing Agrospear platform is the most common starting point."
body: |
  <h2>Crop Protection Challenges Across Africa</h2>
  <p>Africa's agricultural landscape spans equatorial rainforest zones, Sahelian semi-arid belts, and Mediterranean climates in the north — each with distinct pest and disease complexes. Fall armyworm has spread across virtually all Sub-Saharan maize-growing regions since 2016, causing yield losses of 20–50% where untreated. Desert locust upsurges threaten the Horn of Africa and Sahel. Cassava mosaic virus and cassava brown streak disease destroy root crops that feed over 500 million people. In West Africa, cocoa black pod and mirid bugs are the primary constraints on a crop that generates over $10 billion in annual export revenue. Cotton pests — bollworms, aphids and jassids — affect West and Central African growing zones from Burkina Faso to Zambia. Agrospear formulates for these exact pressure points, with product platforms validated in tropical heat, high humidity and limited cold-chain storage.</p>

  <h2>Regulatory Pathways: CPMR, WAEMU/CILLS and National Systems</h2>
  <p>Africa's regulatory landscape is transitioning toward harmonization but remains fragmented in practice. The African Union's Continental Plant Protection Regulatory framework (CPMR) sets a vision for unified standards, but current registration operates through regional and national channels. In West Africa, the WAEMU harmonized pesticide registration system — coordinated through CILLS — allows a single dossier to serve Benin, Burkina Faso, Côte d'Ivoire, Guinea-Bissau, Mali, Niger, Senegal and Togo. East African countries maintain individual national registration through bodies such as KEPHIS (Kenya), TPRI (Tanzania) and NARL (Uganda), though the East African Community is progressing toward mutual recognition. Southern African markets register through individual national authorities with SADC-level coordination. Agrospear prepares documentation for each pathway: WAEMU/CILLS harmonized dossiers, individual national packages, and COLEACP-compliant data for export crop formulations.</p>

  <h2>Agrospear's Formulation Platforms for African Agriculture</h2>
  <p>Agrospear's 20,000 m² factory with 8 automated production lines and 50,000+ tons annual capacity manufactures formulations proven in African field conditions. SC formulations of emamectin benzoate and chlorantraniliprole address fall armyworm and bollworm complexes. EC formulations of profenofos and cypermethrin serve cotton and vegetable pest management. WP formulations of mancozeb and metalaxyl target cocoa black pod and downy mildew. FS seed treatment formulations protect maize and rice from early-season soil pests and seedling diseases. WDG and ME formulations provide resistance-management options and extended residual activity under intense UV and rainfall. Every batch undergoes six-stage QC with accelerated stability testing at 54°C per CIPAC MT 46, confirming performance after tropical storage and transport.</p>

