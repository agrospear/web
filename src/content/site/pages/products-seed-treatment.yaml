faqs:
  tagline: FAQ
  title: 'Seed Treatment Formulations — Frequently Asked Questions'
  items:
    - q: 'What seed treatment formulation types do you produce?'
      a: 'Flowable concentrate for seed treatment (FS) is the primary type — optimized for slurry treaters and film-coating equipment. We also produce seed treatment dusts (DS) and water-dispersible powders (WS) for specific crop and equipment requirements.'
    - q: 'What active ingredients are used in seed treatments?'
      a: 'Insecticide seed treatments: imidacloprid, thiamethoxam, clothianidin, fipronil. Fungicide seed treatments: metalaxyl-M, fludioxonil, sedaxane, trifloxystrobin, tebuconazole. Combination seed treatments (insecticide + fungicide) are our most requested category.'
    - q: 'Do you support seed companies with coating trials?'
      a: 'Yes. We provide sample batches for coating trials on your seed lots and equipment, with viscosity, drying time and film uniformity data. Technical support for coating equipment calibration is available.'
    - q: 'What is the MOQ for seed treatment formulations?'
      a: 'Pilot batches start at 5 tons for slurry and film-coating equipment validation. Standard production runs from 20+ tons per SKU, and sample batches for coating trials and registration start from 1 ton.'
    - q: 'Which seed treatment types do you produce beyond FS?'
      a: 'FS flowable concentrate is the primary type for slurry treaters and film-coaters. We also produce seed treatment dusts (DS) and water-dispersible powders (WS) for specific crop and applicator requirements, as well as combination insecticide + fungicide triple-action products.'
    - q: 'How is active dosage set for a target crop?'
      a: 'Dosage is set in grams of active per 100 kg of seed (g/100 kg seed), matched to the crop, target pest or disease and regional recommendation. Our R&D team calibrates the concentration so your coating equipment meters the correct dose per seed lot.'
    - q: 'Is the FS formulation compatible with my coating equipment?'
      a: 'Yes. We tune viscosity, density, drying behaviour and film flexibility to your slurry treater or film-coater model. We can test with your equipment and provide calibration data, drying time windows and colour uniformity targets.'
    - q: 'Can you add a brand colour or marker to the coating?'
      a: 'Yes. We can incorporate a brand colour or a coating marker/dye so treated seed is visually distinct and droughted to your brand. Colour consistency across batches is monitored as part of our quality release.'
    - q: 'What is the shelf life and drying time of your FS products?'
      a: 'FS formulations carry a 2-year shelf life under recommended storage. Drying time on standard seed-coating equipment is typically short enough to support high-throughput treating, and we provide the target window with your sample.'
    - q: 'What registration data do you supply for seed treatments?'
      a: 'We provide five-batch analysis, accelerated and long-term stability, analytical methods, and toxicity and safety data for the seed-treatment formulation, plus the coating- and pelleting-relevant technical documentation your market requires.'

