      icon: 'tabler:file-certificate'

process_steps:
  tagline: The Process
  title: 'From Tender Specification to Delivered Product'
  subtitle: 'A procurement-ready process designed for institutional compliance requirements.'
  steps:
    - step: '01'
      title: 'Tender Specification Review'
      desc: 'Share the tender or procurement specification. Our team reviews formulation requirements, compliance standards, packaging specifications and delivery timelines.'
    - step: '02'
      title: 'Quotation & Compliance Mapping'
      desc: 'Detailed quotation with formulation specifications mapped to tender requirements. Compliance gap analysis and documentation checklist provided.'
    - step: '03'
      title: 'Sample & Pre-Qualification'
      desc: 'Sample batches produced for evaluation and pre-qualification testing. WHO/FAO specification verification where required.'
    - step: '04'
      title: 'Award & Production Planning'
      desc: 'On tender award, production is scheduled to meet delivery deadlines. Raw material procurement and quality planning confirmed before manufacturing begins.'
    - step: '05'
      title: 'Production, QC & Documentation'
      desc: 'Manufacturing through the 7-stage inspection system. Full batch documentation — CoA, CoQ, stability reports and compliance certificates — prepared to procurement specification.'
    - step: '06'
      title: 'Delivery & Post-Delivery Support'
      desc: 'Shipped to government-designated ports or warehouses. Post-delivery documentation support and reorder coordination for program continuity.'

faqs:
  tagline: FAQ
  title: 'Government Procurement — Frequently Asked Questions'
  items:
    - q: 'Does Agrospear supply products for WHO vector control programs?'
      a: 'Yes. We produce WHO-compliant insecticide formulations for indoor residual spraying, larviciding and space spraying programs, with full WHO specification documentation and quality certificates.'
    - q: 'Can you meet government tender specifications?'
      a: 'Yes. Our team reviews tender specifications and maps our formulations to the required standards. CoA, CoQ, stability data and compliance certificates are prepared per tender documentation requirements.'
    - q: 'What certifications does the factory hold?'
      a: 'ISO 9001, ISO 14001, BSCI and ICAMA. These certifications meet the pre-qualification requirements for most government and institutional procurement programs.'
    - q: 'What is the minimum supply volume?'
      a: 'Standard production runs 20+ tons per batch. Pilot quantities from 5 tons are available for pre-qualification and evaluation. We can schedule production to meet program delivery timelines.'
    - q: 'Do you handle delivery to government-designated locations?'
      a: 'Yes. We ship FOB, CIF or DDP to government-designated ports and warehouses in 50+ countries, with export documentation and customs clearance handled by our logistics team.'

