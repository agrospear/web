hero:
  tagline: Government & Institutional
  title: 'Government & Institutional Agrochemical Procurement'
  subtitle: 'Agrospear supplies agrochemical products for government agencies, NGOs and institutional procurement programs — vector control, food security, tender compliance and bulk supply from our ISO 9001 factory.'

answer:
  label: 'Straight answer'
  text: 'Agrospear supplies agrochemical products for government and institutional procurement: vector control insecticides, food security herbicides and fungicides, and tender-compliant formulations with full documentation. ISO 9001, ISO 14001, BSCI and ICAMA certified factory. Bulk supply from 20+ ton batches, 25–35 day production, shipped to 50+ countries with compliance documentation tailored to procurement requirements.'
  verified: '2026-08'

intro:
  - Government agencies, NGOs and institutional buyers require agrochemical products that meet strict procurement standards — documented quality systems, tender-compliant specifications, traceability and reliable supply chains. Agrospear's manufacturing infrastructure and quality system are designed to meet these requirements.
  - From vector control programs in tropical regions to food security initiatives across Sub-Saharan Africa and Latin America, our factory produces formulations that comply with WHO, FAO and national procurement specifications. Full batch traceability and compliance documentation come standard.

