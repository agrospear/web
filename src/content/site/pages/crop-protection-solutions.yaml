body: |
  <h2>The Agrospear Standard — A Commitment to Flawless Agrochemical Craftsmanship</h2>
  <p>In the demanding world of modern agriculture, the agrochemical formulation stands as the critical link between active ingredient chemistry and field-level crop protection. From pre-emergent herbicide applications in row crops to foliar fungicide sprays in cereals, agrochemical formulations serve a multitude of essential purposes.</p>
  <p>However, not all formulations are created equal. The true measure of an agrochemical formulation lies not just in its active ingredient, but in the integrity of its engineering, the quality of its co-formulants and the precision of its manufacturing. Agrospear distinguishes itself as a premier formulator and manufacturer, producing agrochemical products that are engineered for excellence across every crop protection segment.</p>

  <h2>Formulation Science: The Foundation of Efficacy</h2>
  <p>The choice of formulation type and co-formulant system is the most critical factor in determining an agrochemical product's efficacy and stability. Agrospear invests considerable resources in identifying, testing and procuring the finest active ingredients and co-formulants available globally.</p>
  <ul>
    <li><strong>Superior Active Ingredient Sourcing:</strong> High-purity technical-grade actives from reputable synthesizers, selected for consistent content and impurity profiles.</li>
    <li><strong>SC (Suspension Concentrate) Technology:</strong> Wet-milled particles in aqueous suspension with anti-settling rheology — non-flammable, easy to measure and versatile across crops.</li>
    <li><strong>High-Shear Homogenization:</strong> Industrial mixing vessels with D90 below 5 μm particle size, producing uniform suspensions that meet FAO/WHO specifications batch after batch.</li>
    <li><strong>Extended Stability Engineering:</strong> Formulations engineered for 2-year shelf life with stability verified through accelerated testing at 54 °C / 14 days per CIPAC MT 46.</li>
  </ul>

  <h2>Design Philosophy: Precision Engineering for Every Segment</h2>
  <p>Our formulation team comprises experienced chemists and process engineers who leverage advanced analytical methods and real-world field testing to create formulations that are biologically efficacious, physically stable and commercially competitive.</p>

  <h3>Herbicide Programs</h3>
  <p>Designed for pre- and post-emergent weed control in row crops and cereals. Formulation configurations include SC for broad-spectrum residual activity, EC for fast-acting contact action and WDG for dust-free handling in regulated markets.</p>

  <h3>Insecticide Programs</h3>
  <p>EC formulations for rapid knockdown and systemic action; SC and ME for reduced-solvent, user-friendly options. WDG for greenhouse and field application where dust-free handling is essential.</p>

  <h3>Fungicide & PGR Programs</h3>
  <p>SC and WDG for protective and curative disease management; SL and SC for precise plant growth regulator application at low dose rates. WP for cost-sensitive broad-acre programs.</p>

  <h3>Seed Treatment Programs</h3>
  <p>FS formulations for film-coat and slurry seed treatment — delivering fungicide and insecticide protection at planting. CS and ME encapsulation for controlled-release active delivery to seedlings during early growth stages.</p>

  <h2>Manufacturing Excellence: Precision at Every Step</h2>
  <p>Agrospear employs highly skilled technicians who are masters of their craft. Our production facility is equipped with state-of-the-art machinery, including high-shear homogenizers, CNC-controlled filling lines, fluid-bed granulators and analytical instruments. Every batch follows documented procedures with full traceability.</p>
  <p>Our multi-layered quality control system includes stringent checks at each manufacturing step, culminating in comprehensive testing of every batch before shipping. This commitment to quality is built in from the very beginning, not merely inspected at the end.</p>

  <h2>Quality Control & Testing</h2>
  <ul>
    <li><strong>100% Active Content Analysis:</strong> Every batch is analyzed for active ingredient content per CIPAC methods.</li>
    <li><strong>Physical Properties Verification:</strong> Suspension rate, emulsion stability, wettability and dispersibility tested per FAO/WHO specifications.</li>
    <li><strong>Accelerated Stability Testing:</strong> 54 °C / 14 days per CIPAC MT 46 on every production batch.</li>
    <li><strong>Fill Accuracy Verification:</strong> Weight and volume accuracy checked per unit against specifications.</li>
    <li><strong>Full Systems Check:</strong> Every batch undergoes final inspection and CoA generation before shipping approval.</li>
  </ul>

  <h2>Why Choose Agrospear for Your Crop Protection Supply</h2>
  <p>With our 12,500 m² ISO 9001-certified factory in Qingdao, China, Agrospear offers distributors, agricultural retailers and crop protection brands a reliable manufacturing partner. Our OEM/ODM services include custom branding, private label, regulatory documentation and logistics support. Standard volume MOQ from 20+ tons per batch (pilot runs from 5 tons) with lead times of 25–35 days.</p>
  <p>Every Agrospear formulation is an investment in unparalleled quality, stability and efficacy — ensuring your customers achieve consistent crop protection results season after season.</p>

  <div class="not-prose my-10">
    <div class="rounded-2xl border border-sky-200 bg-sky-50 p-6 text-center dark:border-sky-900 dark:bg-sky-950">
      <h3 class="font-display text-lg font-bold">Supply your distribution network with a documented quality system</h3>
      <p class="mt-2 text-sm text-fg-2">Batch-level consistency comes from the 7-stage inspection system behind every formulation — audit it, or talk to engineering about your program.</p>
      <p class="mt-4 flex flex-wrap justify-center gap-3">
        <a href="/manufacturing/factory/quality-inspection" class="rounded-full bg-sky-600 px-6 py-2.5 text-sm font-bold text-white">The 7-stage inspection system</a>
