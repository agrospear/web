answer:
  label: 'Respuesta directa'
  text: 'Las formulaciones pasan por cinco etapas controladas: inspeccion de materiales (1–2 dias), pesaje y dosificacion automatica (desperdicio inferior al 3%, 2–4 horas por lote), mezclado de alto corte con control de tamano de partcula por molino de arena (1–2 dias por lote), procesamiento de formulacion y granulacion, y llenado final con verificacion de especificaciones y estabilidad al 100% antes del embalaje.'
  verified: '2026-08'

intro: A diferencia de las marcas que subcontratan la produccion a fabricas de terceros, Agrospear es dueno y operador de toda su cadena de fabricacion. Esta integracion vertical nos permite mantener un estricto control de calidad en cada etapa, responder rapidamente a los requisitos personalizados y entregar una calidad de producto constante tanda tras tanda. Asi se fabrica un producto de proteccion de cultivos en nuestras instalaciones.

steps:
  - step: '01'
    title: Recepcion e inspeccion de materiales
    description: Cada lote entrante de ingrediente activo de grado tecnico, solvente, coadyuvante y material de embalaje se inspecciona segun especificacion. Se prueban muestras de materia prima para verificar el contenido activo por HPLC/GC, pureza, contenido de humedad y propiedades fisicas antes de liberarlos a produccion. Los materiales no conformes se ponen en cuarentena y se devuelven.
    duration: 1–2 dias
  - step: '02'
    title: Pesaje y dosificacion automatica
    description: <p>Los materiales aprobados se pesan y dosifican por el sistema automatico controlado por PLC con precision de ±0,1%. El loteado optimizado por ordenador calcula las cantidades precisas para cada formulacion para minimizar el desperdicio, normalmente por debajo del 3%. Los componentes pesados se etiquetan por formulacion y lote, y se transfieren al taller de mezclado.</p>
    duration: 2–4 horas por lote
  - step: '03'
    title: Mezclado y mezclado de alto corte
    description: Los ingredientes activos, dispersantes, emulsionantes y transportadores se mezclan en mezcladores de alto corte a velocidades controladas de 3.000–10.000 rpm. Las formulaciones SC se premezclan antes de la molienda de arena. Las formulaciones EC y SL se mezclan en tanques encamisados con temperatura controlada. El tamano de partcula se monitoriza durante todo el proceso.
    duration: 1–2 dias por lote
  - step: '04'
    title: Molienda de arena y procesamiento de formulacion
    description: Las formulaciones SC y WDG se procesan a traves de molinos de arena para lograr distribuciones de tamano de partcula objetivo (D50 1–5 μm para SC, D50 20–40 μm para WDG). Los productos WDG y WP se producen por secado por aspersion o granulacion de lecho fluido. Cada lote se comprueba en cuanto a tamano de partcula, viscosidad, pH y suspensibilidad antes de continuar.
    duration: 1–2 dias por lote
  - step: '05'
    title: Etiquetado y decoracion
    description: Los contenedores de producto se etiquetan con maquinas de etiquetado automaticas para etiquetas conformes a GHS multilingues y codificadores de inyeccion de tinta para codificacion de lote y fecha. Las etiquetas se verifican contra el arte aprobado y los requisitos regulatorios.
    duration: 1–2 dias
  - step: '06'
    title: Llenado y sellado
    description: Tambores, garrafas y botellas se llenan, sellan y verifican en maquinas de llenado automaticas. Cada lote sigue una lista de control de llenado y embalaje de 100 puntos con firmas obligatorias en cada etapa.
    duration: 1–2 dias
  - step: '07'
    title: Pruebas de calidad e inspeccion
    description: 'Cada lote terminado supera un control de calidad obligatorio: verificacion de contenido activo por HPLC/GC, comprobacion de especificaciones (suspensibilidad, pH, viscosidad, tamano de partcula) y prueba de estabilidad de 14 dias a 54 C segun CIPAC MT 46. Las formulaciones personalizadas y de prototipo tambien reciben verificacion de eficacia en campo cuando se requiere.'
    duration: 14 dias (estabilidad)
  - step: '08'
    title: Embalaje y envio
    description: Los productos terminados se paletizan segun procedimiento, se embalan en embalaje listo para exportacion y se cargan para su envio. Cada paquete se etiqueta con nombre de producto, numero de lote y destino. Coordinamos con transitarios los envios en contenedor FCL y LCL a todo el mundo.
    duration: 1 dia

evidence_gates:
  tagline: Evidencias de inspeccion
  title: 'Cada etapa deja un registro: fotos e informes'
  subtitle: 'A continuacion tienes las fotos de inspeccion reales y los dosieres de informes de ensayo de nuestras siete puertas de control de calidad. Cada PDF es un registro bilingue real que puedes descargar y auditar — los mismos registros que respaldan cada lote en el archivo de trazabilidad ERP de 10 anos. Consulta el flujo completo de 7 etapas en /quality.'
  items:
    - title: 'PPM — Planificacion de calidad del proyecto'
      description: 'La reunion previa a la produccion fija el alcance, la muestra patron y el Plan de Inspeccion de Calidad antes de arrancar la linea. Los puntos sin resolver bloquean la liberacion a produccion.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Descargar QIP (PDF)'
      image: https://assets.agrospear.com/site/quality/node01-ppm.avif
      alt: Reunion previa a la produccion revisando la muestra patron y el plan de inspeccion de calidad de un pedido OEM agroquimico
    - title: 'IQC — Inspeccion de materiales entrantes'
      description: 'Cada lote entrante de ingredientes activos, solventes y embalaje se comprueba contra la especificacion aprobada. Los lotes no conformes se ponen en cuarentena y se rechazan antes de liberarlos a la linea.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
      image: https://assets.agrospear.com/site/quality/node02-iqc.avif
      alt: Inspeccion de materiales entrantes de ingredientes activos y componentes en la fabrica
    - title: 'IPQC / FAI — Control en proceso'
      description: 'La primera pieza se verifica contra las lineas base bloqueadas y cada turno mantiene controles de patrulla en la linea. La aprobacion FAI bloquea la version de formulacion, especificaciones y BOM.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
      image: https://assets.agrospear.com/site/quality/node03-ipqc-fai.avif
      alt: Inspeccion en proceso y control de la primera pieza durante la produccion agroquimica
    - title: 'Verificacion de estabilidad y especificaciones'
      description: 'El 100% de los lotes terminados — no solo una muestra — pasa una prueba de estabilidad de 14 dias a 54 C con rechazo automatico por desviacion de contenido activo superior al ±2%. Un registro por lote.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descargar informes de estabilidad (PDF)'
      image: https://assets.agrospear.com/site/quality/node04-airtightness.avif
      alt: Prueba de estabilidad y verificacion de especificaciones de un lote agroquimico
    - title: 'FQC — Inspeccion final del producto'
      description: 'Los lotes terminados se miden contra los limites de especificacion y se inspeccionan visualmente bajo iluminacion estandar contra la muestra patron aprobada.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
      image: https://assets.agrospear.com/site/quality/node05-fqc.avif
      alt: Inspeccion final del producto de formulaciones agroquimicas terminadas antes del embalaje
    - title: 'PSI — Inspeccion de embalaje y previa al envio'
      description: 'El envio embalado se comprueba al 100% contra el BOM aprobado por el cliente — escaneo de codigo de barras (grado ≥ B), marcas de contenedor e integridad del embalaje antes de la carga.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
      image: https://assets.agrospear.com/site/quality/node06-psi.avif
      alt: Inspeccion previa al envio comprobando el envio agroquimico embalado contra el BOM
    - title: 'Liberacion de envio y trazabilidad'
      description: 'Calidad firma la liberacion del lote solo cuando las seis puertas anteriores estan cerradas. Los numeros de lote se asignan al envio y el dosier se entrega con la entrega.'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberacion (PDF)'
      image: https://assets.agrospear.com/site/quality/node07-shipment-release.avif
      alt: Firma de liberacion de envio y entrega del registro de trazabilidad del lote
