why_canada:
  tagline: 'Why buyers in Canada'
  title: 'Built for Canadian Imports'
  subtitle: 'The factory answers the questions Canadian brands and retailers ask before their first container.'
  items:
    - title: 'DDP for a predictable landed cost'
      description: 'DDP includes customs clearance and delivery to your warehouse — duties, taxes and freight in one total in CAD or USD. The most popular choice for first-time importers.'
    - title: 'West and east coast routing'
      description: 'We quote sea freight to Vancouver or to Toronto and Montreal via the Suez route — whichever balances your transit time and landed cost.'
    - title: 'Bilingual-ready product files'
      description: 'ICAMA, FAO/WHO and customs documentation is prepared for your target markets, so your product file works for English and French label requirements.'
    - title: 'One factory, one quality system'
      description: 'Development, sampling, production and QC all happen inside the 12,500 m² plant — no broker round-trips, no samples that production cannot match.'

process_notes:
  tagline: 'How it works'
  title: 'From Spec to Container'
  subtitle: 'The same six stages whether you buy two containers a year or twenty: specification, R&D, sampling, testing, formulation development, production — then FOB, CIF or DDP delivery.'
  items:
    - title: '1. Send your spec'
      description: 'A reference product, a technical brief or a competitor specification is enough. R&D review and a quote return within one business day.'
    - title: '2. Approve the sample'
      description: 'Your first physical sample ships in 7–12 days with an approval sheet covering composition, physical properties and stability test results.'
    - title: '3. Production & export'
      description: 'Runs complete in 25–35 days with in-process QC checkpoints. Packing list, invoice and bill of lading travel ahead of the vessel.'
    - title: '4. Delivery to your warehouse'
      description: '4–6 weeks of sea freight to Vancouver, Toronto or Montreal — under DDP we handle clearance and delivery to your door.'

faq_section:
  tagline: FAQ
  title: 'Canadian Import Questions'
  questions:
    - q: How long does sea freight take to Canada?
      a: 'Allow 4–6 weeks from the Qingdao port to Canadian ports — Vancouver on the west coast, Toronto and Montreal in the east — depending on the destination and sailing schedule. DDP projects include the complete door-to-door timeline.'
    - q: Do you ship DDP to Canada?
      a: 'Yes. DDP includes ocean freight, customs clearance, duties and taxes, and delivery to your warehouse — one predictable total price. FOB Qingdao and CIF are also available.'
    - q: What is the MOQ for a private label agrochemical import?
      a: 'MOQ is confirmed by project configuration: sample development covers 1–4 tons, pilot batches run 5 tons on existing platforms, and standard volume production runs 20+ tons per batch.'
    - q: Do you support English and French labeling?
      a: 'Yes. Our prepress team prepares label data for the languages and regulations of your target markets — including bilingual EN/FR labeling for the Canadian market.'
    - q: Can I visit the factory before ordering?
      a: 'Yes. The 12,500 m² plant in Qingdao is open to clients — virtual factory tours can be arranged online, and in-person visits guided through the production lines and QC stations.'
    - q: How do I start a project from Canada?
      a: 'Send a reference product, technical brief or specification. The R&D review and quotation return within one business day, and an NDA is signed before any file exchange.'

