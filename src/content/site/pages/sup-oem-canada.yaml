answer:
  label: 'Straight answer'
  text: 'Canadian brands order agrochemical products from Agrospear on standard terms: MOQ is confirmed by project configuration: sample runs of 1–4 tons validate the formulation, pilot batches of 5 tons test the market on existing platforms, and standard volume production runs 20+ tons per batch. The first sample ships 7–12 days after specification approval, production runs 25–35 days after confirmed PO and deposit, and sea freight adds 4–6 weeks to Canadian ports — Vancouver on the west coast, Toronto and Montreal in the east. DDP covers customs clearance and delivery to your warehouse.'
  verified: '2026-08'

