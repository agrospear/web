answer:
  label: 'Respuesta directa'
  text: 'Suministramos herbicidas, insecticidas y fungicidas OEM a distribuidores e importadores africanos en África Occidental, Oriental y Meridional. Nuestro programa para África incluye expedientes de pre-registro, documentación en francés e inglés, tamaños de embalaje adaptados a pequeños agricultores y MOQs flexibles desde 1,000 L/kg por SKU.'
