      href: /es/manufacturing/quality-control

faqs:
  tagline: FAQ
  title: 'Mercado de África — Preguntas frecuentes'
  items:
    - q: '¿A qué países africanos suministráis?'
      a: 'Suministramos productos OEM a distribuidores en África Occidental (Nigeria, Ghana, Costa de Marfil, Senegal), África Oriental (Kenia, Tanzania, Uganda, Etiopía) y África Meridional (Zambia, Zimbabue, Mozambique). Productos registrados o en registro en 20+ países subsaharianos.'
    - q: '¿Qué cultivos abordan vuestros productos en África?'
      a: 'Nuestra gama para África cubre cultivos básicos: maíz, arroz, sorgo, mijo, yuca, ñame, cacao, café, algodón y hortalizas. Las formulaciones se seleccionan según presión de plagas local, métodos de aplicación y estatus regulatorio.'
    - q: '¿Proporcionáis documentación en francés para África francófona?'
      a: 'Sí. Proporcionamos documentación completa de producto en francés para mercados francófonos: etiquetas, fichas de seguridad, fichas técnicas y expedientes de registro. Nuestro equipo regulatorio tiene experiencia con requisitos de registro WAEMU y CEMAC.'
    - q: '¿Qué tamaños de embalaje funcionan para los mercados africanos?'
      a: 'Embalaje adaptado a pequeños agricultores: 100 mL, 250 mL y 1 L para formulaciones líquidas; 100 g, 250 g y 1 kg para formulaciones en polvo. Embalaje al granel (5 L, 10 L, 20 L) para compradores institucionales y plantaciones.'

