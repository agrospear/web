crop_profiles:
  tagline: 'Cultivos y Plagas'
  title: 'Cultivos Principales y Plagas Objetivo — África'
  features:
    - icon: M
      icon_bg: green
      title: 'Maíz — Gusano Cogollero'
      desc: 'El gusano cogollero (Spodoptera frugiperda) causa pérdidas de rendimiento del 20–50% en las regiones maiceras subsaharianas. Formulaciones SC de emamectina benzoato y clorantaniliprol, tratamientos de semilla FS de clothianidin y tiametoxam para protección en etapa temprana.'
      link_label: 'Ver herbicidas'
      href: /products/herbicides
    - icon: C
      icon_bg: blue
      title: 'Cacao — Podredumbre Negra y Miridos'
      desc: 'La podredumbre negra del cacao (Phytophthora) y los miridos (Sahlbergella) amenazan las exportaciones de cacao de África Occidental. Formulaciones WP y SC de mancozeb y metalaxil, conformes con COLEACP para producción de grado exportación.'
      link_label: 'Ver fungicidas'
      href: /products/fungicides
    - icon: R
      icon_bg: purple
      title: 'Arroz — Cecidomyia del Arroz Africano'
      desc: 'La cecidomyia del arroz y el barrenador del tallo afectan el arroz irrigado y de secano en África Occidental y Oriental. Formulaciones EC de cipermetrina y clorpirifos, formulaciones WP de cartap para programas MIP.'
      link_label: 'Ver insecticidas'
      href: /products/insecticides
    - icon: V
      icon_bg: orange
      title: 'Hortalizas — Mosca Blanca y Pulgones'
      desc: 'Los virus transmitidos por mosca blanca y el daño de pulgones afectan la producción de tomate, pimiento y hortalizas de hoja. Formulaciones SC y EC de imidacloprid y abamectina, tamaños de embalaje adaptados a pequeños agricultores.'
      link_label: 'Ver insecticidas'
      href: /products/insecticides
    - icon: T
      icon_bg: green
      title: 'Algodón — Complejo de Heliothis'
      desc: 'Heliothis, pulgones y jassidos afectan la producción algodonera en África Occidental, Central y Meridional. Formulaciones EC de profenofos y cipermetrina para manejo de amplio espectro de plagas del algodón.'
      link_label: 'Ver insecticidas'
      href: /products/insecticides

