hero:
  tagline: 'Resources'
  title: 'Pesticide Export Documentation: Certificates, Licenses and Customs Requirements'

answer:
  label: 'Straight answer'
  text: 'Pesticide export requires ICAMA registration certificate, Certificate of Analysis per batch, GHS-compliant Safety Data Sheet, export license from MOFCOM, dangerous goods declaration (UN number, class, packing group), phytosanitary certificate for certain destinations, and commercial documentation (commercial invoice, packing list, bill of lading). Missing or inconsistent documentation is the primary cause of customs delays and shipment rejection.'
  verified: '2026-08'

intro:
  - 'Agrochemical export documentation is more complex than general merchandise due to dangerous goods classification, pesticide-specific regulatory requirements and the need for consistency between all documents. The ICAMA certificate must match the product name and specification on the Certificate of Analysis, which must match the commercial invoice description, which must match the customs declaration. Any discrepancy — even a formulation name variation — can trigger inspection holds, re-export orders or product seizure.'
  - 'Agrospear''s documentation team prepares and cross-verifies all export paperwork as part of the 7-stage QC system. Every shipment includes: ICAMA certificate, COA per CIPAC methods, SDS in destination-market language, MOFCOM export license, DG declaration with UN classification, fumigation certificate (where required), certificate of origin and authenticated commercial documents. The documentation package is verified against the packing list and bill of lading before shipment release, ensuring zero discrepancy across all 50+ export destinations.'

