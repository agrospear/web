faqs:
  tagline: FAQ
  title: 'West Asia Market — Frequently Asked Questions'
  items:
    - q: 'Which West Asian and Middle Eastern countries do you supply?'
      a: 'We supply OEM products to distributors across Saudi Arabia, UAE, Kuwait, Bahrain, Oman, Qatar, Jordan, Iraq, Lebanon and Pakistan. Products are registered or in registration in key markets.'
    - q: 'How do you ensure formulation stability in extreme heat?'
      a: 'All formulations undergo accelerated stability testing at 54°C (CIPAC MT 46) and long-term stability at 45°C. We adjust adjuvant packages, preservative systems and packaging materials for desert storage conditions exceeding 50°C ambient temperature.'
    - q: 'Do you provide Arabic documentation?'
      a: 'Yes. We provide complete product documentation in Arabic and English: labels, safety data sheets, technical data sheets and registration dossiers adapted to GCC and national regulatory requirements.'
    - q: 'What packaging works for Middle Eastern markets?'
      a: 'Institutional and plantation-scale packaging: 5 L, 10 L, 20 L and 200 L for liquid formulations; 5 kg, 10 kg and 25 kg for powder formulations. UV-resistant containers for outdoor storage in high-temperature conditions.'

