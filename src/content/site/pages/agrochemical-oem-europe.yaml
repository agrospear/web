faq_section:
  tagline: FAQ
  title: 'European Import Questions'
  questions:
    - q: Does Agrospear support EU Regulation 1107/2009 registration dossiers?
      a: 'Yes. Agrospear provides the technical data components that support a Regulation 1107/2009 registration dossier: ICAMA registration documentation, FAO/WHO specification data, active ingredient certificates, full formulation composition, physical-chemical property data and accelerated stability results. Your regulatory consultant integrates these into the zonal authorization submission.'
    - q: What dossier data does Agrospear provide for EU registration?
      a: 'Agrospear supplies formulation composition, five-batch analysis data, physical-chemical property reports, accelerated stability studies per CIPAC MT 46, and toxicology summaries from the ICAMA registration file. Additional studies can be coordinated through GLP-compliant laboratories when required for your dossier.'
    - q: Is ICAMA documentation included with my order?
      a: 'Yes. ICAMA and FAO/WHO documentation is prepared for the EU market alongside your approved sample, before production starts — the documents ship with the container.'
    - q: How long does sea freight take to Europe?
      a: 'Allow 4–6 weeks from the Qingdao port to Rotterdam or Hamburg, depending on the sailing schedule. DDP projects include the complete door-to-door timeline.'
    - q: Do you ship DDP to EU countries?
      a: 'Yes. DDP includes ocean freight, customs clearance, duties and taxes, and delivery to your warehouse — one predictable total price. FOB Qingdao and CIF are also available.'
    - q: What is the MOQ for a private label agrochemical import?
      a: 'MOQ is confirmed by project configuration: sample development covers 1–4 tons, pilot batches run 5 tons on existing platforms, and standard volume production runs 20+ tons per batch.'
    - q: How do I start a project from Europe?
      a: 'Send a reference product, technical brief or specification. The R&D review and quotation return within one business day, and an NDA is signed before any file exchange.'

