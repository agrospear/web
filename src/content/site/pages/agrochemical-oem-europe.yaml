why_europe:
  tagline: 'Why buyers in Europe'
  title: 'Built for European Imports'
  subtitle: 'The factory answers the questions European brands ask before their first container — registration dossier preparation and EU compliance first.'
  items:
    - title: 'EU Regulation 1107/2009 dossier support'
      description: 'Placing plant protection products on the EU market requires registration under Regulation (EC) No 1107/2009. Agrospear provides ICAMA registration documentation, FAO/WHO specification data, active ingredient certificates, formulation composition files and physical-chemical property data to support your zonal authorization dossier and national registrations.'
    - title: 'ICAMA and FAO/WHO documentation'
