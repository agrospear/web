hero:
  tagline: 'Resources'
  title: 'Herbicide Formulation Stability Testing: CIPAC Methods Explained'

answer:
  label: 'Straight answer'
  text: 'CIPAC stability testing for herbicide formulations involves accelerated storage at 54°C for 14 days (simulating 2-year shelf life), freeze-thaw cycling at -10°C/+25°C for 5 cycles, and ongoing monitoring of active ingredient content, suspensibility, pH and viscosity. Formulations must retain ≥95% of declared active ingredient and show no physical separation after stability conditioning to meet FAO/WHO specifications.'
  verified: '2026-08'

intro:
  - 'The Collaborative International Pesticides Analytical Council (CIPAC) publishes the internationally recognized test methods that underpin FAO/WHO pesticide specifications. MT 46 covers accelerated storage testing, MT 39 measures suspensibility of water-dispersible formulations, MT 75 determines emulsion stability, and MT 148 evaluates pourability. These methods are mandatory for ICAMA registration and for meeting import requirements in most regulated markets.'
  - 'Agrospear conducts CIPAC stability testing in dedicated environmental chambers at its 20,000 m² facility. Every formulation batch undergoes 54°C/14-day accelerated testing before release, and long-term stability monitoring continues at 25°C and 35°C for ongoing shelf-life verification. The 7-stage QC system integrates CIPAC methods at raw material intake, in-process checks and final release stages.'

