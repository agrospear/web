faqs:
  tagline: FAQ de Distribuidores
  title: 'Programa de Distribución — Preguntas Frecuentes'
  items:
    - q: '¿Cuál es el pedido mínimo para un nuevo distribuidor?'
      a: 'Los nuevos socios de distribución suelen empezar con un pedido de muestra seguido de un primer envío programado para su temporada. El mínimo exacto depende del tamaño del territorio y de la gama de producto elegida; tu gestor de cuenta confirma el volumen de apertura durante la selección del catálogo.'
    - q: '¿Los territorios son exclusivos?'
      a: 'Sí. El programa de distribución de Agrospear se basa en territorios exclusivos: cada socio mayorista cubre un país o región definido y recibe precios y soporte de programa para ese mercado.'
    - q: '¿Proporcionáis documentación reglamentaria para el registro local?'
      a: 'Sí. El soporte de documentación de registro está incluido en el programa de distribuidores. Datos de licencia de producción ICAMA, plantillas de CdA y especificaciones de formulación se proporcionan para apoyar el registro local en tu territorio.'
    - q: '¿Qué productos pueden pedir los distribuidores?'
      a: 'El catálogo completo de Agrospear: herbicidas (glifosato, glufosinato, atrazina y más), insecticidas, fungicidas, reguladores de crecimiento y tratamientos de semillas en formulaciones SC, EC, WP, WDG, SL, ME, CS y FS. La mayoría de los socios empieza con 4–8 SKU de más venta y amplía en temporadas posteriores.'
    - q: '¿Cómo se envían los pedidos?'
      a: 'Los pedidos salen de nuestra fábrica en salidas programadas, con pedidos anticipados disponibles para estabilizar los costes de transporte. Tu gestor de cuenta planifica la producción y el despacho en función de tu previsión y del calendario de siembra.'
    - q: '¿Cómo puedo solicitar?'
      a: 'Usa el formulario de solicitud de esta página o ponte en contacto con nosotros directamente. Las solicitudes las revisa el equipo de distribución y respondemos con los siguientes pasos, incluida la delimitación del territorio y un contrato provisional, en pocos días hábiles.'

