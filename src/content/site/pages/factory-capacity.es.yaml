meta:
  title: 'Capacidad de Producción de Fábrica | 12.500 m² Fabricante Agroquímico China | {SITE}'
  description: 'La capacidad de la fabrica de Agrospear: 12.500 m2 que producen mas de 20.000 toneladas de formulaciones agroquimicas al ano. Fabricacion OEM/ODM a gran escala.'
  dateModified: '2026-08-07'
