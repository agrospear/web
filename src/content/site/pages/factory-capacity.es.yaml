workshops:
  - title: Produccion de formulaciones SC/EC/SL
    description: '4 lineas de produccion automatizadas para formulaciones SC, EC y SL con una produccion combinada de unas 2.000 toneladas al mes. Las estaciones de mezclado de alto corte y molienda de arena funcionan simultaneamente. Capacidad anual: mas de 20.000 toneladas.'
    output: 'Mas de 20.000 toneladas al ano'
  - title: Produccion de formulaciones WDG/WP/ME
    description: 'Capacidad de produccion ampliada para formulaciones WDG, WP y ME con lineas adicionales de secado por aspersion y granulacion de lecho fluido. Las estaciones de molienda de arena, secado por aspersion y embalaje funcionan en paralelo.'
    output: 'Capacidad WDG/WP ampliada'
  - title: Produccion de tratamientos de semilla FS
    description: 'Lineas de produccion polivalentes para formulaciones de tratamiento de semillas FS. Las estaciones de mezclado, molinos de cuentas y puestos de llenado se reconfiguran segun la mezcla de pedidos. Capacidad anual: mas de 3.000 toneladas.'
    output: 'Mas de 3.000 toneladas al ano'
  - title: Llenado y embalaje
    description: 'Area dedicada de llenado y embalaje para tambores, garrafas y botellas. Lineas automaticas de llenado, maquinas de etiquetado y estaciones de control de peso. Capacidad anual de embalaje: mas de 25.000 unidades.'
    output: 'Mas de 25.000 unidades envasadas al ano'

oem_capacity:
  moq: 'Agroquimico: muestra 1–4 toneladas | piloto 5 toneladas | volumen 20+ toneladas por lote'
  lead_time: 'Estandar de 25–35 dias. Muestras en 7–12 dias. Acelerado disponible.'
  payment: 'T/T 30% de deposito + 70% de saldo. Se aceptan L/C y Western Union.'

lead_time_explainer:
  tagline: 'Planificacion y programacion'
  title: 'Como se traduce la capacidad en tu entrega'
  subtitle: 'La capacidad no es un numero unico: asi se asignan realmente los plazos.'
  items:
    - title: 'La capacidad varia segun tu especificacion'
      body: 'Los huecos disponibles cambian segun el tipo de formulacion, la complejidad de concentracion, el packaging y la demanda estacional. Durante la temporada de aplicacion de primavera/verano, las lineas estan al maximo y los huecos de muestras se reservan primero.'
    - title: 'Planifica antes de tu temporada de lanzamiento'
      body: 'Fija pronto la confirmacion de muestras y el cierre de arte de etiqueta. Los pedidos repetidos se programan en tu hueco recurrente acordado una vez archivada la muestra dorada.'
    - title: 'Tres vias de programacion'
      body: 'Las muestras entran primero en la linea de laboratorio, los pedidos iniciales se colocan en la ventana de produccion abierta mas proxima y los pedidos repetidos se ejecutan en su hueco recurrente.'
    - title: 'Plazos firmes tras la revision'
      body: 'Confirmamos un plazo firme solo despues de revisar formulacion, arte de etiqueta, packaging y cantidad — nunca como una promesa fija a priori.'

cta:
  title: 'Comprueba la disponibilidad de produccion para tu fecha de lanzamiento'
  subtitle: 'Envia tu tipo de formulacion, cantidad y fecha de lanzamiento objetivo — respondemos con la proxima ventana de produccion abierta y una estimacion de plazo firme.'
  actions:
