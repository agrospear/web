hero:
  tagline: Capacidad de produccion
  title: Capacidad de fabricacion y produccion anual
  subtitle: 'Instalacion de 12.500 m2 que produce mas de 20.000 toneladas de formulaciones agroquimicas al ano, con margen para escalar'

answer:
  label: 'Respuesta directa'
  text: 'Capacidad de la fabrica: 12.500 m2 repartidos en cuatro talleres especializados, mas de 20.000 toneladas de formulaciones agroquimicas al ano, mas de 350 trabajadores en dos turnos y exportacion a mas de 50 paises. El MOQ se confirma segun la configuracion del proyecto — muestra (1–4 toneladas), piloto (5 toneladas) y volumen estandar (20+ toneladas por lote); consulta nuestra Guia de MOQ y Branding Flexible para la logica completa. Plazo de entrega de 25–35 dias y muestras en 7–12 dias.'
  verified: '2026-08'

intro: Agrospear opera una de las instalaciones dedicadas mas grandes de fabricacion de agroquimicos en Qingdao, China. Nuestra fabrica de 12.500 m2 esta organizada en cuatro talleres especializados que trabajan en paralelo, lo que nos da la capacidad de producir mas de 20.000 toneladas al ano en las lineas de formulacion y envasado.

