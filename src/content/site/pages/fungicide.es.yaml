faqs:
  - question: '¿Cuál es la diferencia entre fungicidas preventivos y curativos?'
    answer: 'Los preventivos forman una barrera protectora antes de la infección: inhiben la germinación de esporas o la penetración del tubo germinativo. Los curativos poseen actividad sistémica o mesostémica que alcanza el micelio ya establecido en el tejido vegetal, deteniendo el avance de la enfermedad. En la práctica, Agrospear recomienda programas que combinen ambos tipos para maximizar la protección y minimizar el riesgo de resistencia.'
  - question: '¿Cómo aplican los criterios FRAC en sus formulaciones?'
    answer: 'Todo ingrediente activo que formulamos está clasificado según su grupo FRAC. Nuestros programas de aplicación limitan el número de tratamientos consecutivos con el mismo grupo y priorizan las premezclas que combinan grupos FRAC sin cruzados. Esta estrategia reduce la presión de selección y preserva la eficacia de cada modo de acción a largo plazo.'
  - question: '¿Qué formulaciones son más adecuadas para invernadero?'
    answer: 'Para invernadero recomendamos formulaciones SC y FS, que generan baja fitotoxicidad, alta cobertura y mínima residualidad en superficie. Las formulaciones SC permiten aplicaciones de volumen ultra-bajo compatibles con sistemas automatizados, mientras que las FS son ideales para tratamientos preventivos al sustrato o al momento del trasplante.'
  - question: '¿Pueden fabricar fungicidas con doble ingrediente activo?'
    answer: 'Sí. Una parte significativa de nuestra producción OEM corresponde a premezclas multi-IA que combinan un preventivo de amplio espectro con un curativo específico. Estas formulaciones amplían el espectro de control, reducen el número de aplicaciones y mitigan el riesgo de resistencia al incorporar dos modos de acción FRAC diferentes en un solo producto.'
body: |
  <h2>Control preventivo y curativo de enfermedades</h2>
  <p>Las enfermedades fungosas pueden causar pérdidas de hasta el 30 % de la producción si no se manejan oportunamente. Agrospear formula fungicidas preventivos —mancozeb, propineb, copper-based— que forman una película protectora sobre la superficie foliar e impiden la germinación de esporas y la penetración del patógeno. Estos productos son la primera línea de defensa en programas de protección de cultivos de alto valor.</p>
  <p>Para situaciones donde la infección ya está establecida, nuestra línea curativa incluye triazoles (inhibidores de demetilación, grupo FRAC 3), estrobilurinas (inhibidores de Qo, grupo FRAC 11), carboxamidas (inhibidores de SDH, grupo FRAC 7) y fenilamidas (grupo FRAC 4). Cada grupo actúa en un punto distinto del metabolismo del hongo, lo que permite rotar modos de acción y evitar la selección de cepas resistentes.</p>

  <h2>Formulaciones SC, WDG, WP y FS para campo e invernadero</h2>
  <p>El concentrado en suspensión (SC) es la formulación más versátil de nuestra línea fungicida: estable al almacenamiento, libre de polvo, compatible con mezclas en tanque y apta para aplicaciones de bajo volumen. En invernadero, las formulaciones SC minimizan el riesgo de fitotoxicidad y se integran con sistemas de riego por goteo para aplicaciones vía fertirriego.</p>
  <p>Los gránulos dispersables en agua (WDG) ofrecen ventajas logísticas para fungicidas de campo: menor peso de transporte, estabilidad térmica en climas tropicales y dosificación precisa sin generación de polvo. Los polvos mojables (WP) son la opción económica para mercados sensibles al precio, con probada eficacia en aplicaciones de volumen estándar. Las formulaciones FS (flowable for seed treatment) se destinan al tratamiento de semillas, proporcionando protección sistémica desde la emergencia hasta las primeras semanas del ciclo del cultivo.</p>

  <h2>Manejo de resistencia según la clasificación FRAC</h2>
  <p>La resistencia a fungicidas es un fenómeno acelerado por la repetición de aplicaciones con el mismo modo de acción. Agrospear aplica rigurosamente la clasificación FRAC y recomienda no superar dos aplicaciones consecutivas del mismo grupo, intercalando grupos con sitios de acción independientes. Las premezclas (por ejemplo, triazol + estrobilurina, o carboxamida + ditiocarbamato) son una herramienta clave: al exponer al patógeno a dos presiones de selección simultáneas, se reduce drásticamente la probabilidad de aparición de resistencia.</p>
  <p>Nuestro equipo técnico trabaja con cada cliente OEM para diseñar programas de aplicación específicos para cada sistema productivo —arroz, trigo, vid, frutales, hortalizas— considerando la epidemiología local, las condiciones climáticas y el umbral de acción. Esta consultoría forma parte del servicio integral de Agrospear, respaldada por nuestro laboratorio de análisis y nuestro equipo de campo con presencia en más de 60 países.</p>

  <div class="cta">
