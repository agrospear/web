    <p>Con capacidad de 50 000+ toneladas anuales, certificaciones ISO 9001/14001, GMP, BSCI e ICAMA, Agrospear es su socio para fungicidas de alta eficacia. Desde formulaciones preventivas hasta premezclas curativas de última generación, fabricamos bajo su marca con la calidad que su mercado exige.</p>
