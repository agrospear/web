  subtitle: Centrados en el progreso

intro:
  - El Centro de Investigación y Desarrollo (I+D) de Agrospear es la fuerza motriz de nuestra misión de ofrecer soluciones de protección de cultivos superiores a nivel mundial. Damos a las empresas agrícolas de todo el mundo productos más seguros, eficaces y fiables mediante una innovación constante en formulaciones agroquímicas — desde herbicidas e insecticidas hasta fungicidas, reguladores de crecimiento y tratamientos de semillas. Nuestro equipo dedicado de químicos de formulación, científicos analíticos y expertos apasionados de la protección de cultivos está dando forma al futuro del sector, elevando constantemente el listón de la calidad, la eficacia y la sostenibilidad.
  - Nuestras instalaciones de I+D reúnen bajo un mismo techo a químicos de formulación, científicos analíticos e ingenieros de producción. Desde la selección de ingredientes activos y la optimización de coformulantes hasta el desarrollo de procesos de formulación y las pruebas de estabilidad a escala real, cada etapa del desarrollo de producto está impulsada por datos y validada mediante ensayos.

mission:
  tagline: Nuestra misión
  title: Innovando el futuro de la protección de cultivos
  pillars:
    - icon: lightning
      title: Avance tecnológico
      desc: Innovamos en formulaciones, sistemas de dispersión y fabricación para lograr un rendimiento y una estabilidad en estantería superiores.
    - icon: design
      title: Diseño basado en la eficacia
      desc: Entendemos y superamos las necesidades del agricultor mediante la optimización de la entrega del ingrediente activo y el rendimiento en campo.
    - icon: globe
      title: Prácticas sostenibles
      desc: Minimizamos el impacto medioambiental desarrollando formulaciones de menor dosis, biopesticidas y coformulantes ecológicos.
    - icon: shield
      title: Calidad sin concesiones
      desc: Garantizamos los más altos estándares de calidad mediante ensayos rigurosos, evaluación de estabilidad y cumplimiento regulatorio.

pillars:
  - title: Avance tecnológico
    desc: Innovamos en formulaciones, sistemas de dispersión y procesos de fabricación para ofrecer un rendimiento y una estabilidad en estantería superiores.
    icon: tech
  - title: Química de formulación avanzada
    desc: Investigamos tecnologías de vanguardia en SC, EC, WDG, ME, CS y microencapsulación para mejorar las características del producto.
    icon: materials
  - title: Sostenibilidad
    desc: 'Un compromiso central: dedicados a la gestión medioambiental mediante fabricación sostenible y desarrollo de biopesticidas.'
    icon: sustainability

capabilities:
  tagline: Capacidades
  title: Capacidades de I+D
  subtitle: Cuatro disciplinas clave que nos dan control integral del desarrollo de formulación, desde la investigación del ingrediente activo hasta el registro final.
  groups:
    - title: Química de formulación y tecnología de coformulantes
      items:
        - Análisis de compatibilidad de ingredientes activos y optimización de selección de coformulantes
        - Desarrollo de aditivos de estabilización UV, agentes anti-sedimentación y estabilidad en estantería
        - Diseño de formulaciones multicomponente y desarrollo de combinaciones sinérgicas
        - Ensayos de estabilidad acelerada (ciclado térmico, estabilidad en frío, almacenamiento a largo plazo)
    - title: Ingeniería de tamaño de partícula y sistemas de dispersión
      items:
        - Optimización de procesos de molienda con molino de perlas y molino de arena para formulaciones SC y WDG
        - Control de distribución de tamaño de partícula y optimización de tasa de suspensión
        - Desarrollo de sistemas de emulsión y microemulsión para formulaciones EC y ME
        - Desarrollo de sistemas de dispersión a medida para ingredientes activos complejos
    - title: Desarrollo de procesos de fabricación
      items:
        - Escalado de lote de laboratorio a producción piloto y fabricación completa
        - Optimización de procesos de mezcla, molienda, granulación y llenado
        - Cualificación de sistemas de solventes y portadores para diferentes tipos de formulación
        - Modelado de parámetros de proceso y predicción de eficiencia de producción
    - title: Soporte de registro y cumplimiento
      items:
        - Preparación del paquete de datos ICAMA y soporte de dosier regulatorio
        - Análisis de cinco lotes y desarrollo de especificaciones de producto
        - Desarrollo de protocolos de ensayo personalizados para cualificación de compras
        - Coordinación de ensayos en campo y gestión de datos de bioeficacia

