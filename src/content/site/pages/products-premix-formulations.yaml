faqs:
  tagline: FAQ
  title: 'Pre-Mixture Formulations — Frequently Asked Questions'
  items:
    - q: 'What pre-mixture combinations do you formulate?'
      a: 'Insecticide + fungicide, dual-mode insecticide, dual-mode fungicide, and herbicide + safener combinations. Common examples: thiamethoxam + lambda-cyhalothrin SC, azoxystrobin + propiconazole SC, nicosulfuron + atrazine WDG. Custom AI pairs specified per project.'
    - q: 'Are pre-mixture formulations more complex to develop?'
      a: 'Yes. Compatibility between actives, adjuvant system design, and thermal stability of each component must be validated. Our R&D team performs compatibility screening before pilot production and provides stability data for the combined formulation.'
    - q: 'Do pre-mixtures require separate registration?'
      a: 'In most markets, yes — a pre-mixture is a separate product requiring its own registration dossier. We provide the complete data package: five-batch analysis, accelerated and long-term stability, toxicity data and field efficacy for the combination product.'
    - q: 'What MOQ applies to pre-mixture formulations?'
      a: 'Pilot batches start at 5 tons for compatibility and stability validation. Standard production runs from 20+ tons per SKU, with volume discounts at 50 t and 100 t thresholds. Sample batches for registration start from 1–4 tons.'
    - q: 'Which formulation types can a pre-mixture take?'
      a: 'The main types are Suspension Concentrates (SC), Emulsifiable Concentrates (EC) and Water-Dispersible Granules (WDG). Formulation choice is driven by the solubility and physical form of each active, and we recommend the type that keeps the combination physically and chemically stable over its shelf life.'
    - q: 'How do I specify a custom active-ingredient combination?'
      a: 'Share your target actives, ratio, crop and market. Our R&D team runs a compatibility screen, then proposes an adjuvant system and formulation type with a stability program. A technical review confirms the ratios and manufacturing route before pilot production.'
    - q: 'How long does pre-mixture stability validation take?'
      a: 'Compatibility screening takes about 1–2 weeks. Accelerated stability testing (54 °C / 2 weeks or equivalent) runs alongside pilot production, and a full 2-year long-term stability study is maintained while your registration proceeds.'
    - q: 'What sample lead time can I expect?'
      a: 'After formulation confirmation, physical samples are available in 7–14 days. We ship them with a certificate of analysis and stability snapshot so your lab can validate the combination before you commit to volume.'
    - q: 'Do you charge for compatibility and stability testing?'
      a: 'For OEM projects within our standard product platforms, initial compatibility screening is included in the project scope. Custom combinations requiring extensive R&D or unique stability programs are scoped and quoted transparently before work begins.'
    - q: 'Can pre-mixtures be packaged under my private label?'
      a: 'Yes. We offer bottle, IBC, drum and sachet packaging with your private-label artwork, and can unify packaging across the solo and combination products in your range for a consistent brand presence.'

