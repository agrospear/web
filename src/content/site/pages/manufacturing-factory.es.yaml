qc_section:
  tagline: Control de Calidad
  title: Ensayos y Garantía de Calidad
  subtitle: Cada lote se somete a ensayos obligatorios antes del envío. Nuestro laboratorio opera de forma independiente de la producción.
  steps:
    - step: '1'
      title: Inspección de Materias Primas
      desc: Análisis de pureza por HPLC/GC, perfilado de impurezas y verificación de propiedades físicas antes de la producción.
    - step: '2'
      title: Ensayo de Estabilidad de 14 días a 54 °C
      desc: Cada lote se mantiene a 54 °C durante 14 días según CIPAC MT 46. Desviación de contenido activo superior a ±2% provoca rechazo automático.
    - step: '3'
      title: Verificación de Contenido Activo y Especificaciones
      desc: Formulaciones analizadas para contenido activo por HPLC/GC y comprobadas en suspensibilidad, estabilidad de emulsión, pH, viscosidad y tamaño de partícula.

oem_section:
  tagline: Proyectos OEM
  title: Casos de Éxito de Marcas y Asociaciones OEM
  subtitle: 'Del concepto a la producción — cómo ayudamos a marcas globales a lanzar líneas de productos agroquímicos.'
  cases:
    - challenge: Un distribuidor europeo necesitaba una línea de herbicidas de etiqueta privada con formulaciones únicas e ingredientes conformes a REACH en 60 días.
      solution: Desarrollamos formulaciones SC personalizadas, conseguimos ingredientes conformes a REACH y redujimos las muestras al ubicar al equipo en nuestra fábrica.
      result: Producción de 25–35 días desde PO firmado. 200+ toneladas en 4 SKU. Pedido repetido antes de completar la primera tirada.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Una startup estadounidense necesitaba una formulación SC de insecticida con concentración personalizada y registro ICAMA.
      solution: Adaptamos la formulación SC existente con proporción modificada de IA, desarrollamos embalaje co-marcado y proporcionamos documentación de registro ICAMA.
      result: Más de 500 toneladas vendidas en el primer año con una tasa de reorden del 95%.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance son representativos; los resultados específicos no son verificables de forma independiente.'

faq_section:
  tagline: FAQ
  title: 'Fábrica — Preguntas Frecuentes'
  questions:
    - q: ¿Cuál es el MOQ para formulaciones OEM?
      a: 'El MOQ se confirma por configuración del proyecto. Volumen estándar 20+ toneladas por lote, pilotos desde 5 toneladas y cada proyecto pasa por muestras (1–4 toneladas) y etapas piloto.'
    - q: ¿Qué certificaciones tiene la fábrica?
      a: 'ISO 9001, ISO 14001, BSCI e ICAMA. Documentación completa de cumplimiento con cada envío OEM.'
    - q: ¿Cuál es el plazo típico?
      a: 'Plazo estándar de 25–35 días desde PO confirmado y depósito. El desarrollo a medida añade 15–20 días. Muestras de prototipo listas en 7–14 días.'
    - q: ¿Gestionáis la documentación de exportación?
      a: 'Sí. Gestionamos internamente la documentación de exportación y el despacho de aduanas, suministrando a más de 50 países.'

production_flow:
  tagline: Flujo de Producción
  title: Del Material al Producto Terminado
  subtitle: 'Cada lote pasa por 6 etapas de producción con puntos de control de calidad en cada paso.'
  stages:
    - stage: '01'
      title: Recepción de Materiales y QC de Entrada
      description: 'Todos los materiales registrados por número de lote. En cuarentena hasta el visto bueno del QC.'
      qc_check: 'Pureza de IA (HPLC/GC), perfil de impurezas, pureza del solvente'
    - stage: '02'
      title: Mezcla y Premezcla
      description: 'Loteado optimizado por ordenador con precisión de ±0,1%.'
      qc_check: 'Verificación de peso, identidad de materia prima, uniformidad de premezcla'
    - stage: '03'
      title: Procesamiento de Formulación y Molienda
      description: 'Mezclado de alto corte, molienda de arena, secado por aspersión y granulación.'
      qc_check: 'Distribución de tamaño de partícula, viscosidad, pH, suspensibilidad'
    - stage: '04'
      title: Llenado y Embalaje
      description: 'Lista de verificación de llenado y embalaje de 100 puntos por lote.'
      qc_check: 'Peso de llenado, integridad del sellado, precisión de etiqueta, verificación de código de barras'
    - stage: '05'
      title: Ensayo de Estabilidad y Retención de Calidad
      description: 'Ensayo de estabilidad a 54 °C de 14 días según CIPAC MT 46 en cada lote.'
      qc_check: 'Contenido activo, suspensibilidad, pH, estabilidad física'
    - stage: '06'
      title: Inspección Final y Embalaje
      description: 'Inspección visual y de especificaciones completa antes de la carga del contenedor.'
      qc_check: 'Inspección visual, lista de etiquetas, integridad del embalaje, escaneo de código de barras'

