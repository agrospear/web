hero:
  tagline: Fábrica
  title: 'Fábrica y Planta de Fabricación'
  subtitle: 'Visita la fábrica de Agrospear — planta de 20.000 m² con mezcla, molienda, llenado, etiquetado y laboratorio de calidad para fabricación OEM/ODM en Qingdao, China.'

answer:
  label: 'Respuesta directa'
  text: 'La fábrica de Agrospear en Qingdao (China) abarca 20.000 m² con 4 talleres especializados, más de 350 trabajadores y más de 20.000 toneladas de producción anual. Certificada ISO 9001, ISO 14001, BSCI e ICAMA. Cada lote se prueba de estabilidad a 54 °C durante 14 días, supera una lista de control de 100 puntos y conserva trazabilidad de materiales de 5 años. Producción OEM/ODM desde pilotos de 5 toneladas hasta lotes estándar de 20+ toneladas.'
  verified: '2026-08'

intro:
  - Como división de fabricación de **Qingdao Vatrad Group Co., Ltd.**, Agrospear controla cada etapa desde el ingrediente activo bruto hasta el producto de protección de cultivos terminado. Nuestra planta en la Zona de Desarrollo Económico de Qingdao alberga talleres dedicados a la mezcla, molienda, llenado, etiquetado y ensayos de calidad.
  - Al integrar el diseño de formulación, la ingeniería, la creación de prototipos, la fabricación y los ensayos bajo un mismo techo, eliminamos las ineficiencias de la fabricación por contrato y mantenemos el control directo sobre la calidad del producto, la selección de materias primas y los plazos de entrega.

