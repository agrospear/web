customization:
  tagline: Built to Your Spec
  title: OEM Specification Points
  subtitle: 'These are the specification points you control on an OEM project — your specification document is the production contract:'
  items:
    - 'Formulation type and concentration — SC, EC, WP, WDG, SL, ME, CS, FS per your specification or reference product'
    - 'Raw material structure — active ingredient grade, adjuvant package, dispersion system and stability requirements'
    - 'Labels and colors — your artwork applied with unlimited palettes, or support from our in-house design team'
    - 'Drum specifications — size, material, closure type and labeling on every container'
    - 'Regulatory compliance — ICAMA registration support, FAO/WHO specifications and per-market documentation'
    - 'Pallet and packaging configuration — drum count per pallet, stretch wrapping and export packing to your spec'
    - 'Secondary packaging and accessories — measuring cups, gloves, inserts and branded materials'
    - 'Packaging and commercial presentation — retail cartons, bulk packaging and point-of-sale displays under your brand'
    - 'Batch documentation — COA, COQ, stability reports and compliance marks prepared for your export region'

faq_section:
  tagline: FAQ
  title: OEM Manufacturing Questions
  questions:
    - q: How do I start an OEM project with my own formulation?
      a: 'Send your formulation, a reference product or a written specification. Our engineering review confirms manufacturability and returns a quotation within one business day — it is our standard commitment, and an NDA is signed before any file exchange when needed.'
    - q: What is the MOQ for OEM agrochemical manufacturing?
      a: 'MOQ is confirmed by project configuration — formulation type and development, colorways and concentration, artwork, packaging and drum configuration. Standard volume production runs 20+ tons per batch, while pilot runs start at 5 tons on existing platforms. Read the full calculation logic in our MOQ & Flexible Branding Guide.'
    - q: What is the typical lead time for an OEM order?
      a: 'Production runs 25–35 days from confirmed PO and deposit. Custom formulation development adds 15–20 days. Prototype samples usually ship within 7–12 days.'
    - q: Can you manufacture from my existing formulation only?
      a: 'Yes. OEM builds from your specification as-is — you own the formulation. Our engineers review it for production feasibility, flag any spec conflicts before development or mixing starts, and the approved sample becomes the production reference.'
    - q: Do you provide samples before production?
      a: 'Yes. A physical sample batch is produced and approved before any production run, typically within 7–12 days, and it is the reference for all subsequent QC checks.'
    - q: Which certifications does the factory hold?
      a: 'ISO 9001, ISO 14001, BSCI and ICAMA. Full compliance documentation is provided with every OEM shipment, prepared for your target markets.'
    - q: How is quality controlled on an OEM run?
      a: 'Production runs through the 7-stage inspection gate system — incoming raw material, intermediate product, mixing & filling, stability & content analysis, label & packaging QC, compliance documentation verification, and final packaging & documentation — with batch traceability and 10-year ERP records.'
    - q: What are your shipping terms?
      a: 'FOB Qingdao, CIF major global ports, or DDP for qualified partners. We ship to 50+ countries across EU, US, LATAM, Africa and Asia markets.'

process:
  title: The OEM Process — From Spec to Shipped Container
  subtitle: 'Seven controlled stages run by one factory team, so every step from your first spec to the packed container stays documented and on schedule.'
  steps:
    - phase: '01'
      title: Spec Review & Quotation
      period: 1 business day
      items:
        - 'Share your formulation, specification or reference products — our engineers check manufacturability.'
        - 'You receive a detailed quotation and project plan within one business day.'
    - phase: '02'
      title: Engineering Confirmation
      period: Week 1
      items:
        - 'Formulation type, concentration, raw material specs and dispersion system are confirmed against your document.'
        - 'Platform or formulation decisions are locked — custom development starts here when required.'
    - phase: '03'
      title: Prototype & Sample
      period: 7–12 days
      items:
        - 'A physical sample batch is produced and sent for your review — composition and efficacy data included for new formulations.'
        - 'Sample (1–4 tons) validates your spec before any volume commitment.'
    - phase: '04'
      title: Testing & Validation
      period: In parallel
      items:
        - 'Stability, content analysis, physical property and shelf stability checks per production line.'
        - 'ISO 9001, ISO 14001, BSCI and ICAMA documentation prepared for your export markets.'
    - phase: '05'
      title: Approval & Confirmation
      period: After sample sign-off
      items:
        - 'You approve the sample and label artwork; the PO and deposit lock the production slot.'
        - 'A pre-production plan confirms dates, quantities, packaging and port of loading.'
    - phase: '06'
      title: Production
      period: 25–35 days
      items:
        - 'Production runs through the 7-stage inspection gate system — incoming raw material, in-process and final inspection.'
        - 'From pilot orders (5 tons) on existing platforms up to standard volume batches (20+ tons) per formulation.'
    - phase: '07'
      title: Packing & Shipment
      period: 1 day + transit
      items:
        - 'Export packing with batch documentation and COA, then FOB Qingdao, CIF or DDP to 50+ countries.'
        - 'Customs documentation, tracking and reorder support included at every stage.'

