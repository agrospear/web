faqs:
  tagline: FAQ
  title: 'Mercados — Preguntas frecuentes'
  items:
    - q: '¿A qué mercados suministráis?'
      a: 'Suministramos productos agroquímicos OEM a distribuidores e importadores en África Subsahariana, Sudeste Asiático, América Latina, Medio Oriente y Sur de Asia. Nuestros productos están registrados o en registro en 40+ países.'
    - q: '¿Proporcionáis soporte de registro?'
      a: 'Sí. Proporcionamos expedientes de pre-registro incluyendo estudios de toxicidad GLP, datos de residuos, análisis de formulación e informes de análisis de cinco lotes. Nuestro equipo regulatorio apoya presentaciones de registro local en mercados objetivo.'
    - q: '¿Podéis adaptar formulaciones para necesidades regionales específicas?'
      a: 'Sí. Ajustamos concentración de IA, forma dosage, paquete de adyuvantes y tamaño de embalaje para perfiles de cultivos regionales, condiciones climáticas y requisitos regulatorios. El desarrollo de formulación personalizada típicamente toma 35–55 días.'
    - q: '¿Cuál es la cantidad mínima de pedido para un mercado nuevo?'
      a: 'MOQ estándar es 1,000 L o 1,000 kg por SKU para formulaciones existentes. Nuevas formulaciones o embalaje personalizado pueden tener MOQs más altos, confirmados por proyecto según tu plan de entrada al mercado.'

