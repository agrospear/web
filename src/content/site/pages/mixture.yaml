faqs:
  - question: 'What are ZC and CS mixture formulations?'
    answer: 'CS (Capsule Suspension) encapsulates one AI within polymer micro-capsules suspended in water. ZC is a proprietary combination of CS and SC — one AI is micro-encapsulated while a second AI remains as a conventional suspension in the same product. ZC enables simultaneous fast-release and controlled-release delivery from a single tank mix, extending the effective window of control.'
  - question: 'Why use premix formulations instead of tank-mixing at the farm?'
    answer: 'Premix formulations guarantee consistent AI ratios in every application, eliminate farmer tank-mix compatibility errors, reduce handling of multiple containers, and — critically for resistance management — ensure that both modes of action are always present at the correct ratio. Premixes also simplify registration in many jurisdictions where co-formulated products receive streamlined review.'
  - question: 'How does Agrospear design resistance-management premixes?'
    answer: 'We follow both IRAC and FRAC classification systems and pair AIs from distinct mode-of-action groups that have overlapping pest or pathogen spectra. For example, a Group 3A pyrethroid insecticide + Group 4A neonicotinoid for resistant whitefly, or a Group 11 strobilurin + Group 3 DMI for fungicide resistance. Each combination undergoes cross-resistance profiling and synergistic bioassay validation before formulation development begins.'
  - question: 'What AI combinations does Agrospear manufacture?'
    answer: 'Current production includes lambda-cyhalothrin + thiamethoxam (insecticide-insecticide), azoxystrobin + propiconazole (fungicide-fungicide), thiamethoxam + fludioxonil + metalaxyl-M (seed treatment combo), and glyphosate + 2,4-D (herbicide premix). We continuously develop new combinations based on partner requirements and regional resistance profiles.'
  - question: 'What stability testing applies to mixture formulations?'
    answer: 'All premix products undergo accelerated stability testing at 54 °C for 14 days and long-term storage testing at 25 °C for 24 months. We verify that both AIs remain within specification, that no interaction products form, and that physical properties — suspensibility, emulsion stability, viscosity — remain within acceptable ranges throughout the shelf life.'
body: |
  <h2>Dual and Multi-AI Premix Formulations for Integrated Crop Protection</h2>
  <p>Single active-ingredient products increasingly fail to deliver adequate control against evolving pest and pathogen complexes. Agrospear's mixture formulation portfolio addresses this challenge through co-formulated products that combine two or more AIs in a single, ready-to-apply product. Our manufacturing capabilities span Capsule Suspensions (CS) for controlled-release delivery, ZC combinations that merge micro-encapsulated and suspended AIs in one package, and conventional Suspension Concentrates (SC) for simultaneous fast-release dual action. Each mixture is engineered to ensure uniform AI ratio, long-term stability, and compatibility with standard application equipment.</p>

  <h2>IRAC+FRAC Resistance Management Pairing</h2>
  <p>The primary scientific rationale for mixture formulations is resistance management. Agrospear's development process begins with resistance-risk assessment: we identify the target pest or pathogen spectrum, map existing cross-resistance profiles, and select AI pairs from different IRAC or FRAC mode-of-action groups that share overlapping efficacy. A Group 3A pyrethroid paired with a Group 4A neonicotinoid ensures that any individual pest surviving one mode of action is controlled by the second — dramatically reducing the probability of resistance fixation in the population. Our bioassay program validates synergistic or at least additive interaction before committing to formulation development, ensuring that the premix delivers genuine resistance-management value rather than mere marketing convenience.</p>

  <h2>Premix Versus Tank-Mix: Technical Advantages</h2>
  <p>While tank-mixing at the farm level offers flexibility, it introduces variability in AI ratios, compatibility risks (flocculation, phase separation, pH incompatibility), and increased operator handling of multiple concentrated products. Agrospear's premix formulations eliminate these risks: every liter contains AIs at the validated ratio, physical compatibility is guaranteed through our co-formulation science, and the single-container format reduces handling exposure. For regulated markets, premix products also benefit from simplified dossiers in many jurisdictions, as the co-formulated product is evaluated as a single entity rather than requiring separate tank-mix authorizations.</p>

  <h2>Custom Combination Development and OEM Branding</h2>
  <p>Agrospear's R&D team develops custom premix combinations tailored to regional pest complexes and distribution-partner branding strategies. Whether you require a lambda-cyhalothrin + thiamethoxam ZC for cotton whitefly and bollworm, an azoxystrobin + propiconazole SC for rice blast and sheath blight, or a thiamethoxam + fludioxonil + metalaxyl-M FS for cereal seed treatment, we provide full formulation development, stability validation, registration dossier support, and finished-goods production under your brand. Our 50 000+ ton annual capacity and 25–35 day lead times ensure that your market launch timelines are met without compromise.</p>

