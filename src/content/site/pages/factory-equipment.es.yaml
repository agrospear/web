answer:
  label: 'Respuesta directa'
  text: 'Nuestra fabrica de 12.500 m2 dispone de pesaje y dosificacion automatica controlada por PLC (precision de ±0,1%), mezcladores de alto corte a 3.000–10.000 rpm mas molinos de arena para control de tamano de partcula SC/WDG, secadores por aspersion y granuladores de lecho fluido para produccion WDG/WP, y un laboratorio de control de calidad con HPLC/GC para analisis de contenido activo, analizadores de tamano de partcula laser y camaras de estabilidad a 54 C para verificacion de estabilidad en estante de 14 dias.'
  verified: '2026-08'

categories:
  - title: Preparacion de materias primas
    items:
      - name: Sistema automatico de pesaje y dosificacion
        spec: Control PLC, precision de ±0,1%, capacidad de 5 toneladas
        desc: Sistema automatico de pesaje y dosificacion controlado por ordenador para ingredientes activos de grado tecnico, solventes y coadyuvantes. El software de formulacion optimiza el aprovechamiento del material hasta dejar el desperdicio por debajo del 3%.
      - name: Sistema de almacenamiento y transferencia a granel
        spec: Tanques de acero inoxidable, capacidad 10–50 m3, con nitrogeno
        desc: Almacena y transfiere solventes y materias primas liquidas con nitrogeno controlado para evitar contaminacion e ingreso de humedad.

  - title: Mezclado y preparacion de formulaciones
    items:
      - name: Mezclador de alto corte
        spec: 3.000–10.000 rpm, capacidad 500–5.000 L
        desc: Mezclador de alto corte para composicion de formulaciones SC, EC y SL. Dispersa ingredientes activos en transportadores y asegura premezcla uniforme antes de la molienda.
      - name: Tanque de premezcla
        spec: 1.000–5.000 L, encamisado, temperatura controlada
        desc: Tanque de premezcla con temperatura controlada para formulaciones EC y SL que requieren disolucion y mezcla precisa de ingredientes activos con emulsionantes.
      - name: Agitador de baja velocidad
        spec: 50–200 rpm, 2.000–10.000 L
        desc: Agitador de baja velocidad para preparacion de slurries WP y WDG y homogeneizacion post-molienda de concentrados en suspension.

  - title: Procesamiento de formulaciones
    items:
      - name: Molino de arena / molino de cuentas
        spec: Tamano de partcula 0,1–50 μm, rendimiento 200–1.000 L/h
        desc: Molienda de precision para formulaciones SC y WDG para lograr distribuciones de tamano de partcula objetivo (D50 1–5 μm para SC, D50 20–40 μm para WDG).
      - name: Secador por aspersion
        spec: Tasa de evaporacion 50–200 kg/h, entrada 180–220 C
        desc: Secador por aspersion para convertir slurries WDG y WP molidos en grnulos secos dispersables con tamano de partcula y contenido de humedad constantes.
      - name: Granulador de lecho fluido
        spec: 100–500 kg/lote
        desc: Granulacion de lecho fluido para producir grnulos WDG uniformes con densidad aparente y dispersibilidad controladas.

  - title: Llenado y embalaje
    items:
      - name: Linea automatica de llenado
        spec: Tambores de 20–200 L, botellas de 100–1.000 mL, precision ±0,2%
        desc: Maquina de llenado automatica para tambores, garrafas y botellas con llenado volumetrico de precision y verificacion automatica de peso.
      - name: Maquina de etiquetado automatica
        spec: Etiqueta GHS multilingue, 30–60 unidades/min
        desc: Maquina de etiquetado automatica que aplica etiquetas conformes a GHS con numero de lote, codigo de fecha y texto regulatorio multilingue.
      - name: Codificador de lote por inyeccion de tinta
        spec: Inyeccion continua, codificacion lote/fecha/lot
        desc: Codificador de inyeccion de tinta para codificacion permanente de lote y fecha en contenedores y embalaje exterior para trazabilidad completa.

  - title: Ensayos y control de calidad
    items:
      - name: Sistema HPLC
        spec: Detector UV/VIS, metodos conformes a CIPAC
        desc: Cromatografia liquida de alto rendimiento para cuantificacion de contenido de ingrediente activo y analisis de impurezas segun metodos CIPAC.
      - name: Sistema GC
        spec: Detector FID/ECD, analisis volatil y semivolatil
        desc: Cromatografia de gases para analisis de solventes, perfilado de impurezas volatiles y verificacion de contenido activo para formulaciones EC y SL.
      - name: Analizador de tamano de partcula laser
        spec: Rango 0,01–3.500 μm, dispersion humeda y seca
        desc: Analisis de tamano de partcula por difraccion laser para formulaciones SC, WDG y WP para verificar D50, D90 y span segun especificacion.
      - name: Camara de estabilidad
        spec: 54 C ± 2 C, 40 C ± 2 C, conforme a CIPAC MT 46
        desc: Camaras de estabilidad con temperatura controlada para ensayos de estabilidad acelerada de 14 dias y verificacion de vida util segun CIPAC MT 46.

