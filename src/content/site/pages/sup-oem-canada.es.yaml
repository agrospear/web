hero:
  tagline: 'Canadá'
  title: 'OEM Agroquímico para Canadá — de Qingdao a tu almacén'
  subtitle: 'Muestra en 7–12 días, producción en 25–35 días, flete marítimo de 4–6 semanas a puertos de Vancouver, Toronto o Montreal. FOB Qingdao, CIF o DDP — la misma fábrica, el mismo control de calidad, el mismo proceso de desarrollo en seis etapas que todos los clientes de Agrospear.'

answer:
  label: 'Respuesta directa'
  text: 'Las marcas canadienses piden productos agroquímicos a Agrospear con condiciones estándar: MOQ confirmado por configuración del proyecto: muestra de 1–4 toneladas, lote piloto de 5 toneladas y producción de volumen estándar de 20+ toneladas por lote. La primera muestra sale en 7–12 días tras la aprobación de la especificación, la producción transcurre en 25–35 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a puertos canadienses — Vancouver en la costa oeste, Toronto y Montreal en el este. El DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

