faqs:
  tagline: FAQ
  title: 'Formulaciones de biopesticidas — Preguntas frecuentes'
  items:
    - q: '¿Qué tipos de formulación de biopesticidas producís?'
      a: 'Concentrado en suspensión (SC) para activos microbianos, polvo mojable (WP) para productos a base de esporas, dispersión oleosa (OD) para extractos botánicos y líquido soluble (SL) para activos bioquímicos. El tipo de formulación se selecciona para preservar la viabilidad biológica.'
    - q: '¿Cómo aseguráis la viabilidad microbiana en formulaciones de biopesticidas?'
      a: 'Producción en proceso en frío para cepas sensibles a la temperatura, pruebas de vida útil validadas en condiciones de almacenamiento y recuentos de UFC por lote en el momento de fabricación y durante todo el periodo de estabilidad. Opciones de envío con cadena de frío disponibles.'
    - q: '¿Los biopesticidas requieren un apoyo diferente al registro?'
      a: 'Sí. Los biopesticidas suelen acogerse a vías de registro de riesgo reducido o evaluación acelerada en muchos mercados. Proporcionamos los paquetes de datos específicos: identificación de cepa, datos de patogenicidad/toxicidad, estudios de organismos no objetivo y ensayos de eficacia.'
    - q: '¿Cómo preserváis la viabilidad en formulaciones microbianas?'
      a: 'Usamos producción en proceso en frío para cepas sensibles a la temperatura, ensayos de vida útil validados en condiciones de almacenamiento recomendadas y recuentos de UFC por lote en el momento de fabricación y durante todo el periodo de estabilidad. Disponibles opciones de envío con cadena de frío para concentrados microbianos.'
    - q: '¿Qué tipos de formulación funcionan para activos microbianos y botánicos?'
      a: 'Los concentrados en suspensión (SC) son el estándar para activos microbianos, preservando la viabilidad de esporas y la dispersión uniforme. Los gránulos dispersables en agua (WDG) y polvos mojables (WP) se adaptan a polvos de esporas y botánicos, mientras que los concentrados emulsionables (EC) y dispersiones oleosas (OD) se prefieren para activos oleosos botánicos como neem y piretrina.'
    - q: '¿Pueden combinarse los biopesticidas con química sintética?'
      a: 'Sí. Muchos programas posicionan los biopesticidas como la base de una estrategia IPM, usando productos sintéticos solo en umbrales. Podemos formular compañeros de mezcla compatibles y asesorar sobre el calendario para que los componentes biológico y químico funcionen juntos sin degradar la viabilidad.'
    - q: '¿Qué soporte de cadena de frío proporcionáis?'
      a: 'Para concentrados microbianos sensibles al calor podemos suministrar envío con cadena de frío, embalaje aislante y validación de almacenamiento en frío. Para formulaciones estables a temperatura ambiente proporcionamos estabilidad documentada que confirma la viabilidad en condiciones normales de almacén.'
    - q: '¿Los biopesticidas apoyan las declaraciones de certificación orgánica?'
      a: 'Muchos activos microbianos y botánicos están permitidos en programas orgánicos y de bajo insumo. Podemos adaptar la formulación, los ingredientes inertes y la documentación para respaldar el estándar de certificación de tu mercado objetivo, ya sea OMRI, orgánico UE u otro esquema.'
    - q: '¿Qué controles de calidad se aplican a los lotes de biopesticidas?'
      a: 'Cada lote se libera frente a especificaciones de UFC/g o título, tasa de germinación para activos fúngicos y controles de pureza, con certificado de análisis por envío. Mantenemos trazabilidad completa de lotes y conservamos muestras durante todo el periodo de vida útil.'
    - q: '¿Qué datos de registro proporcionáis para biopesticidas?'
      a: 'Proporcionamos identificación de cepa, estudios de patogenicidad/toxicidad y de organismos no objetivo, datos de ensayos de eficacia y el paquete analítico de tu activo y formulación. Nuestro equipo regulatorio adapta el expediente a las vías de riesgo reducido o evaluación acelerada de tu mercado.'

