customization:
  tagline: Designed with You
  title: What We Develop Around Your Brief
  subtitle: 'ODM means the formulation is designed for you from scratch or from our formulation library — these are the levers your brief controls:'
  items:
    - 'Target crop and pest profile — herbicide, insecticide, fungicide, PGR or seed treatment positioning'
    - 'Formulation dimensions — active ingredient concentration, formulation type and dosage rate matched to the target crop and use case'
    - 'Efficacy character — systemic, contact, translaminar or pre-emergence mode of action tuned for your market'
    - 'Formulation structure — dispersion system, raw material grade, adjuvant package and stability requirements'
    - 'Labels and colors — brand colors, label art and drum branding developed in-house'
    - 'Regulatory compliance — ICAMA registration support, FAO/WHO specifications and per-market documentation'
    - 'Accessory package — drum size, closure type and pallet configuration matched to the formulation'
    - 'Packaging and commercial presentation — retail cartons, bulk packaging and export packing under your brand'

faq_section:
  tagline: FAQ
  title: ODM Development Questions
  questions:
    - q: How does ODM differ from OEM?
      a: 'ODM (Original Design Manufacturing) starts from your brief — our R&D team develops the formulation, dispersion system, labeling and packaging, whether from a market concept, efficacy target or adaptation of a proven platform. You approve the formulation before production. OEM (Original Equipment Manufacturing) manufactures to your approved specification — your formulation, concentration, adjuvants and packaging. You own the formulation and IP. Both run through the same plant, QC system and export team; ODM is the fastest path to a branded product when you do not have a formulation yet.'
    - q: I only have a rough idea — where do we start?
      a: 'Send a short brief: target crop, pest profile, rough concentration, markets and volumes. Our R&D team comes back with a formulation concept, a reference product direction and a development plan within one business day — an NDA is signed before any detailed exchange when requested.'
    - q: How long does it take to develop a new agrochemical formulation?
      a: 'Prototype samples ship in 7–12 days. A new formulation with custom development adds 15–20 days of R&D before samples. Production runs 25–35 days after PO and deposit.'
    - q: What is the MOQ for an ODM formulation?
      a: 'Standard volume production runs 20+ tons per batch; pilot runs start at 5 tons on existing platforms. Small-batch co-branding starts at 1–4 tons — see our MOQ & Flexible Branding Guide for the full calculation.'
    - q: Who owns the formulation and development data?
      a: 'Your brief, formulation and development data are protected by NDA, brand licensing terms and formulation ownership or licensing clauses written into the contract. Formulation records are kept for your brand and available for reorders.'
    - q: Can you develop a specific formulation type (SC, EC, WDG, FS)?
      a: 'Yes. Formulation engineering covers all main agrochemical categories — herbicides, insecticides, fungicides, PGRs and seed treatments — in all standard formulation types (SC, EC, WP, WDG, SL, ME, CS, FS), with stability chamber validation available for all formulations.'
    - q: Which certifications will the developed formulation carry?
      a: 'ISO 9001, ISO 14001, BSCI and ICAMA. Certification documents are prepared per order for your export markets, and FAO/WHO specification compliance applies where required.'

process:
  title: The ODM Process — From Brief to Scaled Production
  subtitle: 'Six controlled stages run by the same in-house team that designs, samples and scales your formulation — everything stays documented.'
  steps:
    - phase: '01'
      title: Brief & Concept
      period: 1 business day
      items:
        - 'Share target crops, pest profiles, concentrations, markets and volumes — or just an idea.'
        - 'Our R&D team returns a formulation concept, platform options and a development plan.'
    - phase: '02'
      title: Formulation & Structure Design
      period: Week 1–2
      items:
        - 'Formulation type, concentration, dispersion system and raw material structure engineered in-house.'
        - 'Labels, regulatory layout and packaging concept developed around your brand.'
    - phase: '03'
      title: Formulation Development
      period: +15–20 days (new formulations)
      items:
        - 'Custom formulation R&D designed and tested in-house for new products; existing platforms skip this stage.'
        - 'Formulation ownership terms are fixed in the contract before development starts.'
    - phase: '04'
      title: Prototype & Sample
      period: 7–12 days
      items:
        - 'A prototype batch is produced, tested and sent for your review — composition and efficacy data included.'
        - 'Sample (1–4 tons) validates formulation, stability and branding before volume.'
    - phase: '05'
      title: Validation & Approval
      period: In parallel
      items:
        - 'Stability, content analysis, physical property and shelf stability checks per production line.'
        - 'ISO 9001, ISO 14001, BSCI and ICAMA documentation prepared for your export markets.'
        - 'You approve the prototype; PO and deposit lock the production slot.'
    - phase: '06'
      title: Production & Delivery
      period: 25–35 days
      items:
        - 'Standard-volume batches run 20+ tons, pilot runs from 5 tons.'
        - 'Export packing, FOB/CIF/DDP shipping to 50+ countries and reorder support included.'

