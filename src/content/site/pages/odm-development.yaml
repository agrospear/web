  text: 'ODM development starts from your brief, not your specification: formulation design (active ingredient, concentration, formulation type, adjuvants), dispersion system and labeling are engineered in-house, validated by prototype samples in 7–12 days, and produced at standard volume MOQ of 20+ tons per batch (pilot from 5 tons). Production runs 25–35 days after confirmed PO and deposit; custom formulation development adds 15–20 days. ISO 9001, ISO 14001, BSCI and ICAMA documentation ships with every order.'
