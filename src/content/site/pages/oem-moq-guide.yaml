answer:
  label: 'Straight answer'
  text: 'MOQ is not a one-size-fits-all number. Every MOQ is confirmed by project configuration: formulation type and development, concentration and raw material grade, artwork complexity, packaging and drum configuration. Full-custom volume production runs 20+ tons per batch; small-batch co-branding starts from 1–4 tons; and every project is split into three distinct stages — sample development (1–4 tons), pilot order (5 tons) and volume production (20+ tons). We confirm the exact calculation for your SKU mix before quotation — no vague "low MOQ" promises, no hidden compromises.'
  verified: '2026-08'

moq_principle:
  tagline: The Engineering Logic
  title: 'Why Standard Volume MOQ Is 20+ Tons: Formulation & Raw Material Economics'
  subtitle: 'Production run sizes are not arbitrary numbers set by a sales team — they are determined by formulation development economics, raw material procurement minimums and production line changeover costs.'
  body: |
    **The raw material procurement baseline.** Technical-grade active ingredients and formulation-grade co-formulants are produced and packaged in industrial batch quantities. Minimum procurement runs for custom raw materials are typically 1–5 tons per SKU.

    **The yield calculation (20+ tons per batch).** For a standard agrochemical formulation (herbicide, insecticide or fungicide in SC, EC, WP, WDG, SL, ME, CS or FS), a standard production batch yields 20+ tons of finished product per production run.

    **Zero cross-contamination policy.** Full production line cleaning and validation between formulations ensures complete product purity — no residual active ingredient carryover, and validated cleaning protocols between batches.

    **Mixing and filling calibration.** Automated mixing, milling and filling lines require 2–4 hours of setup, calibration and in-process testing. A full 20+ ton batch amortizes these fixed setup costs, delivering the lowest possible per-ton cost.

