moq_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About MOQ'
  items:
    - q: 'Is MOQ calculated per order, per formulation, or per concentration?'
      a: 'MOQ may apply per formulation, concentration, label version, packaging configuration or total order. Because different formulation types (SC vs EC vs WDG) and concentrations come from distinct production runs, ordering 10 tons split across 5 formulations creates 5 separate production requirements. We confirm the exact calculation against your SKU matrix before quotation so you can plan your mix clearly.'
    - q: 'Can I order a sample before bulk production?'
      a: 'Yes. Sample development (1–4 tons) verifies formulation composition, label accuracy, packaging fitment and physical properties before mass production release. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - q: 'Why does custom printed packaging have an independent MOQ?'
      a: 'Custom drum printing requires a minimum production setup of 500+ units. We offer a Hybrid Packaging Storage Solution: we produce the 500 custom-printed drums, store the surplus in our clean warehouse, and release them across your scheduled shipments — so a smaller product order can still ship in fully branded packaging.'
    - q: 'Why is the standard volume MOQ 20+ tons?'
      a: 'Standard volume MOQ follows production economics: a full production batch for a standard agrochemical formulation yields 20+ tons. Running full batches eliminates cross-contamination risk, ensures batch consistency, and amortizes the 2–4 hours of mixing and filling line calibration — delivering the lowest possible per-ton cost.'
    - q: 'Does a higher quantity reduce unit cost?'
      a: 'In most projects, yes. Higher quantities improve raw material yield, distribute fixed production line setup overhead across more tons, and reduce per-unit packaging costs.'
    - q: 'Do co-branding plate fees apply again on re-orders?'
      a: 'No. Label printing plate fees are charged once on initial setup and are waived for re-orders using the same artwork dimension. You only pay the $1.00 USD per drum factory handling and printing fee.'
    - q: 'Does requesting MOQ guidance commit me to an order?'
      a: 'No. Requesting project MOQ guidance simply allows our engineering team at Qingdao Vatrad Group Co., Ltd. to review your technical brief and advise the most cost-effective production path. A Non-Disclosure Agreement (NDA) is available before you share proprietary technical specifications or formulation data.'

