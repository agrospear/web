hero:
  tagline: Soluciones B2B
  title: '24 soluciones B2B adaptadas a tu negocio'
  subtitle: 'Desde fundadores de startups hasta distribuidores globales: encuentra la solución Agrospear exacta diseñada para tu modelo de negocio, tu sector y tus objetivos.'
  image:
    src: https://assets.agrospear.com/images/agrospear/factory/agrospear-factory-aerial-1.webp
    alt: Fábrica e instalaciones de fabricación de Agrospear

answer:
  label: 'Respuesta directa'
  text: 'Una sola fábrica sirve todas las vías B2B: fabricación OEM/ODM con MOQ confirmado por proyecto (muestra 1–4 toneladas, piloto 5 toneladas, volumen estándar 20+ toneladas por lote; co-branding desde cantidades inferiores), marca privada sobre plataformas probadas, distribución mayorista y programas para distribuidores y cooperativas. Muestras en 7–12 días; producción en 25–35 días tras el PO y el depósito.'
  verified: '2026-08'

