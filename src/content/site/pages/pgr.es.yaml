faqs:
  - question: '¿Qué tipos de reguladores de crecimiento fabrican?'
    answer: 'Nuestra línea abarca giberelinas (GA3, GA4+7) para elongación celular y cuajado; auxinas (ACP, 2,4-D, NAA) para radicación y retención de fruto; citocininas (6-BA, kinetina) para división celular y tamaño de fruto; etefón para maduración y defoliación; y retardantes (paclobutrazol, mepiquat) para control de vigor. Cada grupo se formula en la presentación más adecuada según el cultivo y el momento de aplicación.'
  - question: '¿En qué cultivos se aplican los reguladores de crecimiento?'
    answer: 'Los reguladores tienen cabida en horticultura (tomate, pimiento, melón), fruticultura (manzano, vid, cítricos, cerezo), cultivos industriales (algodón, caña de azúcar) y ornamentales. La clave está en ajustar la dosis y el momento fenológico: una aplicación de GA3 en floración no tiene el mismo efecto que en cuajado, y el exceso de retardante puede comprometer el rendimiento.'
  - question: '¿Qué ventajas ofrece la formulación ME para reguladores?'
    answer: 'La microemulsión (ME) proporciona una absorción más rápida y uniforme que las formulaciones convencionales, lo que es crítico cuando la ventana de aplicación es estrecha —como en el cuajado de fruto o la inducción floral—. Además, reduce la variabilidad de respuesta entre plantas y mejora la compatibilidad con fungicidas e insecticidas en mezcla de tanque.'
  - question: '¿Proporcionan asistencia técnica para el uso de reguladores?'
    answer: 'Sí. Agrospear no solo fabrica el producto sino que acompaña a sus clientes OEM con tablas de dosificación por cultivo y fenología, recomendaciones de mezcla y momentos óptimos de aplicación. Nuestro equipo técnico puede ajustar las formulaciones según las condiciones climáticas y la variedad cultivada en cada mercado destino.'
body: |
  <h2>Regulación del crecimiento y cuajado de fruto</h2>
  <p>Los reguladores de crecimiento vegetal son herramientas de alta precisión que permiten al productor intervenir en procesos fisiológicos clave: elongación celular, división tisular, diferenciación floral, cuajado de fruto y dominancia apical. A diferencia de los pesticidas, cuyo objetivo es eliminar un organismo nocivo, los reguladores modifican el equilibrio hormonal de la planta para optimizar su rendimiento y calidad.</p>
  <p>En fruticultura, las giberelinas se aplican para incrementar el tamaño de bayas en uva de mesa, reducir el raquitismo en cerezo y promover el cuajado en cítricos bajo condiciones de estrés térmico. Las auxinas, por su parte, son esenciales para la radicación de esquejes ornamentales y la retención de fruto en tomate y pimiento bajo invernadero, donde la polinización natural es limitada. Agrospear formula estos productos con coadyuvantes específicos que maximizan la absorción y reducen la variabilidad de respuesta.</p>

  <h2>Control de maduración y manejo del vigor</h2>
  <p>El etefón es el regulador más versátil para el control de maduración: libera etileno en el tejido vegetal y acelera la coloración, el ablandamiento y la dehiscencia. En caña de azúcar se usa para estimular la floración sincrónica; en algodón, como defoliante previo a la cosecha mecánica; en tomate, para concentrar la maduración y facilitar la recolección. Agrospear produce formulaciones SL de etefón con estabilizadores que garantizan una liberación controlada del etileno, evitando el sobremaduramiento.</p>
  <p>Los retardantes de crecimiento —paclobutrazol, mepiquat chloride, chlormequat— reducen la elongación internodal sin afectar la fotosíntesis ni el cuajado. En cereales, previenen el vuelco; en frutales, compactan la copa y facilitan la mecanización; en ornamentales, producen plantas más tupidas y comercialmente atractivas. Nuestros desarrollos en formulación SC permiten una liberación gradual del retardante, proporcionando un efecto sostenido con una sola aplicación.</p>

  <h2>Formulaciones SL, ME y SC para horticultura y cultivos especiales</h2>
  <p>La solución líquida (SL) es la formulación más directa para reguladores solubles en agua: no requiere emulsionantes ni dispersantes, lo que simplifica la fabricación y reduce costos. Es ideal para giberelinas y etefón, que se aplican en volúmenes reducidos y requieren una absorción inmediata.</p>
  <p>Las microemulsiones (ME) aportan la máxima precisión en cultivos de alto valor donde la variabilidad de respuesta no es tolerable —floricultura, frutales finos, hortalizas gourmet—. Su tamaño de gota submicrónico asegura una cobertura homogénea y una penetración cuticular superior, traduciéndose en respuestas más predecibles y uniformes. Las formulaciones SC completan la línea para retardantes y citocininas, ofreciendo estabilidad al almacenamiento y compatibilidad con programas de pulverización convencionales.</p>

  <div class="cta">
    <h3>Potencie sus cultivos con reguladores OEM de Agrospear</h3>
    <p>Con 20 000 m² de fábrica, 50 000+ toneladas de capacidad anual y certificaciones ISO 9001/14001, GMP y BSCI, Agrospear es su fabricante OEM/ODM de reguladores de crecimiento. Desde giberelinas hasta retardantes, formulamos bajo su marca con la precisión que su mercado exige.</p>
