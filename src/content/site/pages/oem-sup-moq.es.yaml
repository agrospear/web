meta:
  title: "MOQ para Formulación Agroquímica — Cantidades mínimas explicadas"
  description: "MOQ escalonado para fabricación de formulaciones agroquímicas: 1–4 t muestra, 5 t piloto, 20+ t volumen estándar por lote. Árbol de decisión por nivel de personalización."
  dateModified: "2026-08-20"

sections:
  - title: "Respuesta directa"
    directAnswer:
      answer: "Las muestras cubren 1–4 toneladas; el lote piloto sobre plataformas existentes corre 5 toneladas; el MOQ de volumen estándar es de 20+ toneladas por lote de producción."
      condition: "El MOQ específico depende de la formulación, el ingrediente activo, el etiquetado, el embalaje y si se necesita desarrollo de formulación nueva."
      value: "1–4 t muestra · 5 t piloto · 20+ t por lote volumen estándar"
      verifiedDate: "2026-08-20"
      sourceType: "factory-record"
    body: |
      El MOQ en Agrospear se escalona por nivel de personalización, no es un único número.

      | Escenario | MOQ | Unidad | Condición |
      |-----------|-----|--------|-----------|
      | Plataforma existente, solo logotipo/etiqueta | 1–4 t | muestra | Misma formulación, mismo ingrediente activo, mismo envase |
      | Etiquetado/empaque personalizado sobre plataforma existente | 5 t | lote piloto | Misma formulación; el diseño nuevo requiere prueba visual |
      | Producción de volumen estándar | 20+ t | por lote de producción | Eficiencia completa de línea; múltiples SKU = lotes separados |
      | Formulación nueva / desarrollo a medida | 20+ t | tirada de producción | I+D de formulación suma 15–20 días; tarifa de desarrollo única |
evidence_review:
  tagline: 'Evidencia y verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricación en esta página son verificadas por nuestro equipo de ingeniería de fabricación en la planta de Laixi, Qingdao. Certificados, registros de inspección QC, informes de análisis de contenido y estabilidad, y registros de trazabilidad por lote están disponibles a petición. Especificaciones verificadas por última vez 2026-08.'
