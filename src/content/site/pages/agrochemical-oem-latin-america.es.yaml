faqs:
  - question: '¿Agrospear proporciona documentación de registro para los requisitos de ANVISA/IBAMA de Brasil?'
    answer: "Sí. Agrospear prepara paquetes de datos técnicos formateados para el sistema de registro de tres agencias de Brasil: ANVISA para clasificación toxicológica, IBAMA para evaluación ambiental y el Ministerio de Agricultura (MAPA) para eficacia agronómica. Los expedientes incluyen documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo, informes de análisis de cinco lotes, datos de propiedades fisicoquímicas y estudios de estabilidad acelerada según CIPAC MT 46. Tu consultor regulatorio brasileño integra estos datos en la presentación formal RDC 223/2018."
  - question: '¿Qué formulaciones recomienda Agrospear para la roya asiática de la soja?'
    answer: "Para la roya asiática de la soja (Phakopsora pachyrhizi), Agrospear recomienda formulaciones SC y WDG de fungicidas triazoles — tebuconazol, propiconazol y difenoconazol — en combinaciones solas y premezcladas con estrobilurinas (azoxistrobina, picoxistrobina). Las formulaciones WP multisitio de mancozeb proporcionan socios protectores de mezcla en tanque para el manejo de resistencia. Todas las formulaciones se prueban para reducción de deriva de pulverización y resistencia a la lluvia adaptadas a las condiciones de aplicación del Cerrado y las Pampas."
  - question: '¿Cuánto tarda el envío a puertos latinoamericanos?'
    answer: "El flete marítimo desde Qingdao a Santos, Buenos Aires o Cartagena suele tardar de 5 a 7 semanas según el destino y el enrutamiento de transbordo. Los servicios directos a Santos son la ruta más rápida a Sudamérica. La entrega DDP incluye despacho de aduanas y transporte terrestre. También se disponen términos FOB Qingdao y CIF para importadores con redes logísticas establecidas."
  - question: '¿Puede Agrospear formular para la protección del cultivo de café?'
    answer: "Sí. Agrospear fabrica formulaciones SC y WP para el control de la roya del café (Hemileia vastatrix) usando ingredientes activos triazoles y estrobilurinas, formulaciones EC para la broca del café (Hypothenemus hampei) con clorpirifos y deltametrina, y formulaciones FS de tratamiento de semilla para la protección de plántulas de café contra nematodos. Las formulaciones se validan para condiciones de aplicación altitudinal de 800 a 1.800 metros."
  - question: '¿Cuál es el MOQ para un proyecto OEM agroquímico latinoamericano?'
    answer: "El MOQ se confirma por configuración del proyecto: el desarrollo de muestra cubre 1–4 toneladas, los lotes piloto corren 5 toneladas sobre plataformas existentes y la producción de volumen estándar corre 20+ toneladas por lote. Para entradas al mercado del Mercosur, un lote piloto de 5 toneladas sobre una plataforma existente de Agrospear con adaptación de etiqueta local es la configuración de inicio más eficiente."
body: |
  <h2>Panorama de Protección de Cultivos en América Latina</h2>
  <p>América Latina es la mayor región productora de soja del mundo, con Brasil solo superando las 150 millones de toneladas anuales — y la roya asiática de la soja (Phakopsora pachyrhizi) es la amenaza de enfermedad dominante, capaz de causar pérdidas de rendimiento superiores al 80% en campos no tratados. La broca del café (Hypothenemus hampei) infesta las plantaciones desde Minas Gerais hasta Huila, mientras que la roya del café (Hemileia vastatrix) sigue siendo endémica en el corredor centroamericano y las laderas andinas. El barrenador de la caña de azúcar (Diatraea saccharalis) y el carbón de la caña (Sporisorium scitamineum) limitan la productividad en las zonas de cultivo de São Paulo y el Noreste de Brasil. El greening de los cítricos (Candidatus Liberibacter asiaticus), transmitido por el psílido asiático de los cítricos (Diaphorina citri), amenaza la industria naranjera de São Paulo — el mayor sector exportador de jugo del mundo. El gusano cogollero (Spodoptera frugiperda) es una amenaza perenne para el maíz en todo el continente. Agrospear diseña formulaciones para estos puntos de presión específicos, con plataformas de producto probadas en calor subtropical, alta precipitación y aplicación mecanizada a gran escala.</p>

  <h2>Navegando los Sistemas de Registro de Brasil, Argentina y Colombia</h2>
  <p>El registro de agroquímicos en América Latina es específico por país sin armonización regional equivalente a la UE o ASEAN. Brasil opera un sistema de tres agencias: ANVISA gestiona la clasificación toxicológica y la evaluación de salud humana bajo RDC 223/2018, IBAMA realiza la evaluación de riesgo ambiental y MAPA evalúa la eficacia agronómica y otorga el registro final. El proceso completo puede tardar 3–5 años para un nuevo ingrediente activo, aunque los registros genéricos tras el vencimiento de patente avanzan más rápido. El SENASA de Argentina bajo Resolución 350/99 requiere ensayos de eficacia, datos toxicológicos y ambientales — con un plazo típico de 18–24 meses para el registro de formulación. El ICA de Colombia bajo Resolución 6834/2021 mantiene un proceso de evaluación técnica alineado con las directrices FAO/OMS. El SENASA de Perú y el SAG de Chile tienen sus propios requisitos nacionales. Agrospear prepara paquetes de documentación adaptados a cada mercado objetivo, con datos ICAMA, especificaciones FAO/OMS, análisis de cinco lotes, informes de propiedades fisicoquímicas y estudios de estabilidad formateados para los requisitos de expediente de cada agencia específica.</p>

  <h2>Fortalezas de Formulación para Sistemas Extensivos y Especiales de América Latina</h2>
  <p>La fábrica de 20.000 m² de Agrospear con más de 50.000 toneladas de capacidad anual produce formulaciones adaptadas a la agricultura mecanizada a gran escala de América Latina. Las suspensiones SC de premezclas triazol-estrobilurina ofrecen control de la roya asiática de la soja en una sola pasada de pulverización en fincas de miles de hectáreas del Cerrado. Las formulaciones EC de lambda-cihalotrina y clorantraniliprol abordan el gusano cogollero y el barrenador de la caña con derribe rápido y actividad residual. Los gránulos WDG dispersables en agua proporcionan manejo sin polvo para los trabajadores de plantaciones de café que aplican en terreno empinado. Las formulaciones FS de tratamiento de semilla protegen el maíz y el algodón de plagas del suelo y enfermedades de plántulas en la siembra. Las formulaciones SL líquidas solubles de glifosato y 2,4-D sirven a los extensos sistemas de soja de siembra directa de la región. Cada lote de producción se somete a un control de calidad de seis etapas con análisis de tamaño de partícula para formulaciones SC (D50 objetivo 2–5 μm para penetración óptima del dosel de soja), pruebas de suspensibilidad según CIPAC MT 15 y verificación de estabilidad de emulsión según CIPAC MT 36 — asegurando que el producto funcione en el campo con la misma consistencia que en el laboratorio.</p>

  <div class="cta-amber">¿Construyendo una marca agroquímica para los mercados de soja, café o caña de azúcar de América Latina? Contacta a Agrospear en info@agrospear.com o WhatsApp +86 13395321653 — revisión de I+D y presupuesto en un día laborable.</div>
