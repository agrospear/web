faqs:
  tagline: FAQ
  title: 'Quality Control — Frequently Asked Questions'
  items:
    - q: 'What does the 7-stage QC framework cover?'
      a: 'Raw material verification (purity and identity), in-process monitoring (weight, temperature, mixing time), active content assay (HPLC/GC), physical property testing (suspensibility, pH, viscosity), pre-shipment inspection (visual, labeling, packaging), batch documentation (CoA, CoO, stability report) and controlled release (QA sign-off before shipment).'
    - q: 'Is every batch really tested?'
      a: 'Yes — 100% of production batches undergo active content analysis, physical property testing and 54°C/14-day accelerated stability testing. No batch ships without a completed certificate of analysis signed by the QA Director.'
    - q: 'What happens when a batch fails QC?'
      a: 'Non-conforming batches are immediately quarantined. The QC team investigates the root cause, documents the findings and determines disposition: rework (under controlled procedure and with re-inspection) or rejection. Reworked batches are fully re-analyzed — never partially.'
    - q: 'Can I request third-party inspection?'
      a: 'Yes. We support pre-shipment, during-production and container-loading inspections by SGS, TÜV, BV or Intertek. Inspection schedules can be written into the contract and we provide full access to production records, QC data and batch documentation for the inspector.'

