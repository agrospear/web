crop_profiles:
  tagline: 'Crops & Pests'
  title: 'Key Crops and Target Pests — Africa'
  features:
    - icon: M
      icon_bg: green
      title: 'Maize — Fall Armyworm'
      desc: 'Fall armyworm (Spodoptera frugiperda) causes 20–50% yield loss across Sub-Saharan maize regions. SC formulations of emamectin benzoate and chlorantraniliprole, FS seed treatments of clothianidin and thiamethoxam for early-stage protection.'
      link_label: 'View herbicides'
      href: /products/herbicides
    - icon: C
      icon_bg: blue
      title: 'Cocoa — Black Pod & Mirids'
      desc: 'Cocoa black pod (Phytophthora) and mirid bugs (Sahlbergella) threaten West African cocoa exports. WP and SC formulations of mancozeb and metalaxyl, COLEACP-compliant for export-grade production.'
      link_label: 'View fungicides'
      href: /products/fungicides
    - icon: R
      icon_bg: purple
      title: 'Rice — African Rice Gall Midge'
      desc: 'Rice gall midge and stem borer affect irrigated and rainfed rice across West and East Africa. EC formulations of cypermethrin and chlorpyrifos, WP formulations of cartap for IPM programs.'
      link_label: 'View insecticides'
      href: /products/insecticides
    - icon: V
      icon_bg: orange
      title: 'Vegetables — Whitefly & Aphids'
      desc: 'Whitefly-transmitted viruses and aphid damage affect tomato, pepper and leafy vegetable production. SC and EC formulations of imidacloprid and abamectin, smallholder-friendly packaging sizes.'
      link_label: 'View insecticides'
      href: /products/insecticides
    - icon: T
      icon_bg: green
      title: 'Cotton — Bollworm Complex'
      desc: 'Bollworms, aphids and jassids affect cotton production in West, Central and Southern Africa. EC formulations of profenofos and cypermethrin for broad-spectrum cotton pest management.'
      link_label: 'View insecticides'
      href: /products/insecticides

regulation_overview:
  tagline: 'Regulation'
  title: 'Registration Pathways — Africa'
  features:
    - icon: W
      icon_bg: blue
      title: 'WAEMU/CILLS — West Africa'
      desc: 'Harmonized registration for Benin, Burkina Faso, Côte d''Ivoire, Guinea-Bissau, Mali, Niger, Senegal and Togo. Single dossier serves all WAEMU member states.'
      link_label: 'Registration support'
      href: /manufacturing/research-development
    - icon: E
      icon_bg: green
      title: 'National Systems — East Africa'
      desc: 'Individual registration through KEPHIS (Kenya), TPRI (Tanzania), NARL (Uganda). East African Community progressing toward mutual recognition.'
      link_label: 'Registration support'
