    - icon: C
      icon_bg: purple
      title: 'COLEACP Compliance'
      desc: 'Good Practices protocols for export-grade cocoa, fruit and vegetable formulations. Documentation aligned with EU MRL requirements for African export crops.'
      link_label: 'View certifications'
      href: /agrochemical-certification-guide

faqs:
  tagline: FAQ
  title: 'Africa Market — Frequently Asked Questions'
  items:
    - q: 'Which African countries do you supply?'
      a: 'We supply OEM products to distributors across West Africa (Nigeria, Ghana, Cote d''Ivoire, Senegal), East Africa (Kenya, Tanzania, Uganda, Ethiopia) and Southern Africa (Zambia, Zimbabwe, Mozambique). Products are registered or in registration in 20+ Sub-Saharan countries.'
    - q: 'What crops do your products target in Africa?'
      a: 'Our Africa product range covers staple crops: maize, rice, sorghum, millet, cassava, yam, cocoa, coffee, cotton and vegetables. Formulations are selected for local pest pressure, application methods and regulatory status.'
    - q: 'Do you provide French documentation for Francophone Africa?'
      a: 'Yes. We provide complete product documentation in French for Francophone markets: labels, safety data sheets, technical data sheets and registration dossiers. Our regulatory team has experience with WAEMU and CEMAC registration requirements.'
    - q: 'What packaging sizes work for African markets?'
      a: 'Smallholder-friendly packaging: 100 mL, 250 mL and 1 L for liquid formulations; 100 g, 250 g and 1 kg for powder formulations. Bulk packaging (5 L, 10 L, 20 L) for institutional and plantation-scale buyers.'

