faqs:
  - question: 'What is the typical application rate for plant growth regulators?'
    answer: 'PGRs are applied at dramatically lower rates than conventional crop-protection products — typically 0.5–50 g AI per hectare for gibberellic acid and auxins, and 100–500 g AI per hectare for paclobutrazol and chlormequat. Precise dose calibration is essential, as over-application can cause phytotoxic effects such as excessive stunting or abnormal fruit set.'
  - question: 'Which PGR formulations does Agrospear offer?'
    answer: 'We manufacture Soluble Liquids (SL) for high-water-solubility AIs like ethephon and chlormequat chloride, Micro-Emulsions (ME) for gibberellic acid and auxin products requiring enhanced foliar uptake, and Suspension Concentrates (SC) for low-solubility AIs such as paclobutrazol. Each formulation is optimized for tank-mix compatibility and spray-drift minimization.'
  - question: 'How are PGRs used for stress mitigation?'
    answer: 'Certain PGRs improve crop tolerance to abiotic stress. Paclobutrazol reduces gibberellin biosynthesis, conserving resources for root development and osmotic adjustment under drought. Chlormequat strengthens stem cell walls, reducing lodging risk in cereals under wind and rain stress. Ethephon-triggered ethylene release can accelerate stress-adaptive ripening responses in fruit crops facing heat or water deficit.'
  - question: 'Can Agrospear develop custom PGR combination products?'
    answer: 'Yes. We develop multi-AI PGR premixes — for example, GA3 + auxin blends for improved fruit set in grapes and tomatoes, or paclobutrazol + chlormequat combinations for height control in ornamental pot production. Our R&D team validates synergistic dose-response curves and stability profiles for each custom combination.'
body: |
  <h2>Precision Plant Growth Regulation for High-Value Crops</h2>
  <p>Plant growth regulators occupy a specialized niche in crop management: they do not control pests or diseases, but instead modulate physiological processes — cell elongation, division, differentiation, senescence, and stress signaling — to optimize yield, quality, and harvestability. Agrospear's PGR portfolio includes gibberellic acid (GA3) for cell elongation and fruit expansion, ethephon for ethylene-mediated ripening and latex flow, paclobutrazol for gibberellin-inhibiting growth retardation, chlormequat chloride for stem-shortening and lodging resistance, and auxin-family compounds for fruit setting and root initiation. These AIs are formulated as Soluble Liquids (SL), Micro-Emulsions (ME), and Suspension Concentrates (SC), each selected for the physicochemical properties of the active ingredient and the target application scenario.</p>

  <h2>Low-Dose Formulation Science</h2>
  <p>PGRs are applied at rates 100–1000 times lower than conventional agrochemicals, making formulation precision critical. Agrospear's ME platform produces droplet sizes below 100 nm, ensuring uniform foliar coverage even at application volumes as low as 100 L/ha. Our GA3 ME formulations incorporate UV-absorber adjuvants that reduce photodegradation of the gibberellin molecule, extending the effective window from hours to days. For paclobutrazol SC, we achieve sub-micron particle sizes that enable rapid soil uptake and xylem transport to apical meristems, even in high-organic-matter substrates where conventional granule applications show inconsistent performance.</p>

  <h2>Horticulture and Specialty Crop Applications</h2>
  <p>High-value horticultural crops — table grapes, citrus, tomatoes, mangoes, apples, and ornamental pot plants — represent the primary PGR market. Agrospear works with distributors to develop crop-specific protocols: GA3 for bunch elongation in Thompson Seedless grapes, ethephon for uniform degreening in citrus, paclobutrazol for canopy management in mango orchards, and chlormequat for height control in potted chrysanthemums. Our technical support extends to tank-mix compatibility testing with local foliar-nutrition and crop-protection products, ensuring that PGR applications integrate seamlessly into existing spray programs.</p>

  <h2>Stress Mitigation and Adaptive Crop Management</h2>
  <p>Climate variability increasingly demands physiological interventions that buffer crops against heat, drought, and lodging stress. Agrospear's stress-mitigation PGR programs leverage paclobutrazol pre-treatment to enhance root-to-shoot ratio before anticipated drought periods, chlormequat applications to reinforce stem internode strength in cereal crops facing storm risk, and ethephon-triggered ethylene responses to accelerate uniform ripening when early harvest is required by weather forecasts. These adaptive strategies help growers protect yield potential under increasingly unpredictable conditions.</p>

