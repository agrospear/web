faqs:
  tagline: FAQ
  title: 'Manufacturing — Frequently Asked Questions'
  items:
    - q: 'What manufacturing capabilities does Agrospear have?'
      a: '12,500 m² factory with 6 production lines, 350+ workers and 20,000+ tons annual capacity. We compound, grind, fill, label and ship agrochemical products across SC, EC, WP, WDG, SL, ME, CS and FS formulations with ISO 9001 and ICAMA certification.'
    - q: 'What is the MOQ for manufacturing?'
      a: 'MOQ is confirmed by project configuration: sample batches 1–4 tons, pilot runs from 5 tons, standard volume production 20+ tons per batch. Production lead time is 25–35 days from confirmed PO.'
    - q: 'Does Agrospear handle export?'
      a: 'Yes. We ship to 50+ countries with in-house export documentation, customs clearance and FOB Qingdao, CIF or DDP terms.'
    - q: 'How is quality controlled?'
      a: 'Every batch passes a 7-stage inspection gate system with stability testing at 54°C for 14 days, active content verification by HPLC/GC, and 10-year ERP batch traceability.'

