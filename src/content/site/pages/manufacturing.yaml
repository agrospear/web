answer:
  label: 'Straight answer'
  text: 'Agrospear operates a 12,500 m² agrochemical factory in Qingdao, China with 350+ workers, 6 production lines and 20,000+ tons annual output. ISO 9001, ISO 14001, BSCI and ICAMA certified. OEM/ODM services from 5-ton pilot to 20+ ton standard batches, shipped to 50+ countries. Every batch is stability-tested at 54°C for 14 days with full material traceability.'
  verified: '2026-08'

intro:
  - As the manufacturing division of **Qingdao Vatrad Group Co., Ltd.**, Agrospear controls every stage of agrochemical manufacturing — from raw active ingredient to finished crop protection product. Our facility houses dedicated workshops for compounding, grinding, filling, labeling and quality testing under one roof.
  - By integrating formulation design, engineering, prototyping, manufacturing and testing, we eliminate the inefficiencies of contract manufacturing and maintain direct control over product quality, raw material selection and delivery timelines.

