faq_section:
  tagline: FAQ
  title: 'Australian Import Questions'
  questions:
    - q: Does Agrospear provide APVMA registration documentation?
      a: 'Yes. Agrospear provides ICAMA registration documentation, FAO/WHO specification data, active ingredient certificates and full formulation composition files to support your APVMA product registration application and import permit process. Your regulatory counsel uses these files to prepare the APVMA submission.'
    - q: What is an Australian import permit for agrochemicals?
      a: 'The APVMA issues import permits for agricultural chemical products not yet registered in Australia. Agrospear supplies the technical data package — composition, toxicology summaries, residue data and formulation specifications — that your local agent submits with the permit application.'
    - q: How long does sea freight take to Australia?
      a: 'Allow 4–6 weeks from the Qingdao port to Sydney, Melbourne or Brisbane, depending on the sailing schedule. DDP projects include the complete door-to-door timeline.'
    - q: When should I order to have stock before the spray season?
      a: 'Production takes 25–35 days and freight 4–6 weeks, so order roughly 3–4 months before you need stock. For the September–November spray season, place the PO in the first half of the year.'
    - q: Do you ship DDP to Australia?
      a: 'Yes. DDP includes ocean freight, customs clearance, duties and taxes, and delivery to your warehouse — one predictable total price. FOB Qingdao and CIF are also available.'
    - q: What is the MOQ for a private label agrochemical import?
      a: 'MOQ is confirmed by project configuration: sample development covers 1–4 tons, pilot batches run 5 tons on existing platforms, and standard volume production runs 20+ tons per batch.'
    - q: How do I start a project from Australia?
      a: 'Send a reference product, technical brief or specification. The R&D review and quotation return within one business day, and an NDA is signed before any file exchange.'

