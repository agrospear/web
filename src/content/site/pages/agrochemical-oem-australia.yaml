      description: 'The Australian Pesticides and Veterinary Medicines Authority (APVMA) requires product registration before import and sale. Agrospear provides ICAMA registration documentation, FAO/WHO specification data, active ingredient certificates and formulation composition files to support your APVMA application and import permit process.'
