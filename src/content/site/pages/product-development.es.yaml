faq_section:
  tagline: FAQ
  title: 'Preguntas frecuentes sobre desarrollo de formulación agroquímica'
  questions:
    - q: ¿Podéis desarrollar un producto agroquímico desde una idea?
      a: 'Sí. Apoyamos todo el recorrido, desde la especificación del producto y la I+D hasta el desarrollo del prototipo, la personalización y la producción en masa según tus requisitos. Un brief técnico, un producto de referencia o incluso la especificación de un competidor bastan para iniciar la revisión de formulación.'
    - q: ¿Cuánto cuesta el desarrollo de una formulación agroquímica?
      a: 'La revisión de especificación y la evaluación de I+D son gratuitas y se devuelven en un día laborable. El muestreo del prototipo se presupuesta por proyecto tras fijar la especificación; el precio de producción depende de las materias primas, el volumen y de si se requiere desarrollo de formulación a medida.'
    - q: ¿Cuánto tarda el desarrollo de una formulación agroquímica?
      a: 'La primera muestra sale en 7–12 días tras la aprobación de la especificación, con 3–7 días por ronda de revisión. La producción transcurre en 25–35 días tras el PO y el depósito. El desarrollo de formulación añade 15–20 días al inicio, y el flete marítimo añade 4–6 semanas a la mayoría de los destinos.'
    - q: ¿Qué va primero — la muestra o la producción?
      a: 'Siempre la muestra. Se produce, analiza y aprueba un prototipo físico contra la especificación antes de iniciar cualquier tirada de producción. No lanzamos producción en volumen sobre formulaciones no aprobadas.'
    - q: ¿Firmáis un NDA para el desarrollo de formulación?
      a: 'Sí. Se firma un NDA antes de cualquier intercambio de archivos, y tus diseños, arte de etiqueta y archivos de formulación siguen siendo de tu propiedad durante todo el desarrollo y la fabricación.'
    - q: ¿Podéis proteger mi formulación agroquímica y mis especificaciones?
      a: 'Las formulaciones, especificaciones y conceptos de producto de los clientes se tratan de forma confidencial durante el desarrollo y la fabricación. Tus archivos de formulación nunca se reutilizan, revenden ni muestran a otro cliente.'

