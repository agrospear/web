hero:
  tagline: Desarrollo de producto
  title: 'Desarrollo de formulación agroquímica personalizada, del concepto al contenedor'
  subtitle: 'Seis etapas convierten tu idea de producto en formulaciones agroquímicas listas para producir — especificación, I+D, prototipado, ensayos, desarrollo de formulación y producción en masa, todo dentro de una sola fábrica con un único sistema de calidad responsable.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo de formulaciones agroquímicas en Agrospear transcurre en seis etapas — especificación del producto, I+D y diseño de formulación, muestreo de prototipo, ensayos y validación, desarrollo de formulación a medida y producción en masa. La primera muestra física sale en 7–12 días tras la aprobación de la especificación; la producción transcurre en 25–35 días tras el PO y el depósito confirmados; el desarrollo de una formulación nueva añade 15–20 días.'
  verified: '2026-08'

stages:
  title: 'Las seis etapas del desarrollo de formulación agroquímica'
  subtitle: 'Cada etapa tiene un entregable claro, para que siempre sepas dónde está tu proyecto — y qué llega después.'
  items:
    - title: '1. Idea y especificación del producto'
      description: 'Ingrediente activo, concentración, tipo de formulación, cultivo objetivo y requisitos de envasado. Un producto de referencia, un dosier técnico o la especificación de un competidor bastan para empezar.'
      icon: 'tabler:bulb'
    - title: '2. I+D y diseño de formulación'
      description: 'Química de formulación, selección de coadyuvantes y diseño del sistema de solventes, más una revisión de fabricabilidad y presupuesto — devueltos en un día laborable.'
      icon: 'tabler:blueprint'
    - title: '3. Muestreo de prototipo'
      description: 'Tu primera muestra física sale en 7–12 días, documentada con una ficha de aprobación que cubre composición, propiedades físicas y resultados del ensayo de estabilidad.'
      icon: 'tabler:tools'
    - title: '4. Ensayos y validación'
      description: 'Ensayos de estabilidad, análisis de contenido y comprobaciones de propiedades físicas contra la muestra aprobada, con documentación ICAMA, FAO y WHO preparada para tus mercados objetivo.'
      icon: 'tabler:test-pipe'
    - title: '5. Desarrollo de formulación y producción en masa'
      description: 'Desarrollo de formulación a medida en 15–20 días cuando se necesita; la producción transcurre en 25–35 días con puntos de control de QC en proceso y trazabilidad de lote.'
      icon: 'tabler:settings'
    - title: '6. Entrega y escalado'
      description: 'Logística FOB, CIF o DDP a más de 50 países — y después pedidos repetidos de tu línea consolidada con plazos estables y diseño de etiqueta aprobado en archivo.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Por qué el desarrollo dentro de una fábrica gana a un proyecto intermediado'
  subtitle: 'Que el trabajo de desarrollo esté dentro de la planta de producción cambia lo que obtienes en cada etapa.'
  items:
    - title: Sin brechas de traspaso de diseño
      description: 'El equipo de I+D y formulación trabaja en la misma planta que la línea de producción — un cambio de formulación llega a producción la misma semana, no después de un viaje comercial de ida y vuelta.'
      icon: 'tabler:handshake'
    - title: Muestras que coinciden con la producción
      description: 'El lote de muestra y el lote de producción comparten equipos, materias primas y puestos de QC, así que la muestra aprobada es lo que realmente recibes a escala de contenedor.'
      icon: 'tabler:stack-2'
    - title: Ingeniería que no vende nada más
      description: 'Las decisiones se toman contra el coste objetivo, la eficacia y el cumplimiento regulatorio — no contra márgenes de venta adicional, porque esto es una fábrica y la producción es el único ingreso.'
      icon: 'tabler:scale'
    - title: Confidencialidad como contrato permanente
      description: 'Se firma un NDA antes de cualquier intercambio de archivos, y tus diseños de etiqueta, archivos de formulación y documentos de especificación siguen siendo de tu propiedad — nunca reutilizados, revendidos ni mostrados a otro cliente.'
      icon: 'tabler:lock'

