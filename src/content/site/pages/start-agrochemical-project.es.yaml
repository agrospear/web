hero:
  tagline: 'Empieza Aquí'
  title: 'Inicia Tu Proyecto Agroquímico'
  subtitle: 'Ya sea que estés lanzando una marca nueva, expandiendo una línea de productos o abasteciendo formulaciones con marca para tu red de distribución — cada proyecto empieza igual: un brief de proyecto, un NDA, una muestra y un camino claro hacia la producción. Esto es lo que pasa después de hacer clic en "Iniciar".'
  actions:
    - variant: primary
