manufacturing_scope:
  heading: 'Manufacturing Scope'
  body: |
    Our manufacturing scope covers the full production chain for agrochemical formulations and crop protection products — from raw material incoming inspection through final packaging and export documentation.

    - **Product categories**: Herbicides, insecticides, fungicides, plant growth regulators (PGRs), seed treatments and combination formulations.
    - **Formulation types**: SC (suspension concentrate), EC (emulsifiable concentrate), WP (wettable powder), WDG (water-dispersible granule), SL (soluble liquid), ME (micro-emulsion), CS (capsule suspension), FS (flowable concentrate for seed treatment). Custom formulation specifications per project.
    - **Collaboration models**: OEM (buyer-owned formulation), ODM (factory-developed from buyer brief), private-label/co-branding (brand applied to proven platforms).
    - **Certifications**: ISO 9001:2015 (factory quality management), ISO 14001 (environmental management), BSCI (social compliance), ICAMA (registration support), FAO/WHO specifications.
    - **Production capacity**: 20,000+ tons annually, 1,500+ tons monthly output. Scale-up available with advance scheduling.

brand_positioning:
  heading: 'Brand Positioning'
  body: |
    Agrospear occupies a specific position in the market — we are not a brand, we are a manufacturer. This distinction shapes every aspect of how we operate:

    - **We never sell under our own brand.** Every product we produce carries the brand of the buyer. We do not compete with our clients in any market, in any channel. This policy is non-negotiable.
    - **We are not a trading company.** We operate the factory. Quality control, formulation engineering, production scheduling and export documentation are all managed in-house. There are no intermediaries between your order and the production floor.
    - **We specialize in agrochemical formulations.** This is not a sideline or one product category among many. Crop protection formulations are our core competence. Every reactor, every process, every QC gate is optimized for this product category.
    - **We serve professional buyers.** Our clients are brands, distributors, cooperatives, registrars and government agencies — not individual farmers. Our pricing, MOQ structure, documentation and communication are designed for B2B relationships.

evidence_review:
  tagline: 'Evidence & Verification'
  title: 'SPECIFICATIONS VERIFIED'
  body: 'All organizational and manufacturing claims on this page are verifiable. ISO 9001 certificate, ISO 14001 certificate, BSCI report, ICAMA documentation, business license and factory registration documents are available on request. Factory visits welcome. Specifications last verified 2026-08.'

faqs:
  tagline: FAQ
  title: 'Brand Identity — Frequently Asked Questions'
  items:
    - q: 'Is Agrospear a separate company from Qingdao Vatrad Group?'
      a: 'No. Agrospear is the buyer-facing brand of Agrospear, which is the agrochemical manufacturing division of Qingdao Vatrad Group Co., Ltd. The legal contracting entity for all orders is Qingdao Vatrad Group Co., Ltd. The factory, team and quality system are one operation.'
    - q: 'Do you sell products under your own brand?'
      a: 'No. We manufacture exclusively under the brands of our clients and never compete with them in any market. This is a core policy — not a temporary position. If you find a Agrospear-branded product on the market, it is not from our factory.'
    - q: 'Can I visit the factory?'
      a: 'Yes. We welcome factory visits and can arrange a structured audit covering the full production process, QC gates, raw material warehouse and documentation review. Contact us to schedule a visit.'
    - q: 'What is the relationship between Agrospear and Agrospear?'
      a: 'Agrospear is the manufacturing division name within Qingdao Vatrad Group. Agrospear is the international buyer-facing brand used for OEM, ODM and private-label manufacturing services. They refer to the same operation — the agrochemical manufacturing division in Laixi, Qingdao.'

