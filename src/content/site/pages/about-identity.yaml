hero:
  tagline: 'Brand Identity'
  title: 'Who Is Agrospear?'
  subtitle: 'Agrospear is the agrochemical manufacturing division of Qingdao Vatrad Group Co., Ltd. — a specialized agrochemical formulation and crop protection products manufacturer in Laixi, Qingdao, China. We manufacture exclusively under the brands of our clients and never compete with them in any market.'

answer:
  label: 'In brief'
  text: 'Legal entity: Qingdao Vatrad Group Co., Ltd. Manufacturing division: Agrospear (Agrospear brand). Factory: Laixi, Qingdao, Shandong, China. Scope: OEM, ODM and private-label manufacturing of herbicides, insecticides, fungicides, PGRs, seed treatments and agrochemical formulations (SC, EC, WP, WDG, SL, ME, CS, FS). Certifications: ISO 9001:2015, ISO 14001, BSCI, ICAMA. We do not sell under our own brand — every product we produce carries the brand of the buyer.'
  verified: '2026-08'

