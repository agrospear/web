faqs:
  - question: 'Does Agrospear provide registration documentation for Brazilian ANVISA/IBAMA requirements?'
    answer: "Yes. Agrospear prepares technical data packages formatted for Brazil's three-agency registration system: ANVISA for toxicological classification, IBAMA for environmental assessment, and the Ministry of Agriculture (MAPA) for agronomic efficacy. Dossiers include ICAMA registration documentation, FAO/WHO specification data, active ingredient certificates, five-batch analysis reports, physical-chemical property data and accelerated stability studies per CIPAC MT 46. Your Brazilian regulatory consultant integrates these into the formal RDC 223/2018 submission."
  - question: 'What formulations does Agrospear recommend for Asian soybean rust?'
    answer: "For Asian soybean rust (Phakopsora pachyrhizi), Agrospear recommends SC and WDG formulations of triazole fungicides — tebuconazole, propiconazole and difenoconazole — in solo and pre-mixed combinations with strobilurins (azoxystrobin, picoxystrobin). Multi-site WP formulations of mancozeb provide protective tank-mix partners for resistance management. All formulations are tested for spray-drift reduction and rain-fastness suited to Cerrado and Pampas application conditions."
  - question: 'How long does shipping take to Latin American ports?'
    answer: "Sea freight from Qingdao to Santos, Buenos Aires or Cartagena typically takes 5–7 weeks depending on the destination and transshipment routing. Direct sailings to Santos are the fastest South American route. DDP delivery includes customs clearance and inland transport. FOB Qingdao and CIF terms are also available for importers with established logistics networks."
  - question: 'Can Agrospear formulate for coffee crop protection?'
    answer: "Yes. Agrospear manufactures SC and WP formulations for coffee leaf rust (Hemileia vastatrix) control using triazole and strobilurin active ingredients, EC formulations for coffee berry borer (Hypothenemus hampei) with chlorpyrifos and deltamethrin, and FS seed treatment formulations for coffee seedling nematode protection. Formulations are validated for altitudinal application conditions from 800 to 1,800 meters."
  - question: 'What is the MOQ for a Latin American OEM agrochemical project?'
    answer: "MOQ is confirmed by project configuration: sample development covers 1–4 tons, pilot batches run 5 tons on existing platforms, and standard volume production runs 20+ tons per batch. For Mercosur market entries, a 5-ton pilot on an existing Agrospear platform with local label adaptation is the most efficient starting configuration."
body: |
  <h2>Latin America's Crop Protection Landscape</h2>
  <p>Latin America is the world's largest soybean-producing region, with Brazil alone exceeding 150 million tons annually — and Asian soybean rust (Phakopsora pachyrhizi) is the dominant disease threat, capable of yield losses exceeding 80% in untreated fields. The coffee berry borer (Hypothenemus hampei) infests plantations from Minas Gerais to Huila, while coffee leaf rust (Hemileia vastatrix) remains endemic across the Central American corridor and Andean slopes. Sugarcane borer (Diatraea saccharalis) and sugarcane smut (Sporisorium scitamineum) constrain productivity across Brazil's São Paulo and Northeast growing zones. Citrus greening (Candidatus Liberibacter asiaticus), transmitted by the Asian citrus psyllid (Diaphorina citri), threatens São Paulo's orange industry — the world's largest juice-exporting sector. Fall armyworm (Spodoptera frugiperda) is a perennial threat to maize across the entire continent. Agrospear designs formulations for these specific pressure points, with product platforms proven in subtropical heat, high rainfall and large-scale mechanized application.</p>

  <h2>Navigating Brazil, Argentina and Colombia Registration Systems</h2>
  <p>Latin America's agrochemical registration is country-specific with no regional harmonization equivalent to the EU or ASEAN. Brazil operates a three-agency system: ANVISA handles toxicological classification and human health assessment under RDC 223/2018, IBAMA conducts environmental risk assessment, and MAPA evaluates agronomic efficacy and grants the final registration. The full process can take 3–5 years for a new active ingredient, though generic registrations following patent expiry move faster. Argentina's SENASA under Resolution 350/99 requires efficacy trials, toxicological and environmental data — with a typical timeline of 18–24 months for formulation registration. Colombia's ICA under Resolution 6834/2021 maintains a technical evaluation process aligned with FAO/WHO guidelines. Peru's SENASA and Chile's SAG have their own national requirements. Agrospear prepares documentation packages tailored to each target market, with ICAMA data, FAO/WHO specifications, five-batch analysis, physical-chemical property reports and stability studies formatted for the specific agency's dossier requirements.</p>

  <h2>Formulation Strengths for Latin American Row Crop and Specialty Systems</h2>
  <p>Agrospear's 20,000 m² factory with 50,000+ tons annual capacity produces formulations matched to Latin America's large-scale, mechanized agriculture. SC suspensions of triazole-strobilurin premixes deliver Asian soybean rust control in a single spray pass across thousand-hectare Cerrado farms. EC formulations of lambda-cyhalothrin and chlorantraniliprole address fall armyworm and sugarcane borer with rapid knockdown and residual activity. WDG water-dispersible granules provide dust-free handling for coffee plantation workers applying on steep terrain. FS seed treatment formulations protect maize and cotton from soil pests and seedling diseases at planting. SL soluble liquid formulations of glyphosate and 2,4-D serve the region's extensive no-till soybean systems. Every production batch undergoes six-stage QC with particle-size analysis for SC formulations (D50 target 2–5 μm for optimal soybean canopy penetration), suspensibility testing per CIPAC MT 15, and emulsion stability verification per CIPAC MT 36 — ensuring the product performs in the field as consistently as it tests in the laboratory.</p>

