manufacturing_scope:
  heading: 'Alcance de Fabricación'
  body: |
    Nuestro alcance de fabricación cubre toda la cadena de producción para formulaciones agroquímicas y productos de protección de cultivos — desde la inspección de materia prima entrante hasta el empaque final y documentación de exportación.

    - **Categorías de productos**: Herbicidas, insecticidas, fungicidas, reguladores de crecimiento vegetal (PGR), tratamientos de semillas y formulaciones combinadas.
    - **Tipos de formulación**: SC (concentrado en suspensión), EC (concentrado emulsionable), WP (polvo mojable), WDG (gránulo dispersable en agua), SL (líquido soluble), ME (microemulsión), CS (suspensión encapsulada), FS (concentrado fluido para tratamiento de semillas). Especificaciones de formulación personalizadas por proyecto.
    - **Modelos de colaboración**: OEM (formulación del comprador), ODM (desarrollado por fábrica a partir del brief del comprador), marca privada/co-branding (marca aplicada a plataformas probadas).
    - **Certificaciones**: ISO 9001:2015 (gestión de calidad de fábrica), ISO 14001 (gestión medioambiental), BSCI (cumplimiento social), ICAMA (soporte de registro), especificaciones FAO/OMS.
    - **Capacidad de producción**: Más de 20,000 toneladas anuales, más de 1,500 toneladas de producción mensual. Escalabilidad disponible con programación anticipada.

brand_positioning:
  heading: 'Posicionamiento de Marca'
  body: |
    Agrospear ocupa una posición específica en el mercado — no somos una marca, somos un fabricante. Esta distinción moldea cada aspecto de cómo operamos:

    - **Nunca vendemos bajo nuestra propia marca.** Cada producto que producimos lleva la marca del comprador. No competimos con nuestros clientes en ningún mercado, en ningún canal. Esta política es innegociable.
    - **No somos una empresa comercializadora.** Operamos la fábrica. El control de calidad, la ingeniería de formulación, la programación de producción y la documentación de exportación se gestionan internamente. No hay intermediarios entre su pedido y la planta de producción.
    - **Nos especializamos en formulaciones agroquímicas.** Esto no es una actividad secundaria ni una categoría de producto entre muchas. Las formulaciones de protección de cultivos son nuestra competencia central. Cada reactor, cada proceso, cada puerta de control de calidad está optimizada para esta categoría de producto.
    - **Servimos a compradores profesionales.** Nuestros clientes son marcas, distribuidores, cooperativas, registradores y agencias gubernamentales — no agricultores individuales. Nuestros precios, estructura de MOQ, documentación y comunicación están diseñados para relaciones B2B.

evidence_review:
  tagline: 'Evidencia y Verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones organizativas y de fabricación en esta página son verificables. El certificado ISO 9001, certificado ISO 14001, informe BSCI, documentación ICAMA, licencia comercial y documentos de registro de fábrica están disponibles bajo solicitud. Visitas de fábrica bienvenidas. Especificaciones verificadas por última vez 2026-08.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'Identidad de Marca — Preguntas Frecuentes'
  items:
    - q: '¿Agrospear es una empresa separada de Qingdao Vatrad Group?'
      a: 'No. Agrospear es la marca orientada al comprador de Agrospear, que es la división de fabricación agroquímica de Qingdao Vatrad Group Co., Ltd. La entidad legal contratante para todos los pedidos es Qingdao Vatrad Group Co., Ltd. La fábrica, el equipo y el sistema de calidad son una sola operación.'
    - q: '¿Venden productos bajo su propia marca?'
      a: 'No. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado. Esta es una política fundamental — no una posición temporal. Si encuentra un producto con la marca Agrospear en el mercado, no proviene de nuestra fábrica.'
    - q: '¿Puedo visitar la fábrica?'
      a: 'Sí. Recibimos visitas de fábrica y podemos organizar una auditoría estructurada que cubra todo el proceso de producción, puertas de control de calidad, almacén de materias primas y revisión de documentación. Contáctenos para programar una visita.'
    - q: '¿Cuál es la relación entre Agrospear y Agrospear?'
      a: 'Agrospear es el nombre de la división de fabricación dentro de Qingdao Vatrad Group. Agrospear es la marca internacional orientada al comprador utilizada para servicios de fabricación OEM, ODM y marca privada. Se refieren a la misma operación — la división de fabricación agroquímica en Laixi, Qingdao.'

