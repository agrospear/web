hero:
  tagline: 'Identidad de Marca'
  title: '¿Quién Es Agrospear?'
  subtitle: 'Agrospear es la división de fabricación agroquímica de Qingdao Vatrad Group Co., Ltd. — un fabricante especializado de formulaciones agroquímicas y productos de protección de cultivos en Laixi, Qingdao, China. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado.'

answer:
  label: 'En resumen'
  text: 'Entidad legal: Qingdao Vatrad Group Co., Ltd. División de fabricación: Agrospear (marca Agrospear). Fábrica: Laixi, Qingdao, Shandong, China. Alcance: Fabricación OEM, ODM y marca privada de herbicidas, insecticidas, fungicidas, reguladores de crecimiento (PGR), tratamientos de semillas y formulaciones agroquímicas (SC, EC, WP, WDG, SL, ME, CS, FS). Certificaciones: ISO 9001:2015, ISO 14001, BSCI, ICAMA. No vendemos bajo nuestra propia marca — cada producto que producimos lleva la marca del comprador.'
  verified: '2026-08'

