qc_section:
  tagline: Quality Control
  title: Testing & Quality Assurance
  subtitle: Every batch undergoes mandatory testing before shipping. Our quality lab operates independently from production.
  steps:
    - step: '1'
      title: Raw Material Inspection
      desc: HPLC/GC purity analysis, impurity profiling and physical property verification before production.
    - step: '2'
      title: 14-Day Stability Test at 54°C
      desc: Every batch held at 54°C for 14 days per CIPAC MT 46. Active content deviation above ±2% triggers automatic rejection.
    - step: '3'
      title: Active Content & Specification Verification
      desc: Completed formulations analyzed for active content by HPLC/GC and checked for suspensibility, emulsion stability, pH, viscosity and particle size.

oem_section:
  tagline: OEM Projects
  title: Brand & OEM Partnership Case Studies
  subtitle: 'From concept to production — how we help global brands launch and scale agrochemical product lines.'
  cases:
    - challenge: European agrochemical distributor needed a private-label herbicide range with unique formulations and REACH-compliant ingredients delivered in 60 days.
      solution: Developed custom SC formulations, sourced REACH-compliant actives and compressed sampling by co-locating the formulation team at our factory.
      result: 25–35 days production from signed PO. 200+ tons across 4 SKUs. Repeat order placed before first batch was fully delivered.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'
    - challenge: US crop protection startup needed a high-efficacy insecticide SC formulation with custom concentration and ICAMA registration.
      solution: Adapted existing SC formulation with modified AI ratio, developed co-branded packaging and provided full ICAMA registration documentation.
      result: Over 500 tons sold in Year 1 with a 95% reorder rate.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'

faq_section:
  tagline: FAQ
  title: 'Factory — Frequently Asked Questions'
  questions:
    - q: What is the MOQ for OEM agrochemical formulations?
      a: 'MOQ is confirmed by project configuration. Standard volume production runs 20+ tons per batch, pilot runs start at 5 tons and every project moves through sample (1–4 tons) and pilot stages.'
    - q: What certifications does the factory hold?
      a: 'ISO 9001, ISO 14001, BSCI and ICAMA. Full compliance documentation is provided with every OEM shipment.'
    - q: What is the typical lead time?
      a: 'Standard lead time is 25–35 days from confirmed PO and deposit. Custom formulation development adds 15–20 days. Prototype samples typically ready in 7–14 days.'
    - q: Do you handle export documentation?
      a: 'Yes. We manage export documentation and customs clearance in-house, supplying to 50+ countries.'

production_flow:
  tagline: Production Flow
  title: From Raw Material to Finished Product
  subtitle: 'Every batch passes through 6 production stages with QC checkpoints at every step.'
  stages:
    - stage: '01'
      title: Material Receiving & Incoming QC
      description: 'All incoming materials logged by batch/lot number. Quarantined until QC sign-off.'
      qc_check: 'AI purity (HPLC/GC), impurity profile, solvent purity'
    - stage: '02'
      title: Compounding & Premixing
      description: 'Computer-optimized batching with ±0.1% accuracy.'
      qc_check: 'Weight verification, raw material identity, premix uniformity'
    - stage: '03'
      title: Formulation Processing & Grinding
      description: 'High-shear mixing, sand milling, spray drying and granulation.'
      qc_check: 'Particle size distribution, viscosity, pH, suspensibility'
    - stage: '04'
      title: Filling & Packaging
      description: '100-point filling and packaging checklist per batch.'
      qc_check: 'Fill weight, seal integrity, label accuracy, barcode verification'
    - stage: '05'
      title: Stability Testing & Quality Hold
      description: '14-day 54°C stability test per CIPAC MT 46 on every batch.'
      qc_check: 'Active content, suspensibility, pH, physical stability'
    - stage: '06'
      title: Final Inspection & Packing
      description: 'Full visual and specification inspection before container loading.'
      qc_check: 'Visual inspection, label checklist, packaging integrity, barcode scan'

