answer:
  label: 'Straight answer'
  text: 'The Agrospear factory in Qingdao, China spans 20,000 m² with 4 specialized workshops, 200+ workers and 50,000+ tons annual output. ISO 9001, ISO 14001, BSCI and ICAMA certified. Every batch is stability-tested at 54°C for 14 days, passes a 100-point production checklist and carries 5-year material traceability. OEM/ODM production from 5-ton pilot to 20+ ton standard batches.'
  verified: '2026-08'

intro:
  - As the manufacturing division of **Qingdao Vatrad Group Co., Ltd.**, Agrospear controls every stage from raw active ingredient to finished crop protection product. Our facility in the Qingdao Economic Development Zone houses dedicated workshops for compounding, grinding, filling, labeling and quality testing.
  - By integrating formulation design, engineering, prototyping, manufacturing and testing under one roof, we eliminate the inefficiencies of contract manufacturing and maintain direct control over product quality, raw material selection and delivery timelines.

