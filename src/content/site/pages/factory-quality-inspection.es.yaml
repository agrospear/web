faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre el control de calidad de agroquimicos
  items:
    - q: 'Como controla QINGDAO VATRAD GROUP.,LTD. la calidad de los agroquimicos?'
      a: 'La calidad se controla mediante inspeccion de materiales entrantes, puntos de control en el proceso de produccion, verificacion final del producto, inspeccion del embalaje y trazabilidad de la produccion, cada uno ejecutado segun muestras, especificaciones y criterios de inspeccion aprobados por proyecto.'
    - q: 'Que inspecciones de calidad se realizan durante la produccion de agroquimicos?'
      a: 'Las inspecciones incluyen verificacion de materias primas, controles de pesada y dosificacion, inspeccion de elaboracion y molienda, verificacion de llenado y tapado, inspeccion de etiquetas, pruebas de estabilidad, inspeccion de aspecto y verificacion del embalaje.'
    - q: 'Pueden los clientes OEM solicitar los registros de inspeccion de los agroquimicos?'
      a: 'Si. Los registros de inspeccion y la documentacion de calidad pueden facilitarse segun los requisitos del proyecto y los acuerdos de calidad con el cliente, incluidos informes de muestra de inspeccion de pre-embarque.'
    - q: 'Como garantiza la fabrica la consistencia de la produccion OEM?'
      a: 'La consistencia de la produccion se mantiene mediante muestras aprobadas, especificaciones tecnicas, puntos de control de fabricacion, procedimientos de inspeccion y procesos documentados de control de calidad vinculados a cada pedido.'
    - q: 'Puedo organizar una inspeccion de terceros con SGS, BV, Intertek o QIMA?'
      a: 'Si. Recibimos a los inspectores de terceros con una zona de inspeccion dedicada, instrumentos analiticos calibrados, briefs de inspeccion precumplimentados y registros accesibles. Comparte tu especificacion, muestra aprobada, etiqueta, requisitos de embalaje y criterios de defectos — o utiliza nuestra plantilla de brief de inspeccion de terceros.'
    - q: 'Como se gestionan los cambios de etiqueta, BOM o embalaje durante la produccion?'
      a: 'Los cambios se registran en nuestro registro de control de cambios con la revision del documento afectado, el resumen del cambio, el motivo, la evaluacion de impacto, el estado de aprobacion del cliente y el lote efectivo. Las versiones obsoletas se retiran para que produccion e inspeccion utilicen siempre los documentos aprobados vigentes.'
    - q: 'La fabrica admite proyectos de agroquimicos personalizados?'
      a: 'Si. Se admiten proyectos OEM/ODM de agroquimicos personalizados segun las especificaciones del cliente, los requisitos de etiqueta, las configuraciones de embalaje y las necesidades reglamentarias, con criterios de inspeccion especificos por proyecto acordados antes de la produccion.'
    - q: 'Puede retrabajarse en fabrica un lote de agroquimicos no conforme?'
      a: 'Si — bajo condiciones controladas. El lote se coloca en HOLD y se vincula a un NCR, el defecto se localiza con un metodo de diagnostico aprobado y el retrabajo solo se realiza tras la autorizacion de Calidad/Ingenieria y unicamente dentro de las clases de defecto aprobadas para retrabajo. El lote se reinspecciona despues contra los mismos criterios de aceptacion que un lote conforme antes de su liberacion.'
    - q: 'Cuantas veces puede retrabajar la fabrica un lote?'
      a: 'Un mismo defecto puede retrabajarse una sola vez bajo una instruccion autorizada. Si la reinspeccion sigue fallando, el lote se escala a sustitucion, rechazo, desecho o concesion del cliente — no se permite repetir el retrabajo sin aprobacion documentada.'

