answer:
  label: 'Respuesta directa'
  text: 'QINGDAO VATRAD GROUP.,LTD. controla la calidad de los agroquimicos mediante un sistema de verificacion en 4 fases: control de materiales entrantes (IQC), control de calidad en proceso (IPQC), ensayos finales del producto y verificacion de estabilidad (FQC) y liberacion de embalaje y pre-embarque (OQC). Cada pedido se inspecciona segun la muestra aprobada, la especificacion tecnica, la prueba de etiqueta, la BOM y los estándares de embalaje, con verificacion de estabilidad, controles de contenido activo y propiedades fisicas, confirmacion de accesorios y trazabilidad del lote. Los articulos que no cumplen los criterios de aceptacion se ponen bajo retencion o cuarentena controlada, se retrabajan solo bajo instrucciones aprobadas y se reinspeccionan antes de la liberacion autorizada.'
  verified: '2026-08'

intro: 'Nuestro sistema de calidad esta disenado para proyectos OEM/ODM: los criterios de inspeccion se definen por pedido, se documentan y son seguidos por los equipos de produccion y calidad desde el material entrante hasta el embalaje. Esto mantiene alineadas las expectativas de calidad entre la fabrica y tu marca, desde la primera muestra hasta los contenedores completos.'

scope_note:
  tagline: Alcance
  title: Criterios de inspeccion especificos por proyecto
  body: |
    Las especificaciones de calidad pueden variar segun el tipo de formulacion (p. ej., SC, EC, WP, WDG, SL, ME, CS, FS), el cultivo y plaga objetivo, las normativas del mercado de destino y los parametros aprobados por el cliente. La autorizacion final de liberacion se basa estrictamente en los criterios de inspeccion documentados y acordados para el pedido.

stages:
  tagline: Marco de calidad
  title: Nuestro sistema de verificacion de calidad en 4 fases
  subtitle: Un circuito completo de control de calidad desde la llegada de la materia prima hasta la liberacion del envio.
  steps:
    - title: '1. Control de materiales entrantes (IQC)'
      desc: 'Los ingredientes activos (AI), disolventes, tensioactivos, coadyuvantes y componentes de embalaje se comprueban segun las especificaciones aprobadas y las muestras de referencia antes de entrar en la linea de produccion. Los polvos y liquidos AI se verifican en cuanto a certificado de analisis del proveedor, numero de lote, contenido activo por HPLC/GC, contenido de humedad, tamano de particula, concordancia de color con la referencia aprobada y confirmacion de identidad. Los tensioactivos y coadyuvantes se revisan en cuanto a tipo, concentracion, pH y compatibilidad. Los tambores, contenedores y tapas se someten a pruebas de integridad, sello y ajuste. Las etiquetas, prospectos y embalajes (botellas, garrafas, tambores, cartones) se cotejan en cantidad, color, marca, precision del codigo de barras y version de arte segun la BOM aprobada.'
    - title: '2. Control de calidad en proceso (IPQC)'
      desc: 'Los pasos criticos de fabricacion se inspeccionan para detectar no conformidades antes de que las formulaciones pasen a los siguientes puestos de trabajo. La pesada y dosificacion se verifican en cuanto a peso de carga del ingrediente activo, volumen de disolvente y adicion de tensioactivo segun los registros de produccion por lote aprobados. La elaboracion y molienda se comprueban en cuanto a tiempo de mezcla, temperatura, uniformidad de la pasta y distribucion del tamano de particula. El llenado y tapado se verifican en cuanto a volumen de llenado, peso neto, par de apriete e integridad del sello. El etiquetado y codificacion se verifican en cuanto a posicion, orientacion, legibilidad del codigo de barras, numero de lote y version de arte.'
    - title: '3. Ensayos finales del producto y verificacion de estabilidad (FQC)'
      desc: 'Las formulaciones terminadas se someten a pruebas fisicas, quimicas y de estabilidad obligatorias antes de la aprobacion para su embalaje. Los productos se analizan en cuanto a contenido activo por HPLC/GC, suspensibilidad (CIPAC MT 15), estabilidad de emulsion (CIPAC MT 36), tamano de particula, pH, viscosidad y aspecto segun la especificacion aprobada. La estabilidad acelerada a 54 C durante 14 dias (CIPAC MT 46) verifica la estabilidad en estante y confirma que no hay sedimentacion, separacion de fases ni degradacion del contenido activo mas alla de la tolerancia.'
    - title: '4. Embalaje y liberacion de pre-embarque (OQC)'
      desc: 'La verificacion exhaustiva de pre-embarque garantiza cero discrepancias en la configuracion del SKU o las marcas de envio. La comprobacion de la integridad del kit cruza producto, etiqueta, prospecto, tapa, sello y carton con la BOM del pedido. Los controles de embalaje y codigo de barras verifican las marcas del carton, las etiquetas de SKU, la legibilidad del codigo de barras, el idioma del prospecto y la integridad estructural del carton. Los pedidos se liberan solo tras la auditoria final de embalaje firmada por personal de calidad autorizado.'

inspection_points:
  tagline: Cobertura de inspeccion
  title: Puntos clave de control de inspeccion
  subtitle: Cada punto de control se ejecuta segun criterios de aceptacion documentados y acordados por pedido.
  features:
    - icon: A
      icon_bg: blue
      title: Verificacion de estabilidad y especificacion
      desc: 'Las formulaciones terminadas se analizan en cuanto a contenido activo por HPLC/GC, suspensibilidad, estabilidad de emulsion, pH, viscosidad y tamano de particula segun la especificacion aprobada. La estabilidad acelerada a 54 C (CIPAC MT 46) confirma la estabilidad en estante antes de la liberacion.'
    - icon: B
      icon_bg: green
      title: Inspeccion visual y fisica
      desc: 'Los productos se inspeccionan con iluminacion adecuada en cuanto a aspecto, color, sedimentacion, separacion de fases, espumacion y contaminacion. El peso neto, el volumen de llenado y el par de apriete se verifican segun las especificaciones aprobadas.'
    - icon: C
      icon_bg: purple
      title: Verificacion de etiqueta y embalaje
      desc: 'La configuracion completa del producto se verifica antes del envio: formulacion, etiqueta, prospecto, tapa, sello, embalaje interior, carton exterior y accesorios especificos del cliente, cada uno cotejado con la muestra, los planos y la BOM aprobados.'
    - icon: D
      icon_bg: orange
      title: Embalaje y liberacion del envio
      desc: 'Las unidades embaladas se comprueban en cuanto a configuracion de SKU, precision de etiqueta, informacion del codigo de barras, version del prospecto, marcado del carton, cantidad de embalaje y estado del carton. La liberacion del envio se autoriza solo tras completar todos los requisitos de inspeccion y embalaje.'

traceability_intro:
  tagline: Trazabilidad de lotes
  title: Sistema de trazabilidad a nivel de proyecto y de lote
  body: |
    Cada pedido de agroquimico personalizado se gestiona bajo un codigo de proyecto unificado que vincula las especificaciones tecnicas, la BOM aprobada, las revisiones de etiqueta, los numeros de lote de material, las referencias de embalaje y los registros de inspeccion. Los registros de produccion e inspeccion se mantienen por proyecto y por lote de produccion aplicable, y cada lote puede vincularse de nuevo a la especificacion del producto aprobada, la BOM, la etiqueta y las referencias de embalaje.

    Esto respalda una revision eficiente de la configuracion del producto, el estado de la inspeccion y el alcance afectado si se identifica un problema de calidad — desde el producto terminado hasta los registros de origen, utilizando la identificacion del lote o del carton.

traceability_chain:
  tagline: Cadena de trazabilidad
  title: Del codigo de proyecto a la liberacion del envio
  subtitle: Una cadena de referencias controladas desde la confirmacion del pedido hasta el despacho autorizado.
  steps:
    - step: '01'
      title: Codigo de proyecto
      desc: 'Referencia unificada del proyecto que vincula cada documento controlado con el pedido.'
    - step: '02'
      title: Revisiones de documentos
      desc: 'Niveles de revision actuales de especificacion, BOM, etiqueta y embalaje: solo las versiones aprobadas son validas para produccion.'
    - step: '03'
      title: Lote y materiales
      desc: 'Lotes de AI y materias primas registrados contra el lote de produccion.'
    - step: '04'
      title: Registros de inspeccion
      desc: 'Resultados de inspeccion IQC, en proceso, estabilidad, final y de embalaje por lote.'
    - step: '05'
      title: Embalaje y liberacion
      desc: 'Lote de embalaje, estado de cierre de NCR y resumen de liberacion de envio autorizada.'

traceability_sample:
  tagline: Muestra anonimizada
  title: Registro de control de trazabilidad (demo)
  body: |
    Los valores de demostracion se muestran solo con fines ilustrativos: los nombres de clientes, numeros de PO, etiquetas personalizadas, datos de proveedores e informacion comercial se eliminan para proteger la confidencialidad.

    - **Fabricante:** QINGDAO VATRAD GROUP, LTD.
    - **Codigo de proyecto:** DEMO-AGRO-2026-01
    - **Referencia de SKU:** DEMO-SC-126
    - **Lote de produccion:** BATCH-AUG-01
    - **Revision de especificacion / BOM / etiqueta:** Rev B / Rev C / Rev B
    - **Registro de estabilidad:** PASS — conservado por lote
    - **Estado de inspeccion:** PASS
    - **Estado de envio:** RELEASED

quarantine_intro:
  tagline: Control de no conformidades
  title: Control de productos no conformes y cuarentena
  body: |
    Los productos o componentes que no cumplen los criterios de aceptacion definidos se identifican claramente y se ponen bajo estado de retencion o cuarentena controlada. No pueden pasar a la siguiente etapa de produccion, al embalaje ni al envio hasta completar una disposicion autorizada. El retrabajo se realiza bajo instrucciones aprobadas y se vincula al registro de no conformidad correspondiente; los articulos retrabajados se reinspeccionan segun los requisitos del proyecto aplicables antes de la liberacion de calidad.

quarantine_flow:
  tagline: Flujo de control en 7 pasos
  title: Que ocurre cuando se detecta una no conformidad
  subtitle: Identificar, controlar, corregir, verificar — luego liberar o rechazar. El producto no conforme nunca vuelve a produccion o embalaje sin verificacion.
  steps:
    - step: '01'
      title: Identificar
      desc: 'La no conformidad se registra contra el producto, SKU, lote o etapa de proceso afectados.'
    - step: '02'
      title: Etiquetar
      desc: 'Los articulos afectados se identifican claramente con etiquetas de estado controladas — HOLD, CUARENTENA o RECHAZADO.'
    - step: '03'
      title: Cuarentena
      desc: 'Los articulos se separan en una zona de cuarentena fisicamente controlada o se bloquean por sistema para evitar su uso o envio no intencionado.'
    - step: '04'
      title: Evaluar el alcance
      desc: 'El alcance afectado se revisa por lote, etapa de proceso, lote de material y revision de documento.'
    - step: '05'
      title: Retrabajo / Sustitucion
      desc: 'La correccion solo se permite mediante una disposicion aprobada y una instruccion de trabajo controlada.'
    - step: '06'
      title: Reinspeccion
      desc: 'Los articulos corregidos se reinspeccionan segun los criterios de aceptacion aplicables antes de la liberacion.'
    - step: '07'
      title: Liberar o rechazar
      desc: 'Solo el producto conforme autorizado avanza al embalaje o a la liberacion del envio.'

quarantine_evidence:
  tagline: En el taller
  title: Ensayos controlados y cuarentena en la practica
  subtitle: Fotografias de nuestro taller en Qingdao que muestran como se aplican el control de estado y los registros de inspeccion en planta.
  features:
    - image: https://assets.agrospear.com/site/quality/qc-stability-test-area.avif
      alt: Formulaciones agroquimicas en la zona de pruebas de estabilidad de la fabrica, monitorizadas con instrumentos digitales HPLC y camara de estabilidad
      title: Zona de pruebas de estabilidad
      desc: 'Formulaciones mantenidas en la zona de control de calidad bajo temperatura controlada, con instrumentos HPLC/GC que monitorizan el contenido activo, la suspensibilidad y la estabilidad acelerada a 54 C segun CIPAC MT 46. Los registros se conservan por lote y se vinculan a la inspeccion final.'
    - image: https://assets.agrospear.com/site/quality/qc-hold-quarantine-station.avif
      alt: Hojas de control de calidad y etiquetas de estado de retencion controlada en la estacion de inspeccion de la fabrica
      title: Estacion de retencion y cuarentena
      desc: 'Estacion de inspeccion con hojas de control de calidad y etiquetado de estado. Cualquier articulo que no cumpla los criterios de aceptacion se etiqueta, se registra y se traslada a cuarentena: no puede pasar al embalaje hasta completar una disposicion autorizada y una reinspeccion obligatoria.'
    - image: https://assets.agrospear.com/site/quality/qc-stability-rework.avif
      alt: Tecnico de control de calidad realizando un retrabajo controlado de estabilidad en una formulacion agroquimica en la estacion de retrabajo de la fabrica
      title: Estacion de retrabajo controlado
      desc: 'El retrabajo de estabilidad se realiza en una estacion dedicada segun una tarjeta de metodo aprobada: el defecto se marca, el lote permanece en HOLD y, tras el periodo de estabilizacion requerido, vuelve a la zona de ensayos para su reinspeccion contra los criterios de aceptacion originales.'
    - image: https://assets.agrospear.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Demostracion en el taller de la segregacion controlada en cuarentena en la fabrica de Qingdao
      title: Demostracion de la zona de cuarentena
      desc: 'Fotografia de demostracion del taller que muestra como funciona la segregacion controlada en cuarentena en planta: las unidades segregadas se mantienen bajo control de estado hasta que se completa una disposicion autorizada.'

rework_intro:
  tagline: Gobernanza del retrabajo
  title: Gobernanza controlada de no conformidades de especificacion y retrabajo
  body: |
    En QINGDAO VATRAD GROUP.,LTD., el retrabajo se define estrictamente como la restauracion de un lote no conforme hasta el pleno cumplimiento de su especificacion de ingenieria original — no como un arreglo rapido. Cualquier lote identificado con una no conformidad de estabilidad o especificacion se coloca bajo retencion controlada y se vincula a un Informe de No Conformidad (NCR) antes de continuar cualquier proceso; la fuente del defecto se localiza y registra mediante el metodo de diagnostico aprobado.

    El retrabajo solo puede realizarse cuando el defecto esta dentro del alcance de retrabajo aprobado y se dispone de un metodo autorizado. La instruccion de retrabajo identifica el producto, el lote, la ubicacion del defecto, el material aprobado, el metodo, las condiciones requeridas y el alcance de la reinspeccion. Tras el periodo de estabilizacion requerido, el lote se reinspecciona contra los mismos criterios de aceptacion aplicables que un lote conforme — el retrabajo nunca reduce el estandar de aceptacion. El fallo de la reinspeccion exige una nueva disposicion de ingenieria y calidad; no se permite repetir el retrabajo sin una aprobacion documentada.

rework_decision:
  tagline: Flujo interactivo
  title: Flujo de decision de retrabajo — haz clic en cualquier nodo
  subtitle: Sigue como se gestiona una no conformidad de especificacion desde la deteccion hasta la liberacion o el desecho. Haz clic en un nodo para expandir los requisitos de control en ese paso.
  nodes:
    - id: detect
      type: start
      label: No conformidad detectada
      detail: 'Se identifica una no conformidad de estabilidad o especificacion durante la inspeccion — contenido activo fuera de rango, sedimentacion, separacion de fases, desviacion de pH o defecto relacionado de formulacion.'
    - id: hold
      type: step
      label: Parada de linea · Etiqueta HOLD · NCR
      detail: 'El procesamiento se detiene. Se registran el ID del lote, el codigo de producto, el numero de lote, el puesto de trabajo, la fecha y el inspector; se coloca una etiqueta HOLD / CUARENTENA y se abre un NCR contra la revision de especificacion aplicable.'
    - id: locate
      type: step
      label: Localizar la fuente del defecto
      detail: 'El lote se vuelve a analizar usando el metodo de diagnostico aprobado para el proyecto — contenido activo por HPLC/GC, suspensibilidad por CIPAC MT 15, pH, viscosidad, tamano de particula o estabilidad acelerada a 54 C segun CIPAC MT 46.'
    - id: classify
      type: step
      label: Clasificar el defecto (A–G)
      detail: 'El defecto se clasifica segun la matriz de aprobacion: A variacion de peso de llenado, B desviacion del contenido activo, C desviacion de pH, D sedimentacion o separacion de fases, E fallo de emulsion/suspensibilidad, F fallo recurrente de especificacion, G contaminacion o defecto de seguridad.'
    - id: authorize
      type: decision
      label: Retrabajo autorizado?
      yes: rework
      no: escalate
      detail: 'Calidad confirma la categoria del defecto e Ingenieria evalua si el lote puede restaurarse a su especificacion original. La autorizacion registra la tarjeta de metodo, los materiales, las condiciones y el alcance de la reinspeccion — o deriva a sustitucion, rechazo, desecho o concesion del cliente.'
    - id: rework
      type: step
      label: Retrabajo controlado
      detail: 'Se ejecuta solo dentro del limite del defecto aprobado, con la tarjeta de metodo, el lote de materia prima y los equipos aprobados — nunca se alteran la formulacion, la concentracion, la etiqueta, el embalaje ni los requisitos del cliente.'
    - id: cure
      type: step
      label: Periodo de estabilizacion
      detail: 'El lote permanece en HOLD durante el periodo de estabilizacion definido por la instruccion de material y proceso aprobada, y recibe una preinspeccion visual y de propiedades fisicas.'
    - id: reinspect
      type: decision
      label: Reinspeccion superada?
      yes: release
      no: escalate
      detail: 'El lote se vuelve a analizar segun la especificacion aprobada para el proyecto y se reverifican el fallo original y todas las caracteristicas potencialmente afectadas — contenido activo, suspensibilidad, pH, viscosidad, tamano de particula, estabilidad, aspecto y etiquetado. El retrabajo nunca reduce el estandar de aceptacion.'
    - id: release
      type: release
      label: Liberacion de calidad
      detail: 'Calidad revisa el NCR cerrado, el registro de retrabajo y el resultado de la reinspeccion y autoriza la liberacion. Ningun lote retrabajado se embala ni se envia sin la liberacion de calidad autorizada.'
    - id: escalate
      type: escalate
      label: Escalar — Sustituir / Desechar / Concesion
      detail: 'No se repite el retrabajo sin aprobacion documentada. El lote se deriva a sustitucion, rechazo, desecho o concesion escrita del cliente cuando no puede restaurarse la especificacion original.'

defect_matrix:
  tagline: Clasificacion de defectos
  title: Matriz de clasificacion de defectos de especificacion y aprobacion
  subtitle: No toda no conformidad se retrabaja — cada defecto se clasifica y su disposicion se aprueba al nivel adecuado, desde el inspector de calidad hasta el director de planta.
  headers:
    category: Categoria de defecto
    area: Zona tipica
    eligibility: Elegibilidad de retrabajo
    approval: Aprobacion requerida
  rows:
    - category: 'Clase A — Variacion de peso de llenado'
      area: 'Peso neto o volumen de llenado fuera de tolerancia'
      eligibility: 'Retrabajo estandar autorizado (ajuste)'
      approval: 'Inspector de calidad'
    - category: 'Clase B — Desviacion del contenido activo'
      area: 'Contenido de AI fuera del rango de especificacion'
      eligibility: 'Retrabajo evaluado segun la tarjeta de metodo aprobada (dilucion o adicion de AI)'
      approval: 'Calidad + Ingenieria'
    - category: 'Clase C — Desviacion de pH'
      area: 'pH fuera del rango de especificacion'
      eligibility: 'Autorizado solo si cumple las especificaciones del cliente y los limites reglamentarios'
      approval: 'Calidad + Ingenieria'
    - category: 'Clase D — Sedimentacion / Separacion de fases'
      area: 'Sedimentacion visible o separacion de fases en concentrado suspendido o emulsion'
      eligibility: 'Riesgo alto; requiere disposicion estricta de ingenieria'
      approval: 'Ingenieria + Jefe de calidad'
    - category: 'Clase E — Fallo de emulsion / suspensibilidad'
      area: 'Estabilidad de emulsion o suspensibilidad por debajo de especificacion (CIPAC MT 15 / MT 36)'
      eligibility: 'Retrabajo estandar no autorizado — revision de reformulacion o sustitucion'
      approval: 'Jefe de calidad + Concesion del cliente'
    - category: 'Clase F — Fallo recurrente de especificacion'
      area: 'Defecto no resoluble o fallo en el reensayo'
      eligibility: 'Sin retrabajo repetido; sustitucion, desecho o analisis de causa raiz'
      approval: 'Jefe de calidad / Ingenieria'
    - category: 'Clase G — Contaminacion / Defecto de seguridad'
      area: 'Contaminacion cruzada, materia extraa o defecto de seguridad'
      eligibility: 'Liberacion por retrabajo no autorizada — sustitucion, desecho o concesion escrita del cliente'
      approval: 'Responsable de calidad + Aprobacion del cliente'

rework_flow:
  tagline: Circuito cerrado en 7 pasos
  title: Flujo de retrabajo controlado — de la deteccion a la liberacion o el desecho
  subtitle: 'Todo retrabajo de especificacion sigue el mismo circuito controlado: detectar, aislar, diagnosticar, autorizar, retrabajar, reinspeccionar, liberar.'
  steps:
    - step: '01'
      title: Deteccion, parada de linea y cuarentena
      desc: 'El procesamiento del lote afectado se detiene de inmediato. Se registran el ID del lote, el codigo de producto, el puesto de trabajo, la fecha y el inspector; se coloca una etiqueta HOLD / CUARENTENA y se abre un NCR contra la revision de especificacion aplicable.'
    - step: '02'
      title: Diagnostico sistematico del defecto
      desc: 'El lote se vuelve a analizar usando el metodo de diagnostico aprobado para el proyecto — contenido activo por HPLC/GC, suspensibilidad por CIPAC MT 15, estabilidad de emulsion por CIPAC MT 36, pH, viscosidad, tamano de particula o estabilidad acelerada a 54 C segun CIPAC MT 46. El defecto sospechoso se documenta sin alterar el lote.'
    - step: '03'
      title: Disposicion e autorizacion de ingenieria
      desc: 'Calidad confirma la categoria del defecto e Ingenieria evalua si el lote puede restaurarse a su especificacion original. Una autorizacion de retrabajo vinculada al NCR registra el metodo, los materiales, las condiciones y el alcance de la reinspeccion aprobados — o asigna sustitucion, rechazo, desecho o concesion del cliente.'
    - step: '04'
      title: Ejecucion controlada del retrabajo
      desc: 'El retrabajo se ejecuta solo dentro del limite del defecto aprobado, utilizando la tarjeta de metodo, el lote de materia prima y los equipos aprobados. Nunca se alteran la formulacion, la concentracion, la configuracion de etiqueta ni los requisitos de embalaje del lote.'
    - step: '05'
      title: Estabilizacion y preinspeccion
      desc: 'El lote retrabajado permanece en estado HOLD durante el periodo de estabilizacion definido por la instruccion de material y proceso aprobada, y recibe una preinspeccion visual y de propiedades fisicas antes de la reinspeccion.'
    - step: '06'
      title: Reinspeccion y ensayo de especificacion
      desc: 'El lote se vuelve a analizar segun la especificacion aprobada para el proyecto y se reverifican el fallo original y todas las caracteristicas potencialmente afectadas: contenido activo, suspensibilidad, estabilidad de emulsion, pH, viscosidad, tamano de particula, estabilidad, aspecto y etiquetado. El retrabajo nunca reduce el estandar de aceptacion.'
    - step: '07'
      title: Liberacion de calidad o disposicion final
      desc: 'Calidad revisa el NCR completado, el registro de retrabajo y el resultado de la reinspeccion y autoriza la liberacion — o escala a sustitucion, rechazo, desecho o concesion del cliente. Ningun lote retrabajado se embala ni se envia sin la liberacion de calidad autorizada.'

quality_safeguards:
  tagline: Salvaguardas de calidad
  title: Reglas a prueba de errores que protegen tu marca
  subtitle: Controles firmes que evitan bucles de reparacion no controlados — un retrabajo documentado por defecto, umbrales de alerta por lote, instrumentacion calibrada y condiciones de ensayo controladas.
  features:
    - icon: 1
      icon_bg: blue
      title: Un retrabajo por defecto
      desc: 'Un mismo defecto puede retrabajarse una sola vez bajo una instruccion autorizada. Si la reinspeccion sigue fallando, el lote se escala a sustitucion, rechazo, desecho o concesion del cliente — no se permite repetir el retrabajo sin aprobacion documentada.'
    - icon: 2
      icon_bg: green
      title: Alerta por lote y parada de linea
      desc: 'Cuando la no conformidad de un lote de produccion supera el umbral fijado por ingenieria, la linea se detiene e Ingenieria investiga la causa — lote de material, condiciones de proceso y registros — antes de reanudar la produccion.'
    - icon: 3
      icon_bg: purple
      title: Instrumentacion calibrada
      desc: 'Los instrumentos HPLC/GC, medidores de pH, viscosimetros y camaras de estabilidad utilizados para las pruebas se controlan y calibran por laboratorios de terceros dentro de su periodo de validez, con el estado de calibracion visible en la zona de inspeccion.'
    - icon: 4
      icon_bg: orange
      title: Condiciones de ensayo controladas
      desc: 'Las camaras de estabilidad y los laboratorios analiticos se mantienen en entornos con temperatura y humedad controladas para que los resultados no se vean afectados por variaciones ambientales.'

rework_boundaries:
  tagline: Alcance y limites
  title: Que no cubre este sistema
  body: |
    El sistema de control de retrabajo se aplica a formulaciones agroquimicas terminadas o en proceso identificadas con fallos de especificacion, no conformidades de estabilidad o defectos relacionados antes de la liberacion del envio. No autoriza cambios en la formulacion, concentracion, etiqueta, configuracion del producto o requisitos del cliente aprobados, y no cubre:

    - Productos ya enviados o en canales de distribucion del cliente.
    - Contaminacion o defectos de seguridad no evaluados por Ingenieria.
    - Fallos generalizados de formulacion, contaminacion cruzada o defectos que puedan afectar a la seguridad.
    - Proyectos en los que no se permite el retrabajo: muestras aprobadas por el cliente, lotes de registro ICAMA o unidades de ensayo.
    - Proyectos con procesos propietarios del cliente, materias primas especiales o requisitos de retrabajo especiales.
    - Fallos recurrentes de especificacion que no pueden resolverse, o lotes que vuelven a fallar tras el retrabajo.

    Cualquier desviacion de las especificaciones del cliente requiere una revision de ingenieria documentada y, cuando corresponda, la aprobacion escrita del cliente. Los lotes que no puedan restaurarse a su especificacion original solo se liberan bajo una concesion explicita del cliente — nunca por decision unicamente de produccion.

method_cards:
  tagline: Sistema de tarjetas de metodo
  title: Indice de tarjetas de metodo de retrabajo controlado
  subtitle: 'La instruccion general controla el proceso; las tarjetas de metodo controlan la operacion. La instruccion de retrabajo (WI-QC-SPEC-001) referencia las tarjetas de metodo MC-RW-01 a MC-RW-06, ademas de MC-RW-00 para desecho y rechazo obligatorios.'
  headers:
    code: Tarjeta de metodo
    defect: Clase de defecto
    scope: Alcance de aplicacion
    controls: Controles clave de ingenieria
    approval: Autoridad de aprobacion
  rows:
    - code: MC-RW-01
      defect: Clase A (Peso de llenado)
      scope: 'Ajuste de peso neto o volumen de llenado'
      controls: 'Pesaje calibrado, ajuste volumetrico, sin cambio de formulacion'
      approval: 'Inspector de calidad'
    - code: MC-RW-02
      defect: Clase B (Contenido activo)
      scope: 'Ajuste del contenido de AI por dilucion o adicion controlada de AI'
      controls: 'Verificacion por HPLC/GC antes y despues, control de tiempo y temperatura de mezcla'
      approval: 'Calidad + Ingenieria'
    - code: MC-RW-03
      defect: Clase C (Ajuste de pH)
      scope: 'Correccion de pH usando acido o alcali aprobado'
      controls: 'Medidor de pH calibrado, adicion incremental, sin efecto en el contenido activo'
      approval: 'Calidad + Ingenieria'
    - code: MC-RW-04
      defect: Clase D (Sedimentacion)
      scope: 'Redispersion de sedimentacion o separacion de fases'
      controls: 'Remolienda controlada, pase por molino de arena, verificacion de tamano de particula'
      approval: 'Ingenieria + Jefe de calidad'
    - code: MC-RW-05
      defect: Clase B/C (Desviacion de viscosidad)
      scope: 'Ajuste de viscosidad usando espesante o diluyente aprobado'
      controls: 'Verificacion con viscosimetro, adicion incremental, sin efecto en contenido activo o suspensibilidad'
      approval: 'Calidad + Ingenieria'
    - code: MC-RW-06
      defect: Clase D (Reestabilizacion de emulsion)
      scope: 'Reestabilizacion de estabilidad de emulsion para formulaciones EC/ME'
      controls: 'Adicion controlada de emulsionante, homogeneizacion, prueba de estabilidad de emulsion segun CIPAC MT 36'
      approval: 'Ingeniero jefe'
    - code: MC-RW-00
      defect: Clase E/F/G (Critico / Contaminacion)
      scope: 'Desecho obligatorio y destruccion controlada'
      controls: 'Destruccion controlada para evitar mezclas, registro de desecho, revision de causa raiz entre departamentos'
      approval: 'Director de planta'

inspector_friendly:
  tagline: Inspeccion de terceros
  title: Protocolo amigable para inspectores
  body: |
    Disponemos de una zona de inspeccion dedicada con instrumentos HPLC/GC calibrados, camaras de estabilidad estandarizadas y Briefs de inspeccion precumplimentados para que las agencias de terceros (SGS, BV, Intertek, QIMA) puedan completar la inspeccion de pre-embarque de forma eficiente — reduciendo tus costes de inspeccion.

    Cada brief resume las revisiones de documentos aplicables, la referencia de la muestra aprobada, los controles criticos de calidad, el nivel de muestreo acordado, los ensayos funcionales y los requisitos de embalaje y codigo de barras del PO. Las cantidades, la calidad, el embalaje y los elementos basicos de seguridad especificados se verifican contra las referencias del proyecto aprobadas — sin busquedas de ultima hora sobre el terreno.

