faqs:
  - question: '¿Agrospear proporciona documentación de registro para los mercados africanos?'
    answer: "Sí. Agrospear prepara documentación alineada con el marco Continental de Protección Fitosanitaria de la Unión Africana, los expedientes de registro armonizado WAEMU/CILLS para los países de la Unión Económica y Monetaria de África Occidental, y los paquetes de reguladores nacionales individuales para mercados de África Oriental como KEPHIS en Kenia, TPRI en Tanzania y NARL en Uganda. Se incluyen datos de registro ICAMA, fichas de especificación FAO/OMS, certificados de ingrediente activo e informes de análisis de cinco lotes."
  - question: '¿Qué formulaciones recomienda Agrospear para el control del gusano cogollero en África?'
    answer: "Para el gusano cogollero (Spodoptera frugiperda) en maíz y sorgo, Agrospear recomienda formulaciones SC de emamectina benzoato o clorantraniliprol para aplicación foliar, formulaciones FS de tratamiento de semilla de clothianidin o tiametoxam para protección en etapa temprana, y formulaciones WDG de indoxacarb para programas de rotación de manejo de resistencia. Todas las formulaciones se prueban para estabilidad en condiciones de almacenamiento tropical por encima de 35°C."
  - question: '¿Cuánto tarda el envío a puertos africanos?'
    answer: "El flete marítimo desde Qingdao a Mombasa, Lagos o Durban suele tardar de 5 a 7 semanas según el destino y el itinerario de navegación. La entrega DDP incluye despacho de aduanas y transporte terrestre hasta tu almacén. También se disponen términos FOB Qingdao y CIF para importadores con sus propias redes logísticas."
  - question: '¿Puede Agrospear formular para la protección del cultivo de cacao?'
    answer: "Sí. Agrospear fabrica formulaciones WP y SC eficaces contra la podredumbre negra del cacao (Phytophthora palmivora y P. megakarya), chinches miridos (Sahlbergella singularis) y cápsidos. Las formulaciones se diseñan para compatibilidad con los protocolos de Buenas Prácticas de COLEACP requeridos para la producción de cacao de grado de exportación en África Occidental."
  - question: '¿Cuál es la cantidad mínima de pedido para proyectos OEM africanos?'
    answer: "El MOQ se confirma por configuración del proyecto: el desarrollo de muestra cubre 1–4 toneladas, los lotes piloto corren 5 toneladas sobre plataformas existentes, y la producción de volumen estándar corre 20+ toneladas por lote. Para entradas iniciales al mercado africano, un lote piloto de 5 toneladas sobre una plataforma existente de Agrospear es el punto de partida más habitual."
body: |
  <h2>Desafíos de Protección de Cultivos en África</h2>
  <p>El paisaje agrícola de África abarca zonas de selva ecuatorial, franjas semiáridas sahelianas y climas mediterráneos en el norte — cada uno con complejos de plagas y enfermedades distintos. El gusano cogollero se ha extendido por prácticamente todas las regiones maiceras subsaharianas desde 2016, causando pérdidas de rendimiento del 20–50% donde no se trata. Las invasiones de langosta del desierto amenazan el Cuerno de África y el Sahel. El virus del mosaico de la yuca y la enfermedad del marrón de la yuca destruyen cultivos de raíz que alimentan a más de 500 millones de personas. En África Occidental, la podredumbre negra del cacao y los miridos son las principales limitaciones de un cultivo que genera más de 10.000 millones de dólares anuales en ingresos de exportación. Las plagas del algodón — barrenadores del belloto, pulgones y cigarrillas — afectan las zonas de cultivo de África Occidental y Central desde Burkina Faso hasta Zambia. Agrospear formula para estos puntos de presión exactos, con plataformas de producto validadas en calor tropical, alta humedad y almacenamiento sin cadena de frío.</p>

  <h2>Vías Regulatorias: CPMR, WAEMU/CILLS y Sistemas Nacionales</h2>
  <p>El panorama regulatorio de África está en transición hacia la armonización pero sigue fragmentado en la práctica. El marco Continental de Protección Fitosanitaria (CPMR) de la Unión Africana establece una visión de estándares unificados, pero el registro actual funciona a través de canales regionales y nacionales. En África Occidental, el sistema de registro armonizado de pesticidas WAEMU — coordinado a través de CILLS — permite que un solo expediente sirva a Benín, Burkina Faso, Côte d'Ivoire, Guinea-Bissau, Mali, Níger, Senegal y Togo. Los países de África Oriental mantienen registros nacionales individuales a través de organismos como KEPHIS (Kenia), TPRI (Tanzania) y NARL (Uganda), aunque la Comunidad de África Oriental avanza hacia el reconocimiento mutuo. Los mercados de África Austral se registran a través de autoridades nacionales individuales con coordinación a nivel de la SADC. Agrospear prepara documentación para cada vía: expedientes armonizados WAEMU/CILLS, paquetes nacionales individuales y datos compatibles con COLEACP para formulaciones de cultivos de exportación.</p>

  <h2>Plataformas de Formulación de Agrospear para la Agricultura Africana</h2>
  <p>La fábrica de 20.000 m² de Agrospear con 8 líneas de producción automatizadas y más de 50.000 toneladas de capacidad anual fabrica formulaciones probadas en condiciones de campo africanas. Las formulaciones SC de emamectina benzoato y clorantraniliprol abordan los complejos de gusano cogollero y barrenador del belloto. Las formulaciones EC de profenofos y cipermetrina sirven para el manejo de plagas del algodón y las hortalizas. Las formulaciones WP de mancozeb y metalaxil atacan la podredumbre negra del cacao y el mildiu. Las formulaciones FS de tratamiento de semilla protegen el maíz y el arroz de plagas del suelo en etapa temprana y enfermedades de plántulas. Las formulaciones WDG y ME proporcionan opciones de manejo de resistencia y actividad residual extendida bajo UV intenso y lluvia. Cada lote se somete a un control de calidad de seis etapas con pruebas de estabilidad acelerada a 54°C según CIPAC MT 46, confirmando el rendimiento tras el almacenamiento y transporte tropical.</p>

  <div class="cta-amber">¿Listo para desarrollar un producto agroquímico para el mercado africano? Contacta a Agrospear en info@agrospear.com o WhatsApp +86 13395321653 — revisión de I+D y presupuesto en un día laborable.</div>
