meta:
  title: 'Lista de Verificacion de Auditoria de Fabrica — Que Verificar Antes de Elegir un Fabricante de Agroquimicos | Agrospear'
  description: 'Lista de verificacion de auditoria de fabrica para compradores de agroquimicos: calidad, capacidad, trazabilidad, pruebas de estabilidad, cumplimiento y documentacion.'
  dateModified: '2026-08-21'
  keywords:
    - 'lista de verificacion auditoria fabrica agroquimica'
    - 'auditoria fabricante proteccion de cultivos'
    - 'verificacion fabrica agroquimica'
    - 'inspeccion fabrica OEM'
    - 'auditoria calidad agroquimica'
    - 'debida diligencia fabricante agroquimico'
    - 'auditoria produccion agroquimica'

hero:
  tagline: 'Debida Diligencia'
  title: 'Lista de Verificacion de Auditoria de Fabrica'
  subtitle: 'Antes de comprometerse con un fabricante de agroquimicos, verifique los fundamentos. Esta lista cubre las ocho areas que un comprador profesional debe auditar — desde gestion de calidad y capacidad de produccion hasta trazabilidad de materiales y cumplimiento social. Cada elemento de esta lista es algo que podemos demostrar con registros, no solo con afirmaciones.'

answer:
  label: 'Respuesta rapida'
  text: 'Las ocho areas de auditoria mas importantes: (1) Sistema de gestion de calidad — certificacion ISO 9001 y registros reales de inspeccion puerta por puerta, no solo un certificado en la pared. (2) Capacidad de produccion — numeros reales de produccion, no nominales. (3) Trazabilidad de materiales — inspeccion de entrada por lote e informes de prueba. (4) Pruebas de estabilidad y especificaciones — protocolos documentados de prueba de estabilidad. (5) Controles de formulacion y llenado — parametros de mezclado y verificacion de especificaciones. (6) Cumplimiento social — auditoria BSCI o equivalente. (7) Documentacion y trazabilidad — registros por lote, registros de inspeccion, certificados de analisis. (8) Soporte post-entrega — proceso de garantia, soporte regulatorio, capacidad de respuesta en comunicacion.'
  verified: '2026-08'

audit_areas:
  tagline: Ocho Areas de Auditoria
  title: 'Que Verificar — Las Ocho Areas de Auditoria'
  subtitle: 'Cada area incluye las preguntas a hacer, los registros a solicitar y las senales de alerta a observar.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: Q
      icon_bg: blue
      title: '1. Sistema de Gestion de Calidad'
      desc: 'Solicite: Certificado ISO 9001 (organismo acreditado, vigente), programa de auditorias internas, registro CAPA (accion correctiva y preventiva), procedimientos de puertas de inspeccion. Senal de alerta: Solo certificado, sin registros de inspeccion a nivel de puerta ni proceso CAPA.'
    - icon: C
      icon_bg: green
      title: '2. Capacidad de Produccion'
      desc: 'Solicite: Cifras de produccion mensual por tipo de formulacion, programa de produccion mostrando utilizacion actual, capacidad de mezcladores, molinos y lineas de llenado. Senal de alerta: Solo capacidad nominal, sin datos de utilizacion ni programa de produccion.'
    - icon: M
      icon_bg: purple
      title: '3. Trazabilidad de Materiales'
      desc: 'Solicite: Registros de inspeccion de material entrante, certificados de proveedores de ingredientes activos y coadyuvantes, trazabilidad por lote desde materia prima hasta producto terminado, declaraciones de sustancias REACH. Senal de alerta: Sin trazabilidad a nivel de lote, certificados de material no disponibles.'
    - icon: P
      icon_bg: orange
      title: '4. Pruebas de Estabilidad y Especificaciones'
      desc: 'Solicite: Protocolo de prueba de estabilidad (54 C, duracion, criterios de aprobacion/rechazo), registros de prueba de lotes recientes, registros de pruebas de especificaciones (contenido activo, suspensibilidad, pH, viscosidad). Senal de alerta: "Solo inspeccion visual" o sin protocolo de prueba documentado con criterios cuantitativos.'
    - icon: F
      icon_bg: blue
      title: '5. Controles de Formulacion y Llenado'
      desc: 'Solicite: Registros de parametros de mezclado (temperatura, velocidad, tiempo de molienda), criterios de verificacion de especificaciones y tasas de rechazo, documentacion de secuencia de llenado. Senal de alerta: Sin registros de parametros de mezclado, alta tasa de rechazo sin CAPA.'
    - icon: S
      icon_bg: green
      title: '6. Cumplimiento Social'
      desc: 'Solicite: Informe de auditoria BSCI o SMETA (vigente, alcance completo), registros de horarios y salarios, informes de inspeccion de salud y seguridad, documentacion de cumplimiento ambiental. Senal de alerta: Sin auditoria social de terceros, o auditoria con no conformidades mayores sin resolver.'
    - icon: D
      icon_bg: purple
      title: '7. Documentacion y Trazabilidad'
      desc: 'Solicite: Registros de produccion por lote, registros de inspeccion por puerta, certificados de analisis, listas de empaque con referencias de lote, sistema de seguimiento de reclamaciones de garantia. Senal de alerta: Sin documentacion a nivel de lote, reclamaciones de garantia no rastreadas ni analizadas.'
    - icon: A
      icon_bg: orange
      title: '8. Soporte Post-Entrega'
      desc: 'Solicite: Terminos de garantia y proceso de reclamacion, tiempo promedio de resolucion de reclamaciones, disponibilidad de soporte regulatorio, compromiso de tiempo de respuesta en comunicacion, proceso de revision post-entrega. Senal de alerta: Sin proceso de garantia documentado, comunicacion lenta o inconsistente despues de la entrega.'

our_position:
  heading: 'Nuestra Posicion en Cada Area de Auditoria'
  body: |
    No solo afirmamos cumplimiento — proporcionamos los registros. Aqui esta nuestra posicion en cada una de las ocho areas de auditoria:

    - **Gestion de calidad**: Certificados ISO 9001:2015, auditados anualmente por un tercero acreditado. Sistema de inspeccion de 7 puertas con criterios documentados de aprobacion/rechazo en cada puerta. Registro CAPA mantenido y revisado trimestralmente.
    - **Capacidad de produccion**: Mas de 20.000 toneladas de capacidad anual, mas de 2.000 de produccion mensual. Programa de produccion disponible para revision durante la visita de fabrica. 4 lineas de produccion, 6 mezcladores de alto corte, 8 molinos de arena.
    - **Trazabilidad de materiales**: Trazabilidad a nivel de lote desde material entrante hasta producto terminado. Certificados de proveedores de ingredientes activos y coadyuvantes en archivo. Declaraciones de sustancias REACH disponibles por lote.
    - **Pruebas de estabilidad**: Prueba de estabilidad a 54 C durante 14 dias con rechazo automatico por desviacion de contenido activo superior al ±2%. Registros de prueba disponibles para cada lote de produccion. Pruebas de especificaciones y estabilidad fisica segun tipo de formulacion.
    - **Controles de formulacion**: Parametros de mezclado registrados por cada tirada de produccion. Verificacion de especificaciones en puerta 3 con tasas de rechazo documentadas. CAPA iniciada para tasas de rechazo por encima del umbral.
    - **Cumplimiento social**: Auditado por BSCI. Registros de horarios, salarios y seguridad disponibles para inspeccion durante la visita de fabrica.
    - **Documentacion**: Registros de produccion por lote, registros de inspeccion por puerta, certificados de analisis y listas de empaque con referencias de lote enviados con cada pedido. Sistema de seguimiento de reclamaciones de garantia mantenido.
    - **Soporte post-entrega**: Terminos de garantia documentados por contrato. Resolucion promedio de reclamaciones en menos de 14 dias habiles. Soporte regulatorio disponible. Revision post-entrega ofrecida para cada primer pedido.

evidence_review:
  tagline: 'Evidencia y Verificacion'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricacion y calidad en esta pagina son verificadas por nuestro equipo de ingenieria de fabricacion en la fabrica de Laixi, Qingdao. Certificados, registros de inspeccion de CC, informes de pruebas de estabilidad y especificaciones, y registros de trazabilidad por lote estan disponibles bajo solicitud. Especificaciones verificadas por ultima vez 2026-08.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'Auditoria de Fabrica — Preguntas Frecuentes'
  items:
    - q: 'Puedo visitar la fabrica para una auditoria en sitio?'
      a: 'Si. Recibimos visitas de fabrica y podemos organizar una auditoria estructurada que cubra las ocho areas. Una visita tipica incluye recorrido por la planta de produccion, observacion de puertas de CC, inspeccion de almacen de materiales, revision documental y preguntas y respuestas con el gerente de calidad. Reserve un dia completo. Contactenos para programar.'
    - q: 'Proporcionan documentacion de auditoria antes de una visita?'
      a: 'Si. Podemos compartir el certificado ISO 9001, informe BSCI, resumen de capacidad de produccion, protocolo de prueba de estabilidad y registros de inspeccion de muestra antes de su visita — para que pueda preparar preguntas especificas. Los registros completos de lotes estan disponibles en sitio durante la visita.'
    - q: 'Que inspecciones de terceros utilizan?'
      a: 'Trabajamos con SGS, Intertek y TUV para inspecciones y certificaciones de terceros. La inspeccion de pre-embarque por terceros esta disponible bajo solicitud para cualquier pedido. El alcance y costos de inspeccion se confirman durante la fase de cotizacion.'
    - q: 'Como se que su sistema de calidad realmente se aplica, no solo esta documentado?'
      a: 'Cada lote pasa 7 puertas de inspeccion con criterios cuantitativos de aprobacion/rechazo — no listas de verificacion visuales. Datos de pruebas de estabilidad, parametros de mezclado y tasas de rechazo se registran por lote y estan disponibles para su revision. CAPA se activa automaticamente para resultados fuera de especificacion. Le recomendamos auditar el proceso en vivo durante una visita de fabrica.'

