hero:
  tagline: 'Fabricación · Formulación'
  title: 'Proceso de Formulación de Pesticidas'
  subtitle: 'Nuestro proceso de formulación integral transforma ingredientes activos en productos terminados con tu marca — desde el mezclado y la molienda hasta el llenado y la liberación de calidad.'

answer:
  label: 'Respuesta directa'
  text: 'Nuestro proceso de formulación cubre cada etapa desde el ingrediente activo hasta el producto terminado: mezclado (mezcla de IA con coformulantes), molienda (reducción de tamaño de partícula para SC/WP/WDG), llenado (líneas automatizadas de líquido y polvo), etiquetado (tu marca en cada envase) y liberación de calidad (QC por lote antes del envío). Seis líneas de producción manejan formas dosage SC, EC, WP, WDG, SL, ME, CS y FS.'
  verified: '2026-08'

intro:
  - El camino desde el ingrediente activo hasta un producto agroquímico terminado con marca implica ingeniería de formulación precisa en cada etapa. Cada paso — mezclado, molienda, llenado, etiquetado y liberación de calidad — está controlado y documentado para asegurar consistencia lote a lote.
  - Nuestras seis líneas de producción están configuradas para todas las formas dosage agroquímicas principales: concentrados en suspensión (SC), concentrados emulsionables (EC), polvos mojables (WP), gránulos dispersables en agua (WDG), líquidos solubles (SL), microemulsiones (ME), suspensiones encapsuladas (CS) y concentrados fluidos para tratamiento de semillas (FS).

