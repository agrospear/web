faqs:
  tagline: FAQ
  title: 'Proceso de formulación — Preguntas frecuentes'
  items:
    - q: '¿Qué formas dosage podéis producir?'
      a: 'Concentrado en suspensión (SC), concentrado emulsionable (EC), polvo mojable (WP), gránulo dispersable en agua (WDG), líquido soluble (SL), microemulsión (ME), suspensión encapsulada (CS) y concentrado fluido para tratamiento de semillas (FS). Seis líneas de producción dedicadas cubren todas las formas dosage principales.'
    - q: '¿Cómo se controla el tamaño de partícula en formulaciones SC?'
      a: 'Molienda con molino de perlas con múltiples pasadas para lograr D90 < 5 μm. Monitoreo de tamaño de partícula en proceso durante la molienda, con análisis final por difracción láser antes del llenado.'
    - q: '¿Qué controles de calidad se realizan durante la producción?'
      a: 'Monitoreo en proceso incluye verificación de peso, registro de temperatura, control de tiempo de mezcla, medición de tamaño de partícula, comprobación de viscosidad y pH, y verificación de peso de llenado. Cada comprobación se registra en el registro de producción del lote.'
    - q: '¿Cuánto tarda una producción?'
      a: 'La producción en 25–35 días tras PO y depósito confirmados para formulaciones existentes. Las formulaciones nuevas que requieren desarrollo añaden 35–55 días para análisis de laboratorio, producción piloto y pruebas de estabilidad.'

