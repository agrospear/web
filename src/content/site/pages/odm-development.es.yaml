customization:
  tagline: Diseñado contigo
  title: Qué desarrollamos alrededor de tu brief
  subtitle: 'ODM significa que la formulación se diseña para ti desde cero o desde nuestra biblioteca de formulaciones — estas son las palancas que controla tu brief:'
  items:
    - 'Perfil de cultivo y plaga objetivo — posicionamiento herbicida, insecticida, fungicida, PGR o tratamiento de semillas'
    - 'Dimensiones de la formulación — concentración de ingrediente activo, tipo de formulación y dosis ajustados al cultivo y al caso de uso objetivo'
    - 'Carácter de eficacia — modo de acción sistémico, de contacto, translaminar o pre-emergencia ajustado para tu mercado'
    - 'Estructura de la formulación — sistema de dispersión, calidad de materia prima, paquete de coadyuvantes y requisitos de estabilidad'
    - 'Etiquetas y colores — colores de marca, arte de etiqueta y branding de tambores desarrollados en casa'
    - 'Cumplimiento regulatorio — soporte de registro ICAMA, especificaciones FAO/OMS y documentación por mercado'
    - 'Paquete de accesorios — tamaño de tambor, tipo de cierre y configuración de paleta acordes a la formulación'
    - 'Embalaje y presentación comercial — cajas retail, embalaje a granel y embalaje de exportación bajo tu marca'

faq_section:
  tagline: FAQ
  title: Preguntas sobre desarrollo ODM
  questions:
    - q: '¿En qué se diferencia ODM de OEM?'
      a: 'ODM (fabricación con diseño original) parte de tu brief o simplemente de una idea — nuestro equipo de I+D diseña la formulación, el sistema de dispersión, el etiquetado y el embalaje, y luego muestrea y produce. OEM (fabricación con equipo original) construye desde tu propia formulación o especificación tal cual. Ambas rutas pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación; ODM es la vía más rápida hacia un producto con tu marca cuando todavía no tienes una formulación.'
    - q: 'Solo tengo una idea aproximada — ¿por dónde empezamos?'
      a: 'Envía un brief corto: cultivo objetivo, perfil de plagas, concentración aproximada, mercados y volúmenes. Nuestro equipo de I+D vuelve con un concepto de formulación, una dirección de productos de referencia y un plan de desarrollo en un día laborable — se firma un NDA antes de cualquier intercambio detallado cuando lo pidas.'
    - q: '¿Cuánto tarda el desarrollo de una formulación agroquímica nueva?'
      a: 'Las muestras de prototipo salen en 7–12 días. Una formulación nueva con desarrollo a medida añade 15–20 días de I+D antes de las muestras. La producción corre en 25–35 días tras el pedido y el depósito.'
    - q: '¿Cuál es el MOQ de una formulación ODM?'
      a: 'La producción de volumen estándar corre de 20+ toneladas por lote; los pilotos parten de 5 toneladas sobre plataformas existentes. El co-branding de lotes pequeños parte de 1–4 toneladas — consulta nuestra Guía de MOQ y branding flexible para el cálculo completo.'
    - q: '¿Quién es el dueño de la formulación y los datos de desarrollo?'
      a: 'Tu brief, tu formulación y tus datos de desarrollo están protegidos por NDA, términos de licencia de marca y cláusulas de propiedad o licencia de la formulación escritas en el contrato. Los registros de formulación se conservan para tu marca y están disponibles para reordenes.'
    - q: '¿Podéis desarrollar un tipo de formulación específico (SC, EC, WDG, FS)?'
      a: 'Sí. La ingeniería de formulaciones cubre todas las categorías agroquímicas principales — herbicidas, insecticidas, fungicidas, PGR y tratamientos de semillas — en todos los tipos de formulación estándar (SC, EC, WP, WDG, SL, ME, CS, FS), con validación en cámara de estabilidad disponible para todas las formulaciones.'
    - q: '¿Qué certificaciones llevará la formulación desarrollada?'
      a: 'ISO 9001, ISO 14001, BSCI e ICAMA. La documentación de certificación se prepara por pedido para tus mercados de exportación, y la conformidad con especificaciones FAO/OMS aplica cuando se requiere.'

process:
  title: 'El proceso ODM — Del brief a la producción escalada'
  subtitle: 'Seis fases controladas dirigidas por el mismo equipo interno que diseña, muestrea y escala tu formulación — todo queda documentado.'
  steps:
    - phase: '01'
      title: Brief y concepto
      period: 1 día laborable
      items:
        - 'Comparte cultivos objetivo, perfiles de plagas, concentraciones, mercados y volúmenes — o solo una idea.'
        - 'Nuestro equipo de I+D devuelve una dirección de concepto, opciones de plataforma y un plan de desarrollo.'
    - phase: '02'
      title: Diseño de formulación y estructura
      period: Semana 1–2
      items:
        - 'Tipo de formulación, concentración, sistema de dispersión y estructura de materias primas diseñados en casa.'
        - 'Etiquetas, diseño regulatorio y concepto de embalaje desarrollados alrededor de tu marca.'
    - phase: '03'
      title: Desarrollo de formulación
      period: +15–20 días (formulaciones nuevas)
      items:
        - 'I+D de formulación a medida diseñada y probada en casa para nuevos productos; las plataformas existentes omiten esta fase.'
        - 'Los términos de propiedad de la formulación se fijan en el contrato antes de empezar el desarrollo.'
    - phase: '04'
      title: Prototipo y muestra
      period: 7–12 días
      items:
        - 'Se produce un lote prototipo, se prueba y se envía para tu revisión — datos de composición y eficacia incluidos.'
        - 'La muestra (1–4 toneladas) valida formulación, estabilidad y branding antes del volumen.'
    - phase: '05'
      title: Validación y aprobación
      period: En paralelo
      items:
        - 'Controles de estabilidad, análisis de contenido, propiedades físicas y estabilidad en estante por línea de producción.'
        - 'Documentación ISO 9001, ISO 14001, BSCI e ICAMA preparada para tus mercados de exportación.'
        - 'Apruebas el prototipo; el pedido y el depósito bloquean el cupo de producción.'
    - phase: '06'
      title: Producción y entrega
      period: 25–35 días
      items:
        - 'Los lotes de volumen estándar corren de 20+ toneladas; los pilotos desde 5 toneladas.'
        - 'Embalaje de exportación, envío FOB/CIF/DDP a más de 50 países y soporte de reordenes incluidos.'

