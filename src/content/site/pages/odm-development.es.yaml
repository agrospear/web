hero:
  tagline: Desarrollo ODM
  title: 'Desarrollo ODM Agroquímico — De tu idea a una formulación lista para el mercado'
  subtitle: '¿Aún no tienes especificación de formulación? Nuestro equipo de I+D diseña la formulación, el sistema de dispersión, el etiquetado y el embalaje alrededor de tu brief — y luego produce, prueba y fabrica en serie. Prototipos en 7–12 días, producción en 25–35 días tras confirmar el pedido.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo ODM parte de tu brief, no de tu especificación: el diseño de la formulación (ingrediente activo, concentración, tipo de formulación, coadyuvantes), el sistema de dispersión y el etiquetado se ingenian en casa, se validan con muestras de prototipo en 7–12 días y se producen con un MOQ de volumen estándar de 20+ toneladas por lote (pilotos desde 5 toneladas). La producción corre en 25–35 días tras confirmar el pedido y el depósito; el desarrollo de formulación a medida añade 15–20 días. Con cada pedido se envía documentación ISO 9001, ISO 14001, BSCI e ICAMA.'
  verified: '2026-08'

