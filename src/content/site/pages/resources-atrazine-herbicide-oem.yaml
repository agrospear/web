  title: 'Atrazine Herbicide OEM Manufacturing: Specifications and Market Access'

answer:
  label: 'Straight answer'
  text: 'Atrazine OEM manufacturing covers SC 500 g/L, WP 80% and WDG 90% formulations, with SC 500 being the dominant format for pre-emergence weed control in corn and sugarcane. While banned in the EU since 2004, atrazine remains registered and widely used across the Americas, Africa and parts of Asia. CIPAC method 153 validates active ingredient content, with chlorotriazine impurity limits strictly monitored per FAO/WHO specifications.'
  verified: '2026-08'

intro:
  - 'Atrazine is the most widely used herbicide in global corn production, applied pre-emergence or early post-emergence at 1-3 kg ai/ha for broadleaf and grass weed control. The SC 500 formulation offers superior spray uniformity and tank-mix compatibility compared to WP alternatives, while WDG 90 reduces shipping cost per kilogram of active ingredient for export markets. Key markets include Brazil (largest consumer), the United States, Mexico, Argentina, China, India and across sub-Saharan Africa.'
  - 'Agrospear manufactures atrazine SC 500 and WDG 90 with full ICAMA registration and CIPAC 153 analytical validation. Each batch undergoes impurity profiling for chlorotriazine metabolites (desethylatrazine, deisopropylatrazine) to meet the strictest market specifications. OEM clients receive complete registration data packages with five-batch analysis, toxicity dossiers and environmental fate data for independent registration in target markets across the Americas and Africa.'

