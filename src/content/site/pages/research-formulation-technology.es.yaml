  text: 'El sistema de dispersión es una formulación cuyos coformulantes mantienen el ingrediente activo en suspensión, emulsión o solución a una concentración definida, de modo que la agitación previa a la aplicación garantiza la uniformidad del producto. Formulaciones Agrospear: grado técnico certificado, dispersantes y humectantes optimizados, validados mediante prueba de estabilidad de 14 días a 54 °C según CIPAC MT 46.1.'
