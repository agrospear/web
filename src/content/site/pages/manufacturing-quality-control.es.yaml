hero:
  tagline: 'Fabricación · Calidad'
  title: 'Control de Calidad y Ensayos'
  subtitle: 'Nuestro marco de control de calidad de 7 etapas asegura que cada lote cumple la especificación — análisis del 100% de lotes, pruebas de estabilidad CIPAC y trazabilidad documentada controlada.'

answer:
  label: 'Respuesta directa'
  text: 'Nuestro sistema de control de calidad opera un marco de inspección de 7 etapas: verificación de materia prima, monitorización en proceso, ensayo de contenido activo, pruebas de propiedades físicas, inspección pre-embarque, documentación por lote y liberación controlada. Análisis del 100% de lotes con estabilidad CIPAC y pruebas de especificación. No conformidad = cuarentena y disposición. Inspección de terceros (SGS, TÜV, BV, Intertek) disponible a petición.'
  verified: '2026-08'

intro:
  - La calidad no es una ocurrencia tardía en Agrospear — está integrada en cada etapa de producción. Nuestro marco de inspección de 7 etapas asegura que cada lote cumple la especificación antes de salir de fábrica, con trazabilidad completa desde la materia prima hasta el producto terminado.
  - Operamos análisis del 100% de lotes con pruebas de estabilidad CIPAC, gestión documentada controlada y retenciones de calidad obligatorias. Los productos no conformes se ponen en cuarentena, se investigan y se disponen — nunca se envían.

