faqs:
  tagline: FAQ
  title: 'Control de calidad — Preguntas frecuentes'
  items:
    - q: '¿Qué cubre el marco de QC de 7 etapas?'
      a: 'Verificación de materia prima (pureza e identidad), monitorización en proceso (peso, temperatura, tiempo de mezcla), ensayo de contenido activo (HPLC/GC), pruebas de propiedades físicas (suspensibilidad, pH, viscosidad), inspección pre-embarque (visual, etiquetado, embalaje), documentación por lote (CoA, CoO, informe de estabilidad) y liberación controlada (aprobación de QA antes del envío).'
    - q: '¿Se prueba realmente cada lote?'
      a: 'Sí — el 100% de los lotes de producción se someten a análisis de contenido activo, pruebas de propiedades físicas y pruebas de estabilidad acelerada a 54 °C/14 días. Ningún lote se envía sin un certificado de análisis completado firmado por el Director de QA.'
    - q: '¿Qué ocurre cuando un lote no supera el QC?'
      a: 'Los lotes no conformes se ponen en cuarentena inmediatamente. El equipo de QC investiga la causa raíz, documenta los hallazgos y determina la disposición: retrabajo (bajo procedimiento controlado y con reinspección) o rechazo. Los lotes retrabajados se reanalizan completamente — nunca parcialmente.'
    - q: '¿Puedo solicitar inspección de terceros?'
      a: 'Sí. Apoyamos inspecciones pre-embarque, durante la producción y de carga de contenedor por SGS, TÜV, BV o Intertek. Los calendarios de inspección pueden escribirse en el contrato y proporcionamos acceso completo a los registros de producción, datos de QC y documentación por lote para el inspector.'

