faqs:
  tagline: FAQ
  title: 'Adjuvant Formulations — Frequently Asked Questions'
  items:
    - q: 'What adjuvant types do you formulate?'
      a: 'Non-ionic surfactants (NIS), organosilicone super-spreaders, crop oil concentrates (COC), methylated seed oils (MSO), drift control agents, deposition aids, rain-fastness agents and pH buffers. Custom blends for specific crop-spray combinations.'
    - q: 'Can adjuvants be co-branded with my pesticide line?'
      a: 'Yes. Many brands package adjuvants as tank-mix partners alongside their pesticide formulations. We can match label design and packaging across your product line for a unified brand presentation.'
    - q: 'What is the MOQ for adjuvant formulations?'
      a: 'Pilot batches from 5 tons; standard volume from 20+ tons per SKU. Adjuvant formulations typically have simpler registration requirements, enabling faster market entry.'
    - q: 'Can you formulate tank-mix compatibility across my whole spray program?'
      a: 'Yes. We run tank-mix compatibility screening against the herbicides, insecticides, fungicides and fertilizers in your program, testing for physical compatibility, pH shift, foaming, and sedimentation. We then adjust the surfactant or buffer system so your program can be applied as a single pass.'
    - q: 'What does "spreading, wetting and retention" mean for adjuvant performance?'
      a: 'Spreading is how far a drop flattens over leaf surface, wetting is how well it displaces waxy leaf films, and retention is how much spray stays on the leaf versus running off. We test all three (contact angle, dynamic surface tension and retention index) and tune the surfactant blend to your crop type and spray equipment.'
    - q: 'Do you provide rain-fastness and anti-drift adjuvants?'
      a: 'Yes. Our rain-fastness agents form a flexible film that protects the deposit through rain events, and our drift control agents increase droplet size and reduce fine particles for aerial and ground application. Both can be blended into a single custom product.'
    - q: 'How do you control quality on every adjuvant batch?'
      a: 'Every batch is released against its approved reference standard with HLB value, active content, surface tension, pH, viscosity and emulsion stability checks. We provide a certificate of analysis with each shipment and keep ERP-linked batch traceability for full recall readiness.'
    - q: 'What are the registration requirements for adjuvants vs. active pesticides?'
      a: 'In most markets adjuvants face simplified registration compared with active pesticide products, which shortens time to market. Our team prepares the required technical and safety documentation (SDS, COA, GHS labelling) for your destination market.'
    - q: 'Can adjuvants be made pesticide-compatible for organic or low-input programs?'
      a: 'Yes. We can formulate crop oil concentrates and wetting agents compatible with organic or reduced-input programs, and we validate your material against the relevant certification lists before formulation.'
    - q: 'What is the typical shelf life of an adjuvant formulation?'
      a: 'Most of our adjuvant formulations carry a 2–3 year shelf life at recommended storage conditions. We run accelerated and long-term stability testing per FAO/WHO guidelines and confirm stability before release.'

