intro: |
  <p><strong>Agrospear</strong> es la división de fabricación agroquímica de <strong>Qingdao Vatrad Group Co., Ltd.</strong>, con sede en la Zona de Desarrollo Económico de Laixi, Qingdao, Shandong (China). Fundada en 2012, la empresa empezó como un taller especializado de formulación dedicado a la ciencia de protección de cultivos, y se ha convertido en una fábrica certificada que da servicio a clientes OEM y ODM en más de 50 países.</p>
  <p>Agrospear es la división B2B de desarrollo personalizado de la fábrica de Agrospear. Cada proyecto de Agrospear — desde una primera muestra o una tirada pequeña de co-branding hasta una línea de producto completa de marca privada — se fabrica en las mismas instalaciones, con los mismos equipos y bajo el mismo sistema de calidad que se describe aquí.</p>
  <p>La fábrica ocupa 12,500 m² con talleres dedicados a la inspección de materias primas, preparación de sistemas de dispersión, mezcla y molienda, llenado de formulaciones y una zona de pruebas para los ensayos de estabilidad, análisis de contenido y propiedades físicas. La capacidad de producción supera las 20,000 toneladas al año, y las instalaciones operan bajo un sistema de gestión de calidad ISO 9001 e ISO 14001 con cumplimiento BSCI e ICAMA para los productos exportados.</p>
  <p>Más de 350 trabajadores cualificados y más de 14 ingenieros de I+D respaldan las dos líneas de trabajo que importan a las marcas agroquímicas: la ingeniería (diseño de formulación, selección de co-formulantes, creación de prototipos) y la producción (etiquetado, llenado, inspección, embalaje de exportación). Un centro de I+D interno con laboratorio de formulación y cámara de estabilidad se ocupa de las formulaciones personalizadas y el soporte de registro antes de empezar la producción en masa.</p>
