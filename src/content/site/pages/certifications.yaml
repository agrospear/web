traceability:
  tagline: Batch-Level Traceability
  title: 'Four Questions Every Batch Answers'
  subtitle: 'Quality records are maintained by production batch and linked to the applicable product specification, label, BOM and packing requirements. This supports investigation and controlled action if a quality issue is identified. During a buyer audit, our quality team answers these four questions on the floor — each answer points to a controlled record.'
  items:
    - title: 'What was produced?'
      description: 'Product, formulation, concentration and revision are tied to the order number and the approved specification revision.'
      icon: '1'
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'View traceability dossier (PDF)'
    - title: 'Which materials went in?'
      description: 'Every material lot feeding the batch is logged with its supplier, certificate and IQC disposition.'
