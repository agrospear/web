  description: 'How every custom agrochemical order is controlled: 7 inspection gates from pre-production planning to shipment release, with downloadable bilingual reports.'
  dateModified: '2026-08-15'
  keywords:
    - 'agrochemical quality control'
    - 'pesticide factory inspection'
    - 'oem quality inspection plan'
    - 'pre shipment inspection agrochemical'
    - 'icama registration quality'
    - 'iso 9001 agrochemical'
hero:
  tagline: Quality Control for Custom Projects
  title: 'Quality Control for Custom Agrochemical OEM Projects'
  subtitle: 'Quality is verified against the approved sample, technical specification, artwork, bill of materials and packaging requirements for each project — not against a general claim. From incoming raw materials to shipment release, our inspection process is structured to verify product conformity at defined production stages. Powered by QINGDAO VATRAD GROUP, the 20,000 m² agrochemical factory behind agrospear.'
stats:
  - value: 100%
    label: Batches analyzed
  - value: '7'
    label: Controlled inspection gates
  - value: FAO/WHO
    label: Specification standards
  - value: ISO 9001
    label: Quality certified
quality_basis:
  tagline: Quality Basis
  title: 'What Defines Product Acceptance'
  subtitle: 'Final acceptance criteria are established before production release. These controlled project documents define what is to be made, how key details are verified and what must be checked before shipment — approved with the buyer and frozen in the Quality Inspection Plan (QIP). Any change request goes through documented change control, never silently through the line.'
  items:
    - title: 'Approved Sample'
      description: 'The physical reference batch signed off by the buyer. Every finished product is compared against it for active ingredient content, physical properties and appearance.'
      icon: tabler:medal
    - title: 'Technical Specification'
      description: 'Active ingredient, formulation type, concentration and physical-chemical parameters locked to a revision number. The FAI verifies the first article against this exact revision.'
      icon: tabler:file-check
    - title: 'Approved Artwork'
      description: 'Label design, print colors and placement approved and version-locked before production, so every container ships in the look the brand approved.'
      icon: tabler:palette
    - title: 'Customer Approved BOM'
      description: 'Bill of materials — formulation components, packaging, labels, CoA templates — confirmed by the buyer. The PSI checks 100% kit completeness against this BOM.'
      icon: tabler:list-checks
    - title: 'Packaging & Labeling Requirements'
      description: 'Drum/bottle specifications, markings, barcodes, label content and shipping marks fixed in writing. Barcode readability and marking accuracy are verified at PSI.'
      icon: tabler:package
tests:
  - title: Active Ingredient Analysis
    description: Every production batch undergoes active ingredient quantification using validated HPLC or GC methods. Results are compared against the declared content with ±5% tolerance per FAO/WHO specifications, ensuring potency and efficacy.
    image: https://assets.agrospear.com/site/factory/agrospear-pressure-testing.webp
    alt: Active ingredient analysis using HPLC for agrochemical batch verification
  - title: Physical Property Testing
    description: 'Formulation-specific physical tests are performed per FAO/WHO guidelines: suspension stability (SC), emulsion stability (EC), wettability and dispersibility (WDG/WP), pourability and persistent foam. These verify the product will perform reliably in the field.'
    image: https://assets.agrospear.com/site/factory/agrospear-production-department.webp
    alt: Physical property testing of agrochemical formulations per FAO/WHO standards
  - title: Accelerated Stability Testing
    description: Batches are subjected to 54 °C accelerated storage for 14 days per FAO/WHO CIPAC methods. Active ingredient content and physical properties are verified before and after, confirming shelf life and formulation integrity.
    image: https://assets.agrospear.com/site/factory/agrospear-uv-resistance-testing.webp
    alt: Accelerated stability testing chamber for agrochemical formulations at 54°C
  - title: Impurity & By-Product Screening
    description: Technical-grade active ingredients and finished formulations are screened for relevant impurities and degradation products per FAO/WHO specifications, ensuring product safety and regulatory compliance.
    image: https://assets.agrospear.com/site/factory/agrospear-pvc-material-testing.webp
    alt: Impurity screening analysis for agrochemical technical and formulation products
  - title: Low-Temperature Stability Testing
    description: Liquid formulations (SC, EC, SL, ME) are stored at 0 °C for 7 days per CIPAC methods to verify no crystallization, phase separation or sedimentation occurs, ensuring product integrity in cold-climate storage and transport.
    image: https://assets.agrospear.com/site/factory/agrospear-factory-exterior.webp
    alt: Low-temperature stability test chamber for liquid agrochemical formulations
  - title: pH & Density Verification
    description: pH and density are measured per CIPAC methods for every batch. These parameters serve as critical quality indicators and must fall within the specified range for the formulation type.
    image: https://assets.agrospear.com/images/agrochemical/factory/agrospear-factory-exterior.webp
    alt: pH and density verification for agrochemical formulation quality control
  - title: Water Dispersibility & Suspensibility
    description: WDG and WP formulations are tested for wettability, dispersibility and suspensibility per CIPAC/FAO methods. These parameters determine field performance and spray uniformity, and must meet specification before release.
    image: https://assets.agrospear.com/images/agrochemical/factory/agrospear-formulation-lab.webp
    alt: Water dispersibility and suspensibility testing for WDG and WP formulations
  - title: Container Compatibility & Seal Integrity
    description: Filled drums, bottles and containers are tested for leakage, seal integrity and compatibility between the formulation and the packaging material. Every filled container passes a mandatory leak check before shipping.
    image: https://assets.agrospear.com/site/factory/agrospear-production-department-2.webp
    alt: Container compatibility and seal integrity testing for agrochemical packaging
qc_flow:
  tagline: The 7-Stage Inspection Flow
  title: 'Seven Controlled Quality Gates, End to End'
  subtitle: 'Each gate below is defined in the project Quality Inspection Plan with its inspection object, method, acceptance criteria and record output. The bilingual report dossiers are real controlled records — open any of them to see the actual structure.'
  obj_label: Inspection object
  method_label: Inspection method
  criteria_label: Acceptance criteria
  record_label: Record output
  stages:
    - stage: STAGE 01
      title: 'Project Quality Planning (PPM)'
      summary: 'The pre-production meeting locks scope, baselines and inspection plan before the line starts.'
      checks:
        - 'Product name, internal code, customer SKU, order number and batch definition are recorded.'
        - 'Active ingredient, formulation type, concentration, packaging specifications and target market regulatory requirements are specified.'
        - 'Label file name, version, colors, logo position and regulatory text are locked and approved.'
        - 'BOM — every component per batch with quantity, grade, supplier and substitution rules — is customer-approved.'
        - 'Packaging, labeling, barcodes, language of safety data sheets and third-party inspection arrangements are fixed in writing.'
      object: 'Project scope vs. customer requirements — formulation, concentration, labeling, packaging, target market and applicable standards.'
      method: 'Pre-production meeting with sales, engineering and QC; Golden Sample sign-off; Quality Inspection Plan (QIP) issued for the order.'
      criteria: 'All five baselines approved and frozen before mass production starts. Unresolved items block production release.'
      record: 'QIP + PPM minutes, approved sample records.'
      image: https://assets.agrospear.com/site/quality/node01-ppm.avif
      alt: Pre-production meeting reviewing the golden sample and quality inspection plan for an OEM agrochemical order
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Download QIP (PDF)'
    - stage: STAGE 02
      title: 'Incoming Material Inspection (IQC)'
      summary: 'Raw materials are verified against the approved supplier specification before they enter production.'
      checks:
        - 'Technical-grade active ingredients checked for identity (HPLC/GC), content, impurity profile and certificate of analysis against the approved spec.'
        - 'Co-formulants, solvents, surfactants and adjuvants checked for grade, purity, appearance and supplier COA compliance.'
        - 'Packaging materials — drums, bottles, caps, labels and cartons — verified for specification, print accuracy and compatibility.'
        - 'Supplier certificates (COA), material declarations and regulatory compliance documents reviewed per batch.'
        - 'Non-conforming lots are quarantined and returned before any material reaches the line.'
      object: 'Active ingredients, co-formulants, solvents, packaging materials and labels against the approved spec and supplier test certificates.'
      method: 'Identity and assay verification (HPLC/GC); visual and physical checks; batch sampling per AQL; material certificates reviewed; approved supplier list enforced.'
      criteria: 'Meets approved specification and certificates. Non-conforming lots are quarantined and rejected before release to the line.'
      record: 'IQC test reports with lot references and dispositions.'
      image: https://assets.agrospear.com/site/quality/node02-iqc.avif
      alt: Incoming material inspection of active ingredients and co-formulants at the factory
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Download IQC reports (PDF)'
    - stage: STAGE 03
      title: 'In-Process Control & First Article (IPQC / FAI)'
      summary: 'Formulation methods and checkpoints are selected according to the approved formulation platform and project configuration. The first article is checked against the locked baselines; every shift keeps patrol checks on the line.'
      checks:
        - 'First article verified against approved sample, technical specification, BOM, label artwork and packaging files before mass production starts.'
        - 'Active ingredient content, pH, density and formulation-specific physical properties measured; label and regulatory text confirmed.'
        - 'Mixing, milling and filling processes checked for homogeneity, particle size and fill weight compliance.'
        - 'Container filling, sealing and labeling checked for accuracy, fill level and label alignment against the customer-approved BOM.'
        - 'FAI approval version-locks artwork, formulation and BOM; deviations route to the rework decision flow — never inline patching.'
      object: 'First article and in-process batches — active ingredient content, physical properties, fill weight, label position and seal integrity.'
      method: 'First Article Inspection on the first batch; patrol checks per shift; active ingredient assay and physical property verification inline.'
      criteria: 'FAI approval version-locks artwork, formulation and BOM. Deviations route to the rework decision flow — never inline patching.'
      record: 'FAI record, shift patrol logs, rework and disposition notes.'
      image: https://assets.agrospear.com/site/quality/node03-ipqc-fai.avif
      alt: In-process inspection and first article check during agrochemical production
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Download IPQC reports (PDF)'
    - stage: STAGE 04
      title: 'Formulation Quality & Stability Testing'
      summary: 'Every completed batch undergoes full active ingredient analysis and physical property verification before packing — 100% of batches, not a sample.'
      checks:
        - 'Active ingredient content determined by validated HPLC/GC method and compared to declared content (±5% tolerance per FAO/WHO).'
        - 'Formulation-specific physical tests performed: suspension stability (SC), emulsion stability (EC), wettability/dispersibility (WDG/WP), pourability and persistent foam.'
        - 'Accelerated stability test at 54 °C for 14 days per CIPAC methods — active ingredient and physical properties verified post-storage.'
        - 'pH, density and appearance verified and recorded per batch.'
        - 'Failed batches are quarantined, investigated under NCR and either reprocessed under instruction or rejected — not just re-checked at the failing point.'
      object: '100% of production batches — active ingredient analysis, physical property testing and accelerated stability verification.'
      method: 'Active ingredient assay by HPLC/GC; physical property testing per FAO/WHO CIPAC methods; 54 °C / 14-day accelerated stability.'
      criteria: 'Active ingredient within ±5% of declared, all physical properties within specification, stability test pass. Failed batches are quarantined and reprocessed or rejected.'
      record: 'Formulation quality and stability test reports, one per batch, linked to the batch traceability.'
      image: https://assets.agrospear.com/site/quality/node04-airtightness.avif
      alt: Formulation quality and stability testing of agrochemical batch
      link: /manufacturing/qcqa-documents
      link_label: 'View QC/QA document library'
    - stage: STAGE 05
      title: 'Final Product Inspection (FQC)'
      summary: 'Finished products are verified and graded against the approved golden sample.'
      checks:
        - 'Active ingredient content confirmed by independent QC assay against specification.'
        - 'Physical appearance, color and odor compared to the approved reference sample.'
        - 'Cosmetic inspection under controlled lighting: label alignment, print quality, container integrity, cap seal.'
        - 'Functional checks: fill weight, seal integrity, label legibility, barcode scannability.'
        - 'Configuration verified against the customer-approved BOM and SKU — packaging, labels, CoA and regulatory documents.'
      object: 'Finished product vs. golden sample — active ingredient content, appearance, labeling, packaging completeness and CoA.'
      method: 'Active ingredient assay; visual and cosmetic grading under controlled lighting; fill weight and seal integrity verification; barcode scan test.'
      criteria: 'Active ingredient within tolerance, cosmetic grade per approved sample, correct labeling, all packaging present and sealed.'
      record: 'FQC reports with inspector sign-off and disposition.'
      image: https://assets.agrospear.com/site/quality/node05-fqc.avif
      alt: Final product inspection of agrochemical formulations before packing
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Download FQC reports (PDF)'
    - stage: STAGE 06
      title: 'Packaging & Pre-Shipment Inspection (PSI)'
      summary: 'The packed order is checked for completeness, marking accuracy and shipment readiness.'
      checks:
        - '100% kit completeness vs. BOM: filled containers, labels, CoA documents, safety data sheets — one set at a time.'
        - 'Container specifications verified: drum/bottle type, fill weight, seal integrity and label accuracy.'
        - 'Label graphics, brand name, active ingredient declaration, regulatory text and language versions verified against the approved revision.'
        - 'Barcode type, number, position and scannability verified; shipping marks, SKU, PO, carton number and quantity correct.'
        - 'Pallet configuration, stretch-wrapping and container loading plan match the packing specification; gross/net weight verified.'
      object: 'Packed order — containers, labels, CoA, SDS, packaging — against the customer-approved BOM and packaging spec.'
      method: '100% kit completeness vs. BOM; barcode scan (Grade ≥ B); label marking accuracy; container seal check; weight verification.'
      criteria: '100% kit match to BOM, readable barcodes, correct markings and secure packing before loading.'
      record: 'PSI checklists and packing records per shipment.'
      image: https://assets.agrospear.com/site/quality/node06-psi.avif
      alt: Pre-shipment inspection checking the packed agrochemical order against the BOM
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Download PSI reports (PDF)'
    - stage: STAGE 07
      title: 'Shipment Release & Traceability'
      summary: 'Quality signs off the batch only when all six previous gates are closed and every record is complete.'
      checks:
        - 'Production batch, order number, SKU, quantity and container count match the packing list and commercial invoice.'
        - 'Specification, BOM, label artwork and packaging files are all at the current approved revision.'
        - 'IQC, FAI, in-process, formulation quality, FQC and PSI records are complete for the batch being released.'
        - 'All non-conformances are resolved, reprocessed, re-inspected and closed — no open items on the release.'
        - 'Traceability fields recorded per batch: project code, PO, SKU, artwork/BOM/packaging revisions, production date, inspector and record numbers.'
      object: 'Release authorization for the batch — all gates closed, records complete, batch numbers mapped to the shipment.'
      method: 'Gate review of all six preceding records by quality; batch traceability dossier assembled; records handed over with the shipment.'
      criteria: 'All gates approved by QA; batch records and traceability dossier delivered to the buyer or kept under NDA on request.'
      record: 'Shipment release authorization and batch traceability dossier.'
      image: https://assets.agrospear.com/site/quality/node07-shipment-release.avif
      alt: Shipment release sign-off and batch traceability record handover
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Download release reports (PDF)'
system_map:
  tagline: The Quality System
  title: 'One System, Four Controlled Standards'
  subtitle: 'The seven gates above run on four documented standards, each published as a controlled procedure you can download and audit. Together they form the QMS behind every OEM/ODM order — inspection criteria, change control, non-conformance and laboratory testing.'
  items:
    - title: 'Inspection & Release Standards'
      description: 'The project QIP drives every gate: inspection object, method, acceptance criteria and record output per order. Includes the 4-stage QC framework, traceability chain, quarantine flow, defect matrix and the 00–15 documentation register.'
      icon: tabler:clipboard-check
      link: /manufacturing/factory/quality-inspection
      link_label: 'Inspection standards & QMS downloads'
    - title: 'Rework Change Control'
      description: 'No rework parameter changes without documented control: containment, risk classification, 9-step change loop, approval matrix and validation. Any change to approved specs, samples, BOMs or acceptance criteria requires written customer approval.'
      icon: tabler:git-branch
      link: /manufacturing/factory/quality-change-control
      link_label: 'Change control standard'
    - title: 'Non-Conforming Product Control'
      description: 'A closed 7-step loop under ISO 9001:2015 clause 8.7: identify, quarantine, disposition per NCR, rework or reject, re-inspect, release, correct. Includes severity authority, defect disposition matrix and witnessed destruction.'
      icon: tabler:alert-triangle
      link: /manufacturing/factory/non-conforming-control
      link_label: 'Non-conforming product control standard'
    - title: 'Laboratory Testing & Equipment'
      description: 'The quality lab operates independently from production: HPLC, GC, particle size analysis, pH/density meters, stability chambers and viscosity testing — with the calibration and test procedures behind our published claims.'
      icon: tabler:flask
      link: /manufacturing/factory/quality-lab
      link_label: 'Quality lab & test equipment'
    - title: 'Formulation R&D Lab'
      description: 'The R&D center runs independent formulation development, accelerated ageing studies and registration support, feeding the standards production uses.'
      icon: tabler:microscope
      link: /randdcenter/quality-inspection-lab
      link_label: 'R&D formulation lab'
