faqs:
  - question: 'Does Agrospear provide registration documentation for ASEAN markets?'
    answer: "Yes. Agrospear prepares documentation for ASEAN-member national registration systems, including the Department of Veterinary Services (DVS) in Malaysia, the Department of Agriculture (DOA) in Thailand, the Pesticide Control Division (PCD) in the Philippines, and the Plant Protection Division under MARDI. Dossiers include ICAMA data, FAO/WHO specifications, active ingredient certificates, five-batch analysis and physical-chemical property reports aligned with ASEAN Maximum Residue Limit guidelines."
  - question: 'What formulations are effective against brown planthopper on rice?'
    answer: "For brown planthopper (Nilaparvata lugens) control in rice, Agrospear recommends SC formulations of pymetrozine or dinotefuran for rapid knockdown, WDG formulations of buprofezin for nymph-stage suppression, and EC formulations of ethiprole or isoprocarb as rotation partners in resistance-management programs. FS seed treatment formulations of clothianidin provide early-season protection in direct-seeded rice systems common across Southeast Asia."
  - question: 'Can Agrospear formulate for oil palm disease management?'
    answer: "Yes. While Ganoderma basal stem rot has no curative treatment, Agrospear manufactures hexaconazole and benomyl-based SC and WP formulations for prophylactic soil drench and trunk injection programs. For oil palm insect pests — rhinoceros beetle (Oryctes rhinoceros) and bagworms — Agrospear offers EC and ME formulations of cypermethrin and chlorantraniliprole with rain-fast adjuvant systems suited to high-rainfall plantation environments."
  - question: 'How long does shipping take to Southeast Asian ports?'
    answer: "Sea freight from Qingdao to Singapore, Bangkok or Jakarta typically takes 2–3 weeks. Direct sailings to Port Klang and Laem Chabang are the fastest routes. DDP delivery includes customs clearance and inland transport. FOB Qingdao and CIF terms are also available."
  - question: 'What quality testing is done for tropical climate formulations?'
    answer: "All formulations undergo accelerated stability testing at 54°C for 14 days per CIPAC MT 46, confirming active ingredient content, physical properties and emulsion stability after simulated tropical storage. Additional thermal cycling tests between 0°C and 50°C validate cold-chain interruption scenarios. Suspensibility, pourability and persistent foam tests are conducted on every SC and WDG batch to ensure spray-tank performance under monsoon-season field conditions."
body: |
  <h2>Southeast Asia's Dominant Crop-Pest Complexes</h2>
  <p>Southeast Asia produces over 200 million tons of rice annually, and brown planthopper (Nilaparvata lugens) remains the single most destructive pest — causing hopperburn that can destroy an entire crop in days when populations surge. Rice blast (Magnaporthe oryzae) and sheath blight (Rhizoctonia solani) add chronic yield drag across Vietnam, Thailand, Indonesia and the Philippines. Oil palm, spanning over 20 million hectares in Indonesia and Malaysia alone, faces Ganoderma basal stem rot — a lethal disease with no curative treatment that progressively kills mature stands. Banana Fusarium wilt Tropical Race 4 has spread through the Mekong Delta and Mindanao, threatening Cavendish export production. Mango anthracnose (Colletotrichum gloeosporioides) limits fruit quality across Thailand and the Philippines. Agrospear's formulation platforms are built for these exact pressures, with rain-fast adjuvant systems, UV-stable active ingredients and tropical-grade packaging.</p>

  <h2>ASEAN Regulatory Alignment and National Registration</h2>
  <p>The ASEAN Sectoral Working Group on Crops has developed harmonized guidelines for pesticide registration data requirements and Maximum Residue Limits, but implementation remains at the national level. Malaysia's Department of Veterinary Services (DVS) under the Pesticides Act 1974 requires separate registration for each formulation and label claim. Thailand's DOA under the Hazardous Substances Act processes registrations through a committee review averaging 12–18 months. The Philippines' Fertilizer and Pesticide Authority processes through the PCD with a data requirement framework aligned to FAO/WHO guidelines. Vietnam's Plant Protection Department registers under Circular 21/2015/TT-BNNPTNT with specific stability data requirements for tropical formulations. Agrospear prepares registration documentation targeted to each national pathway, with ICAMA data, FAO/WHO specifications and five-batch analysis reports formatted for the specific national authority's dossier template.</p>

  <h2>Formulation Expertise for Monsoon Agriculture</h2>
  <p>Agrospear's 20,000 m² facility produces formulations engineered for Southeast Asia's wet-dry monsoon cycle. SC formulations with high suspensibility and anti-settling agents ensure uniform spray application even after storage in plantation warehouses without air conditioning. ME and CS micro-encapsulated formulations provide sustained release under intense rainfall — a critical advantage in oil palm and rubber plantation spraying during monsoon season. WDG water-dispersible granules eliminate dust exposure for rice farmers applying backpack sprayers in flooded paddies. EC formulations with optimized emulsifier packages resist wash-off for the 4–6 hour rain-fastness window that monsoon scheduling demands. Every batch is tested for suspensibility (CIPAC MT 15), emulsion stability (CIPAC MT 36), and persistent foam (CIPAC MT 47) — quality benchmarks that ensure field performance when spraying conditions are far from ideal.</p>

  <div class="cta-amber">Developing a crop protection product for Southeast Asian rice, palm or fruit markets? Contact Agrospear at info@agrospear.com or WhatsApp +86 13395321653 — R&D review and quotation within one business day.</div>
