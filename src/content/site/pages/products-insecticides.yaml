faqs:
  - question: 'What are translaminar insecticides and when are they preferred?'
    answer: 'Translaminar insecticides such as abamectin and emamectin benzoate penetrate leaf tissue and form a reservoir within the mesophyll, controlling pests that feed on the undersides of leaves where spray coverage is limited. They are preferred in crops with dense canopies — cotton, vegetables, fruit trees — where thorough contact coverage is impractical.'
  - question: 'How does Agrospear support insecticide resistance management?'
    answer: 'We follow IRAC Mode of Action classification and develop premix and rotation programs that pair AIs from different groups. For example, combining a Group 3A pyrethroid with a Group 4A neonicotinoid, or a Group 6 avermectin with a Group 1B organophosphate, reduces selection pressure and prolongs field efficacy.'
  - question: 'Can Agrospear formulate insecticides for vector control programs?'
    answer: 'Yes. We manufacture residual spray formulations (WP, SC) for indoor residual spraying (IRS) and space spray concentrates for mosquito vector management. These products meet WHO-PQ specifications where applicable and can be tailored for public health procurement programs.'
  - question: 'What formulation types are available for insecticides?'
    answer: 'We produce Suspension Concentrates (SC), Emulsifiable Concentrates (EC), Water-Dispersible Granules (WDG), and Micro-Emulsions (ME). ME formulations are particularly effective for systemic neonicotinoids, offering enhanced leaf penetration and reduced photodegradation.'
  - question: 'What is the minimum order for insecticide production?'
    answer: 'Sample orders: 1–4 t for field trials and registration. Pilot orders: 5 t for market entry. Standard production: 20+ t with volume pricing tiers at 50 t and 100 t. Typical lead time is 25–35 days.'
  - question: What is the difference between contact and systemic insecticides?
    answer: Contact insecticides act where they land, controlling pests present at application, while systemic insecticides are absorbed into the plant and control pests feeding on treated foliage or plant sap. Many programmes use a systemic base for prolonged control plus a contact partner for knockdown, and we formulate premixes that combine both chemistries.
  - question: Which active suits chewing versus sucking pests?
    answer: For chewing pests (lepidopteran larvae, beetles) we often use emamectin benzoate, lambda-cyhalothrin or spinosad-type actives; for sucking pests (aphids, whiteflies, thrips, mites) systemic neonicotinoids such as imidacloprid and thiamethoxam, or translaminar avermectins such as abamectin. We recommend based on your pest spectrum, crop and IRAC rotation plan.
  - question: What registration data do you supply for insecticides?
    answer: We provide five-batch analysis, accelerated and long-term stability, analytical methods, toxicology and residue data, and field-efficacy reports — the complete dossier to register your insecticide brand in your target markets.
  - question: What is the shelf life of your insecticide formulations?
    answer: Most SC, EC, WDG and ME insecticide formulations carry a 2-year shelf life under recommended storage, supported by accelerated stability testing (54 °C) and long-term stability data included in the technical package.
  - question: What export documentation is included?
    answer: Each shipment includes certificate of analysis, certificate of origin, MSDS/SDS, GHS-compliant labelling and, where needed, phytosanitary documentation so customs clearance is smooth in your destination market.
body: |
  <h2>Insecticide Solutions for Chewing and Sucking Pest Complexes</h2>
  <p>Insect pests inflict yield losses of 15–40 % across major row crops and horticultural systems. Agrospear's insecticide portfolio addresses both chewing pests (lepidopteran larvae, coleopteran adults and grubs) and sucking pests (aphids, whiteflies, jassids, thrips, mites) through contact, systemic, and translaminar delivery modes. Our core active ingredients include lambda-cyhalothrin (Group 3A, broad-spectrum contact), abamectin (Group 6, translaminar miticide-insecticide), chlorpyrifos (Group 1B, soil and foliar contact), imidacloprid (Group 4A, systemic seed and foliar), and emamectin benzoate (Group 6, lepidopteran-specific translaminar). Each AI is available in optimized SC, EC, WDG, or ME formulations designed for maximum bioavailability under field conditions.</p>

  <h2>IPM-Aligned Development and IRAC Resistance Management</h2>
  <p>Modern crop protection demands integration of chemical control within broader IPM frameworks. Agrospear designs insecticide programs that respect beneficial-organism windows, provide rotation options across IRAC Mode of Action groups, and minimize non-target impact. Our R&D team evaluates cross-resistance patterns — particularly among neonicotinoid-resistant whitefly populations and pyrethroid-resistant Helicoverpa spp. — and recommends premix combinations or sequential treatment schedules that preserve efficacy over multiple seasons. This systematic approach helps distribution partners maintain product performance in markets where resistance pressure is intensifying.</p>

  <h2>Formulation Technology for Challenging Environments</h2>
  <p>Subtropical and tropical cropping systems demand formulations that withstand high temperatures, intense UV exposure, and heavy rainfall. Agrospear's micro-emulsion (ME) platform encapsulates systemic AIs within nano-scale oil droplets, improving cuticular penetration and reducing photodegradation by up to 40 % compared with conventional EC products. Our SC platform achieves particle sizes below 3 µm D90, ensuring uniform spray deposition and sustained suspensibility even after extended storage at 54 °C. All products undergo two-year accelerated stability testing before commercial release.</p>

  <h2>Vector Control and Public Health Formulations</h2>
  <p>Beyond agriculture, Agrospear manufactures WHO-classified residual spray formulations for mosquito vector control programs. Our WP and SC products for indoor residual spraying (IRS) meet stringent suspensibility and bioefficacy benchmarks, and we can customize packaging for institutional procurement channels. With BSCI certification and experience supplying government tender programs, we are equipped to serve both crop-protection and public-health markets from a single quality-management system.</p>

