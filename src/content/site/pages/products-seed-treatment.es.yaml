faqs:
  tagline: FAQ
  title: 'Formulaciones de tratamiento de semillas — Preguntas frecuentes'
  items:
    - q: '¿Qué tipos de formulación de tratamiento de semillas producís?'
      a: 'El concentrado fluido para tratamiento de semillas (FS) es el tipo principal — optimizado para máquinas de slurizado y equipos de recubrimiento en película. También producimos polvos para tratamiento de semillas (DS) y polvos dispersables en agua (WS) para requisitos específicos de cultivo y equipo.'
    - q: '¿Qué ingredientes activos se usan en tratamientos de semillas?'
      a: 'Tratamientos insecticidas: imidacloprid, tiametoxam, clotianidina, fipronil. Tratamientos fungicidas: metalaxil-M, fludioxonil, sedaxano, trifloxistrobina, tebuconazol. Los tratamientos combinados (insecticida + fungicida) son nuestra categoría más solicitada.'
    - q: '¿Apoyáis a empresas de semillas con ensayos de recubrimiento?'
      a: 'Sí. Proporcionamos lotes de muestra para ensayos de recubrimiento en sus lotes de semillas y equipos, con datos de viscosidad, tiempo de secado y uniformidad de película. Disponible soporte técnico para calibración de equipos de recubrimiento.'
    - q: '¿Cuál es el MOQ para formulaciones de tratamiento de semillas?'
      a: 'Los lotes piloto parten de 5 toneladas para la validación con equipos de slurizado y recubrimiento en película. La producción estándar arranca desde 20+ toneladas por SKU, y los lotes de muestra para ensayos de recubrimiento y registro parten de 1 tonelada.'
    - q: '¿Qué tipos de tratamiento de semillas producís además de FS?'
      a: 'El FS concentrado fluido es el tipo principal para máquinas de slurizado y recubridoras de película. También producimos polvos para tratamiento de semillas (DS) y polvos dispersables en agua (WS) para requisitos específicos de cultivo y equipo, así como productos combinados de triple acción insecticida + fungicida.'
    - q: '¿Cómo se fija la dosis de activo para un cultivo objetivo?'
      a: 'La dosis se fija en gramos de activo por 100 kg de semilla (g/100 kg de semilla), ajustada al cultivo, la plaga o enfermedad objetivo y la recomendación regional. Nuestro equipo de I+D calibra la concentración para que tu equipo de recubrimiento dosifique correctamente por lote de semillas.'
    - q: '¿Es compatible la formulación FS con mi equipo de recubrimiento?'
      a: 'Sí. Ajustamos la viscosidad, densidad, comportamiento de secado y flexibilidad de película a tu modelo de slurizadora o recubridora de película. Podemos ensayar con tu equipo y proporcionar datos de calibración, ventanas de tiempo de secado y objetivos de uniformidad de color.'
    - q: '¿Podéis añadir un color o marcador de marca al recubrimiento?'
      a: 'Sí. Podemos incorporar un color de marca o un marcador/tinte de recubrimiento para que la semilla tratada sea visualmente distintiva y atribuible a tu marca. La consistencia del color entre lotes se controla como parte de nuestra liberación de calidad.'
    - q: '¿Cuál es la vida útil y el tiempo de secado de vuestros productos FS?'
      a: 'Las formulaciones FS tienen una vida útil de 2 años en condiciones de almacenamiento recomendadas. El tiempo de secado en equipos estándar de recubrimiento suele ser lo bastante corto para soportar tratamiento de alto rendimiento, y proporcionamos la ventana objetivo con tu muestra.'
    - q: '¿Qué datos de registro suministráis para tratamientos de semillas?'
      a: 'Proporcionamos análisis de cinco lotes, estabilidad acelerada y a largo plazo, métodos analíticos y datos de toxicidad y seguridad para la formulación de tratamiento de semillas, además de la documentación técnica relevante de recubrimiento y peletizado que requiere tu mercado.'

