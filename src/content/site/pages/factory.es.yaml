qc_section:
  tagline: Control de calidad
  title: Proceso de ensayo y garantía de calidad
  subtitle: Cada lote se somete a ensayos obligatorios antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción e informa directamente a la dirección.
  steps:
    - step: '1'
      title: Inspección de materias primas
      desc: Los ingredientes activos de grado técnico, solventes y coadyuvantes se someten a análisis de pureza por HPLC/GC, perfilado de impurezas y verificación de propiedades físicas antes de que cualquier lote entre en producción.
    - step: '2'
      title: Ensayo de estabilidad de 14 días a 54 °C
      desc: Cada lote de producción se mantiene a 54 °C durante 14 días según CIPAC MT 46. Una desviación del contenido activo superior al ±2% o inestabilidad física provoca el rechazo automático y la reinspección de especificaciones.
    - step: '3'
      title: Verificación de contenido activo y especificaciones
      desc: Las formulaciones terminadas se analizan para determinar el contenido activo por HPLC/GC y se comprueban en cuanto a suspensibilidad, estabilidad de emulsión, pH, viscosidad y distribución de tamaño de partícula. Cada lote se verifica contra la especificación del producto antes de su liberación.

oem_section:
  tagline: Proyectos OEM
  title: Casos de éxito de marcas y asociaciones OEM
  subtitle: 'Del concepto a la producción: cómo ayudamos a marcas globales a lanzar y escalar sus líneas de productos agroquímicos.'
  cases:
    - challenge: Un distribuidor europeo de agroquímicos necesitaba una línea de herbicidas de etiqueta privada con formulaciones únicas, ingredientes conformes a REACH y embalaje listo para el comercio minorista, todo entregado en 60 días.
      solution: Desarrollamos formulaciones SC personalizadas, conseguimos ingredientes activos conformes a REACH y redujimos las muestras de 3 rondas a 1 al ubicar al equipo de formulación en nuestra fábrica de Qingdao.
      result: Producción de 25–35 días desde la orden de compra firmada, con la primera entrega dentro de la ventana de llegada de 60 días. 200+ toneladas en 4 SKU. Pedido repetido antes de completarse la primera tirada.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Una startup estadounidense de protección de cultivos necesitaba una formulación SC de insecticida de alta eficacia con concentración personalizada, embalaje co-marcado y registro ICAMA para su entrada al mercado.
      solution: Adaptamos la formulación SC existente con proporción de ingrediente activo modificada, desarrollamos el arte del embalaje co-marcado y proporcionamos documentación completa de registro ICAMA.
      result: Registrado y colocado con éxito en los principales canales agrícolas de EE. UU., generando un fuerte impulso con más de 500 toneladas vendidas en el primer año y una tasa de reorden del 95%.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Un distribuidor australiano necesitaba una gama de fungicidas registrada por ICAMA con formulaciones personalizadas y cumplimiento de las normas reguladoras australianas.
      solution: Produjimos muestras de preproducción con 4 variantes de formulación y coordinamos ensayos de eficacia y residuos de terceros.
      result: Gama de fungicidas de 3 modelos lanzada en el mercado AU/NZ. Posteriormente, adjudicación de una licitación gubernamental para 50 toneladas de insecticida de salud pública.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'

faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para formulaciones agroquímicas OEM?
      a: 'El MOQ se confirma según la configuración del proyecto, no con un número fijo — tipo de formulación y concentración, materias primas, arte de etiqueta, embalaje y mercado de destino. La producción de volumen estándar corre en lotes de 20+ toneladas, el co-branding de lotes pequeños parte de 5 toneladas, y cada proyecto pasa por las etapas de muestra (1–4 toneladas) y piloto (5 toneladas). Consulta nuestra Guía de MOQ y Branding Flexible para la lógica de cálculo completa.'
    - q: ¿Mantiene Agrospear la certificación BSCI?
      a: Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo petición). También tenemos ISO 9001 para gestión de calidad e ISO 14001 para gestión ambiental. El registro ICAMA aplica a formulaciones destinadas al mercado chino y mercados regulados; el alcance se confirma por proyecto. La documentación de cumplimiento REACH se entrega con cada pedido OEM.
    - q: ¿Cuál es el plazo de entrega típico de un pedido OEM?
      a: El plazo estándar es de 25–35 días desde la confirmación del pedido y el depósito para la producción OEM en volumen. El desarrollo de formulación personalizada añade 15–20 días para ensayos de laboratorio. Hay producción acelerada disponible para pedidos urgentes y picos de temporada. Las muestras de prototipo suelen estar listas en 7–12 días.
    - q: ¿Gestionáis la documentación de exportación?
      a: Sí. Nuestro equipo gestiona internamente la documentación de exportación y el despacho de aduanas, y suministramos a más de 50 países en los mercados de la UE, EE. UU., Australia y Asia.

b2b_moq: 'MOQ confirmado por configuración del proyecto: muestra 1–4 toneladas, piloto 5 toneladas, volumen 20+ toneladas por lote; co-branding de lotes pequeños desde 5 toneladas.'

production_flow:
  tagline: Flujo de producción
  title: Del material al producto terminado
  subtitle: Cada lote pasa por 6 etapas de producción con puntos de control de calidad en cada paso. Sin atajos, sin inspecciones omitidas.
  stages:
    - stage: '01'
      title: Recepción de materiales y control de calidad de entrada
      description: 'Todos los materiales entrantes se registran por número de lote en nuestro sistema ERP. Los ingredientes activos de grado técnico, solventes, coadyuvantes, dispersantes y materiales de embalaje se ponen en cuarentena hasta el visto bueno del control de calidad.'
      qc_check: 'Pureza del ingrediente activo (HPLC/GC), perfil de impurezas, pureza del solvente, contenido de humedad, verificación de propiedades físicas'
      qc_threshold: 'Se ensaya el 100% de los lotes. Rechazo si pureza de IA < 95% de la especificación, impurezas > mínimo de especificación o cualquier defecto visual'
      responsibility: Equipo de control de calidad de entrada (3 inspectores)
    - stage: '02'
      title: Mezclado y premezcla
      description: 'El loteado optimizado por ordenador calcula las cantidades precisas de materias primas para cada formulación. Los sistemas automáticos de pesaje y dosificación mantienen una precisión de ±0,1%.'
      qc_check: 'Verificación de peso contra tarjeta de formulación, confirmación de identidad de materia prima, comprobación de uniformidad de premezcla'
      qc_threshold: 'Se pesa cada lote. Tolerancia ±0,5% en componentes principales. Rechazo del lote si >2% fuera de tolerancia'
      responsibility: Responsable del taller de mezclado
    - stage: '03'
      title: Procesamiento de formulación y molienda
      description: 'Los mezcladores de alto corte componen formulaciones SC, EC y SL. Los molinos de arena y molinos de cuentas reducen el tamaño de partícula a especificación. Los secadores por aspersión y granuladores de lecho fluido producen productos WDG y WP.'
      qc_check: 'Distribución de tamaño de partícula cada lote (difracción láser), viscosidad, pH, suspensibilidad (CIPAC MT 15), revisión de registro de temperatura de molienda'
      qc_threshold: 'D50 dentro de ±10% del objetivo. Suspensibilidad ≥90%. Cualquier parámetro fuera de especificación = retener y reprocesar'
      responsibility: Control de calidad de formulación (2 inspectores por turno)
    - stage: '04'
      title: Llenado y embalaje
      description: 'Las formulaciones pasan al llenado donde tambores, garrafas y botellas se llenan, sellan y etiquetan. Cada unidad sigue una lista de verificación de llenado y embalaje de 100 puntos.'
      qc_check: 'Firma de la lista de verificación de 100 puntos por lote, verificación de peso de llenado, ensayo de integridad del sellado, comprobación de precisión de etiqueta, verificación por escaneo de código de barras'
      qc_threshold: 'Política de cero defectos en los elementos críticos de seguridad (sellos, etiquetas, marcas GHS). Defectos menores estéticos: AQL 2.5 (ISO 2859)'
      responsibility: Responsable del equipo de llenado + control de calidad de línea
    - stage: '05'
      title: Ensayos de estabilidad y retención de calidad
      description: 'Cada lote de producción se mantiene a 54 °C durante 14 días según CIPAC MT 46. Se verifican el contenido activo, la suspensibilidad, el pH y la estabilidad física antes de la liberación. Los lotes que superan los límites de especificación se rechazan y se envían para reinspección de especificaciones.'
      qc_check: 'Ensayo de estabilidad a 54 °C de 14 días, contenido activo por HPLC/GC, suspensibilidad, estabilidad de emulsión, pH, viscosidad'
      qc_threshold: 'Contenido activo dentro de ±2% de la especificación tras almacenamiento a 54 °C. Cualquier lote que lo supere = reensayo del 100% de todo el lote de producción'
      responsibility: Laboratorio de calidad (independiente de la producción, informa a la dirección)
    - stage: '06'
      title: Inspección final y embalaje
      description: 'Inspección visual y de especificaciones final. Precisión de etiqueta, consistencia de color, verificación de lote/ID, integridad del embalaje y completitud. Las unidades se paletizan y preparan para la carga de contenedores.'
      qc_check: 'Inspección visual completa, lista de verificación de etiquetas por SKU, ensayo de integridad del embalaje (muestra aleatoria), verificación por escaneo de código de barras'
      qc_threshold: 'AQL 2.5 para defectos mayores, AQL 4.0 para menores. Tolerancia cero en defectos de seguridad. El 100% de las unidades se inspeccionan visualmente'
      responsibility: Equipo de control de calidad final (4 inspectores) + responsable del equipo de embalaje

