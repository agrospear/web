material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de materiales y control de lotes
  description: A cada lote de materia prima se le asigna un número de lote único en nuestro sistema ERP. Desde la llegada hasta la producción y el producto terminado, la lista de materiales de cada lote se vincula al lote original del proveedor. Esto permite la trazabilidad ascendente completa ante cualquier consulta de calidad o cumplimiento.
  system: ERP a medida (sistema interno de Qingdao Vatrad Group) + etiquetas físicas de lote en cada orden de trabajo
  coverage: 'El 100% de los materiales de producción: ingredientes activos, solventes, coadyuvantes, dispersantes, emulsionantes, embalaje'
  records_retained: 10 años (según requisito regulatorio)
  suppliers:
    - material: Ingredientes activos de grado técnico
      source: Proveedores chinos e indios
      certified: ISO 9001, ICAMA, REACH
    - material: Solventes y coadyuvantes
      source: Proveedores chinos e internacionales
      certified: ISO 9001, REACH
    - material: Dispersantes y emulsionantes
      source: Proveedores chinos + socios externos
      certified: Control de calidad interno + ISO 9001 del proveedor
    - material: Materiales de embalaje (tambores, botellas, tapas)
      source: Proveedores OEM chinos
