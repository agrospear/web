answer:
  label: 'Respuesta directa'
  text: 'Fábrica certificada de agroquímicos en Qingdao, China: ISO 9001, ISO 14001, BSCI, ICAMA. Planta de 12.500 m² con 4 talleres especializados, más de 350 trabajadores y más de 20.000 toneladas producidas al año (2.000+ toneladas/mes en 4 líneas automatizadas). Cada lote se prueba de estabilidad a 54 °C durante 14 días, supera una lista de control de producción de 100 puntos y conserva una trazabilidad de materiales de 10 años.'
  verified: '2026-08'

intro:
  - Como división de fabricación de **Qingdao Vatrad Group Co., Ltd.**, Agrospear controla cada etapa de la fabricación de agroquímicos, desde la llegada de los ingredientes activos brutos hasta la inspección final previa a la entrega del producto de protección de cultivos terminado. Nuestra planta de fabricación en la Zona de Desarrollo Económico de Qingdao ocupa 12.500 metros cuadrados y alberga talleres dedicados a la preparación de materias primas, la mezcla y el mezclado, la molienda de formulaciones, el llenado y sellado, y los ensayos de calidad.
  - Al integrar diseño de formulación, ingeniería, creación de prototipos, fabricación y ensayos bajo un mismo techo, eliminamos las ineficiencias de la fabricación por contrato y mantenemos el control directo de la calidad del producto, la selección de materias primas y los plazos de entrega. Cada formulación que sale de nuestro taller está producida por nuestra gente, con nuestro equipo y según nuestros estándares.

