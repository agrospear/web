faqs:
  tagline: FAQ
  title: 'Formulaciones de PGR — Preguntas frecuentes'
  items:
    - q: '¿Qué ingredientes activos de PGR formuláis?'
      a: 'Ácido giberélico (GA3), giberelina A4+A7, paclobutrazol, uniconazol, etefón, clormecuat, cloruro de mepiquat, forclorfenurón (CPPU), brasinólido, triacontanol y productos a base de auxinas. Combinaciones personalizadas disponibles.'
    - q: '¿Cuál es el MOQ para formulaciones de PGR?'
      a: 'Por las dosis de aplicación más bajas, los lotes piloto de PGR parten de 1–5 toneladas según el ingrediente activo y la concentración. Volumen estándar desde 5+ toneladas por SKU. Lotes de muestra para registro desde 500 kg.'
    - q: '¿Las formulaciones de PGR requieren un manejo especial?'
      a: 'Sí — muchos PGR son eficaces a concentraciones muy bajas (nivel de ppm), por lo que la precisión y homogeneidad de la formulación son críticas. Probamos la uniformidad del contenido activo por lote y proporcionamos certificado de análisis con cada envío.'
    - q: '¿Qué tipos de formulación de PGR producís?'
      a: 'Producimos concentrados solubles (SL), concentrados en suspensión (SC), polvos mojables (WP) y formatos de gránulos dispersables y tabletas. La elección depende del ingrediente activo, el método de aplicación y las preferencias regionales — por ejemplo, GA3 es común como SL, mientras que el paclobutrazol se suministra como SC o WP.'
    - q: '¿Cómo garantizáis contenido activo uniforme a dosis de ppm?'
      a: 'Usamos dispersión de alta cizalla y homogenización en varias etapas, y luego verificamos la uniformidad del contenido activo por HPLC por lote con una tolerancia declarada. Esto evita puntos calientes que pueden sobre-regular o sub-responder en el cultivo.'
    - q: '¿Cuál es el momento de aplicación de los principales PGR?'
      a: 'El GA3 se aplica en floración y cuajado para el cuajado partenocárpico y el aclareo; el paclobutrazol es un tratamiento de suelo o foliar al inicio del crecimiento de brotes para dormancia y control de vigor; el etefón se aplica pre-cosecha para maduración y en macollaje para control de encamado. Nuestro equipo técnico proporciona orientación de calendario por cultivo durante el desarrollo.'
    - q: '¿Suministráis paquetes de datos de registro para PGR?'
      a: 'Sí. Preparamos el dossier completo — análisis de cinco lotes, estabilidad acelerada y a largo plazo, métodos analíticos y datos de etiqueta y seguridad — para que tu PGR pueda registrarse en tus mercados objetivo sin vacíos técnicos.'
    - q: '¿Podéis formular combinaciones de PGR personalizadas?'
      a: 'Sí. Las combinaciones habituales incluyen GA4+7 más una citoquinina como CPPU para tamaño de fruto, y GA3 más un retardante para un equilibrio vegetativo/fructífero. Validamos la compatibilidad y proporcionamos datos de estabilidad antes de la producción piloto.'
    - q: '¿Cuál es la vida útil y la sensibilidad a la temperatura de las formulaciones de PGR?'
      a: 'La mayoría de las formulaciones de PGR tienen una vida útil de 2 años y permanecen estables hasta 54 °C en ensayos acelerados. Para activos sensibles al calor diseñamos sistemas estabilizantes y recomendamos condiciones de almacenamiento controladas, documentadas en el informe de estabilidad.'
    - q: '¿Qué documentación de exportación proporcionáis para los envíos de PGR?'
      a: 'Proporcionamos certificado de análisis, certificado de origen, certificado de fumigación, FDS/MSDS, etiquetado conforme a GHS y documentación fitosanitaria para que el despacho de aduanas sea fluido en tu mercado de destino.'

