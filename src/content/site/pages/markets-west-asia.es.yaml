crop_profiles:
  tagline: 'Cultivos y Plagas'
  title: 'Cultivos Principales y Plagas Objetivo — Asia Occidental y Oriente Medio'
  features:
    - icon: W
      icon_bg: green
      title: 'Trigo — Plaga del Sol y Roya'
      desc: 'La plaga del sol (Eurygaster integriceps) y la roya del trigo afectan la producción de grano en la región. Formulaciones EC de clorpirifos y formulaciones SC de tebuconazol para protección integrada del trigo.'
      link_label: 'Ver insecticidas'
      href: /es/products/insecticides
    - icon: D
      icon_bg: blue
      title: 'Palmera Datilera — Picudo Rojo'
      desc: 'El picudo rojo (Rhynchophorus ferrugineus) devasta las plantaciones de palmera datilera. Formulaciones EC de clorpirifos y formulaciones de inyección al tronco para programas de manejo del picudo.'
      link_label: 'Ver insecticidas'
      href: /es/products/insecticides
    - icon: C
      icon_bg: purple
      title: 'Algodón — Gusano y Mosca Blanca'
      desc: 'El complejo de gusano del algodonero y los virus transmitidos por mosca blanca afectan la producción de algodón en Pakistán y Asia Central. Formulaciones EC de cipermetrina y profenofos para manejo de plagas de amplio espectro.'
      link_label: 'Ver insecticidas'
      href: /es/products/insecticides
    - icon: V
      icon_bg: orange
      title: 'Hortalizas — Trips y Minadores'
      desc: 'Trips y minadores dañan hortalizas de invernadero y campo abierto en la región. Formulaciones SC de abamectina y formulaciones WDG de espinosad para cultivo protegido.'
      link_label: 'Ver insecticidas'
      href: /es/products/insecticides

