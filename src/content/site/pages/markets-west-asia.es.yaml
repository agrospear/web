faqs:
  tagline: FAQ
  title: 'Mercado de Asia Occidental — Preguntas frecuentes'
  items:
    - q: '¿A qué países de Asia Occidental y Oriente Medio suministráis?'
      a: 'Suministramos productos OEM a distribuidores en Arabia Saudita, EAU, Kuwait, Bahréin, Omán, Qatar, Jordania, Irak, Líbano y Pakistán. Los productos están registrados o en registro en los mercados clave.'
    - q: '¿Cómo aseguráis la estabilidad de la formulación en calor extremo?'
      a: 'Todas las formulaciones se someten a pruebas de estabilidad acelerada a 54°C (CIPAC MT 46) y estabilidad a largo plazo a 45°C. Ajustamos paquetes de adyuvantes, sistemas de conservantes y materiales de embalaje para condiciones de almacenamiento desértico que superan los 50°C de temperatura ambiente.'
    - q: '¿Proporcionáis documentación en árabe?'
      a: 'Sí. Proporcionamos documentación completa del producto en árabe e inglés: etiquetas, fichas de seguridad, fichas técnicas y expedientes de registro adaptados a los requisitos regulatorios del GCC y nacionales.'
    - q: '¿Qué embalaje funciona para los mercados de Oriente Medio?'
      a: 'Embalaje institucional y a escala de plantación: 5 L, 10 L, 20 L y 200 L para formulaciones líquidas; 5 kg, 10 kg y 25 kg para formulaciones en polvo. Contenedores resistentes a UV para almacenamiento exterior en condiciones de alta temperatura.'

