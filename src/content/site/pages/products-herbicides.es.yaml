faqs:
  tagline: FAQ
  title: 'Formulaciones de herbicida — Preguntas frecuentes'
  items:
    - q: '¿Puedo personalizar una formulación de herbicida para mi marca?'
      a: 'Sí. Cada proyecto de herbicida empieza con tu cultivo objetivo, espectro de malas hierbas y estado de registro en el mercado. Especificas el ingrediente activo, la concentración, el tipo de formulación (SC, EC, WP, WDG, SL, ME), el paquete de coadyuvantes, el diseño de etiqueta y el embalaje.'
    - q: '¿Cuál es el pedido mínimo para formulaciones de herbicida?'
      a: 'Los lotes piloto parten de 5 toneladas por formulación; la producción en volumen estándar, desde 20+ toneladas por SKU. Los lotes de muestra (1–4 toneladas) están disponibles para registro y ensayos de campo.'
    - q: '¿Qué tipos de formulación de herbicida están disponibles?'
      a: 'Concentrado en suspensión (SC), concentrado emulsionable (EC), polvo mojable (WP), gránulo dispersable en agua (WDG), líquido soluble (SL), microemulsión (ME) y suspensión encapsulada (CS).'
    - q: '¿Proporcionáis documentación de registro de herbicidas?'
      a: 'Sí. Suministramos paquetes completos de apoyo al registro: certificados ICAMA, cumplimiento de especificaciones FAO/OMS, análisis de cinco lotes, datos de estabilidad y expedientes de registro local.'

