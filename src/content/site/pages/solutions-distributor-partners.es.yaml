slug: solutions-distributor-partners
meta:
  title: 'Socios Distribuidores Agroquímicos | Marca Privada Proveedor OEM | {SITE}'
  description: 'Producción de agroquímicos de marca privada para socios distribuidores: especificaciones de formulación personalizadas, embalaje con marca, documentación de mercado regional y QC de fábrica.'
  dateModified: '2026-08'

hero:
  tagline: Socios Distribuidores
  title: 'Producción de Agroquímicos de Marca Privada para Socios Distribuidores'
  subtitle: 'Las marcas distribuidoras lanzan su propia línea de productos agroquímicos con nuestra fábrica: formulaciones desarrolladas a partir de tus requisitos, tu marca en el producto y control de calidad de producción gestionado de principio a fin.'
  image:
    src: https://assets.agrospear.com/site/factory/agrospear-factory-aerial-1.webp
    alt: Productos agroquímicos de Agrospear producidos para un socio distribuidor

answer:
  label: 'Respuesta directa'
  text: 'El MOQ se confirma según la configuración del proyecto: los socios distribuidores empiezan con una muestra (1–4 toneladas) o un lote piloto (5 toneladas, muestras en 7–14 días), escalan a una producción de volumen estándar de 20+ toneladas por lote (25–35 días tras el PO y el depósito) o invierten en una formulación a medida para líneas de producto totalmente personalizadas (I+D añade 10–15 días). Cada lote se prueba en estabilidad y se analiza en contenido antes del envío, con condiciones FOB, CIF o DDP desde Qingdao.'
  verified: '2026-08'

margin_section:
  title: 'Etapas de Producción para Socios Distribuidores'
  subtitle: 'Empieza con una muestra, valida con un piloto, escala a una producción de volumen estándar o invierte en una formulación a medida: los MOQ y los plazos los fija la vía de producción, no las estimaciones.'
  items:
    - tier: 'Etapa de Muestra'
      moq: '1–4 toneladas'
      margin_note: 'Plazo de la muestra de 7–14 días'
      features:
        - 'Desarrollo de formulación a partir de tus requisitos'
        - 'Muestra física para su aprobación'
        - 'Control de calidad (QC) estándar de plataforma'
    - tier: 'Etapa Piloto'
      moq: '5 toneladas'
      margin_note: 'Validación de mercado sobre plataformas existentes'
      features:
        - 'Etiquetado personalizado, embalaje con marca y texto regulatorio'
        - 'Pedidos repetidos sobre las mismas plataformas verificadas'
        - 'Documentación ICAMA y FAO/OMS incluida'
    - tier: 'Formulación a Medida'
      moq: 'Confirmado por configuración'
      margin_note: 'I+D añade 10–15 días'
      features:
        - 'Desarrollo de nueva composición de formulación'
        - 'Control total de la especificación'
        - 'Asignación prioritaria de producción'

product_line:
  title: Línea de Producto Completa
  subtitle: 'Una plataforma de formulación para cada segmento de tu red de distribución.'
  items:
    - name: Serie de Herbicidas
      description: 'Control de malezas pre y posemergente — SC, EC, WDG'
    - name: Serie de Insecticidas
      description: 'Manejo de plagas de contacto y sistémico — EC, SC, ME'
    - name: Serie de Fungicidas
