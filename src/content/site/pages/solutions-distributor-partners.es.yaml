    - name: Serie de Reguladores de Crecimiento
      description: 'Regulación del crecimiento vegetal a dosis bajas — SC, SL'
    - name: Serie de Tratamiento de Semillas
      description: 'Tratamiento de semillas en recubrimiento y en pasta — FS, CS'
    - name: Formulaciones Personalizadas
      description: 'Composiciones a medida para necesidades específicas de cultivo y mercado'

