answer:
  label: 'Straight answer'
  text: 'QINGDAO VATRAD GROUP.,LTD. controls agrochemical quality through a 4-stage verification system: incoming material control (IQC), in-process quality control (IPQC), final product testing and stability verification (FQC), and packing and pre-shipment release (OQC). Every order is inspected against the approved sample, technical specification, label proof, BOM, and packaging standards, with stability verification, active content and physical property checks, accessory confirmation, and batch traceability. Items failing acceptance criteria are placed under controlled hold or quarantine, reworked only under approved instructions, and re-inspected before authorized release.'
  verified: '2026-08'

intro: 'Our quality system is built for OEM/ODM projects: inspection criteria are defined per order, documented, and followed by production and quality teams from incoming material to packing. This keeps quality expectations aligned between the factory and your brand from the first sample to full container shipments.'

scope_note:
  tagline: Scope
  title: Project-Specific Inspection Criteria
  body: |
    Quality specifications may vary depending on formulation type (e.g., SC, EC, WP, WDG, SL, ME, CS, FS), intended crop and target pest, target market regulations, and customer-approved parameters. Final release authorization is strictly based on the documented inspection criteria agreed upon for the order.

stages:
  tagline: Quality Framework
  title: Our 4-Stage Quality Verification System
  subtitle: A complete QC loop from raw material arrival to shipment release.
  steps:
    - title: '1. Incoming Material Control (IQC)'
      desc: 'Active ingredients (AI), solvents, surfactants, adjuvants, and packaging components are checked against approved specifications and reference samples before entering the production line. AI powders and liquids are verified for supplier certificate of analysis, batch number, active content by HPLC/GC, moisture content, particle size, colour match against approved reference, and identity confirmation. Surfactants and adjuvants are checked for type, concentration, pH, and compatibility. Drums, containers, and caps undergo integrity, seal, and fitment tests. Labels, leaflets, and packaging (bottles, jugs, drums, cartons) are matched for quantity, colour, branding, barcode accuracy, and artwork version against the approved BOM.'
    - title: '2. In-Process Quality Control (IPQC)'
      desc: 'Critical manufacturing steps are inspected to catch non-conformities before formulations move to subsequent workstations. Weighing and dosing are verified for active ingredient charge weight, solvent volume, and surfactant addition against approved batch production records. Compounding and milling are checked for mixing time, temperature, slurry uniformity, and particle size distribution. Filling and capping are verified for fill volume, net weight, torque, and seal integrity. Labeling and coding are verified for position, orientation, barcode readability, batch number, and artwork version.'
    - title: '3. Final Product Testing & Stability Verification (FQC)'
      desc: 'Completed formulations undergo mandatory physical, chemical, and stability testing before packaging approval. Products are tested for active content by HPLC/GC, suspensibility (CIPAC MT 15), emulsion stability (CIPAC MT 36), particle size, pH, viscosity, and appearance against the approved specification. Accelerated stability at 54 °C for 14 days (CIPAC MT 46) verifies shelf stability and confirms no sedimentation, phase separation, or active content degradation beyond tolerance.'
    - title: '4. Packing & Pre-Shipment Release (OQC)'
      desc: 'Comprehensive pre-shipment verification ensures zero mismatch in SKU configuration or shipping marks. Kit completeness cross-checks product, label, leaflet, cap, seal, and carton against the order BOM. Packaging and barcode checks verify carton marks, SKU labels, barcode readability, leaflet language, and carton structural integrity. Orders are released only after the final packaging audit is signed off by authorized quality personnel.'

inspection_points:
  tagline: Inspection Coverage
  title: Key Inspection Control Points
  subtitle: Every checkpoint is executed against documented acceptance criteria agreed per order.
  features:
    - icon: A
      icon_bg: blue
      title: Stability & Specification Verification
      desc: 'Completed formulations are tested for active content by HPLC/GC, suspensibility, emulsion stability, pH, viscosity, and particle size against the approved specification. Accelerated stability at 54 °C (CIPAC MT 46) confirms shelf stability before release.'
    - icon: B
      icon_bg: green
      title: Visual & Physical Inspection
      desc: 'Products are inspected under suitable lighting for appearance, colour, sedimentation, phase separation, foaming, and contamination. Net weight, fill volume, and torque are verified against approved specifications.'
    - icon: C
      icon_bg: purple
      title: Label & Packaging Verification
      desc: 'The complete product configuration is verified before shipment: formulation, label, leaflet, cap, seal, inner packaging, outer carton, and customer-specific accessories — each matched to the approved sample, drawings, and BOM.'
    - icon: D
      icon_bg: orange
      title: Packing & Shipment Release
      desc: 'Packed units are checked for SKU configuration, label accuracy, barcode information, leaflet version, carton marking, packing quantity, and carton condition. Shipment release is authorized only after all inspection and packing requirements are completed.'

traceability_intro:
  tagline: Batch Traceability
  title: Project-Level & Batch Traceability System
  body: |
    Every custom agrochemical order is managed under a unified project code linking technical specifications, the approved BOM, label revisions, material lot numbers, packing references, and inspection records. Production and inspection records are maintained by the applicable project and production batch, and each batch can be linked back to the approved product specification, BOM, label, and packing references.

    This supports efficient review of product configuration, inspection status, and affected scope if a quality concern is identified —from finished product back to source records using the batch or carton identification.

traceability_chain:
  tagline: Traceability Chain
  title: From Project Code to Shipment Release
  subtitle: One chain of controlled references from order confirmation to authorized dispatch.
  steps:
    - step: '01'
      title: Project Code
      desc: Unified project reference that links every controlled document to the order.
    - step: '02'
      title: Document Revisions
      desc: Current spec, BOM, label, and packing revision levels —only approved versions are valid for production.
    - step: '03'
      title: Batch & Materials
      desc: AI and raw material lots recorded against the production batch.
    - step: '04'
      title: Inspection Records
      desc: IQC, in-process, stability, final, and packing inspection results per batch.
    - step: '05'
      title: Packing & Release
      desc: Packing batch, NCR closure status, and authorized shipment release summary.

traceability_sample:
  tagline: Anonymized Sample
  title: Traceability Control Record (Demo)
  body: |
    Demonstration values are shown for illustration only —customer names, PO numbers, custom labels, supplier data, and commercial information are removed to protect confidentiality.

