    - image: https://assets.agrospear.com/site/quality/qc-stability-rework.avif
      alt: QC technician performing controlled stability rework on an agrochemical formulation at the factory rework station
      title: Controlled Rework Station
      desc: 'Stability rework is performed at a dedicated station under an approved method card: the defect is marked, the batch remains on HOLD, and after the required stabilization period it returns to the test area for re-inspection against the original acceptance criteria.'
    - image: https://assets.agrospear.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Workshop demonstration of controlled quarantine segregation in the Qingdao factory
      title: Quarantine Area Demonstration
      desc: 'Demonstration photo from the workshop showing how controlled quarantine segregation works on site: segregated units are kept under status control until an authorized disposition is completed.'

rework_intro:
  tagline: Rework Governance
  title: Controlled Stability Non-Conformance & Rework Governance
  body: |
    At QINGDAO VATRAD GROUP.,LTD., rework is defined strictly as restoring a non-conforming batch to full compliance with its original engineering specification — not as a quick fix. Any batch identified with a stability or specification non-conformance is placed on controlled hold and linked to a Non-Conformance Report (NCR) before further processing; the defect source is located and recorded using the approved diagnostic method.

    Rework may proceed only when the defect is within the approved rework scope and an authorized method is available. The rework instruction identifies the product, batch, defect location, approved material, method, required conditions and re-inspection scope. After the required stabilization period, the batch is re-inspected against the same applicable acceptance criteria as a conforming batch — rework never reduces the acceptance standard. Failure of re-inspection requires renewed engineering and quality disposition; repeated rework is not permitted without documented approval.

rework_decision:
  tagline: Interactive Flow
  title: Rework Decision Flow — Click Any Node
  subtitle: Follow how a stability non-conformance is handled from detection to release or scrap. Click a node to expand the control requirements at that step.
  nodes:
    - id: detect
      type: start
      label: Non-Conformance Detected
      detail: 'A stability or specification non-conformance is identified during inspection — active content out of range, sedimentation, phase separation, pH drift, or a related formulation defect.'
    - id: hold
      type: step
      label: Stop Line · HOLD Label · NCR
      detail: 'Processing stops. Batch ID, product code, batch number, workstation, date and inspector are recorded; a HOLD / QUARANTINE label is attached and an NCR is opened against the applicable specification revision.'
    - id: locate
      type: step
      label: Locate Defect Source
      detail: 'The batch is re-tested using the project-approved diagnostic method — active content by HPLC/GC, suspensibility by CIPAC MT 15, pH, viscosity, particle size, or accelerated stability at 54 °C per CIPAC MT 46.'
    - id: classify
      type: step
      label: Classify Defect (A–G)
      detail: 'The defect is classified against the approval matrix: A fill weight variation, B active content deviation, C pH drift, D sedimentation or phase separation, E emulsion/suspensibility failure, F recurring specification failure, G contamination or safety-related defect.'
    - id: authorize
      type: decision
      label: Rework Authorized?
      yes: rework
      no: escalate
      detail: 'QC confirms the defect category and Engineering reviews whether the batch can be restored to its original specification. The authorization records the method card, materials, conditions and re-inspection scope — or routes to replacement, rejection, scrap or customer concession.'
    - id: rework
      type: step
      label: Controlled Rework
      detail: 'Executed only within the approved defect boundary using the approved method card, raw material batch and equipment — never altering formulation, concentration, label, packaging or customer requirements.'
    - id: cure
      type: step
      label: Stabilization Period
      detail: 'The batch remains on HOLD through the stabilization period defined by the approved material and process instruction, then receives a visual and physical property pre-check.'
    - id: reinspect
      type: decision
      label: Re-Inspection Passed?
      yes: release
      no: escalate
      detail: 'The batch is re-tested against the project-approved specification and the original failure plus all potentially affected characteristics are re-verified — active content, suspensibility, pH, viscosity, particle size, stability, appearance and labeling. Rework never reduces the acceptance standard.'
    - id: release
      type: release
      label: Quality Release
      detail: 'Quality reviews the closed NCR, rework record and re-inspection result and authorizes release. No reworked batch is packed or shipped without authorized quality release.'
    - id: escalate
      type: escalate
      label: Escalate — Replace / Scrap / Concession
      detail: 'No repeat rework without documented approval. The batch routes to replacement, rejection, scrap, or a written customer concession where the original specification cannot be restored.'

defect_matrix:
  tagline: Defect Classification
  title: Specification Defect Classification & Approval Matrix
  subtitle: Not every non-conformance is reworked — each defect is classified and its disposition approved at the right level, from QC inspector up to plant manager.
  headers:
    category: Defect Category
    area: Typical Area
    eligibility: Rework Eligibility
    approval: Required Approval
  rows:
    - category: 'Class A — Fill Weight Variation'
      area: 'Net weight or fill volume outside tolerance'
      eligibility: 'Standard rework authorized (adjustment)'
      approval: 'QC Inspector'
    - category: 'Class B — Active Content Deviation'
      area: 'AI content outside specification range'
      eligibility: 'Evaluated rework per the approved method card (dilution or AI addition)'
      approval: 'QC + Engineering'
    - category: 'Class C — pH Drift'
      area: 'pH outside specification range'
      eligibility: 'Authorized only when compliant with client specifications and regulatory limits'
      approval: 'QC + Engineering'
    - category: 'Class D — Sedimentation / Phase Separation'
      area: 'Visible sedimentation or phase separation in suspension concentrate or emulsion'
      eligibility: 'High risk; strict engineering disposition required'
      approval: 'Engineering + QA Head'
    - category: 'Class E — Emulsion / Suspensibility Failure'
      area: 'Emulsion stability or suspensibility below specification (CIPAC MT 15 / MT 36)'
      eligibility: 'Standard rework not authorized — reformulation review or replacement'
      approval: 'QA Head + Customer Concession'
    - category: 'Class F — Recurring Specification Failure'
      area: 'Non-resolvable defect or re-test failure'
      eligibility: 'No repeat rework; replacement, scrap or engineering root-cause analysis'
      approval: 'Lead QA / Engineering'
    - category: 'Class G — Contamination / Safety Defect'
      area: 'Cross-contamination, foreign matter, or safety-related defect'
      eligibility: 'Rework release not authorized — replacement, scrap or written customer concession'
      approval: 'Quality Manager + Customer Approval'

rework_flow:
  tagline: 7-Step Closed-Loop
  title: Controlled Rework Workflow — From Detection to Release or Scrap
  subtitle: 'Every specification rework follows the same controlled loop: detect, quarantine, diagnose, authorize, rework, re-inspect, release.'
  steps:
    - step: '01'
      title: Detection, Stop-Line & Quarantine
      desc: 'Processing stops immediately on the affected batch. Batch ID, product code, workstation, date and inspector are recorded, a HOLD / QUARANTINE label is attached, and an NCR is opened against the applicable specification revision.'
    - step: '02'
      title: Systematic Defect Diagnosis
      desc: 'The batch is re-tested using the project-approved diagnostic method — active content by HPLC/GC, suspensibility by CIPAC MT 15, emulsion stability by CIPAC MT 36, pH, viscosity, particle size, or 54 °C accelerated stability per CIPAC MT 46. The suspected defect is documented without altering the batch.'
    - step: '03'
      title: Engineering Disposition & Authorization
      desc: 'QC confirms the defect category and Engineering reviews whether the batch can be restored to its original specification. A rework authorization referencing the NCR records the approved method, materials, conditions and re-inspection scope —or assigns replacement, rejection, scrap or customer concession.'
    - step: '04'
      title: Controlled Rework Execution
      desc: 'Rework is executed only within the approved defect boundary, using the approved method card, raw material batch and equipment. Formulation, concentration, label configuration and packing requirements are never altered.'
    - step: '05'
      title: Stabilization & Pre-Check
      desc: 'The reworked batch remains in HOLD status through the stabilization period defined by the approved material and process instruction, then receives a visual and physical property pre-check before re-inspection.'
    - step: '06'
      title: Re-Inspection & Specification Testing
      desc: 'The batch is re-tested against the project-approved specification and the original failure plus all potentially affected characteristics are re-verified: active content, suspensibility, emulsion stability, pH, viscosity, particle size, stability, appearance and labeling. Rework never reduces the acceptance standard.'
    - step: '07'
      title: QA Release or Final Disposition
      desc: 'Quality reviews the completed NCR, rework record and re-inspection result, then authorizes release —or escalates to replacement, rejection, scrap or customer concession. No reworked batch is packed or shipped without authorized quality release.'

quality_safeguards:
  tagline: Quality Safeguards
  title: Anti-Error Rules That Protect Your Brand
  subtitle: Hard controls that prevent uncontrolled repair loops —one documented rework per defect, batch-level alert thresholds, calibrated instrumentation and controlled test conditions.
  features:
    - icon: 1
      icon_bg: blue
      title: One Rework Per Defect
      desc: 'A single defect may be reworked once under an authorized instruction. If re-inspection still fails, the batch is escalated for replacement, rejection, scrap or customer concession —repeated rework without documented approval is not permitted.'
    - icon: 2
      icon_bg: green
      title: Batch Alert & Line-Stop
      desc: 'When non-conformance in a production batch exceeds the engineering-set threshold, the line is stopped and Engineering investigates the cause —material lot, process conditions and records —before production resumes.'
    - icon: 3
      icon_bg: purple
      title: Calibrated Instrumentation
      desc: 'HPLC/GC instruments, pH meters, viscometers, and stability chambers used for testing are controlled and calibrated by third-party laboratories within their validity period, with calibration status visible in the inspection area.'
    - icon: 4
      icon_bg: orange
      title: Controlled Test Conditions
      desc: 'Stability testing and analytical laboratories are kept in controlled temperature and humidity environments so results are not affected by ambient condition variations.'

rework_boundaries:
  tagline: Scope & Boundaries
  title: What This System Does Not Cover
  body: |
    The rework control system applies to completed or in-process agrochemical formulations identified with specification failures, stability non-conformances or related defects before shipment release. It does not authorize changes to approved formulation, concentration, label, product configuration or customer requirements, and it does not cover:

    - Products already shipped or in customer channels.
    - Contamination or safety defects not assessed by Engineering.
    - Widespread formulation failure, cross-contamination, or defects that may affect safety.
    - Projects where rework is not permitted: customer-approved samples, ICAMA registration batches, or test units.
    - Projects with proprietary customer processes, special raw materials or special rework requirements.
    - Recurring specification failures that cannot be resolved, or batches failing again after rework.

    Any deviation from customer specifications requires documented engineering review and, where applicable, written customer approval. Batches that cannot be restored to their original specification are only released under an explicit customer concession —never by production alone.

method_cards:
  tagline: Method Card System
  title: Controlled Rework Method Card Index
  subtitle: 'The general instruction controls the process; method cards control the operation. The rework instruction (WI-QC-SPEC-001) references method cards MC-RW-01 to MC-RW-06, plus MC-RW-00 for mandatory scrap and reject.'
  headers:
    code: Method Card
    defect: Defect Class
    scope: Application Scope
    controls: Key Engineering Controls
    approval: Sign-off Authority
  rows:
    - code: MC-RW-01
      defect: Class A (Fill Weight)
      scope: 'Net weight or fill volume adjustment'
      controls: 'Calibrated weighing, volumetric adjustment, no formulation change'
      approval: 'QC Inspector'
    - code: MC-RW-02
      defect: Class B (Active Content)
      scope: 'AI content adjustment by dilution or controlled AI addition'
      controls: 'HPLC/GC verification before and after, mixing time and temperature control'
      approval: 'QC + Engineering'
    - code: MC-RW-03
      defect: Class C (pH Adjustment)
      scope: 'pH correction using approved acid or alkali'
      controls: 'Calibrated pH meter, incremental addition, no effect on active content'
      approval: 'QC + Engineering'
    - code: MC-RW-04
      defect: Class D (Sedimentation)
      scope: 'Sedimentation or phase separation re-dispersion'
      controls: 'Controlled re-milling, sand mill pass, particle size verification'
      approval: 'Engineering + QA Head'
    - code: MC-RW-05
      defect: Class B/C (Viscosity Drift)
      scope: 'Viscosity adjustment using approved thickener or diluent'
      controls: 'Viscometer verification, incremental addition, no effect on active content or suspensibility'
      approval: 'QC + Engineering'
    - code: MC-RW-06
      defect: Class D (Emulsion Re-Stabilization)
      scope: 'Emulsion stability re-stabilization for EC/ME formulations'
      controls: 'Controlled emulsifier addition, homogenization, emulsion stability test per CIPAC MT 36'
      approval: 'Chief Engineer'
    - code: MC-RW-00
      defect: Class E/F/G (Critical / Contamination)
      scope: 'Mandatory scrap and controlled destruction'
      controls: 'Controlled destruction to prevent mix-out, scrap record, cross-department root-cause review'
      approval: 'Plant Manager'

inspector_friendly:
  tagline: Third-Party Inspection
  title: Inspector-Friendly Protocol
  body: |
    We provide a dedicated inspection area with calibrated HPLC/GC instruments, standardized stability chambers, and pre-filled Inspection Briefs so third-party agencies (SGS, BV, Intertek, QIMA) can complete pre-shipment inspection efficiently —saving your inspection overhead.

    Each brief summarizes the applicable document revisions, approved sample reference, critical-to-quality checks, agreed sampling level, functional tests, and packaging and barcode requirements for the PO. Specified quantities, quality, packing, and basic safety items are verified against the approved project references —no last-minute document hunting on site.

