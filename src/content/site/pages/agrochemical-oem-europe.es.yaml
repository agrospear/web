why_europe:
  tagline: 'Por qué los compradores europeos'
  title: 'Pensado para las importaciones europeas'
  subtitle: 'La fábrica responde a las preguntas que las marcas europeas hacen antes de su primer contenedor — preparación del expediente de registro y cumplimiento de la UE primero.'
  items:
    - title: 'Soporte de dossier del Reglamento UE 1107/2009'
      description: 'La comercialización de productos fitosanitarios en la UE requiere el registro bajo el Reglamento (CE) n.º 1107/2009. Agrospear proporciona documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo, archivos de composición de formulación y datos de propiedades fisicoquímicas para respaldar tu expediente de autorización zonal y tus registros nacionales.'
    - title: 'Documentación ICAMA y FAO/OMS'
      description: 'La muestra aprobada viaja con documentación ICAMA y FAO/OMS preparada para el mercado de la UE, de modo que tu expediente técnico y tu papeleo aduanero están listos antes del contenedor.'
    - title: 'DDP para un coste total predecible'
      description: 'El DDP incluye despacho de aduanas, aranceles, impuestos y entrega en tu almacén — un solo total, puerta a puerta por toda la UE.'
    - title: 'FOB Qingdao con tu propio agente de carga'
      description: '¿Importas con regularidad? Elige FOB Qingdao y usa tu propio socio logístico — nosotros cargamos y documentamos el contenedor, tú controlas el resto.'
    - title: 'Una fábrica, un sistema de calidad'
      description: 'El desarrollo, el muestreo, la producción y el control de calidad ocurren dentro de la planta de 12.500 m² — la muestra que apruebas es el producto que recibes.'

process_notes:
  tagline: 'Cómo funciona'
  title: 'De la especificación al contenedor'
  subtitle: 'Las mismas seis etapas tanto si compras dos contenedores al año como veinte: especificación, I+D, muestreo, pruebas, desarrollo de formulación, producción — y entrega FOB, CIF o DDP.'
  items:
    - title: '1. Envía tu especificación'
      description: 'Basta con un producto de referencia, un brief técnico o la especificación de un competidor. La revisión de I+D y el presupuesto vuelven en un día laborable.'
    - title: '2. Aprueba la muestra'
      description: 'Tu primera muestra física sale en 7–12 días con una hoja de aprobación que cubre composición, propiedades físicas y resultados de ensayos de estabilidad — más datos listos para expedientes del Reg. 1107/2009.'
    - title: '3. Producción y exportación'
      description: 'Las tiradas se completan en 25–35 días con puntos de control de calidad durante el proceso. La lista de empaque, la factura y el conocimiento de embarque viajan antes que el buque.'
    - title: '4. Entrega en tu almacén'
      description: 'De 4 a 6 semanas de flete marítimo a Róterdam o Hamburgo — con DDP gestionamos el despacho y la entrega hasta tu puerta.'

faq_section:
  tagline: FAQ
  title: 'Preguntas sobre importación a Europa'
  questions:
    - q: ¿Agrospear respalda los expedientes de registro del Reglamento UE 1107/2009?
      a: 'Sí. Agrospear proporciona los componentes de datos técnicos que respaldan un expediente de registro bajo el Reglamento 1107/2009: documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo, composición completa de formulación, datos de propiedades fisicoquímicas y resultados de estabilidad acelerada. Tu consultor regulatorio integra estos datos en la presentación de autorización zonal.'
    - q: ¿Qué datos de dossier proporciona Agrospear para el registro en la UE?
      a: 'Agrospear suministra composición de formulación, datos de análisis de cinco lotes, informes de propiedades fisicoquímicas, estudios de estabilidad acelerada según CIPAC MT 46 y resúmenes toxicológicos del expediente de registro ICAMA. Estudios adicionales pueden coordinarse a través de laboratorios conformes a GLP cuando se requieran para tu expediente.'
    - q: ¿La documentación ICAMA está incluida en mi pedido?
      a: 'Sí. La documentación ICAMA y FAO/OMS se prepara para el mercado de la UE junto con tu muestra aprobada, antes de que comience la producción — los documentos viajan con el contenedor.'
    - q: ¿Cuánto tarda el flete marítimo a Europa?
      a: 'Cuenta con 4–6 semanas desde el puerto de Qingdao hasta Róterdam o Hamburgo, según el itinerario de navegación. Los proyectos DDP incluyen el calendario completo puerta a puerta.'
    - q: ¿Enviáis con DDP a países de la UE?
      a: 'Sí. El DDP incluye flete marítimo, despacho de aduanas, aranceles e impuestos y entrega en tu almacén — un total predecible. También ofrecemos FOB Qingdao y CIF.'
    - q: ¿Cuál es el MOQ para importar agroquímicos de marca privada?
      a: 'MOQ confirmado por configuración del proyecto: las muestras cubren 1–4 toneladas, los lotes piloto corren 5 toneladas sobre plataformas existentes, y la producción de volumen estándar corre 20+ toneladas por lote.'
    - q: ¿Cómo inicio un proyecto desde Europa?
      a: 'Envía un producto de referencia, un brief técnico o una especificación. La revisión de I+D y el presupuesto vuelven en un día laborable, y se firma un NDA antes de cualquier intercambio de archivos.'

