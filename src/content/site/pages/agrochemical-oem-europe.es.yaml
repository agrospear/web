answer:
  label: 'Respuesta directa'
  text: 'Las marcas europeas piden productos agroquímicos a Agrospear con condiciones estándar: MOQ confirmado por configuración del proyecto — muestra de 1–4 toneladas, lote piloto de 5 toneladas y producción de volumen estándar de 20+ toneladas por lote. La primera muestra sale en 7–12 días tras la aprobación de la especificación, la producción transcurre en 25–35 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a Róterdam o Hamburgo. La documentación ICAMA y FAO/OMS se prepara junto con la muestra aprobada, con datos adicionales para respaldar los expedientes de registro del Reglamento UE 1107/2009. El DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

