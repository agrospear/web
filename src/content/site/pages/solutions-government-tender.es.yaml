meta:
  title: 'Adquisición Gubernamental e Institucional de Agroquímicos | {SITE}'
  description: 'Agrospear suministra productos agroquímicos para agencias gubernamentales, ONGs y programas de adquisición institucional incluyendo control de vectores, seguridad alimentaria y cumplimiento de licitaciones.'
  dateModified: '2026-08-24'
  keywords:
    - 'adquisición agroquímica gubernamental'
    - 'suministro pesticidas institucional'
    - 'licitación agroquímica'
