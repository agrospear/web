  tagline: 'Capacidades'
  title: 'Soluciones para el Mercado del Sudeste Asiático'
  features:
    - icon: S
      icon_bg: green
      title: 'Formulaciones tropicales'
      desc: 'Formulaciones diseñadas para alta temperatura y alta humedad: productos SC y EC estables al calor, embalaje resistente a UV y datos de estabilidad acelerada para condiciones de almacenamiento tropical.'
      link_label: 'Ver productos'
