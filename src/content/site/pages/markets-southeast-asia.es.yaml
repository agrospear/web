      link_label: 'Ver soporte de registro'
      href: /es/manufacturing/research-development
    - icon: S
      icon_bg: orange
      title: 'Embalaje para pequeños agricultores'
      desc: 'Tamaños pequeños asequibles para canales de pequeños agricultores: sobres y botellas de 50 mL, 100 mL y 250 mL. Embalaje con dosis medidas y etiquetas pictóricas para usuarios con baja alfabetización.'
      link_label: 'Ver embalaje'
      href: /es/manufacturing/packaging

crop_profiles:
  tagline: 'Cultivos y Plagas'
  title: 'Cultivos Principales y Plagas Objetivo — Sudeste Asiático'
  features:
    - icon: R
      icon_bg: green
      title: 'Arroz — Saltamontes Marrón y Barrenador del Tallo'
      desc: 'El saltamontes marrón (Nilaparvata lugens) y el barrenador amarillo del tallo (Scirpophaga incertulas) son plagas primarias del arroz en ASEAN. Formulaciones SC de buprofezina y formulaciones EC de clorpirifos para manejo integrado de plagas.'
      link_label: 'Ver insecticidas'
      href: /products/insecticides
    - icon: P
      icon_bg: blue
      title: 'Palma Aceitera — Escarabajo Rinoceronte y Ganoderma'
      desc: 'El escarabajo rinoceronte (Oryctes) y la podredumbre basal del tallo (Ganoderma) amenazan los rendimientos de aceite de palma. Formulaciones EC para control del escarabajo, formulaciones WP de trifloxistrobina para manejo de enfermedades.'
      link_label: 'Ver fungicidas'
      href: /products/fungicides
    - icon: B
      icon_bg: purple
      title: 'Caucho — Caída de Hojas por Corynespora'
      desc: 'La enfermedad de caída de hojas por Corynespora cassiicola afecta las plantaciones de caucho en el Sudeste Asiático. Formulaciones SC y WP de mancozeb y tebuconazol para programas de control de enfermedades.'
      link_label: 'Ver fungicidas'
      href: /products/fungicides
    - icon: V
      icon_bg: orange
      title: 'Hortalizas — Polilla Dorada'
      desc: 'La polilla dorada (Plutella xylostella) y barrenadores de frutos dañan hortalizas crucíferas y solanáceas. Formulaciones WDG de indoxacarb y formulaciones SC de clorantaniliprol para manejo de resistencia.'
      link_label: 'Ver insecticidas'
      href: /products/insecticides

regulation_overview:
