faqs:
  tagline: FAQ
  title: 'Mercado del Sudeste Asiático — Preguntas frecuentes'
  items:
    - q: '¿A qué países del Sudeste Asiático suministráis?'
      a: 'Suministramos productos OEM a distribuidores en Vietnam, Tailandia, Indonesia, Filipinas, Myanmar, Camboya y Laos. Productos registrados o en registro en mercados clave de ASEAN.'
    - q: '¿Cómo aseguráis la estabilidad de formulaciones en climas tropicales?'
      a: 'Todas las formulaciones pasan pruebas de estabilidad acelerada a 54°C (CIPAC MT 46) y estudios de estabilidad a largo plazo a 30°C/75% HR. Ajustamos paquetes de adyuvantes, sistemas de conservantes y materiales de embalaje para condiciones de almacenamiento tropical.'
    - q: '¿Qué tamaños de embalaje funcionan para los mercados del Sudeste Asiático?'
      a: 'Embalaje para pequeños agricultores: sobres y botellas de 50 mL, 100 mL y 250 mL con etiquetas pictóricas. Tamaños institucionales: 1 L y 5 L para compradores de plantaciones. Tamaños personalizados disponibles.'
    - q: '¿Apoyáis el registro armonizado ASEAN?'
      a: 'Sí. Proporcionamos documentación alineada con las directrices ASEAN para registro armonizado de pesticidas: informes de estudios GLP, análisis de cinco lotes, datos de residuos y especificaciones de formulación. Nuestro equipo regulatorio apoya presentaciones en países ASEAN objetivo.'

