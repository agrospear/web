      icon_bg: blue
      title: 'Soluciones para arroz y aceite de palma'
      desc: 'Herbicidas para arroz (pretilacloro, bentazon, propanil), aceite de palma (glifosato, alternativas a paraquat) y plantaciones de caucho. Insecticidas para saltamontes marrones, barrenador del tallo y escarabajo rinoceronte.'
