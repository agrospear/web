answer:
  label: 'Straight answer'
  text: 'Agrospear provides agrochemical OEM manufacturing from its ISO 9001, ISO 14001, BSCI and ICAMA certified factory in Qingdao, China. Services include custom formulation development, private label production, co-branding and contract manufacturing. MOQ from 5-ton pilot to 20+ ton standard batches, 25–35 day production lead time, shipped to 50+ countries with full compliance documentation.'
  verified: '2026-08'

intro:
  - OEM manufacturing at Agrospear means your formulation, specification or proven platform is produced at our factory under your brand. You own all intellectual property; we provide the manufacturing infrastructure, quality system and export logistics.
  - Our integrated approach — formulation design, engineering, prototyping, manufacturing and testing under one roof — eliminates the handoff risk of contract manufacturing. Every batch is produced, tested and shipped by one team under one quality system.

oem_services:
  tagline: OEM Services
  title: 'Three OEM Service Models'
  subtitle: 'Every project goes through the same quality process — what changes is the R&D scope and where IP ownership sits.'
  items:
    - title: Custom Formulation OEM
      desc: 'You provide the specification or reference product. Our R&D team develops the formulation to your exact requirements. Full documentation and registration support included. You own the formulation IP.'
      icon: 'tabler:flask'
      href: /solutions/custom-formulation
    - title: Private Label Production
      desc: 'Your brand on a proven Agrospear formulation platform. No R&D stage required — we manufacture under your label with custom packaging and regulatory documentation. Fastest route to market.'
      icon: 'tabler:tag'
      href: /solutions/private-label-pesticides
    - title: Co-Branding Partnership
      desc: 'Both brands on the product label. Shared R&D, shared registration data and combined market presence. Ideal for regional market entry with a trusted manufacturing partner.'
      icon: 'tabler:branding'
      href: /solutions/co-branding

process_steps:
  tagline: The Process
  title: 'From Specification to Shipped Container'
  subtitle: 'Every step has a defined timeline, documented deliverables and go/no-go checkpoints.'
  steps:
    - step: '01'
      title: 'Specification Review & Quotation (Day 1)'
      desc: 'Share your formulation, specification or reference product. Our engineers review manufacturability and return a detailed quotation within one business day. An NDA is available before any file exchange.'
    - step: '02'
      title: 'Engineering Confirmation (Days 2–4)'
      desc: 'Formulation type, concentration, raw material specs and dispersion system confirmed. Custom development starts when required — adds 15–20 days.'
    - step: '03'
      title: 'Prototype & Sample (Days 5–15)'
      desc: 'Physical sample batch produced for your review. Composition and efficacy data included. Sample fees credited toward production order. 1–4 ton prototype batches ready in 7–14 days.'
    - step: '04'
      title: 'Testing & Validation (Days 16–20)'
      desc: 'Stability testing, content analysis, physical property checks and compliance documentation prepared for your export markets. Each batch passes the 7-stage QC gate system.'
    - step: '05'
      title: 'Approval & Production Slot (Days 21–25)'
      desc: 'You approve the sample and label artwork. PO and deposit lock the production slot. Pre-production plan confirms dates and quantities.'
    - step: '06'
      title: 'Production & QC (Days 26–45)'
      desc: 'Manufacturing through the 7-stage inspection gate system. From pilot (5 tons) to standard volume (20+ tons) per formulation. Production completes in 25–35 days from confirmed PO.'
    - step: '07'
      title: 'Packing & Shipment (Days 46–50)'
      desc: 'Export packing with batch documentation and COA. FOB Qingdao, CIF or DDP to 50+ countries.'

faqs:
  tagline: FAQ
  title: 'Agrochemical OEM — Frequently Asked Questions'
  items:
    - q: 'How do I start an OEM project?'
      a: 'Send your formulation, specification or reference product. Our engineering review confirms manufacturability and returns a quotation within one business day. An NDA is available before any file exchange.'
    - q: 'What is the MOQ for OEM manufacturing?'
      a: 'MOQ is confirmed by project configuration: sample batches 1–4 tons, pilot runs from 5 tons, standard volume 20+ tons per batch. Production lead time 25–35 days from confirmed PO.'
    - q: 'Do I own the formulation IP?'
      a: 'Yes. On OEM projects, you own all intellectual property. We manufacture exclusively under your brand and never compete with our clients.'
    - q: 'Which certifications does the factory hold?'
      a: 'ISO 9001, ISO 14001, BSCI and ICAMA. Full compliance documentation is provided with every OEM shipment, prepared for your target markets.'
    - q: 'What are your shipping terms?'
      a: 'FOB Qingdao, CIF major global ports or DDP for qualified partners. We ship to 50+ countries across EU, US, LATAM, Africa and Asia.'
    - q: 'How long does an OEM project take from start to first shipment?'
      a: 'Sample approval typically takes 2–4 weeks (including sample production in 7–14 days and your review period). The first production run completes in 25–35 days from confirmed PO and deposit — typically 6–8 weeks total from first contact to shipped container. A custom formulation adds 15–20 days of development.'
    - q: 'Can I test the market with a small order before committing to volume?'
      a: 'Yes. The entry point is tiered to de-risk market entry: 1–4 ton sample batches first, then a 5-ton trial or pilot order, and standard volume runs of 20+ tons once the configuration is validated. You approve and lock every sample before committing to larger volume.'
    - q: 'Do you provide registration and compliance support for my market?'
      a: 'Yes. We provide market-specific documentation in-house — MSDS, certificate of analysis, phytosanitary certificates, GHS labeling and ICAMA/FAO-WHO/REACH compliance files — matching the regulatory requirements of your destination market (Africa, LATAM, Southeast Asia, EU, North America).'
    - q: 'Is my formulation data kept confidential?'
      a: 'Yes. Your formulation data, specifications and label files remain your property and are stored in access-controlled systems with audit trails. An NDA is available immediately before you share any proprietary details, and your data is never reused, resold or shown to another client.'
    - q: 'How is quality controlled on each batch?'
      a: 'Every batch — sample, trial or volume — passes the same 7-stage inspection gate system: incoming raw material inspection, intermediate product inspection, mixing & filling, stability and content analysis testing, label & packaging QC, compliance documentation verification, and final packaging & documentation. Quality is never downscaled for smaller orders.'
    - q: 'Can you produce under my own brand and packaging?'
      a: 'Yes. Private label production lets you apply your brand to a field-tested formulation platform with custom label artwork, color coding, packaging formats (50 mL bottles to 200 L drums/IBCs) and export-ready labeling — no development cycle required.'
    - q: 'What if I have a formulation idea but no complete specification?'
      a: 'Use our ODM development path. Share your target crop, target pest, price point and market, and our R&D team develops the formulation from your brief. You approve each sample before production, and IP is allocated per the collaboration agreement.'

