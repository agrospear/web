      link_label: 'Descargar PDF'
    - icon: 4
      icon_bg: orange
      title: 'Dossier de Liberación en 4 Etapas de Insecticidas'
      desc: 'Cadena de evidencia de cuatro etapas que cubre inspección de entrada, control en proceso, liberación final y trazabilidad de muestras retenidas.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Insecticide_4Stage_QC_and_Release_Dossier.pdf
      link_label: 'Descargar PDF'
    - icon: F
      icon_bg: blue
      title: 'Sistema y Dossier QC de Fungicidas'
      desc: 'Marco QC/QA de producción de fungicidas y dossier de evidencia de soporte.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Fungicide_QC_System_and_Dossier.pdf
      link_label: 'Descargar PDF'
    - icon: A
      icon_bg: green
      title: 'Dossier QC de Acaricidas y Nematicidas'
      desc: 'Sistema de control de calidad específico para el grupo de producto de acaricidas y nematicidas.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Acaricides_Nematicides_QC_System_and_Dossier.pdf
      link_label: 'Descargar PDF'
    - icon: P
      icon_bg: purple
      title: 'Dossier del Sistema QC de PGR'
      desc: 'Resumen del control de calidad para la formulación y producción de reguladores de crecimiento de plantas.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_PGR_QC_System_and_Dossier.pdf
      link_label: 'Descargar PDF'
    - icon: 1
      icon_bg: blue
      title: 'Informe de Inspección IQC de Insecticidas'
      desc: 'Etapa 1: Informe de inspección de control de calidad de entrada para materias primas y componentes de embalaje.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Insecticide_IQC_Inspection_Report.pdf
      link_label: 'Descargar PDF'
    - icon: 2
      icon_bg: green
      title: 'Informe de Inspección IPQC de Insecticidas'
      desc: 'Etapa 2: Informe de inspección de control de calidad en proceso con puntos de control críticos.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Insecticide_IPQC_Inspection_Report.pdf
      link_label: 'Descargar PDF'
    - icon: 3
      icon_bg: purple
      title: 'Informe COA FQC de Clorantraniliprol 200SC'
