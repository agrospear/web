evidence_images:
  tagline: 'Evidencia del Piso de Fábrica'
  title: 'Registros de Inspección y Coordinación de Producción'
  subtitle: 'Registros fotográficos del conjunto de documentos públicos aprobados, que muestran cómo se organizan la coordinación de producción, las responsabilidades de inspección y liberación.'
  features:
    - image: /images/qcqa/insecticide-pre-production-meeting.jpeg
      alt: 'Reunión de coordinación pre-producción para un proyecto de fabricación agroquímica'
      title: 'Coordinación Pre-Producción'
      desc: 'Coordinación de producción antes del inicio de un lote, alineando responsabilidades técnicas, de producción y de calidad.'
    - image: /images/qcqa/insecticide-four-party-meeting-roles.jpeg
      alt: 'Roles y responsabilidades de la reunión de cuatro partes para el control de producción agroquímica'
      title: 'Roles y Responsabilidades Definidos'
      desc: 'Asignación de roles para el equipo de control de producción antes de la ejecución.'
    - image: /images/qcqa/insecticide-iqc-inspection.jpeg
      alt: 'Inspección de control de calidad de entrada de materias primas y embalaje agroquímico'
      title: 'Inspección IQC de Entrada'
      desc: 'Las materias primas y el embalaje de entrada se verifican antes de entrar en producción.'
    - image: /images/qcqa/ipqc-critical-control-points.jpeg
      alt: 'Puntos de control críticos de control de calidad en proceso en la producción agroquímica'
      title: 'Puntos de Control Críticos IPQC'
      desc: 'Puntos de inspección en proceso utilizados para identificar desviaciones antes de la siguiente etapa de producción.'
    - image: /images/qcqa/fqc-personnel-release-verification.jpeg
      alt: 'Personal de control de calidad final y verificación de liberación de producto'
      title: 'Verificación de Liberación FQC/OQC'
      desc: 'Inspección final y responsabilidades de liberación autorizada antes del envío.'
    - image: /images/qcqa/traceability-key-personnel-verification.jpeg
      alt: 'Trazabilidad por lote y verificación de control de calidad de muestras retenidas'
      title: 'Trazabilidad y Muestras Retenidas'
      desc: 'Evidencia del personal y registros que respaldan los controles de muestras retenidas y trazabilidad por lote.'

