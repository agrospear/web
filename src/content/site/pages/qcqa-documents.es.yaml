    - icon: F
      icon_bg: orange
      title: 'Verificación de Personal y Liberación FQC'
      desc: 'Etapa 3: Registros de verificación de personal de control de calidad final y liberación de producto.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_FQC_Personnel_and_Release_Verification.pdf
      link_label: 'Descargar PDF'
    - icon: T
      icon_bg: blue
      title: 'Informe de Retención y Trazabilidad'
