    - text: 'Explorar el marco QC de 7 etapas'
      href: /es/manufacturing/quality-control

answer:
  label: 'Qué incluye'
  text: 'Esta biblioteca contiene los documentos públicos aprobados de procesos y evidencia suministrados para la fabricación agroquímica de Agrospear. Cubre sistemas QC/QA específicos por formulación, IQC, IPQC, FQC/OQC, registros de liberación tipo COA, muestras retenidas, trazabilidad por lote y coordinación pre-producción. Los documentos se proporcionan para revisión de capacidades; las especificaciones del proyecto y los criterios de liberación permanecen definidos por la especificación del cliente aprobada y el acuerdo de calidad.'
  verified: '2026-08'

document_groups:
  tagline: 'Dossiers Descargables'
  title: 'Evidencia de Producción e Inspección por Grupo de Producto'
  subtitle: 'Los dossiers PDF bilingües originales están disponibles para revisión y descarga directa.'
  features:
    - icon: S
      icon_bg: blue
      title: 'SOP de Producción SC y WDG'
      desc: 'SOP bilingüe que cubre la producción de concentrado en suspensión y granulado dispersable en agua, puntos de control del proceso y requisitos de inspección de calidad.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_SC_WDG_Production_QC_SOP.pdf
      link_label: 'Descargar PDF'
    - icon: H
      icon_bg: green
      title: 'Sistema y Dossier QC de Herbicidas'
      desc: 'Marco de control de calidad y dossier de soporte para la producción y liberación de herbicidas.'
      link: https://assets.agrospear.com/site/downloads/qcqa/AGROSPEAR_Herbicide_QC_System_and_Dossier.pdf
      link_label: 'Descargar PDF'
    - icon: I
      icon_bg: purple
      title: 'Sistema y Dossier QC de Insecticidas'
      desc: 'Sistema central de control de calidad de insecticidas y documentación de soporte.'
