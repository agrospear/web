meta:
  title: 'Biblioteca de Documentos QC/QA | Evidencia de Fabricación Agroquímica | Agrospear'
  description: 'Dossiers públicos de procesos QC/QA, inspección y trazabilidad de las operaciones de fabricación agroquímica de Agrospear.'
  dateModified: '2026-08-30'
  keywords:
    - 'documentos QC QA agroquímicos'
    - 'informe de inspección agroquímica'
    - 'sistema de calidad de plaguicidas'

hero:
  tagline: 'Biblioteca de Evidencia de Fábrica'
  title: 'Documentos de Proceso QC/QA, Inspección y Trazabilidad'
  subtitle: 'Una biblioteca pública de dossiers de control de producción e inspección de Agrospear: desde IQC de materias primas hasta liberación de producto terminado, muestras retenidas y trazabilidad por lote.'
  actions:
    - variant: primary
      text: 'Solicitar Paquete de Calidad del Proyecto'
