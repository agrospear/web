values_section:
  title: How the Factory Works With Brands
  subtitle: 'Three principles that shape every project built by the Agrospear factory.'
  columns: 3
  items:
    - title: Engineering Before Production
      description: 'Every project starts with requirements, specifications and a physical sample — formulation type, concentration, label placement and packaging are validated before any production run, not discovered on the line.'
      icon: 'tabler:settings'
    - title: One Team, One Facility
      description: 'Formulation, mixing, filling, inspection and testing happen in one 12,500 m² facility. No trading-company handoffs: the people who answer your questions are the people who formulate your products.'
      icon: 'tabler:building-factory-2'
    - title: Small First Runs
      description: 'Small-batch co-branding starts at 1–4 tons and standard volume production runs 20+ tons per batch, so brands validate the market before scaling — with formulation records and artwork retained for reorders.'
      icon: 'tabler:layers-intersect'
services_section:
