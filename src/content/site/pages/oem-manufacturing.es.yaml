customization:
  tagline: Hecho a tu especificación
  title: Puntos de especificación OEM
  subtitle: 'Estos son los puntos de especificación que controlas en un proyecto OEM — tu documento de especificación es el contrato de producción:'
  items:
    - 'Tipo de formulación y concentración — SC, EC, WP, WDG, SL, ME, CS, FS según tu especificación o producto de referencia'
    - 'Estructura de materia prima — calidad del ingrediente activo, paquete de coadyuvantes, sistema de dispersión y requisitos de estabilidad'
    - 'Etiquetas y colores — tu arte aplicado con paletas ilimitadas, o soporte de nuestro equipo de diseño interno'
    - 'Especificaciones de tambores — tamaño, material, tipo de cierre y etiquetado en cada contenedor'
    - 'Cumplimiento regulatorio — soporte de registro ICAMA, especificaciones FAO/OMS y documentación por mercado'
    - 'Configuración de paleta y embalaje — cantidad de tambores por paleta, embalaje retractilado y embalaje de exportación a tu especificación'
    - 'Embalaje secundario y accesorios — vasos dosificadores, guantes, insertos y materiales con marca'
    - 'Embalaje y presentación comercial — cajas retail, embalaje a granel y displays para punto de venta bajo tu marca'
    - 'Documentación por lote — COA, COQ, informes de estabilidad y marcas de cumplimiento preparadas para tu región de exportación'

faq_section:
  tagline: FAQ
  title: Preguntas sobre fabricación OEM
  questions:
    - q: '¿Cómo inicio un proyecto OEM con mi propia formulación?'
      a: 'Envía tu formulación, un producto de referencia o una especificación escrita. Nuestra revisión de ingeniería confirma la fabricabilidad y devuelve un presupuesto en un día laborable — es nuestro compromiso estándar, y se firma un NDA antes de cualquier intercambio de archivos cuando sea necesario.'
    - q: '¿Cuál es el MOQ para fabricación OEM agroquímica?'
      a: 'El MOQ se confirma por configuración del proyecto — tipo de formulación y desarrollo, colores y concentración, arte, embalaje y configuración de tambores. La producción de volumen estándar corre de 20+ toneladas por lote, y los pilotos parten de 5 toneladas sobre plataformas existentes. Consulta la lógica completa en nuestra Guía de MOQ y branding flexible.'
    - q: '¿Cuál es el plazo típico de un pedido OEM?'
      a: 'La producción corre en 25–35 días desde el pedido confirmado y el depósito. El desarrollo de formulación a medida añade 15–20 días. Las muestras de prototipo suelen enviarse en 7–12 días.'
    - q: '¿Podéis fabricar solo a partir de mi formulación existente?'
      a: 'Sí. OEM construye desde tu especificación tal cual — tú eres dueño de la formulación. Nuestros ingenieros revisan la formulación para viabilidad de producción, señalan cualquier conflicto de especificación antes de empezar el desarrollo o la mezcla, y la muestra aprobada se convierte en la referencia de producción.'
    - q: '¿Proporcionáis muestras antes de la producción?'
      a: 'Sí. Se produce y aprueba un lote de muestra física antes de cualquier tirada, normalmente en 7–12 días, y es la referencia para todos los controles de calidad posteriores.'
    - q: '¿Qué certificaciones tiene la fábrica?'
      a: 'ISO 9001, ISO 14001, BSCI e ICAMA. Con cada envío OEM se entrega documentación completa de cumplimiento, preparada para tus mercados objetivo.'
    - q: '¿Cómo se controla la calidad en una tirada OEM?'
      a: 'La producción corre a través del sistema de inspección de 7 etapas — materia prima entrante, producto intermedio, mezcla y llenado, estabilidad y análisis de contenido, QC de etiqueta y embalaje, verificación de documentación de cumplimiento, y embalaje y documentación final — con trazabilidad por lote y registros ERP de 10 años.'
    - q: '¿Cuáles son vuestros términos de envío?'
      a: 'FOB Qingdao, CIF a los principales puertos globales, o DDP para socios cualificados. Enviamos a más de 50 países en los mercados de la UE, EE. UU., LATAM, África y Asia.'

process:
  title: 'El proceso OEM — De la especificación al contenedor enviado'
  subtitle: 'Siete fases controladas dirigidas por un solo equipo de fábrica, para que cada paso desde tu primera especificación hasta el contenedor embalado quede documentado y a tiempo.'
  steps:
    - phase: '01'
      title: Revisión de especificación y presupuesto
      period: 1 día laborable
      items:
        - 'Comparte tu formulación, especificación o productos de referencia — nuestros ingenieros comprueban la fabricabilidad.'
        - 'Recibes un presupuesto detallado y un plan de proyecto en un día laborable.'
    - phase: '02'
      title: Confirmación de ingeniería
      period: Semana 1
      items:
        - 'El tipo de formulación, la concentración, las especificaciones de materia prima y el sistema de dispersión se confirman contra tu documento.'
        - 'Se cierran las decisiones de plataforma o formulación — el desarrollo a medida empieza aquí cuando se requiere.'
    - phase: '03'
      title: Prototipo y muestra
      period: 7–12 días
      items:
        - 'Se produce un lote de muestra física y se envía para tu revisión — datos de composición y eficacia incluidos para formulaciones nuevas.'
        - 'La muestra (1–4 toneladas) valida tu especificación antes de cualquier compromiso de volumen.'
    - phase: '04'
      title: Ensayos y validación
      period: En paralelo
      items:
        - 'Controles de estabilidad, análisis de contenido, propiedades físicas y estabilidad en estante por línea de producción.'
        - 'Documentación ISO 9001, ISO 14001, BSCI e ICAMA preparada para tus mercados de exportación.'
    - phase: '05'
      title: Aprobación y confirmación
      period: Tras el visto bueno de la muestra
      items:
        - 'Apruebas la muestra y el arte de etiqueta; el pedido y el depósito bloquean el cupo de producción.'
        - 'Un plan de preproducción confirma fechas, cantidades, embalaje y puerto de carga.'
    - phase: '06'
      title: Producción
      period: 25–35 días
      items:
        - 'La producción corre a través del sistema de inspección de 7 etapas — materia prima entrante, proceso e inspección final.'
        - 'Desde pedidos piloto (5 toneladas) sobre plataformas existentes hasta lotes de volumen estándar (20+ toneladas) por formulación.'
    - phase: '07'
      title: Embalaje y envío
      period: 1 día + tránsito
      items:
        - 'Embalaje de exportación con documentación por lote y COA, luego FOB Qingdao, CIF o DDP a más de 50 países.'
        - 'Documentación aduanera, seguimiento y soporte para reordenes incluidos en cada fase.'

