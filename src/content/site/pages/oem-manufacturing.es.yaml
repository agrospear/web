hero:
  tagline: Fabricación OEM
  title: 'Fabricación OEM agroquímica a medida — Tu especificación, nuestra fábrica'
  subtitle: 'Tú aportas la formulación, la especificación o una plataforma probada — nosotros fabricamos a escala de contenedor. Revisión de ingeniería en un día laborable, muestras en 7–12 días y producción en 25–35 días tras confirmar el pedido y el depósito, enviada bajo tu marca.'

answer:
  label: 'Respuesta directa'
  text: 'La producción OEM parte de tu especificación. El MOQ se confirma por configuración del proyecto y no es un número fijo: la producción de volumen estándar corre de 20+ toneladas por lote, los lotes piloto parten de 5 toneladas sobre plataformas existentes y cada proyecto pasa por una muestra (1–4 toneladas) antes del volumen. Las muestras salen en 7–12 días; la producción corre en 25–35 días tras confirmar el pedido y el depósito, más 15–20 días cuando se requiere desarrollo de formulación a medida.'
  verified: '2026-08'

