intro: 'Una especificación, por muy detallada que sea, no puede revelar cómo se comportará realmente una formulación hasta que se compone, analiza y prueba en estabilidad. Por eso nuestro Laboratorio de Formulación está pensado para convertir los datos de I+D en una muestra física y validada de la forma más rápida y precisa posible. Cada nueva formulación de Agrospear — y cada desarrollo a medida significativo — pasa por este taller antes de comprometer la producción.'

content_html: |
  <h2>Donde la especificación se convierte en producto</h2>
  <p>El laboratorio está equipado para la formulación simultánea, el análisis y la evaluación de estabilidad. Este enfoque de trabajo concurrente reduce el plazo de entrega de la muestra a 7–14 días desde la aprobación de la especificación. Cuando tu aplicación exige una solución especializada, podemos pasar del concepto a la muestra validada en menos de tres semanas.</p>

  <h2>Capacidades del taller</h2>
  <table>
    <thead><tr><th>Puesto de trabajo</th><th>Equipamiento</th><th>Propósito</th></tr></thead>
    <tbody>
      <tr><td>Pesaje y dosificación</td><td>Básculas de precisión (0,01 g), sistema de tarjeta de fórmula, seguimiento de ingredientes por código de barras</td><td>Dosificación precisa de ingredientes activos, coformulantes y solventes según la fórmula maestra</td></tr>
      <tr><td>Formulación</td><td>Mezcladores de alto corte, molino de perlas, molino de arena, homogeneizador</td><td>Preparación de formulaciones SC, EC, WP, WDG, SL, ME, CS y FS con distribución de tamaño de partícula controlada</td></tr>
      <tr><td>Llenado y envasado</td><td>Línea de llenado semiautomática, selladora de bidones, aplicadora de etiquetas</td><td>Envasado de formulaciones de muestra en bidones de 1 L a 200 L con etiquetado adecuado</td></tr>
      <tr><td>Verificación de calidad</td><td>HPLC, GC, analizador láser de tamaño de partícula, viscosímetro, pH-metro</td><td>Contenido de ingrediente activo, distribución de tamaño de partícula, viscosidad, pH, tasa de suspensión y calidad de dispersión</td></tr>
      <tr><td>Evaluación de estabilidad</td><td>Cámaras de estabilidad térmica (0 °C, 25 °C, 54 °C), equipo de ciclado frío/caliente</td><td>Ensayos de estabilidad acelerada, estimación de vida útil y verificación de estabilidad en frío</td></tr>
    </tbody>
  </table>

  <h2>El viaje del lote piloto — paso a paso</h2>
  <ol>
    <li><strong>Cesión de especificación</strong> — El paquete de formulación (composición objetivo, tipo de formulación, datos de producto de referencia, requisitos de rendimiento) se revisa formalmente por el responsable del laboratorio y el ingeniero de proyecto. Cualquier preocupación de fabricación se señala y resuelve antes de comenzar la formulación.</li>
    <li><strong>Formulación</strong> — La muestra se produce según la especificación aprobada. Se pesan los ingredientes activos, se añaden los coformulantes en secuencia y el lote se procesa con el equipo adecuado para el tipo de formulación objetivo (SC, EC, WP, WDG, SL, ME, CS o FS).</li>
    <li><strong>Análisis inicial</strong> — La muestra formulada se somete a análisis: contenido de ingrediente activo por HPLC/GC, distribución de tamaño de partícula, viscosidad, pH, tasa de suspensión y estabilidad de emulsión según el tipo de formulación.</li>
    <li><strong>Envasado y etiquetado</strong> — La muestra se envasa en contenedores adecuados con etiquetado correcto que incluye número de lote, código de formulación y pictogramas de peligro. Todo el envasado se verifica contra la especificación.</li>
    <li><strong>Ensayos de estabilidad</strong> — La muestra entra en el programa de estabilidad: estabilidad en frío a 0 °C (7 días), almacenamiento acelerado a 54 °C (14 días) y ciclado térmico (5 ciclos). Las propiedades físicas se vuelven a comprobar tras cada condición.</li>
    <li><strong>Programa de evaluación en campo</strong> — Evaluación de bioeficacia y seguridad del cultivo, detallada a continuación.</li>
    <li><strong>Revisión de la muestra</strong> — Se celebra una reunión formal de validación con los equipos de I+D, producción y calidad. Los ajustes necesarios de formulación se documentan e incorporan a la versión de producción.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programa de Evaluación en Campo — Calendario de pruebas</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 1</span>
        <span class="flex-1">Confirmación de dosis — tasa de aplicación, volumen de pulverización y comprobación de tolerancia del cultivo</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 3</span>
        <span class="flex-1">Evaluación de eficacia — evaluación de incidencia de plaga/enfermedad a la dosis objetivo</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 7</span>
        <span class="flex-1">Actividad residual — evaluación del control sostenido e impacto en plagas secundarias</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 14</span>
        <span class="flex-1">Seguridad del cultivo — evaluación de fitotoxicidad a 1× y 2× la dosis recomendada</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 21</span>
        <span class="flex-1">Eficacia extendida — evaluación del control a largo plazo e impacto en rendimiento</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Día 28</span>
        <span class="flex-1">Evaluación final — informe completo con datos de eficacia, seguridad del cultivo y aplicación</span>
      </div>
    </div>
  </div>

  <h2>Formulación a medida para aplicaciones singulares</h2>
  <p>El Laboratorio de Formulación es el lugar donde resolvemos los problemas que las plataformas de producto estándar no pueden atender. Ejemplos recientes:</p>
  <ul>
    <li>Una formulación CS de lambda-cialotrina de alta concentración para una marca europea de protección de cultivos, con microencapsulación de liberación controlada y resistencia a la lluvia mejorada — formulada, probada y validada en nuestras instalaciones.</li>
    <li>Una formulación SC herbicida combinada con dos ingredientes activos para control de malezas de amplio espectro, validada durante un programa de ensayos en campo de 4 semanas en múltiples cultivos.</li>
    <li>Una formulación WDG fungicida de marca blanca con distribución de tamaño de gránulo personalizada, cuyo lote piloto sirvió para validar la tasa de disolución, la estabilidad de suspensión y la compatibilidad del envasado antes de que el cliente se comprometiera con la producción en volumen.</li>
  </ul>

  <h2>Nuestro equipo de formulación</h2>
  <p>El laboratorio cuenta con ocho técnicos de formulación polivalentes, cada uno formado en al menos dos de las tres disciplinas básicas (formulación, análisis, ensayos de estabilidad). El responsable del laboratorio es un químico de formulación senior con 16 años de experiencia abarcando desde formulaciones únicas a medida hasta series de producción completas. A cada lote piloto se asigna un ingeniero de proyecto dedicado que actúa como único punto de contacto del cliente durante todo el proceso de formulación y prueba.</p>

  <h2>Participación del cliente</h2>
  <p>Animamos activamente a nuestros clientes a asistir a los hitos clave de la producción del lote piloto, en particular a la revisión inicial de la formulación y a los resultados de los ensayos de estabilidad. Tu comentario operativo en estas fases es de gran valor para afinar la formulación antes de que entre en producción. No formulamos en un vacío: formulamos en colaboración contigo.</p>
  <p>El programa de evaluación en campo también es una ocasión para que tu equipo se familiarice con las características de rendimiento y los requisitos de aplicación del producto, garantizando una transición fluida a la producción cuando se entreguen los primeros lotes de volumen.</p>

