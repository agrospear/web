use_cases:
  tagline: Which Formulation for Which Buyer
  title: 'Match Formulation Type to Your Target Market'
  subtitle: 'Formulation choice is not just a cost decision — it defines the safety profile, the shelf-life risk, and the brand positioning you can sustain.'
  grid: 'sm:grid-cols-3'
  features:
    - icon: W
      icon_bg: 'blue'
      title: 'WP for Cost & Volume'
      desc: 'Lowest production cost at the most competitive price point. Ideal for brands targeting price-sensitive markets, generic actives and large-volume government tenders where cost is the primary purchase driver. Acceptable safety when handled with standard PPE. Lower warranty risk when stored properly.'
      link_label: 'See OEM formulation details'
      href: /oem-manufacturing
    - icon: E
      icon_bg: 'green'
      title: 'EC for Performance & Tank-Mix'
      desc: 'The workhorse formulation for oil-soluble active ingredients. Excellent knockdown speed and broad tank-mix compatibility make EC the standard for insecticide programs in row crops, fruit trees and vegetable production. Solvent-based system requires proper handling protocols. Most popular insecticide formulation globally.'
      link_label: 'Distribution & supply solutions'
      href: /solutions/bulk-supply
    - icon: S
      icon_bg: 'purple'
      title: 'SC for Safety & Modern Brands'
      desc: 'Best handling safety profile — no dust, no solvent. Preferred for premium brand positioning, export markets with strict safety requirements, and biopesticide formulations. Water-based system provides excellent user experience and broad active ingredient compatibility. Higher material cost, but stronger brand positioning and growing market share globally.'
      link_label: 'Formulation development'
      href: /odm-development

key_factors:
  heading: 'Key Factors Beyond Formulation Type'
  body: |
    Formulation type is one variable in product performance. Three additional factors matter as much or more:

    - **Adjuvant system** — Surfactants, dispersants and stabilizers determine how effectively the active ingredient delivers to the target. We select adjuvant packages per project and crop type.
    - **Active ingredient quality** — Not all technical-grade actives are equal. Higher-purity technical material produces more stable formulations with better shelf life and consistent efficacy. We specify raw material grade per project.
    - **Packaging and storage** — Proper packaging (UV-resistant containers, sealed liners, moisture barriers) dramatically reduces degradation risk. All our products use appropriate packaging regardless of formulation tier.

faqs:
  tagline: FAQ
  title: 'Formulation Type — Frequently Asked Questions'
  items:
    - q: 'Which formulation type should I choose for my brand?'
      a: 'It depends on your target market and price positioning. Cost-sensitive and government tenders: WP. Insecticide programs and tank-mixing: EC. Premium brands and safety-first markets: SC. Export and long supply chains: WDG. Most modern brands start with SC as the best balance of safety, efficacy and market positioning. We recommend based on your specific market during the feasibility review.'
    - q: 'Can I offer multiple formulation types under one brand?'
      a: 'Yes — many brands offer two or more formulation types. We produce all four formulations on the same line with the same QC gates, so you can mix formulation types within a single order. The active ingredient and label design can be identical across types; only the formulation and packaging change.'
    - q: 'What is the quality test standard for all formulations?'
      a: 'Every batch regardless of formulation type passes content analysis confirming active ingredient concentration within specification, plus formulation-specific tests: suspensibility (WP), emulsion stability (EC), suspension stability (SC) and disintegration time (WDG). All tests follow FAO/WHO specification methods.'
    - q: 'How does formulation type affect shelf life?'
      a: 'WP and WDG formulations generally have the longest shelf stability (24–36+ months) as dry formulations. EC formulations may show solvent separation over time if not stored properly. SC formulations require suspension stability testing to ensure no settling or caking. We provide per-formulation shelf life data from our stability studies during the quotation phase.'

