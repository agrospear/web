faqs:
  tagline: FAQ
  title: 'Fungicide Formulations — Frequently Asked Questions'
  items:
    - q: 'What fungicide formulation types does Agrospear manufacture?'
      a: 'SC, WP, WDG and FS. Formulation choice depends on the active ingredient, target pathogen, application method and regional registration preferences.'
    - q: 'What is the difference between protective and curative fungicide action?'
      a: 'Protective fungicides form a chemical barrier on the plant surface before infection. Curative (systemic) fungicides are absorbed into plant tissue and can arrest early-stage infections. Effective programs typically combine both modes.'
    - q: 'How does Agrospear manage fungicide resistance?'
      a: 'We follow FRAC classification and design spray programs that alternate or mix AIs from different mode-of-action groups, reducing selection for resistant strains.'
    - q: 'What MOQ tiers are available for fungicide products?'
      a: 'Sample orders start at 1–4 tons, pilot runs at 5 tons and standard production at 20+ tons. Lead time is 25–35 days from confirmed specification.'

