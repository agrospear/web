intro:
  - Fungal diseases reduce global crop output by an estimated 10–20% annually. Agrospear's fungicide portfolio delivers both preventive barrier protection and curative systemic action across the major pathogen groups.
  - Each formulation is engineered for stability, rainfast adhesion and compliance with international standards. FRAC-aligned resistance management programs are built into every product recommendation to extend product efficacy life.

