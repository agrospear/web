hero:
  tagline: 'Manufacturing · Formulation'
  title: 'Pesticide Formulation Process'
  subtitle: 'Our end-to-end formulation process transforms raw active ingredients into finished, labeled products under your brand — from compounding and grinding to filling and quality release.'

answer:
  label: 'Straight answer'
  text: 'Our formulation process covers every stage from raw active ingredient to finished product: compounding (mixing AI with co-formulants), grinding (particle size reduction for SC/WP/WDG), filling (automated liquid and powder lines), labeling (your brand on every container) and quality release (batch-level QC before shipment). Six production lines handle SC, EC, WP, WDG, SL, ME, CS and FS dosage forms.'
  verified: '2026-08'

intro:
  - The journey from raw active ingredient to a finished, branded agrochemical product involves precise formulation engineering at every stage. Each step — compounding, grinding, filling, labeling and quality release — is controlled and documented to ensure consistency batch after batch.
  - Our six production lines are configured for all major agrochemical dosage forms: suspension concentrates (SC), emulsifiable concentrates (EC), wettable powders (WP), water-dispersible granules (WDG), soluble liquids (SL), micro-emulsions (ME), capsule suspensions (CS) and flowable concentrates for seed treatment (FS).

capabilities:
  tagline: 'Capabilities'
  title: 'Formulation Process Stages'
  features:
    - icon: F
      icon_bg: green
      title: 'Compounding'
      desc: 'Active ingredient mixing with co-formulants, adjuvants and carriers under controlled temperature and mixing conditions. Precise dosing systems ensure accurate AI concentration in every batch.'
