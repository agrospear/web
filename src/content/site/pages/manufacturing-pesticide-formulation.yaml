      desc: 'Automated filling lines for liquid (SC, EC, SL, ME, CS, FS) and powder (WP, WDG) formulations. Volume and weight verification on every container. Cleanroom filling for high-purity formulations.'
      link_label: 'View filling details'
      href: /manufacturing/pesticide-formulation
    - icon: F
      icon_bg: orange
      title: 'Labeling & Branding'
      desc: 'Your brand on every container: custom label application, batch coding, expiration dating and regulatory compliance markings. Label proof approval before production run.'
      link_label: 'View branding details'
      href: /manufacturing/packaging

faqs:
  tagline: FAQ
  title: 'Formulation Process — Frequently Asked Questions'
  items:
    - q: 'What dosage forms can you produce?'
      a: 'Suspension concentrate (SC), emulsifiable concentrate (EC), wettable powder (WP), water-dispersible granule (WDG), soluble liquid (SL), micro-emulsion (ME), capsule suspension (CS) and flowable concentrate for seed treatment (FS). Six dedicated production lines cover all major agrochemical formulation types.'
    - q: 'How is particle size controlled in SC formulations?'
      a: 'Bead mill grinding with multiple passes to achieve target D90 < 5 μm. In-process particle size monitoring during grinding, with final laser diffraction analysis before filling. Suspension rate tested to >90% after 30 minutes per CIPAC MT 15.'
    - q: 'What quality checks happen during production?'
      a: 'In-process monitoring includes weight verification, temperature logging, mixing time control, particle size measurement (SC/WP/WDG), viscosity and pH checks, and fill weight verification. Every check is recorded in the batch production record.'
    - q: 'How long does a production run take?'
      a: 'Bulk production runs 25–35 days after confirmed PO and deposit for existing formulations. New formulations requiring development add 35–55 days for lab screening, pilot production and stability testing before full-scale production.'

