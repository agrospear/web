faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre el control de cambios de retrabajo
  items:
    - q: 'Puede la fabrica cambiar los parametros de retrabajo sin avisarnos?'
      a: 'No. Cualquier cambio propuesto en materiales de retrabajo aprobados, condiciones de proceso, herramientas, metodos de ensayo, criterios de inspeccion o personal autorizado debe pasar primero el control de cambios documentado. Los cambios que afectan a especificaciones, muestras, BOM, formulacion o criterios de aceptacion aprobados por el cliente requieren su aprobacion escrita.'
    - q: 'Que cuenta como cambio de alto riesgo?'
      a: 'Los cambios en materiales o proveedores de retrabajo, en las condiciones de estabilidad/molienda/mezclado, en los metodos de retrabajo de formulacion/especificacion/etiquetado, en los criterios de inspeccion o aceptacion, y la ampliacion del alcance del defecto a zonas criticas de especificacion se clasifican como alto riesgo. Requieren revision interdepartamental, un plan de validacion aprobado e implementacion piloto controlada antes de su uso rutinario.'
    - q: 'Puede usarse indefinidamente una desviacion temporal?'
      a: 'No. Toda desviacion temporal lleva una ventana de validez definida, alcance de lote, limite de cantidad y requisitos de validacion, con expiracion automatica. Al alcanzar el tope, el lote se bloquea y se impide imprimir la etiqueta de liberacion hasta que el cambio se evalue formalmente.'
    - q: 'Como se demuestra que un metodo cambiado funciona antes de su uso pleno?'
      a: 'Los cambios de alto riesgo requieren un plan de validacion: al menos 5 lotes de muestra representativos que cubran los limites de tolerancia, ensayados por 2 inspectores de Calidad independientes contra criterios de aceptacion cuantificados (contenido activo, estabilidad, suspensibilidad, tamano de particula, apariencia). Aprobar la validacion no es aprobar la aplicacion.'
    - q: 'Necesitamos aprobar todos los cambios?'
      a: 'No todos, pero cualquier cambio que aleje el producto de la muestra aprobada por el cliente, la especificacion tecnica, la BOM, la formulacion, el embalaje o los criterios de aceptacion solo se implementa con aprobacion escrita del cliente. Sin ella, los lotes se retrabajan segun el requisito original, se reemplazan o se rechazan.'
    - q: 'Que ocurre con los documentos antiguos cuando se aprueba un cambio?'
      a: 'Las instrucciones de trabajo, tarjetas de parametros y hojas de inspeccion antiguas se recogen fisicamente y se cancelan (1-a-1), se marcan como OBSOLETAS y se sustituyen por la nueva revision controlada tras la formacion. Las versiones antigua y nueva nunca comparten una estacion de trabajo.'
    - q: 'Cuanto tiempo se conservan los registros de control de cambios?'
      a: 'Los registros de cierre — evidencia de validacion, revisiones documentales, registros de formacion y revisiones de eficacia — se conservan segun nuestra politica de retencion de registros (minimo 3 anos para registros de cierre), de modo que cada cambio siga siendo trazable para auditorias y revisiones de trazabilidad.'

