cc_validation:
  tagline: Validacion de ingenieria
  title: Protocolo de validacion y aceptacion — evidencia sobre declaraciones
  body: |
    La redaccion de aceptacion vaga como *"el lote reparado debe estar bien"* no se acepta. La redaccion controlada es:

    > "La muestra retrabajada cumplira los mismos criterios de aceptacion aplicables de contenido activo, especificacion, etiquetado y especificos del proyecto que un lote conforme, salvo que una desviacion aprobada por el cliente defina especificamente un criterio alternativo."

    La evidencia de validacion es cuantitativa, y la base de ingenieria para el retrabajo de especificaciones incluye:

    - **Verificacion de contenido activo.** La desviacion original se corrige; el lote cumple el contenido activo de especificacion por HPLC/GC dentro de ±2%, con estabilidad verificada a 54 C durante 14 dias segun CIPAC MT 46.
    - **Suspensibilidad y estabilidad de emulsion.** Suspensibilidad ≥90% segun CIPAC MT 15; estabilidad de emulsion segun CIPAC MT 36 sin separacion ni cremado.
    - **Tamano de particula y propiedades fisicas.** Distribucion de tamano de particula dentro de especificacion (D50 dentro de ±10% del objetivo); pH y viscosidad dentro del rango de especificacion.
    - **Apariencia y etiquetado.** Sin sedimentacion, sin separacion de fases, sin dano de contenedor y sin desplazamiento de etiqueta ni errores de codigo de lote.

cc_engineering:
  tagline: Matriz de ejecucion de ingenieria
  title: Parametros cuantificados de los cuatro procesos basicos de retrabajo
  subtitle: 'Cada proceso de retrabajo controlado lleva parametros, metodologia y criterios de aceptacion definidos — los mismos numeros que siguen nuestros operadores y que los clientes pueden verificar durante las auditorias.'
  headers:
    process: Proceso de retrabajo
    parameters: Parametros controlados
    methodology: Metodologia de ensayo
    acceptance: Criterios de aceptacion
  rows:
    - process: 'Ajuste de contenido activo'
      parameters: 'Re-analizar por HPLC/GC; ajustar con IA de grado tecnico aprobado; mezclar a velocidad controlada 500–1000 rpm durante 30 min'
      methodology: 'Analisis de contenido activo por HPLC/GC segun metodo CIPAC; verificacion con inyeccion duplicada'
      acceptance: 'Contenido activo dentro de ±2% de la especificacion; sin impacto en perfil de impurezas'
    - process: 'Retrabajo de suspensibilidad / tamano de particula'
      parameters: 'Re-moler en molino de arena a velocidad y carga de medios definidas; entorno 22–28 C, ≤ 65% HR'
      methodology: 'Analisis de tamano de particula por difraccion laser; suspensibilidad segun CIPAC MT 15; comprobacion de estabilidad a 54 C 7 dias'
      acceptance: 'D50 dentro de ±10% del objetivo; suspensibilidad ≥90%; sin sedimentacion tras retencion a 54 C'
    - process: 'Ajuste de pH / viscosidad'
      parameters: 'Anadir tampón o modificador de viscosidad aprobado; velocidad y duracion de mezclado controladas; verificar tras 2 h de equilibrado'
      methodology: 'pH-metro segun CIPAC MT 75; viscosimetro segun CIPAC MT 22; estabilidad de 7 dias a 54 C'
      acceptance: 'pH dentro del rango de especificacion; viscosidad dentro de especificacion; sin cambio tras retencion a 54 C'
    - process: 'Ensayo final de estabilidad de 14 dias'
      parameters: '54 C ± 2 C segun CIPAC MT 46; registrador de temperatura calibrado; humedad ambiente registrada'
      methodology: 'Contenido activo por HPLC/GC antes y despues; observacion de estabilidad fisica; re-comprobacion de suspensibilidad'
      acceptance: 'Contenido activo dentro de ±2% del inicial tras 14 dias; sin sedimentacion, separacion de fases o cambio fisico'

