answer:
  label: 'Respuesta directa'
  text: 'Los cambios de parametros de retrabajo nunca se deciden verbalmente ni de forma retroactiva en QINGDAO VATRAD GROUP.,LTD. Todo cambio propuesto en materiales de retrabajo aprobados, condiciones de proceso, equipos, metodos de ensayo, criterios de inspeccion o personal autorizado debe pasar un control de cambios formal antes de su implementacion: una solicitud de cambio de ingenieria (ECR) documentada, evaluacion de impacto y riesgos, revision interdepartamental por Ingenieria, Calidad, Produccion, Compras y Proyecto, aprobacion al nivel fijado por nuestra matriz de autorizacion, un plan de validacion aprobado para cambios de alto riesgo, implementacion piloto controlada, reinspeccion y revision de eficacia, y cierre solo tras la revision de documentos y la formacion. Cualquier cambio que afecte a especificaciones, muestras, BOM, formulacion o criterios de aceptacion aprobados por el cliente requiere ademas su aprobacion escrita.'
  verified: '2026-08'

