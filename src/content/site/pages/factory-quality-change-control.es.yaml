cc_intro:
  tagline: Alcance y politica
  title: Principios basicos de gobernanza
  body: |
    **Documento:** QMS-SOP-QC-CC-001 — *Estandar de control de cambios de parametros de retrabajo* (Rev 2.0, lanzamiento oficial). **Fabricante:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Referencia normativa:** ISO 9001:2015 Sistemas de gestion de la calidad.

    - **Sin cambios no controlados.** Los cambios de parametros de retrabajo deben pasar por el control de cambios formal. Los operadores en planta, jefes de turno o un departamento individual nunca pueden modificar parametros de retrabajo aprobados mediante acuerdos verbales o anotaciones a mano en el registro de retrabajo.
    - **Cobertura de todos los elementos.** El alcance controlado cubre el contenido activo, la suspensibilidad, el tamano de particula, la viscosidad, el pH, la estabilidad de emulsion, el etiquetado, los parametros de llenado y los ensayos de estabilidad — todo parametro que pueda influir en la calidad del producto, el cumplimiento regulatorio, la apariencia, la aceptacion del cliente o la trazabilidad.
    - **Limite de aprobacion del cliente.** Cualquier cambio que aleje el producto de la muestra aprobada por el cliente, la especificacion tecnica, la BOM, la formulacion, el requisito de embalaje o los criterios de aceptacion solo se implementa con aprobacion escrita del cliente. Sin ella, el lote se retrabaja segun el requisito original, se reemplaza o se rechaza — la fabrica nunca "relaja" el estandar por si sola.

cc_scope:
  tagline: Clasificacion de riesgos
  title: Alcance del cambio y clasificacion de riesgos
  subtitle: Cualquiera de los siguientes casos activa el control de cambios formal — nunca se gestiona anotandolo en el registro de retrabajo. El nivel de riesgo determina quien aprueba y cuanta validacion se requiere.
  headers:
    category: Categoria de cambio
    examples: Ejemplos tipicos
    risk: Riesgo
    requirements: Requisitos de control y aprobacion
  rows:
    - category: 'Materiales de retrabajo'
      examples: 'Cambio de coadyuvante, dispersante, solvente, transportador o proveedor'
      risk: 'Alto'
      requirements: 'Revision interdepartamental + validacion de compatibilidad de materiales y estabilidad + firma del cliente cuando aplique'
    - category: 'Condiciones de proceso'
      examples: 'Velocidad de mezclado, tiempo de molienda, temperatura, humedad, tiempo de retencion'
      risk: 'Alto'
      requirements: 'Aprobacion de Ingenieria y Calidad con validacion de la ventana de proceso definida'
    - category: 'Herramientas e instrumentos'
      examples: 'Columnas HPLC, analizadores de tamano de particula, maquinas de llenado, software de ensayo'
      risk: 'Medio/Alto'
      requirements: 'Verificacion de validez de calibracion + evaluacion de idoneidad del equipo'
    - category: 'Alcance del defecto'
      examples: 'Ampliacion del area de retrabajo; desviacion menor de especificacion que crece a zona critica'
      risk: 'Alto'
      requirements: 'Parametros criticos de especificacion: parada obligatoria y re-evaluacion'
    - category: 'Metodos de inspeccion'
      examples: 'Metodo analitico, temperatura de ensayo (54 C), duracion de retencion (14 dias)'
      risk: 'Alto'
      requirements: 'Aprobacion de Calidad + confirmacion del acuerdo tecnico del cliente'
    - category: 'Documentacion y autorizacion'
      examples: 'Instruccion de retrabajo, hojas de inspeccion, logica de disposicion NCR, cualificacion de operadores'
      risk: 'Medio'
      requirements: 'Revision controlada de documentos (Rev A → Rev B) + registros de formacion'

cc_containment:
  tagline: Regla de parada dura
  title: Contencion inmediata cuando las condiciones son graves
  body: |
    > "El metodo de retrabajo existente se sometera a revision y no se aplicara a producto adicional afectado hasta que el cambio sea evaluado y autorizado, salvo que una desviacion temporal documentada sea aprobada por Calidad e Ingenieria."

    El metodo de retrabajo actual debe suspenderse de inmediato cuando la reinspeccion del retrabajo sigue fallando, cuando el defecto afecta parametros criticos de especificacion (contenido activo, suspensibilidad, tamano de particula), cuando un material sustituto aun no esta validado o cuando los parametros actuales entran en conflicto con la especificacion aprobada por el cliente.

    Las desviaciones temporales nunca se convierten en practica permanente: cada una lleva una ventana de validez definida, alcance de lote aplicable, limite de cantidad, requisitos de validacion y un mecanismo de expiracion automatica. Una excepcion verbal no es una excepcion — si no esta documentada con su caducidad, no existe.

cc_flow:
  tagline: Bucle cerrado estandar de 9 pasos
  title: De la solicitud de cambio al cierre y retencion
  subtitle: 'Un bucle documentado para cada cambio de parametro: proponer, cribar, evaluar, aprobar, validar, pilotar, verificar, revisar, cerrar.'
  steps:
    - step: '01'
      title: Solicitud de cambio (ECR)
      desc: 'Cualquier departamento puede presentar una solicitud, pero Ingenieria, Calidad o la direccion de Produccion la patrocinan. La ECR responde por que se propone el cambio, que cambia, que se ve afectado y como se verificara — con numero de control de cambios, NCR/CAPA relacionado, parametro actual vs propuesto, lotes afectados y clasificacion temporal/permanente.'
    - step: '02'
      title: Cribado inicial y contencion
      desc: 'La solicitud se criba primero para determinar la contencion inmediata: debe detenerse el metodo actual ahora? Si se permite una desviacion temporal, queda limitada por ventana de validez, alcance de lote, limite de cantidad y expiracion automatica.'
    - step: '03'
      title: Evaluacion de impacto y riesgos
      desc: 'Ingenieria, Calidad, Produccion, Compras/Cadena de suministro y Proyecto evaluan el rendimiento del producto, los criterios de aceptacion, la compatibilidad de materiales, la apariencia, la capacidad del proceso, los equipos e instrumentos, la cualificacion del personal, los requisitos del cliente, el cumplimiento normativo y el alcance de trazabilidad.'
    - step: '04'
      title: Revision y aprobacion conjunta
      desc: 'La aprobacion sigue la matriz de autorizacion fija — no "quien grita mas". Los cambios de alto riesgo requieren aprobacion interdepartamental y, cuando corresponde, aprobacion escrita del cliente antes de cualquier prueba.'
    - step: '05'
      title: Plan de validacion
      desc: 'Para cambios de alto riesgo se requiere un plan de validacion aprobado antes de la aplicacion rutinaria: lotes de muestra representativos, metodo actual vs propuesto, metodos de ensayo, criterios de aceptacion, etapas de inspeccion, responsables y calendario.'
    - step: '06'
      title: Piloto controlado e implementacion
      desc: 'Se publican los nuevos documentos y se retiran y marcan como OBSOLETOS los obsoletos; se verifican y calibran los nuevos materiales e instrumentos; se forma y cualifica a los operadores; el primer lote se ejecuta bajo inspeccion intensificada con identificacion de estado clara.'
    - step: '07'
      title: Reinspeccion y revision de eficacia
      desc: 'Se miden y revisan la tasa de primera pasada del retrabajo, la tasa de aprobacion de la reinspeccion, la tasa de recurrencia y la aceptacion de especificaciones antes de considerar eficaz el cambio — un lote reparado nunca se trata como validacion del proceso.'
    - step: '08'
      title: Revision de documentos y formacion
      desc: 'Las instrucciones de trabajo, hojas de inspeccion, opciones de disposicion NCR, tarjetas de parametros y materiales de formacion se actualizan a la nueva revision con formacion practica registrada y cualificacion de operadores.'
    - step: '09'
      title: Cierre y retencion de registros
      desc: 'El cambio se cierra solo tras revisar y aprobar la evidencia de validacion, las actualizaciones documentales, los registros de formacion y la eficacia de la implementacion. Si no se logra el resultado previsto, el cambio se revisa, extiende, suspende o retira.'

