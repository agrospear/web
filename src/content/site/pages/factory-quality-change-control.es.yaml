cc_pokayoke:
  tagline: Salvaguardas anti-error
  title: 'Poka-Yoke: bloques duros que detienen el cambio no controlado'
  subtitle: El estandar no se aplica solo con procedimientos, sino con bloqueos fisicos y de sistema que hacen imposible ejecutar un cambio no controlado.
  features:
    - icon: 1
      icon_bg: blue
      title: Puerta ECR para desbloqueo de equipos
      desc: 'Las estaciones de retrabajo leen un codigo de barras ECR firmado por Calidad antes de que se desbloqueen los molinos de arena, mezcladores de alto corte y maquinas de llenado. Sin registro de control de cambios aprobado, sin suministro — la firma retroactiva ("cambiar primero, firmar despues") queda bloqueada fisicamente.'
    - icon: 2
      icon_bg: green
      title: Expiracion automatica de la desviacion temporal
      desc: 'Las desviaciones temporales tienen un tope duro en el sistema (por ejemplo, un maximo de 5 lotes o 7 dias naturales). Al alcanzar el tope, el lote se bloquea y se impide imprimir la etiqueta de liberacion del envio hasta que el cambio se evalue formalmente.'
    - icon: 3
      icon_bg: purple
      title: Evidencia minima de validacion
      desc: 'Los cambios de alto riesgo requieren al menos 5 lotes de muestra representativos que cubran los limites de tolerancia superior e inferior, inspeccionados por completo por 2 inspectores de Calidad independientes, antes de poder emitir un informe de validacion — un lote reparado nunca se trata como validacion del proceso.'
    - icon: 4
      icon_bg: orange
      title: Control documental 1-a-1
      desc: 'Las tarjetas de estacion obsoletas se recogen fisicamente y se cancelan (perforadas) antes de emitir la nueva tarjeta sellada con el sello rojo controlado — las versiones antigua y nueva nunca comparten una estacion de trabajo.'

