hero:
  tagline: 'Fabricación · I+D'
  title: 'Centro de Investigación y Desarrollo'
  subtitle: 'Nuestro centro de I+D impulsa el desarrollo de formulaciones agroquímicas personalizadas — desde cribado en laboratorio y lotes piloto hasta formulaciones listas para producción bajo tu marca.'

answer:
  label: 'Respuesta directa'
  text: 'Nuestro centro de I+D ofrece capacidades completas de desarrollo de formulación: ingeniería de formulación, producción en planta piloto, laboratorio de inspección de calidad y taller de prototipos. Desarrollamos formulaciones agroquímicas personalizadas desde tus requisitos a través de cribado en laboratorio, lotes piloto y transferencia a producción a escala. Plazo típico: 25–35 días para formulaciones existentes, 60–90 días para nuevos registros.'
  verified: '2026-08'

intro:
  - Nuestro centro de I+D es el motor detrás de cada formulación personalizada: desde el cribado inicial en laboratorio y las pruebas de compatibilidad hasta la producción en planta piloto y las especificaciones listas para producción. Cada producto de Agrospear empieza aquí antes de llegar a la línea de producción.
  - Desarrollamos formulaciones agroquímicas personalizadas desde tus requisitos — cultivo objetivo, espectro de plagas, mercado y estado de registro — a través de un proceso de desarrollo estructurado con hitos documentados y puntos de control de calidad.

