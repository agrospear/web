faqs:
  tagline: FAQ
  title: 'Centro de I+D — Preguntas frecuentes'
  items:
    - q: '¿Cuál es el plazo típico de desarrollo para una formulación personalizada?'
      a: '25–35 días para formulaciones existentes (concentración adaptada, sistema de coadyuvantes o embalaje). 60–90 días para formulaciones nuevas que requieren validación de estabilidad, cribado de compatibilidad y documentación de registro. El plazo se confirma tras la revisión inicial de especificaciones.'
    - q: '¿Puedo visitar el centro de I+D durante mi proyecto?'
      a: 'Sí. Hay disponibles visitas presenciales y recorridos en vídeo por el centro de I+D. Muchos clientes visitan durante la producción piloto para observar los ensayos de formulación y dar retroalimentación en tiempo real sobre las especificaciones del producto.'
    - q: '¿Desarrolláis formulaciones para nuevos ingredientes activos?'
      a: 'Sí. Desarrollamos formulaciones a partir de tu ingrediente activo suministrado o lo obtenemos a través de nuestra red de proveedores aprobados. Las formulaciones con IA nuevo requieren plazos de desarrollo extendidos para validación de estabilidad y cribado de compatibilidad.'
    - q: '¿Cómo se documentan los hitos de desarrollo?'
      a: 'Cada proyecto sigue un protocolo de desarrollo documentado: brief de formulación, informe de cribado en laboratorio, registro de lote piloto, datos de estabilidad, ficha de especificación y protocolo de transferencia a producción. Todos los documentos se comparten con el cliente en cada hito.'

