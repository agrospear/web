answer:
  label: 'Respuesta directa'
  text: 'Las marcas australianas piden productos agroquímicos a Agrospear con condiciones estándar: MOQ confirmado por configuración del proyecto — muestra de 1–4 toneladas, lote piloto de 5 toneladas y producción de volumen estándar de 20+ toneladas por lote. La primera muestra sale en 7–12 días tras la aprobación de la especificación, la producción transcurre en 25–35 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a Sídney, Melbourne o Brisbane. La documentación de soporte para registro APVMA y datos de permiso de importación se preparan con la muestra aprobada. Entre producción y flete, pide con 3–4 meses de antelación para tener stock en la tienda; el DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

