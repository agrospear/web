why_australia:
  tagline: 'Por qué los compradores en Australia'
  title: 'Pensado para el mercado australiano'
  subtitle: 'Para las marcas australianas el calendario y el cumplimiento importan por igual: haz los pedidos en la primera mitad del año para que los contenedores lleguen antes de la temporada de pulverización, y prepara la documentación APVMA en paralelo.'
  items:
    - title: 'Soporte de registro APVMA'
      description: 'La Autoridad de Pesticidas y Medicamentos Veterinarios de Australia (APVMA) exige el registro del producto antes de su importación y venta. Agrospear proporciona documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo y archivos de composición de formulación para respaldar tu solicitud APVMA y tu proceso de permiso de importación.'
    - title: 'Planificación por temporada'
      description: 'La temporada de pulverización australiana va de septiembre a noviembre. Con 25–35 días de producción y 4–6 semanas de flete, hacer el PO en el primer semestre pone el stock en tus estanterías antes del pico.'
    - title: 'DDP para un coste total predecible'
      description: 'El DDP incluye despacho de aduanas, aranceles, impuestos y entrega en tu almacén — un solo total, puerta a puerta.'
    - title: 'FOB Qingdao con tu propio agente de carga'
      description: '¿Importas con regularidad? Elige FOB Qingdao y usa tu propio socio logístico — nosotros cargamos y documentamos el contenedor, tú controlas el resto.'
    - title: 'Una fábrica, un sistema de calidad'
      description: 'El desarrollo, el muestreo, la producción y el control de calidad ocurren dentro de la planta de 12.500 m² — la muestra que apruebas es el producto que recibes.'

process_notes:
  tagline: 'Cómo funciona'
  title: 'De la especificación al contenedor'
  subtitle: 'Las mismas seis etapas tanto si compras dos contenedores al año como veinte: especificación, I+D, muestreo, pruebas, desarrollo de formulación, producción — y entrega FOB, CIF o DDP.'
  items:
    - title: '1. Envía tu especificación'
      description: 'Basta con un producto de referencia, un brief técnico o la especificación de un competidor. La revisión de I+D y el presupuesto vuelven en un día laborable.'
    - title: '2. Aprueba la muestra'
      description: 'Tu primera muestra física sale en 7–12 días con una hoja de aprobación que cubre composición, propiedades físicas y resultados de ensayos de estabilidad — más documentación lista para APVMA.'
    - title: '3. Producción y exportación'
      description: 'Las tiradas se completan en 25–35 días con puntos de control de calidad durante el proceso. La lista de empaque, la factura y el conocimiento de embarque viajan antes que el buque.'
    - title: '4. Entrega en tu almacén'
      description: 'De 4 a 6 semanas de flete marítimo a Sídney, Melbourne o Brisbane — con DDP gestionamos el despacho y la entrega hasta tu puerta.'

faq_section:
  tagline: FAQ
  title: 'Preguntas sobre importación a Australia'
  questions:
    - q: ¿Agrospear proporciona documentación de registro APVMA?
      a: 'Sí. Agrospear proporciona documentación de registro ICAMA, datos de especificación FAO/OMS, certificados de ingrediente activo y archivos completos de composición de formulación para respaldar tu solicitud de registro de producto ante la APVMA y tu proceso de permiso de importación. Tu asesor regulatorio utiliza estos archivos para preparar la presentación APVMA.'
    - q: ¿Qué es un permiso de importación australiano para agroquímicos?
      a: 'La APVMA emite permisos de importación para productos químicos agrícolas aún no registrados en Australia. Agrospear suministra el paquete de datos técnicos — composición, resúmenes toxicológicos, datos de residuos y especificaciones de formulación — que tu agente local presenta con la solicitud de permiso.'
    - q: ¿Cuánto tarda el flete marítimo a Australia?
      a: 'Cuenta con 4–6 semanas desde el puerto de Qingdao hasta Sídney, Melbourne o Brisbane, según el itinerario de navegación. Los proyectos DDP incluyen el calendario completo puerta a puerta.'
    - q: ¿Cuándo debo pedir para tener stock antes de la temporada de pulverización?
      a: 'La producción tarda 25–35 días y el flete 4–6 semanas, así que pide con unos 3–4 meses de antelación a la fecha en que necesitas el stock. Para la temporada de septiembre–noviembre, haz el PO en la primera mitad del año.'
    - q: ¿Enviáis con DDP a Australia?
      a: 'Sí. El DDP incluye flete marítimo, despacho de aduanas, aranceles e impuestos y entrega en tu almacén — un total predecible. También ofrecemos FOB Qingdao y CIF.'
    - q: ¿Cuál es el MOQ para importar agroquímicos de marca privada?
      a: 'MOQ confirmado por configuración del proyecto: las muestras cubren 1–4 toneladas, los lotes piloto corren 5 toneladas sobre plataformas existentes, y la producción de volumen estándar corre 20+ toneladas por lote.'
    - q: ¿Cómo inicio un proyecto desde Australia?
      a: 'Envía un producto de referencia, un brief técnico o una especificación. La revisión de I+D y el presupuesto vuelven en un día laborable, y se firma un NDA antes de cualquier intercambio de archivos.'

