answer:
  label: 'Straight answer'
  text: '100% of batches are tested for active content by HPLC/GC, suspensibility (CIPAC MT 15), and 54 °C accelerated stability for 14 days (CIPAC MT 46), with auto-reject on active content deviation beyond ±2%. Raw material batches are verified by certificate of analysis and identity testing, and in-process checks run every production stage with AQL 2.5 final sampling per ISO 2859.'
  verified: '2026-08'

intro: Agrospear operates a dedicated quality control laboratory that operates independently from production. Every batch of raw material and every finished agrochemical formulation passes through documented inspection protocols before release. Our QC team reports directly to management, ensuring impartial quality decisions.

highlights:
  - value: 100%
    label: Batches tested
    detail: Every raw material, every finished product
  - value: 14 d
    label: Accelerated stability test duration
    detail: At 54 °C per CIPAC MT 46
  - value: ±2%
    label: Max active content deviation
    detail: Over specification range
  - value: AQL 2.5
    label: Major defect threshold
    detail: Per ISO 2859 sampling

test_procedures:
  - title: Raw Material Inspection
    description: Every incoming batch of active ingredient, solvent, surfactant, adjuvant, and packaging component is tested before acceptance. Active content by HPLC/GC, moisture, particle size, pH, and identity confirmation are verified. Non-conforming materials are quarantined and returned.
    standards:
      - HPLC/GC (active content)
      - CIPAC MT 15 (suspensibility)
      - ICAMA/FAMI-QS (identity)
  - title: In-Process QC Checkpoints
    description: Production operators perform self-inspection at each stage. QC auditors conduct random sampling throughout the shift. Active content checks are performed after compounding. Particle size and viscosity checks happen after milling. Fill weight and torque verification after filling.
    standards:
      - CIPAC MT 15 (suspensibility)
      - Internal 100-point checklist
      - ISO 2859 sampling
  - title: 54 °C Accelerated Stability Test
    description: Every formulation batch is held at 54 °C for 14 days per CIPAC MT 46. Active content, suspensibility, emulsion stability, pH, and appearance are tested before and after. Any batch showing sedimentation, phase separation, or active content degradation beyond tolerance triggers automatic batch re-inspection.
    standards:
      - CIPAC MT 46 (stability)
      - FAO/WHO specifications
  - title: Final Specification Verification
    description: Completed formulations are tested against the full project specification — active content, suspensibility, emulsion stability, pH, viscosity, particle size, and appearance. Each batch undergoes complete analytical verification before final inspection approval.
    standards:
      - CIPAC MT 36 (emulsion)
      - CIPAC MT 75 (particle size)
      - FAO/WHO specifications

equipment:
  - name: HPLC System (active content)
    spec: UV/DAD detector, validated methods per CIPAC
  - name: GC System (volatile AI)
    spec: FID/ECD detector, headspace capability
  - name: Stability Chamber
    spec: 54 °C ±2 °C, CIPAC MT 46 compliant
  - name: Particle Size Analyzer (laser diffraction)
    spec: 0.01–3,500 µm range
  - name: pH Meter (calibrated)
    spec: ±0.01 resolution, temperature compensated
  - name: Viscometer (rotational)
    spec: 0.3–6,000 mPa·s range
  - name: Suspensibility Test Apparatus
    spec: CIPAC MT 15 compliant

