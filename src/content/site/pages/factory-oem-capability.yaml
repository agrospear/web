answer:
  label: 'Straight answer'
  text: 'MOQ is confirmed by project configuration rather than a fixed number: every project moves through sample (1–4 tons) and pilot (5 tons) stages, with standard volume production running 20+ tons per batch. Samples are ready in 7–12 days; standard production runs 25–35 days after confirmed PO and deposit.'
  verified: '2026-08'

intro: Agrospear offers comprehensive OEM and ODM services for brands, distributors, and government agencies worldwide. With 10+ years of export experience and a 12,500 m2 ISO 9001, ISO 14001 & BSCI certified factory, we handle everything from formulation design and registration support to full-scale production, packaging, and export management.

