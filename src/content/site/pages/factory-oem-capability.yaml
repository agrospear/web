services:
  - title: Formulation Design & Engineering
    description: Our in-house R&D team works with your concept or spec to develop custom formulations in SC, EC, WP, WDG, SL, ME, CS, and FS. We offer formulation optimization, active ingredient selection, and regulatory guidance.
  - title: Custom Branding & Labeling
    description: Multi-language GHS-compliant labeling, private-label packaging, and custom container colors. We develop brand-specific label artwork, regulatory text, and retail-ready packaging.
  - title: Material & Specification Customization
    description: Choose from herbicides, insecticides, fungicides, PGRs, and seed treatments across multiple formulation types. Custom concentrations, carrier systems, and packaging configurations.
  - title: Packaging & Logistics
    description: Custom retail packaging, private-label drums and bottles, palletizing, and export-grade packing prepared in-house.

moq_table:
  - product: Agrochemical Formulations
    standard_moq: 'Sample 1–4 tons | Pilot 5 tons'
    custom_moq: 'Volume 20+ tons per batch'
    lead_time: 25–35 days

why_us:
  - title: Vertical Integration
    description: We own our factory, formulations, and supply chain —no middlemen, no subcontractors. This gives us control over quality, cost, and delivery.
  - title: Triple Certification
    description: ISO 9001 quality management, ISO 14001 environmental management, and BSCI social compliance certification. Factory audit reports available upon request.
  - title: ICAMA Registration Support
    description: ICAMA registration applies to formulations destined for regulated markets (scope confirmed per project). Custom formulations can be registered through our established process.
  - title: Project-Specific MOQ
    description: 'MOQ is confirmed by your project configuration — small-batch co-branding starts at 5 tons, standard volume runs 20+ tons per batch. We help emerging brands launch without overcommitting inventory.'

