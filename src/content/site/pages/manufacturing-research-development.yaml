faqs:
  tagline: FAQ
  title: 'R&D Center — Frequently Asked Questions'
  items:
    - q: 'What is the typical development timeline for a custom formulation?'
      a: '25–35 days for existing formulations (adapted concentration, adjuvant system or packaging). 60–90 days for new formulations requiring stability validation, compatibility screening and registration documentation. Timeline is confirmed after the initial specification review.'
    - q: 'Can I visit the R&D center during my project?'
      a: 'Yes. In-person visits and remote video walkthroughs of the R&D center are available. Many clients visit during pilot production to observe formulation trials and provide real-time feedback on product specifications.'
    - q: 'Do you develop formulations for new active ingredients?'
      a: 'Yes. We develop formulations from your supplied active ingredient or source it through our approved supplier network. New AI formulations require extended development timelines for stability validation and compatibility screening.'
    - q: 'How are development milestones documented?'
      a: 'Every project follows a documented development protocol: formulation brief, lab screening report, pilot batch record, stability data, specification sheet and production transfer protocol. All documents are shared with the client at each milestone.'

