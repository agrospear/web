answer:
  label: 'Straight answer'
  text: 'Our R&D center provides full formulation development capabilities: formulation engineering, pilot plant production, quality inspection lab and prototype workshop. We develop custom agrochemical formulations from your requirements through lab screening, pilot batches and full-scale production transfer. Typical development timeline: 25–35 days for existing formulations, 60–90 days for new registrations.'
