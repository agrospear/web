capabilities:
  tagline: Capabilities
  title: R&D Capabilities
  subtitle: Four core disciplines that give us end-to-end control over formulation development — from active ingredient research to final registration.
  groups:
    - title: Formulation Chemistry & Co-formulant Technology
      items:
        - Active ingredient compatibility analysis and co-formulant selection optimization
        - UV stabilisation, anti-settling agent, and shelf stability additive development
        - Multi-component formulation design and synergistic combination development
        - Accelerated stability testing (thermal cycling, cold stability, long-term storage)
    - title: Particle Size Engineering & Dispersion Systems
      items:
        - Bead mill and sand mill grinding process optimization for SC and WDG formulations
        - Particle size distribution control and suspension rate optimization
        - Emulsion and microemulsion system development for EC and ME formulations
        - Custom dispersion system development for challenging active ingredients
    - title: Manufacturing Process Development
      items:
        - Scale-up from lab batch to pilot production and full manufacturing
        - Mixing, grinding, granulation and filling process optimization
        - Solvent system and carrier qualification for different formulation types
        - Process parameter modelling and production efficiency prediction
    - title: Registration Support & Compliance
      items:
        - ICAMA data package preparation and regulatory dossier support
        - Five-batch analysis and product specification development
        - Custom test protocol development for procurement qualification
        - Field trial coordination and bioefficacy data management

