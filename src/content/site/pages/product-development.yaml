answer:
  label: 'Straight answer'
  text: 'Agrochemical formulation development at Agrospear runs six stages — product specification, R&D and formulation design, prototype sampling, testing and validation, formulation development, and mass production. The first physical sample ships 7–14 days after specification approval; production runs 25–35 days after confirmed PO and deposit; new formulation development adds 15–20 days.'
  verified: '2026-08'

stages:
  title: 'The Six Stages of Agrochemical Formulation Development'
  subtitle: 'Each stage has a clear deliverable, so you always know where your project stands — and what arrives next.'
  items:
    - title: '1. Idea & Product Specification'
      description: 'Active ingredient, concentration, formulation type, target crop and packaging requirements. A reference product, technical dossier or competitor spec is enough to start.'
      icon: 'tabler:bulb'
    - title: '2. R&D & Formulation Design'
      description: 'Formulation chemistry, adjuvant selection and solvent system design, plus a manufacturability review and quotation — returned within one business day.'
      icon: 'tabler:blueprint'
    - title: '3. Prototype Sampling'
      description: 'Your first physical sample ships in 7–14 days, documented with an approval sheet covering composition, physical properties and stability test results.'
      icon: 'tabler:tools'
    - title: '4. Testing & Validation'
      description: 'Stability testing, content analysis and physical property checks against the approved sample, with ICAMA, FAO and WHO documentation prepared for your target markets.'
      icon: 'tabler:test-pipe'
    - title: '5. Formulation Development & Mass Production'
      description: 'Custom formulation development in 15–20 days when needed; production runs 25–35 days with in-process QC checkpoints and batch traceability.'
      icon: 'tabler:settings'
    - title: '6. Delivery & Scale'
      description: 'FOB, CIF or DDP logistics to 50+ countries — then repeat orders on your established line with stable lead times and approved label design on file.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Why Development Inside a Factory Beats a Brokered Project'
  subtitle: 'Development work sitting inside the production plant changes what you get at every stage.'
  items:
    - title: No Design Handoff Gaps
      description: 'The R&D and formulation team works on the same floor as the production line — a formulation change goes to production the same week, not after a commercial round trip.'
      icon: 'tabler:handshake'
    - title: Samples That Match Production
      description: 'The sample batch and the production batch share the same equipment, raw materials and QC stations, so the approved sample is what you actually receive at container scale.'
      icon: 'tabler:stack-2'
    - title: Engineering That Sells Nothing
      description: 'Decisions are made against target cost, efficacy and regulatory compliance — not against upsell margins, because this is a factory and production is the only revenue.'
      icon: 'tabler:scale'
    - title: Confidentiality as a Standing Contract
      description: 'An NDA is signed before any file exchange, and your label designs, formulation files and specification documents remain your property — never reused, resold or shown to another client.'
      icon: 'tabler:lock'

