faq_section:
  tagline: FAQ
  title: 'Agrochemical Formulation Development Frequently Asked Questions'
  questions:
    - q: Can you develop an agrochemical product from an idea?
      a: 'Yes. We support the full journey from product specification and R&D through prototype development, customization and mass production based on your requirements. A technical brief, a reference product or even a competitor specification is enough to start the formulation review.'
    - q: What does agrochemical formulation development cost?
      a: 'The specification review and R&D assessment are free and returned within one business day. Prototype sampling is quoted per project after the spec is fixed; production pricing depends on raw materials, volume and whether custom formulation development is required.'
    - q: How long does agrochemical formulation development take?
      a: 'The first sample ships 7–14 days after specification approval, with 3–7 days per revision round. Production runs 25–35 days after PO and deposit. Custom formulation development adds 15–20 days up front, and sea freight adds 4–6 weeks to most destinations.'
    - q: What comes first — sample or production?
      a: 'Always the sample. A physical prototype is produced, tested and approved against the specification before any production run starts. We do not run bulk production on unapproved formulations.'
    - q: Do you sign an NDA for formulation development?
      a: 'Yes. An NDA is signed before any file exchange, and your designs, label artwork and formulation files remain your property throughout development and manufacturing.'
    - q: Can you protect my agrochemical formulation and specifications?
      a: 'Customer formulations, specifications and product concepts are handled confidentially during development and manufacturing. Your formulation files are never reused, resold or shown to another client.'

