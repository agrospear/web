faqs:
  title: 'Preguntas frecuentes sobre la producción OEM'
  subtitle: 'Respuestas a las preguntas más habituales de las marcas que lanzan su propia línea de adyuvantes.'
  items:
    - title: '¿Cómo creo mi propia marca de adyuvantes?'
      description: 'Lanza tu marca: briefing, diseño de formulación, prototipo con documentación ICAMA, producción en serie y entrega. Muestras en 7–14 días y producción en 25–35 días a partir del pedido y del depósito. Explora nuestros paquetes OEM.'
    - title: '¿Cuál es el plazo de producción?'
      description: 'La muestra está lista en 7–14 días y la producción en serie en 25–35 días después del pedido y del depósito, según el volumen.'
    - title: '¿El adyuvante lleva nuestra etiqueta?'
      description: 'Sí: marca privada completa con etiquetas personalizadas, marca en tambores, embalaje y fichas de datos de seguridad en tu marca.'
    - title: '¿Puedo comprar en gran volumen desde el primer día?'
      description: 'El MOQ se confirma según la configuración del proyecto — muestra (1–4 toneladas), piloto (5 toneladas) y volumen estándar (20+ toneladas por lote), con precios al por mayor que mejoran a medida que aumenta el volumen.'

