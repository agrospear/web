answer:
  label: 'Respuesta directa'
  text: 'La cantidad mínima de pedido se confirma según la configuración del proyecto: muestra (1–4 toneladas), piloto (5 toneladas sobre plataformas existentes) y volumen estándar (20+ toneladas por lote de producción), con co-branding desde cantidades menores. Las muestras se envían en 7–14 días; la producción en serie tarda 25–35 días tras la confirmación del pedido y el depósito. Documentación ICAMA y FAO/OMS preparada para tus mercados objetivo, y toda la documentación de conformidad incluida en cada pedido.'
  verified: '2026-08'
  image:
    src: https://assets.agrospear.com/site/products/adjuvant-series/adjuvant-spreadertest-1.webp
