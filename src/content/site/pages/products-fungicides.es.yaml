faqs:
  tagline: FAQ
  title: 'Formulaciones de Fungicidas — Preguntas Frecuentes'
  items:
    - q: '¿Qué tipos de formulación de fungicidas fabrica Agrospear?'
      a: 'SC, WP, WDG y FS. La elección depende del ingrediente activo, el patógeno objetivo, el método de aplicación y las preferencias de registro regional.'
    - q: '¿Cuál es la diferencia entre acción fungicida protectora y curativa?'
      a: 'Los fungicidas protectores forman una barrera química en la superficie de la planta antes de la infección. Los curativos (sistémicos) se absorben en el tejido vegetal y pueden detener infecciones en etapa temprana. Los programas eficaces suelen combinar ambos modos.'
    - q: '¿Cómo maneja Agrospear la resistencia a fungicidas?'
      a: 'Seguimos la clasificación FRAC y diseñamos programas de pulverización que alternan o mezclan principios activos de diferentes grupos de modo de acción, reduciendo la selección de cepas resistentes.'
    - q: '¿Qué tramos de MOQ están disponibles para fungicidas?'
      a: 'Muestras desde 1–4 toneladas, pilotos desde 5 toneladas y producción estándar desde 20+ toneladas. Plazo de 25–35 días desde la especificación confirmada.'
    - q: '¿Qué tipos de formulación de fungicidas fabricáis?'
      a: 'Fabricamos concentrados en suspensión (SC), gránulos dispersables en agua (WDG), polvos mojables (WP), concentrados emulsionables (EC) y concentrados fluidos para tratamiento de semillas (FS). La elección depende del activo, el patógeno objetivo, el método de aplicación y la preferencia de registro regional.'
    - q: '¿Apoyáis los requisitos de intervalo pre-cosecha (LMR) cortos?'
      a: 'Sí. Para productos frescos orientados a la exportación con límites máximos de residuos (LMR) estrictos, formulamos fungicidas de baja dosis y corto IPC y proporcionamos datos de residuos. Nuestro equipo técnico asesora sobre dosis y calendario para mantener la conformidad con las normas de residuos del mercado de destino.'
    - q: '¿Producís formulaciones para invernadero o cultivos protegidos?'
      a: 'Sí. Desarrollamos formulaciones SC y ME de baja dosis y alta eficacia para hortalizas y flores de invernadero, con intervalos pre-cosecha cortos, riesgo mínimo de fitotoxicidad y ajuste de pH y coadyuvantes para sistemas de sustrato e hidropónicos.'
    - q: '¿Qué datos de registro suministráis para fungicidas?'
      a: 'Proporcionamos análisis de cinco lotes, estabilidad acelerada y a largo plazo, métodos analíticos, datos de toxicología y residuos, e informes de eficacia de campo — el expediente completo para registrar tu marca de fungicida en tus mercados objetivo.'
    - q: '¿Cuál es la vida útil de vuestras formulaciones de fungicidas?'
      a: 'La mayoría de las formulaciones SC, WDG, WP y FS tienen una vida útil de 2 años en condiciones de almacenamiento recomendadas, respaldada por datos de estabilidad acelerada y a largo plazo incluidos en el paquete técnico.'
    - q: '¿Qué documentación de exportación se incluye?'
      a: 'Cada envío incluye certificado de análisis, certificado de origen, FDS/MSDS, etiquetado conforme a GHS y documentación fitosanitaria, para que el despacho de aduanas sea fluido en tu mercado de destino.'

