intro:
  - Las enfermedades fúngicas reducen la producción global de cultivos en un 10–20% estimado anualmente. El portfolio de fungicidas de Agrospear ofrece tanto protección barrera preventiva como acción sistémica curativa frente a los principales grupos de patógenos.
  - Cada formulación se diseña para estabilidad, adherencia resistente a la lluvia y cumplimiento de las normas internacionales. Programas de manejo de resistencia alineados con FRAC se integran en cada recomendación para prolongar la vida útil del producto.

