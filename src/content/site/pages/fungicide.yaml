faqs:
  - question: 'What is the difference between preventive and curative fungicide action?'
    answer: 'Preventive (protective) fungicides such as mancozeb and chlorothalonil form a chemical barrier on the plant surface before infection occurs. Curative (systemic) fungicides like propiconazole and tebuconazole are absorbed into plant tissue and can arrest early-stage infections that have already penetrated. Effective disease programs typically combine both modes for layered protection.'
  - question: 'How does Agrospear manage fungicide resistance?'
    answer: 'We follow FRAC classification and design spray programs that alternate or mix AIs from different mode-of-action groups. For example, pairing a Group M3 dithiocarbamate (mancozeb) with a Group 3 DMI (tebuconazole) in a premix reduces selection for DMI-resistant strains. Our technical bulletins provide partner-specific resistance-risk assessments for key pathogen-crop combinations.'
  - question: 'Does Agrospear produce fungicide seed treatment formulations?'
    answer: 'Yes. Our Flowable Concentrates for Seed Treatment (FS) are formulated for uniform film-coat application on cereals, vegetables, and cash crop seeds. FS formulations feature optimized viscosity, low dust-off, and rapid drying for high-throughput seed treatment lines. Common AIs include fludioxonil, metalaxyl, and tebuconazole in single or combination products.'
  - question: 'What quality controls apply to fungicide manufacturing?'
    answer: 'Every batch undergoes AI content verification by HPLC, particle-size analysis, suspensibility testing (> 90 % after 30 min for SC/FS), and accelerated stability (54 °C, 14 days). Our GMP-certified facility maintains full batch traceability and retains samples for two years post-shipment.'
body: |
  <h2>Full-Spectrum Fungicide Manufacturing for Field and Greenhouse Crops</h2>
  <p>Fungal diseases reduce global crop output by an estimated 10–20 % annually. Agrospear's fungicide portfolio delivers both preventive barrier protection and curative systemic action across the major pathogen groups — Ascomycetes, Basidiomycetes, Deuteromycetes, and Oomycetes. Core active ingredients include azoxystrobin (Group 11, strobilurin, broad-spectrum preventive), propiconazole (Group 3, DMI, curative systemic), mancozeb (Group M3, multi-site contact protective), carbendazim (Group 1, MBC, curative), and tebuconazole (Group 3, DMI, systemic curative and protective). These chemistries are available in Suspension Concentrates (SC), Water-Dispersible Granules (WDG), Wettable Powders (WP), and Flowable Concentrates for Seed Treatment (FS).</p>

  <h2>FRAC-Aligned Resistance Management Programs</h2>
  <p>Fungicide resistance has become a critical challenge, particularly among DMI-resistant powdery mildew populations and QoI-resistant downy mildew strains. Agrospear's product development follows FRAC guidelines rigorously: we design premixes that combine multi-site protectants with single-site systemics, recommend spray interval and application-rate strategies that limit selection pressure, and provide resistance-monitoring protocols to distribution partners. Our dual-AI formulations — such as azoxystrobin + propiconazole SC — deliver simultaneous protective and curative activity while reducing the per-application selection window for resistant biotypes.</p>

  <h2>Seed Treatment and Foliar Fungicide Platforms</h2>
  <p>Seed-borne and soil-borne pathogens demand early intervention. Our FS platform produces low-viscosity, high-suspensibility flowable concentrates optimized for film-coat and slurry treatment equipment. Key seed-treatment AIs — fludioxonil, metalaxyl-M, tebuconazole — are available as standalone FS products or in insecticide-fungicide combinations for comprehensive seedling protection. For foliar applications, our SC and WDG formulations achieve particle sizes below 5 µm D90, ensuring even canopy coverage and rainfast adhesion through advanced sticker-spreader adjuvant systems.</p>

  <h2>Greenhouse Specialty Formulations</h2>
  <p>Protected-culture environments present unique challenges: high humidity, dense planting, and strict residue limits for fresh-market produce. Agrospear develops low-rate, high-efficacy SC and ME fungicide formulations specifically for greenhouse vegetable and flower crops, with short pre-harvest intervals and minimal phytotoxicity risk. Our technical team can tailor pH, adjuvant packages, and application-rate recommendations for substrate-grown and hydroponic production systems.</p>

