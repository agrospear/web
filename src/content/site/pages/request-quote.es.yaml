faqs:
  tagline: FAQ
  title: 'Solicitar Presupuesto — Preguntas Frecuentes'
  items:
    - q: '¿Qué información necesito proporcionar?'
      a: 'Tu tipo de negocio, especificaciones de producto objetivo (ingrediente activo, concentración, tipo de formulación), rango de cantidad del pedido, cronograma y cualquier requisito de cumplimiento. El brief toma 5–10 minutos. Si no estás seguro de algún campo, omítelo — haremos seguimiento.'
    - q: '¿Qué tan rápido recibiré una respuesta?'
      a: 'Recibes una respuesta en un día laborable. I+D revisa tu brief y devuelve una cotización detallada con MOQ, tarifas de muestra y un cronograma puerta por puerta.'
    - q: '¿Está protegida mi formulación?'
      a: 'Sí. Un NDA está disponible de inmediato — antes de que compartas cualquier información de propiedad. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellas.'
    - q: '¿Cuál es el pedido mínimo para empezar?'
      a: 'El punto de entrada es escalonado: primero 1–4 toneladas de muestra (7–14 días), un pedido de prueba de 5 toneladas (25–35 días), y luego series de volumen estándar de 20+ toneladas por configuración aprobada.'
    - q: '¿Se aplican tarifas de muestra?'
      a: 'Las tarifas de muestra se presupuestan en la etapa de revisión de factibilidad y se acreditan hacia tu pedido de producción. No se requiere compromiso hasta que revises y firmes el contrato.'

