use_cases:
  tagline: Qué Formulación para Qué Comprador
  title: 'Ajuste el Tipo de Formulación a Su Mercado Objetivo'
  subtitle: 'La elección de formulación no es solo una decisión de coste — define el perfil de seguridad, el riesgo de vida útil y el posicionamiento de marca que puede sostener.'
  grid: 'sm:grid-cols-3'
  features:
    - icon: W
      icon_bg: 'blue'
      title: 'WP para Coste y Volumen'
      desc: 'Menor coste de producción al punto de precio más competitivo. Ideal para marcas dirigidas a mercados sensibles al precio, activos genéricos y licitaciones gubernamentales de gran volumen donde el coste es el principal impulsor de compra. Seguridad aceptable con EPP estándar. Menor riesgo de garantía cuando se almacena correctamente.'
      link_label: 'Ver detalles de formulación OEM'
      href: /es/oem-manufacturing
    - icon: E
      icon_bg: 'green'
      title: 'EC para Rendimiento y Mezcla en Tanque'
      desc: 'La formulación de trabajo para ingredientes activos solubles en aceite. Excelente velocidad de efecto y amplia compatibilidad en mezcla de tanque hacen del EC el estándar para programas de insecticidas en cultivos en hilera, frutales y producción de hortalizas. El sistema base solvente requiere protocolos de manejo adecuados. Formulación de insecticida más popular a nivel global.'
      link_label: 'Soluciones de distribución y suministro'
      href: /es/solutions/distributor-partners
    - icon: S
      icon_bg: 'purple'
      title: 'SC para Seguridad y Marcas Modernas'
      desc: 'Mejor perfil de seguridad de manejo — sin polvo, sin solvente. Preferido para posicionamiento de marca premium, mercados de exportación con requisitos de seguridad estrictos y formulaciones de biopesticidas. El sistema base agua proporciona excelente experiencia de usuario y amplia compatibilidad con ingredientes activos. Mayor coste de material, pero posicionamiento de marca más fuerte y cuota de mercado creciente a nivel global.'
      link_label: 'Desarrollo de formulación'
      href: /es/odm-development

key_factors:
  heading: 'Factores Clave Más Allá del Tipo de Formulación'
  body: |
    El tipo de formulación es una variable en el rendimiento del producto. Tres factores adicionales importan tanto o más:

    - **Sistema de coadyuvantes** — Surfactantes, dispersantes y estabilizadores determinan la eficacia con la que el ingrediente activo llega al objetivo. Seleccionamos paquetes de coadyuvantes por proyecto y tipo de cultivo.
    - **Calidad del ingrediente activo** — No todo el material técnico de grado es igual. El material técnico de mayor pureza produce formulaciones más estables con mejor vida útil y eficacia consistente. Especificamos el grado de materia prima por proyecto.
    - **Embalaje y almacenamiento** — El embalaje adecuado (contenedores resistentes a UV, liners sellados, barreras de humedad) reduce drásticamente el riesgo de degradación. Todos nuestros productos usan embalaje apropiado independientemente del nivel de formulación.

faqs:
  tagline: Preguntas Frecuentes
  title: 'Tipo de Formulación — Preguntas Frecuentes'
  items:
    - q: '¿Qué tipo de formulación debo elegir para mi marca?'
      a: 'Depende de su mercado objetivo y posicionamiento de precio. Sensible al coste y licitaciones gubernamentales: WP. Programas de insecticidas y mezcla en tanque: EC. Marcas premium y mercados de seguridad: SC. Exportación y largas cadenas de suministro: WDG. La mayoría de las marcas modernas comienzan con SC como el mejor equilibrio de seguridad, eficacia y posicionamiento de mercado. Recomendamos según su mercado específico durante la revisión de viabilidad.'
    - q: '¿Puedo ofrecer múltiples tipos de formulación bajo una misma marca?'
      a: 'Sí — muchas marcas ofrecen dos o más tipos de formulación. Producimos las cuatro formulaciones en la misma línea con las mismas puertas de control de calidad, por lo que puede mezclar tipos de formulación dentro de un solo pedido. El ingrediente activo y el diseño de etiqueta pueden ser idénticos entre tipos; solo cambian la formulación y el embalaje.'
    - q: '¿Cuál es el estándar de prueba de calidad para todas las formulaciones?'
      a: 'Cada lote, independientemente del tipo de formulación, supera un análisis de contenido que confirma la concentración del ingrediente activo dentro de la especificación, más pruebas específicas por formulación: suspendibilidad (WP), estabilidad de emulsión (EC), estabilidad de suspensión (SC) y tiempo de desintegración (WDG). Todas las pruebas siguen los métodos de especificación FAO/OMS.'
    - q: '¿Cómo afecta el tipo de formulación a la vida útil?'
      a: 'Las formulaciones WP y WDG generalmente tienen la mayor estabilidad en estantería (24–36+ meses) como formulaciones secas. Las formulaciones EC pueden mostrar separación de solvente con el tiempo si no se almacenan correctamente. Las formulaciones SC requieren pruebas de estabilidad de suspensión para asegurar que no haya sedimentación ni apelmazamiento. Proporcionamos datos de vida útil por formulación de nuestros estudios de estabilidad durante la fase de cotización.'

