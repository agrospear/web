  description: 'Comparación de tipos de formulación agroquímica: Concentrado en Suspensión (SC), Concentrado Emulsionable (EC), Polvo Mojable (WP) y Gránulo Dispersable en Agua (WDG). Eficacia, estabilidad, coste y mejor uso.'
