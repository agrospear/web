hero:
  tagline: 'Guía de Formulación'
  title: 'Comparación de Tipos de Formulación Agroquímica'
  subtitle: 'Cuatro tipos de formulación, una línea de fabricación. Comprenda las diferencias de eficacia, estabilidad, coste y aplicación entre Concentrado en Suspensión (SC), Concentrado Emulsionable (EC), Polvo Mojable (WP) y Gránulo Dispersable en Agua (WDG) — y cuál se adapta a su cultivo objetivo y posición de mercado.'

answer:
  label: 'Comparación rápida'
  text: 'El Polvo Mojable (WP) es el más establecido y asequible — ideal para mercados sensibles al precio e ingredientes activos simples. El Concentrado Emulsionable (EC) ofrece un efecto rápida y excelente compatibilidad en mezcla de tanque para activos solubles en aceite. El Concentrado en Suspensión (SC) proporciona el mejor perfil de seguridad y facilidad de uso — la opción estándar de la industria para marcas modernas. El Gránulo Dispersable en Agua (WDG) combina comodidad de manejo con excelente estabilidad en estantería — preferido para mercados de exportación y posicionamiento premium. Las cuatro formulaciones se fabrican en la misma línea de producción con las mismas puertas de control de calidad; la diferencia está en las materias primas y los pasos de procesamiento.'
  verified: '2026-08'

