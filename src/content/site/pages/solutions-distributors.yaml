faqs:
  tagline: Distributor FAQ
  title: 'Distribution Program — Frequently Asked Questions'
  items:
    - q: 'What is the minimum wholesale order for a new distributor?'
      a: 'New distribution partners typically open with a sample order followed by a first shipment scheduled to their season. Exact minimums depend on territory size and the chosen product range; your account manager confirms the opening volume during catalog selection.'
    - q: 'Are territories exclusive?'
      a: 'Yes. The Agrospear distribution program is built on exclusive territories — each wholesale partner covers a defined country or region and receives pricing and program support for that market.'
    - q: 'Do you provide regulatory documentation for local registration?'
      a: 'Yes. Registration documentation support is included in the distributor program. ICAMA production license data, CoA templates and formulation specifications are provided to support local registration in your territory.'
    - q: 'What products can distributors order?'
      a: 'The complete Agrospear catalog: herbicides (glyphosate, glufosinate, atrazine and more), insecticides, fungicides, PGRs and seed treatments across SC, EC, WP, WDG, SL, ME, CS and FS formulations. Most partners open with 4–8 best-selling SKUs and expand in later seasons.'
    - q: 'How are orders shipped?'
      a: 'Orders leave our factory on scheduled sailings, with forward ordering available to stabilize freight costs. Your dedicated account manager plans production and dispatch around your forecast and the planting season calendar.'
    - q: 'How do I apply?'
      a: 'Use the application form on this page or contact us directly. Applications are reviewed by the distribution team, and we respond with next steps, including territory mapping and a draft agreement, within a few working days.'

