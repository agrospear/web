answer:
  label: 'Straight answer'
  text: 'Certified agrochemical factory in Qingdao, China: ISO 9001, ISO 14001, BSCI, ICAMA. 20,000 m² plant across 4 specialized workshops, 200+ workers, 50,000+ tons produced annually (4,000+ tons/month on automated production lines). Every batch is stability-tested at 54°C for 14 days, passes a 100-point production checklist, and carries 5-year material traceability.'
  verified: '2026-08'

intro:
  - As the manufacturing division of **Qingdao Vatrad Group Co., Ltd.**, Agrospear controls every stage of agrochemical manufacturing —from the arrival of raw active ingredients to the final pre-delivery inspection of the finished crop protection product. Our manufacturing facility in the Qingdao Economic Development Zone spans 20,000 square metres and houses dedicated workshops for raw material preparation, compounding and mixing, formulation grinding, filling and sealing, and quality testing.
  - By integrating formulation design, engineering, prototyping, manufacturing, and testing under one roof, we eliminate the inefficiencies of contract manufacturing and maintain direct control over product quality, raw material selection, and delivery timelines. Every formulation that leaves our workshop is produced by our people, on our equipment, to our standards.

