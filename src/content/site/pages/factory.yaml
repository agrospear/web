material_traceability:
  tagline: Traceability
  title: Material Tracking & Batch Control
  description: Every batch of raw material is assigned a unique lot number in our ERP system. From arrival through production to the finished product, each batch's bill of materials links back to the original supplier batch. This enables full upstream traceability for any quality or compliance inquiry.
  system: Custom ERP (Qingdao Vatrad Group internal system) + physical batch tags on each work order
  coverage: 100% of production materials —active ingredients, solvents, adjuvants, dispersants, emulsifiers, packaging
  records_retained: 5 years (per regulatory requirement)
  suppliers:
    - material: Technical-grade active ingredients
      source: Chinese and Indian suppliers
      certified: ISO 9001, ICAMA, REACH
    - material: Solvents & adjuvants
      source: Chinese and international suppliers
      certified: ISO 9001, REACH
    - material: Dispersants & emulsifiers
      source: Chinese suppliers + external partners
      certified: Internal QC + supplier ISO 9001
    - material: Packaging materials (drums, bottles, caps)
      source: Chinese OEM suppliers
      certified: ISO 9001, material certs per batch

