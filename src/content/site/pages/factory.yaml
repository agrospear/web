qc_section:
  tagline: Quality Control
  title: Testing & Quality Assurance Process
  subtitle: Every batch undergoes mandatory testing before shipping. Our quality lab operates independently from production and reports directly to management.
  steps:
    - step: '1'
      title: Raw Material Inspection
      desc: Technical-grade active ingredients, solvents, and adjuvants undergo HPLC/GC purity analysis, impurity profiling, and physical property verification before any batch enters production.
    - step: '2'
      title: 14-Day Stability Test at 54°C
      desc: Every production batch is held at 54°C for 14 days per CIPAC MT 46. Active content deviation above ±2% or physical instability triggers automatic rejection and specification re-inspection.
    - step: '3'
      title: Active Content & Specification Verification
      desc: Completed formulations are analyzed for active content by HPLC/GC and checked for suspensibility, emulsion stability, pH, viscosity, and particle size distribution. Each batch is verified against the product specification before release.

oem_section:
  tagline: OEM Projects
  title: Brand & OEM Partnership Case Studies
  subtitle: From concept to production —how we help global brands launch and scale their agrochemical product lines.
  cases:
    - challenge: European agrochemical distributor needed a private-label herbicide range with unique formulations, REACH-compliant ingredients, and retail-ready packaging —all delivered in 60 days.
      solution: Developed custom SC formulations, sourced REACH-compliant active ingredients, and compressed sampling from 3 rounds to 1 by co-locating the formulation team at our Qingdao factory.
      result: 25–35 days production from signed PO, with first delivery within the 60-day landing window. 200+ tons across 4 SKUs. Repeat order placed before the first batch was fully delivered.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'
    - challenge: A US crop-protection brand needed a high-efficacy insecticide SC formulation with custom concentration, co-branded packaging, and ICAMA registration for market entry.
      solution: Adapted existing SC formulation with modified active ingredient ratio, developed co-branded packaging artwork, and provided full ICAMA registration documentation.
      result: Successfully registered and placed across key US agricultural channels, driving strong momentum with over 500 tons sold in Year 1 and a 95% reorder rate.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'
    - challenge: Australian distributor required an ICAMA-registered fungicide range with custom formulations and compliance with Australian regulatory standards.
      solution: Produced pre-production samples with 4 formulation variants and coordinated third-party efficacy and residue testing.
      result: 3-model fungicide range launched in AU/NZ market. Followed by government tender win for 50 tons of public health insecticide.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'

faq_section:
  tagline: FAQ
  title: B2B & OEM Frequently Asked Questions
  questions:
    - q: What is the minimum order quantity (MOQ) for OEM agrochemical formulations?
      a: 'MOQ is confirmed by project configuration rather than a fixed number — formulation type and concentration, raw materials, label artwork, packaging and destination market. Standard volume production runs 20+ tons per batch, small-batch co-branding starts at 5 tons, and every project moves through sample (1–4 tons) and pilot (5 tons) stages. See our MOQ & Flexible Branding Guide for the full calculation logic.'
    - q: Does Agrospear hold BSCI certification?
      a: Yes. Our factory maintains valid BSCI social compliance certification (audit report available on request). We also hold ISO 9001 for quality management and ISO 14001 for environmental management. ICAMA registration applies to formulations destined for Chinese and regulated markets; scope is confirmed per project. REACH compliance documentation is provided with every OEM order.
    - q: What is the typical lead time for an OEM order?
      a: Standard lead time is 25–35 days from confirmed PO and deposit for bulk OEM production. Custom formulation development adds 15–20 days for lab trials. Expedited production is available for urgent orders and seasonal rushes. Prototype samples are typically ready within 7–14 days.
    - q: Do you handle export documentation?
      a: Yes. Our team manages export documentation and customs clearance in-house, and we supply to 50+ countries across EU, US, AU, and Asia markets.

b2b_moq: 'MOQ confirmed by project configuration: sample 1–4 tons, pilot 5 tons, volume 20+ tons per batch; small-batch co-branding from 5 tons.'

production_flow:
  tagline: Production Flow
  title: From Raw Material to Finished Product
  subtitle: Every batch passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: '01'
      title: Material Receiving & Incoming QC
      description: 'All incoming materials are logged by batch/lot number in our ERP system. Technical-grade active ingredients, solvents, adjuvants, dispersants, and packaging materials are quarantined until QC sign-off.'
      qc_check: 'Active ingredient purity (HPLC/GC), impurity profile, solvent purity, moisture content, physical property verification'
      qc_threshold: '100% of batches tested. Reject if AI purity < 95% of spec, impurity > spec max, or any visual defect'
      responsibility: Incoming QC team (3 inspectors)
    - stage: '02'
      title: Compounding & Premixing
      description: 'Computer-optimized batching calculates precise raw material quantities for each formulation. Automatic weighing and dosing systems maintain ±0.1% accuracy.'
      qc_check: 'Weight verification against formulation card, raw material identity confirmation, premix uniformity check'
      qc_threshold: 'Every batch weighed. Tolerance ±0.5% on major components. Reject batch if >2% out of tolerance'
      responsibility: Compounding workshop lead
    - stage: '03'
      title: Formulation Processing & Grinding
      description: 'High-shear mixers compound SC, EC, and SL formulations. Sand mills and bead mills reduce particle size to specification. Spray dryers and fluid bed granulators produce WDG and WP products.'
      qc_check: 'Particle size distribution every batch (laser diffraction), viscosity, pH, suspensibility (CIPAC MT 15), milling temperature log review'
      qc_threshold: 'D50 within ±10% of target. Suspensibility ≥90%. Any out-of-spec parameter = hold and re-process'
      responsibility: Formulation QC (2 inspectors per shift)
    - stage: '04'
      title: Filling & Packaging
      description: 'Formulations move to filling where drums, jerry cans, and bottles are filled, sealed, and labeled. Each unit follows a 100-point filling and packaging checklist.'
      qc_check: '100-point checklist sign-off per batch, fill weight verification, seal integrity test, label accuracy check, barcode scan verification'
      qc_threshold: 'Zero-defect policy on safety-critical items (seals, labels, GHS marks). Minor cosmetic: AQL 2.5 (ISO 2859)'
      responsibility: Filling team lead + line QC
    - stage: '05'
      title: Stability Testing & Quality Hold
      description: 'Every production batch is held at 54°C for 14 days per CIPAC MT 46. Active content, suspensibility, pH, and physical stability are verified before release. Batches exceeding specification limits are rejected and sent for specification re-inspection.'
      qc_check: '14-day 54°C stability test, active content by HPLC/GC, suspensibility, emulsion stability, pH, viscosity'
      qc_threshold: 'Active content within ±2% of specification after 54°C storage. Any batch exceeding this = 100% re-test of entire production batch'
      responsibility: Quality lab (independent of production, reports to management)
    - stage: '06'
      title: Final Inspection & Packing
      description: 'Final visual and specification inspection. Label accuracy, color consistency, batch/lot verification, packaging integrity, and accessory completeness. Units are palletized and prepared for container loading.'
      qc_check: 'Full visual inspection, label checklist per SKU, packaging integrity test (random sample), barcode scan verification'
      qc_threshold: 'AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected'
      responsibility: Final QC team (4 inspectors) + Packing team lead

