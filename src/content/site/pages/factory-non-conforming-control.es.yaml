answer:
  label: 'Respuesta directa'
  text: 'Los productos no conformes nunca se ocultan, se retrabajan informalmente ni se liberan sin verificacion en QINGDAO VATRAD GROUP.,LTD. Toda no conformidad identificada se registra contra el producto, lote o componente afectado y se vincula a un NCR. El articulo se etiqueta (HOLD / QUARANTINE / REJECTED), se segrega fisicamente y se evalua el alcance afectado por lote, lote de material, etapa de proceso y revision documental. La disposicion se decide al nivel de autoridad que corresponde a la gravedad del defecto: los problemas menores se firman a nivel de linea; los mayores requieren una disposicion de Gerente de Calidad + Ingeniero Tecnico con instruccion de retrabajo controlada y reinspeccion independiente al 100%; y los criticos requieren una decision del comite de revision de materiales (MRB) con concesion escrita del cliente cuando corresponde — si no, destruccion fisica presenciada obligatoria. Los articulos retrabajados se reinspeccionan contra los criterios de aceptacion originales, las reparaciones de especificacion reciben un ciclo completo nuevo de prueba de estabilidad y especificacion, y la liberacion del envio solo ocurre tras la firma autorizada de calidad. Los problemas repetidos o sistemicos activan acciones correctivas de causa raiz (CAPA).'
  verified: '2026-08'

