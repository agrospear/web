nc_intro:
  tagline: Control de productos no conformes
  title: Que ocurre cuando un producto no cumple los criterios
  body: |
    Los productos o componentes que no cumplen los criterios de aceptacion definidos se identifican y controlan para evitar su uso no intencionado, el procesamiento posterior o su envio. Los criterios de aceptacion aplicables se basan en la muestra aprobada, la especificacion tecnica, el arte de etiqueta, la lista de materiales, los requisitos de embalaje y el plan de inspeccion del proyecto.

    Los articulos no conformes se evaluan para determinar el alcance afectado y la disposicion adecuada. Segun el problema, el articulo puede retenerse, retrabajarse bajo instrucciones controladas, reemplazarse, rechazarse o gestionarse mediante un proceso aprobado. Los articulos retrabajados o corregidos se reinspeccionan antes de su liberacion. La liberacion del envio solo se permite cuando los registros de calidad pertinentes estan completos y el producto cumple los criterios de aceptacion aplicables.

nc_flow:
  tagline: Bucle cerrado estandar de 7 pasos
  title: De la identificacion a la accion correctiva
  subtitle: 'Un bucle controlado para cada no conformidad: identificar, poner en cuarentena, revisar, retrabajar o reemplazar, reinspeccionar, liberar o rechazar, mejorar.'
  steps:
    - step: '01'
      title: Identificar
      desc: 'Toda no conformidad identificada se registra contra el producto, lote o componente afectado y se evalua contra los requisitos del proyecto aplicables. La deteccion puede ocurrir en el material entrante, el control en proceso, los ensayos finales, el embalaje o la inspeccion del cliente o de terceros.'
    - step: '02'
      title: Cuarentena
      desc: 'Los articulos se identifican claramente y se colocan bajo retencion o cuarentena controlada para evitar su uso no intencionado, procesamiento posterior o envio. Las etiquetas HOLD / QUARANTINE / REJECTED llevan el numero NCR, SKU, lote, cantidad, descripcion del defecto y fecha.'
    - step: '03'
      title: Revision
      desc: 'Se evaluan el alcance afectado y la disposicion adecuada: unidad individual, lote de turno, lote completo o varios lotes — entre lotes de materiales compartidos, revisiones de etiqueta, etapas de proceso y revisiones documentales. Se aplican contencion adicional o inspeccion intensificada cuando se requiere.'
    - step: '04'
      title: Retrabajo o reemplazo
      desc: 'El retrabajo permitido sigue instrucciones aprobadas que identifican el articulo afectado, el metodo, los materiales, los puntos de inspeccion y los requisitos de reinspeccion. Nunca se permiten cambios no aprobados en la especificacion del producto, el arte de etiqueta, la configuracion de embalaje o la formulacion. Los articulos de reemplazo vuelven a pasar por las compuertas de inspeccion aplicables.'
    - step: '05'
      title: Reinspeccion
      desc: 'Los articulos retrabajados o corregidos se reinspeccionan contra los criterios de aceptacion aplicables. La caracteristica fallada original y cualquier caracteristica relacionada potencialmente afectada por el retrabajo se verifican antes de la liberacion — por QC independiente, y con un ciclo completo nuevo de prueba de estabilidad y especificacion para las reparaciones de formulacion.'
    - step: '06'
      title: Liberar o rechazar
      desc: 'El producto se libera solo tras completar la reinspeccion requerida y que personal de calidad autorizado confirme la conformidad con los requisitos del proyecto aplicables. Los articulos que no pueden alcanzar la conformidad se rechazan, reemplazan, devuelven o reciben una disposicion bajo procedimientos controlados — incluida la destruccion fisica presenciada.'
    - step: '07'
      title: Accion correctiva
      desc: 'Las no conformidades repetidas, significativas o sistemicas se revisan para determinar la causa raiz y la accion correctiva (CAPA). Las mejoras pueden incluir actualizaciones de instrucciones de trabajo, controles de materiales, puntos de inspeccion, formacion, gestion de proveedores o control documental.'

nc_pillars:
  tagline: Pilares de confianza del comprador
  title: Tres controles que protegen su marca
  subtitle: 'El proceso esta disenado en torno a las preguntas que realmente hacen los compradores internacionales: se ocultaran los problemas, se descontrolara el retrabajo y se volveran a verificar los lotes corregidos?'
  features:
    - icon: 1
      icon_bg: blue
      title: Solo instrucciones controladas
      desc: 'El retrabajo se rige estrictamente por instrucciones de retrabajo estandar (SRI) autorizadas. Las alteraciones de campo no aprobadas, el cambio de especificaciones o la modificacion de formulacion sin autorizacion escrita estan terminantemente prohibidos.'
    - icon: 2
      icon_bg: green
      title: Reinspeccion independiente
      desc: 'Los lotes retrabajados reciben reinspeccion al 100% por inspectores de QA contra los criterios de aceptacion originales. Las reparaciones de especificacion requieren un ciclo completo nuevo de prueba de estabilidad y especificacion — nunca una verificacion parcial.'
    - icon: 3
      icon_bg: purple
      title: Firma autorizada y trazabilidad
      desc: 'La liberacion del envio solo se permite tras la documentacion NCR completa y la firma autorizada de QC, pasando el estado del lote de HOLD a RELEASED. Las desviaciones sistemicas o repetidas activan automaticamente flujos de trabajo CAPA de causa raiz.'

