nc_severity:
  tagline: Gravedad del defecto y autoridad
  title: Clasificacion de gravedad y autoridad de disposicion
  subtitle: No toda no conformidad se gestiona al mismo nivel — la autoridad de disposicion escala con la gravedad del defecto, desde la firma a nivel de linea hasta el comite de revision de materiales y la concesion del cliente.
  headers:
    severity: Gravedad
    examples: Ejemplos tipicos
    authority: Autoridad de disposicion y control
    control: Condicion de liberacion
  rows:
    - severity: 'Menor'
      examples: 'Esquina de caja arrugada, desalineacion leve de etiqueta no critica'
      authority: 'Firma en sitio del lider de QC de seccion + supervisor de linea, reemplazo o liberacion'
      control: 'Registrado en el NCR; sin impacto en la funcion del producto ni en los requisitos del cliente'
    - severity: 'Mayor'
      examples: 'Contenido activo bajo especificacion, suspensibilidad fuera de rango, accesorio faltante'
      authority: 'El Gerente de Calidad + el Ingeniero Tecnico emiten una instruccion de retrabajo controlada (SRI)'
      control: 'Re-ensayo independiente al 100% de la caracteristica fallada original y las afectadas antes de la liberacion'
    - severity: 'Critico'
      examples: 'Ingrediente activo erroneo, contaminacion de formulacion, etiqueta del cliente mal impresa o desviacion de concentracion'
      authority: 'Decision del comite de revision de materiales (MRB); concesion escrita del cliente cuando corresponde'
      control: 'Sin liberacion sin concesion autorizada; si no, destruccion fisica presenciada obligatoria'

nc_matrix:
  tagline: Matriz de protocolo de ingenieria
  title: Matriz de disposicion de defectos y reinspeccion agroquimica
  subtitle: Protocolos de ingenieria estandar aplicados a las desviaciones de fabricacion mas comunes — los mismos parametros cuantificados que los clientes pueden verificar durante las auditorias.
  headers:
    defect: Categoria de defecto
    protocol: Protocolo de disposicion controlada
    validation: Reinspeccion y validacion independientes
  rows:
    - defect: 'Contenido activo bajo especificacion'
      protocol: 'Aislar el lote. Re-analizar por HPLC/GC con inyecciones duplicadas. Si se confirma bajo, evaluar lote de materia prima y registros de mezclado para causa raiz.'
      validation: 'Re-analisis completo por QC independiente; el contenido activo debe cumplir especificacion ±2% tras retrabajo o ajuste.'
    - defect: 'Suspensibilidad inferior al 90%'
      protocol: 'Poner en cuarentena el lote de turno. Evaluar distribucion de tamano de particula por difraccion laser. Re-moler en molino de arena si D50 fuera de especificacion.'
      validation: 'Re-ensayar suspensibilidad segun CIPAC MT 15; verificacion de distribucion de tamano de particula; re-comprobacion completa de especificaciones.'
    - defect: 'pH o viscosidad fuera de rango'
      protocol: 'Ajustar con tampón o modificador de viscosidad aprobado bajo instruccion SRI controlada. Registrar volumen de ajuste y parametros de mezclado.'
      validation: 'Re-ensayar pH y viscosidad segun metodos CIPAC; verificacion de estabilidad a 54 C durante 7 dias tras el ajuste.'
    - defect: 'Error de marca / etiqueta'
      protocol: 'Parada inmediata de la linea de etiquetado. Retener todos los contenedores etiquetados. Revisar la revision del arte de etiqueta con el cliente; cero alteraciones no aprobadas.'
      validation: 'Comprobacion de color con espectrofotometro (Delta E ≤ 1,5); verificacion visual al 100% del texto contra el PDF de etiqueta aprobado por el cliente.'
    - defect: 'Desajuste de embalaje / SKU faltante'
      protocol: 'Poner en cuarentena el pale de exportacion. Desembalar y realizar una comprobacion BOM al 100% por articulo (contenedor, etiqueta, tapa, inserto, codigo de lote).'
      validation: 'Validacion dinamica en linea con pesadora electronica (±30 g de variacion); verificacion con escaner optico de codigo de barras 2D.'

nc_scrap:
  tagline: Cero fugas al mercado
  title: Destruccion presenciada y desguace — protocolo antidivertido de cero defectos
  body: |
    Los socios de marca internacionales necesitan certeza de que los lotes fallidos nunca llegaran a la venta minorista secundaria, a mercados grises o a canales de comercio electronico. Los lotes que no pueden alcanzar la conformidad se destruyen bajo un protocolo presenciado y registrado:

    **1. Desidentificacion de contenedores.** Bajo supervision del Director de QA, todas las etiquetas, codigos de lote y marcas de marca se retiran o se destruyen permanentemente. Las tapas y sellos de los contenedores se retiran, eliminando cualquier componente de marca aprovechable.

    **2. Neutralizacion de formulacion.** La formulacion no conforme se neutraliza quimicamente segun protocolo aprobado de tratamiento de residuos, inactivando el ingrediente activo y haciendo el producto permanentemente inadecuado para cualquier uso agricola o comercial.

    **3. Boleta de video y fotos.** La destruccion se graba como video 1080p sin cortes con primeros planos de la etiqueta de lote, el proceso de desidentificacion, la neutralizacion y la pila final de residuos pesada. El video se somete a hash (SHA-256) y se archiva en un servidor controlado durante ≥ 5 anos.

    **4. Eliminacion certificada de residuos.** Todo el residuo de formulacion y los fragmentos de embalaje se pesan, se registran en el libro de salida y se transportan solo por socios cualificados de eliminacion de residuos peligrosos — ningun residuo sale de la planta por otro canal.

    > **Garantia de proteccion de marca:** QINGDAO VATRAD GROUP CO., LTD. garantiza la destruccion al 100% de los productos agroquimicos fuera de especificacion no retrabajables. Cero segundas marcas de fabrica o productos comprometidos entraran jamas en la venta minorista secundaria, mercados grises o canales de comercio electronico. El certificado de destruccion (VAT-QA-SCRAP-CERT-2026) registra el producto, el lote, la conclusion del MRB, las fotos de testigo y la doble firma del Director de QA y el Gerente de Planta.

