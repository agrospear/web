faqs:
  tagline: FAQ
  title: FAQ sobre calidad y control de defectos para compradores globales
  items:
    - q: 'Como garantizan que los lotes retrabajados cumplen todos los estandares de especificacion?'
      a: 'Todo lote retrabajado se trata como una unidad nueva y debe completar el mismo ciclo completo de ensayos desde cero — para reparaciones de especificacion, una prueba completa de estabilidad y especificacion. Los inspectores de QC independientes, no los operadores del retrabajo, realizan la validacion de liberacion.'
    - q: 'Enviara la fabrica productos con desviaciones menores de especificacion sin avisarnos?'
      a: 'Nunca. Cualquier desviacion que afecte a las muestras doradas aprobadas por el cliente, el arte de etiqueta, la formulacion o el embalaje requiere un acuerdo de concesion formal por escrito firmado por el cliente antes de la liberacion del envio.'
    - q: 'Que ocurre si un lote retrabajado falla la reinspeccion?'
      a: 'El lote no se libera. Vuelve a una nueva revision de disposicion y, si no puede alcanzar la conformidad, se reemplaza, rechaza o destruye bajo el protocolo de desguace presenciado. El fallo repetido de la misma clase de defecto activa un CAPA de causa raiz.'
    - q: 'Pueden venderse los lotes fallidos como segundas marcas de fabrica o por otros canales?'
      a: 'No. Los lotes fuera de especificacion no retrabajables se destruyen fisicamente bajo el protocolo de desguace presenciado — etiquetas retiradas, formulacion neutralizada, video grabado con hash SHA-256 y archivado durante al menos 5 anos. El certificado de destruccion lo firman el Director de QA y el Gerente de Planta.'
    - q: 'Como se evalua el alcance afectado cuando se encuentra un defecto?'
      a: 'El alcance se revisa por identificacion de producto, lote de produccion, lote de material o componente, etapa de proceso y revision documental aplicable. Si estan implicados el mismo lote de material, revision de etiqueta o puesto de trabajo, los productos afectados se contienen y verifican en consecuencia.'
    - q: 'Necesitan nuestra aprobacion antes de realizar una concesion?'
      a: 'Si. Cualquier aceptacion bajo una concesion documentada que afecte a los requisitos del cliente — muestras aprobadas, especificacion, formulacion, embalaje o criterios de aceptacion — requiere la aprobacion escrita del cliente antes de la liberacion. Sin ella, el producto se retrabaja segun el requisito original, se reemplaza o se rechaza.'
    - q: 'Que documentacion recibimos por una no conformidad?'
      a: 'El registro NCR cubre el numero NCR, la etapa de deteccion, el producto/SKU, el lote, las revisiones documentales aplicables, la descripcion del defecto, la contencion, la disposicion, la referencia de la instruccion de retrabajo, el resultado de la reinspeccion y la aprobacion de liberacion o cierre — disponible segun el acuerdo de calidad de su proyecto.'

