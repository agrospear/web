faqs:
  - question: '¿Agrospear proporciona documentación de registro para los estados miembros de la UEAC?'
    answer: "Sí. Agrospear prepara documentación alineada con el reglamento técnico de la Unión Económica Euroasiática CU TR 025/2012 sobre seguridad de productos químicos, que proporciona un marco de registro armonizado entre Rusia, Bielorrusia, Kazajistán, Kirguistán y Armenia. Uzbekistán y Turkmenistán no son miembros de la UEAC y mantienen registros nacionales independientes bajo UzStandard y TurkmenStandard respectivamente. Agrospear prepara expedientes base armonizados UEAC complementados con adiciones específicas por país para los estados centroasiáticos no miembros de la UEAC."
  - question: '¿Qué formulaciones recomienda Agrospear para el barrenador del algodón en Uzbekistán?'
    answer: "Para el barrenador del belloto del algodón (Helicoverpa armigera), Agrospear recomienda formulaciones EC de profenofos y lambda-cihalotrina para derribe rápido durante la ventana pico de infestación de julio a agosto, formulaciones SC de indoxacarb y clorantraniliprol para control residual extendido durante el período de fructificación, y formulaciones WDG de espinosad para programas de manejo integrado de plagas donde se prioriza la conservación de insectos benéficos. Las formulaciones FS de tratamiento de semilla de imidacloprid protegen las plántulas de algodón de los complejos de trips y pulgones de temporada temprana."
  - question: '¿Cómo llega el envío a Asia Central desde Qingdao?'
    answer: "El transporte combinado mar-rail desde Qingdao a través del puerto seco de Khorgos hasta Almaty suele tardar de 4 a 5 semanas. El servicio directo de contenedor ferroviario vía el ferrocarril China-Europa a través de Dostyk/Alashankou hasta Taskent tarda de 3 a 4 semanas. El flete marítimo vía puertos iraníes (Bandar Abbas) con transporte terrestre a Asia Central es una ruta alternativa para destinos del sur. Los términos DDP cubren despacho de aduanas y entrega final. Se disponen opciones FOB Qingdao y CIF para importadores que gestionan su propia logística."
  - question: '¿Puede Agrospear formular para el rango extremo de temperatura invierno-verano en Asia Central?'
    answer: "Sí. Todas las formulaciones se someten a pruebas de estabilidad por ciclos térmicos entre -30°C y +50°C, simulando los extremos climáticos continentales del almacenamiento y transporte en Asia Central. Las formulaciones SC incluyen agentes anticongelantes que mantienen la suspensibilidad tras el almacenamiento bajo cero. Las formulaciones EC se validan para estabilidad de emulsión tras ciclos térmicos. Las formulaciones FS de tratamiento de semilla se prueban para impacto en la germinación tras almacenamiento en frío — crítico para la siembra de trigo de primavera y algodón cuando el producto puede haber pasado el invierno en almacenes sin calefacción."
  - question: '¿Qué productos ofrece Agrospear para los cultivos de manzana y uva en Asia Central?'
    answer: "Para los extensos sectores de huertos y viñedos de la región — particularmente en el Valle de Fergana de Uzbekistán, la región de Almaty de Kazajistán y Kirguistán — Agrospear fabrica formulaciones SC y WP de difenoconazol y mancozeb para la sarna del manzano (Venturia inaequalis), formulaciones EC de clorpirifos y deltametrina para la carpocapsa (Cydia pomonella), y formulaciones SC de azufre y tebuconazol para el oídio de la vid (Uncinula necator) y el mildiu (Plasmopara viticola)."
body: |
  <h2>El Triángulo Algodón-Trigo-Fruta de Asia Central</h2>
  <p>La agricultura de Asia Central gira en torno a tres pilares: algodón, trigo y frutas de hueso y pepita — cada uno enfrentando presiones de plagas y enfermedades distintas moldeadas por el clima continental extremo de la región. Uzbekistán es el quinto productor mundial de algodón, y el barrenador del belloto (Helicoverpa armigera) sigue siendo la plaga insectil principal, con larvas que perforan los bellotos durante el período crítico de fructificación de julio a agosto. La roya estriada del trigo (Puccinia striiformis) y la roya de la hoja (Puccinia triticina) amenazan tanto el trigo de invierno como el de primavera en la estepa norte de Kazajistán — el granero de la región — y los campos de trigo irrigados de Uzbekistán y Tayikistán. La sarna del manzano (Venturia inaequalis) y la carpocapsa (Cydia pomonella) limitan la sustancial industria frutícola de la región, particularmente en Uzbekistán, que se sitúa entre los cinco mayores productores mundiales de albaricoque y cereza. El oídio y el mildiu de la vid afectan a los sectores vitivinícolas de las cinco repúblicas centroasiáticas. Los brotes de langosta — tanto la langosta italiana (Calliptamus italicus) como la langosta marroquí (Dociostaurus maroccanus) — amenazan periódicamente las tierras de cereales y pastos de la región, requiriendo formulaciones de respuesta de emergencia. Las plataformas de producto de Agrospear abordan cada uno de estos puntos de presión con formulaciones validadas en el rango de temperatura desde el almacenamiento invernal a -30°C hasta la aplicación estival a +45°C.</p>

  <h2>Reglamentos Técnicos de la UEAC y Registro Nacional</h2>
  <p>La Unión Económica Euroasiática (UEAC) — que comprende Rusia, Bielorrusia, Kazajistán, Kirguistán y Armenia — mantiene un marco regulatorio armonizado bajo CU TR 025/2012 sobre seguridad de productos químicos, que cubre el registro de plaguicidas y agroquímicos en toda la unión. Un registro obtenido en un estado miembro de la UEAC se reconoce en todos los demás, reduciendo la carga regulatoria para las marcas que se dirigen a múltiples mercados centroasiáticos. Sin embargo, dos estados agrícolas centroasiáticos clave — Uzbekistán y Turkmenistán — no son miembros de la UEAC y mantienen sistemas de registro nacional independientes. La agencia UzStandard de Uzbekistán registra plaguicidas bajo el marco nacional de estandarización, con requisitos de documentación similares pero no idénticos a los de CU TR 025/2012 de la UEAC. El TurkmenStandard de Turkmenistán opera su propio proceso. Para marcas que se dirigen tanto a mercados UEAC como no-UEAC de Asia Central, Agrospear prepara un expediente base CU TR 025/2012 complementado con las adiciones específicas requeridas por UzStandard o TurkmenStandard — maximizando la reutilización de datos mientras se cumplen las expectativas de formato de cada autoridad. La documentación de registro ICAMA, los datos de especificación FAO/OMS y los informes de análisis de cinco lotes forman la base técnica de todos los paquetes nacionales.</p>

  <h2>Diseño de Formulación para Extremos Climáticos Continentales</h2>
  <p>La fábrica de 20.000 m² de Agrospear con más de 50.000 toneladas de capacidad anual y más de 30 patentes produce formulaciones diseñadas para los extremos de temperatura de Asia Central — un desafío que pocos fabricantes abordan sistemáticamente. Las formulaciones EC de profenofos y lambda-cihalotrina para el barrenador del algodón incluyen potenciadores de estabilidad térmica que mantienen la integridad de la emulsión tras el almacenamiento estival a 45°C en almacenes sin refrigeración de Karshi y Bujará. Las suspensiones SC de fungicidas triazoles para la roya del trigo incorporan agentes anticongelantes que previenen la formación de cristales durante el almacenamiento invernal a -30°C en el norte de Kazajistán — verificado mediante pruebas de ciclos térmicos entre temperaturas extremas en cada lote de producción. Las formulaciones FS de tratamiento de semilla de imidacloprid y tiametoxam para algodón y trigo se prueban para impacto en la germinación tras almacenamiento en frío, asegurando que la siembra de primavera no se comprometa por producto invernal. Los gránulos WDG dispersables en agua para pulverización de huertos se formulan para dispersión rápida en agua de riego fría, un requisito práctico en las condiciones de aplicación primaveral de Asia Central. Cada lote se somete a un control de calidad de seis etapas incluyendo pruebas de estabilidad en frío, suspensibilidad tras ciclos térmicos y análisis de distribución de tamaño de partícula — protocolos de calidad desarrollados específicamente para servir las demandas climáticas únicas de Asia Central.</p>

