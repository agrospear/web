categories:
  herbicide: Herbicidas formulados para el control eficaz de malezas. Selecciona la formulación según el cultivo y el modo de acción.
  insecticide: Insecticidas para el control de plagas en cultivos de campo, frutales y hortalizas. Elige por ingrediente activo y concentración.
  fungicide: Fungicidas y tratamientos de semillas para la protección contra enfermedades fúngicas. Múltiples tipos de formulación disponibles.

