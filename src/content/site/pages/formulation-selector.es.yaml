how_to_choose:
  title: Cómo elegir la formulación adecuada
  cards:
    - title: Formulaciones SC
      description: Las suspensiones concentradas (SC) ofrecen alta concentración de ingrediente activo, excelente suspensibilidad y fácil medición. Ideales para herbicidas e insecticidas sistémicos. Requieren buena agitación antes de la aplicación.
    - title: Formulaciones EC
      description: Los concentrados emulsionables (EC) se dispersan como emulsión en agua. Excelente penetración foliar. Ideales para insecticidas de contacto. Verificar la estabilidad de emulsión y la compatibilidad con el agua de aplicación.
    - title: Formulaciones WP y WDG
      description: Los polvos mojables (WP) y gránulos dispersables en agua (WDG) son fáciles de almacenar y transportar. Ideales para fungicidas. Los WDG generan menos polvo y se dispersan más rápidamente que los WP.

