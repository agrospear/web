faqs:
  tagline: FAQ
  title: 'Formulaciones de insecticida — Preguntas frecuentes'
  items:
    - q: '¿Qué tipos de formulación de insecticida fabricáis?'
      a: 'Concentrado en suspensión (SC), concentrado emulsionable (EC), suspensión encapsulada (CS), microemulsión (ME), gránulo dispersable en agua (WDG) y tratamiento de semillas (FS).'
    - q: '¿Las formulaciones de insecticida requieren pruebas de estabilidad especiales?'
      a: 'Sí — los insecticidas con sistemas de coadyuvantes complejos se someten a pruebas de estabilidad acelerada de 54 °C/14 días y almacenamiento a largo plazo de 2 años.'
    - q: '¿Puedo pedir formulaciones para complejos de plagas específicos?'
      a: 'Sí. Las formulaciones se adaptan a espectros de plagas objetivo con el ingrediente activo, concentración y paquete de coadyuvantes adecuados.'
    - q: '¿Cuál es la diferencia entre insecticidas sistémicos y de contacto?'
      a: 'Los insecticidas de contacto actúan donde aterrizan, controlando las plagas presentes en la aplicación, mientras que los sistémicos se absorben en la planta y controlan las plagas que se alimentan del follaje o la savia tratados. Muchos programas usan una base sistémica para control prolongado más un socio de contacto para derribo, y formulamos premezclas que combinan ambos químicos.'
    - q: '¿Qué son los insecticidas translaminares y cuándo se prefieren?'
      a: 'Los insecticidas translaminares como la abamectina y el benzoato de emamectina penetran en el tejido de la hoja y forman una reserva en el mesófilo, controlando plagas que se alimentan del envés donde la cobertura de pulverización es limitada. Se prefieren en cultivos de copa densa — algodón, hortalizas, frutales — donde una cobertura de contacto completa es poco práctica.'
    - q: '¿Cómo gestionáis la resistencia a insecticidas?'
      a: 'Seguimos la clasificación de modo de acción IRAC y desarrollamos programas de premezcla y rotación que combinan principios activos de diferentes grupos — por ejemplo un piretroide del Grupo 3A con un neonicotinoide del Grupo 4A, o una avermectina del Grupo 6 con un organofosforado del Grupo 1B — reduciendo la presión de selección y prolongando la eficacia de campo.'
    - q: '¿Cuál es el pedido mínimo para formulaciones de insecticida?'
      a: 'Los lotes de muestra van de 1–4 t para ensayos de campo y registro. Los pedidos piloto son de 5 t para la entrada al mercado y la producción estándar desde 20+ t, con niveles de precio por volumen en 50 t y 100 t. El plazo típico es de 25–35 días.'
    - q: '¿Qué activo se adapta a plagas masticadoras frente a chupadoras?'
      a: 'Para plagas masticadoras (larvas de lepidópteros, escarabajos) se suelen usar benzoato de emamectina, lambda-cialotrina o activos tipo espinosad; para plagas chupadoras (pulgones, mosca blanca, trips, ácaros) neonicotinoides sistémicos como imidacloprid y tiametoxam, o avermectinas translaminares como abamectina. Recomendamos según tu espectro de plagas, cultivo y plan de rotación IRAC.'
    - q: '¿Qué datos de registro suministráis para insecticidas?'
      a: 'Proporcionamos análisis de cinco lotes, estabilidad acelerada y a largo plazo, métodos analíticos, datos de toxicología y residuos, e informes de eficacia de campo — el expediente completo para registrar tu marca de insecticida en tus mercados objetivo.'
    - q: '¿Qué documentación de exportación se incluye?'
      a: 'Cada envío incluye certificado de análisis, certificado de origen, FDS/MSDS, etiquetado conforme a GHS y, cuando es necesario, documentación fitosanitaria para que el despacho de aduanas sea fluido en tu mercado de destino.'

