faqs:
  tagline: FAQ
  title: 'Formulaciones de insecticida — Preguntas frecuentes'
  items:
    - q: '¿Qué tipos de formulación de insecticida fabricáis?'
      a: 'Concentrado en suspensión (SC), concentrado emulsionable (EC), suspensión encapsulada (CS), microemulsión (ME), gránulo dispersable en agua (WDG) y tratamiento de semillas (FS).'
    - q: '¿Las formulaciones de insecticida requieren pruebas de estabilidad especiales?'
      a: 'Sí — los insecticidas con sistemas de coadyuvantes complejos se someten a pruebas de estabilidad acelerada de 54 °C/14 días y almacenamiento a largo plazo de 2 años.'
    - q: '¿Puedo pedir formulaciones para complejos de plagas específicos?'
      a: 'Sí. Las formulaciones se adaptan a espectros de plagas objetivo con el ingrediente activo, concentración y paquete de coadyuvantes adecuados.'

