values_section:
  title: How the Factory Works With Brands
  subtitle: 'Three principles that shape every project built by the Agrospear factory.'
  columns: 3
  items:
    - title: Engineering Before Production
      description: 'Every project starts with requirements, specifications and a physical sample — whether it is a 480 g/L EC insecticide or a 75% WDG herbicide, the formulation type, active concentration, label placement and packaging are validated in the lab before any production run, not discovered on the line.'
      icon: 'tabler:settings'
    - title: One Team, One Facility
      description: 'Formulation, mixing, filling, inspection and testing happen in one 20,000 m² facility. No trading-company handoffs: the chemists who develop your suspension concentrate are the same people who oversee its milling and filling, ensuring emulsion stability and particle-size distribution carry straight from the lab to the drum.'
      icon: 'tabler:building-factory-2'
    - title: Small First Runs
      description: 'Sample runs start at 1–4 tons and pilot batches at 5 tons, so brands validate field performance — efficacy, sprayability, shelf stability — before committing to standard 20+ ton production runs. Formulation records, artwork and registration dossiers are retained for seamless reorders.'
      icon: 'tabler:layers-intersect'
services_section:
  title: What the Factory Delivers
  subtitle: 'The manufacturing services available to Agrospear clients.'
  columns: 2
  items:
    - title: Custom Formulation Development
      description: 'Requirement evaluation, specification, co-formulant selection, labeling, prototyping, sample approval and production for custom agrochemical formulations — from suspension concentrates and water-dispersible granules to micro-emulsions and soluble liquids.'
      icon: 'tabler:bulb'
    - title: Private Label Production
      description: 'Your logo, colors and packaging on proven technical-grade platforms — product, label, drums and cartons all carry your identity, with no factory branding. Artwork adaptation for multilingual markets is handled in-house.'
      icon: 'tabler:tag'
    - title: OEM / ODM Manufacturing
      description: 'Full OEM and ODM agrochemical manufacturing from client specifications or co-developed formulations, including custom formulation development for new products and white-label programs for regional distributors.'
      icon: 'tabler:package'
    - title: Bulk Supply
      description: 'Branded product supply for distributors, cooperatives, government programs and regional registrars, with consistent batch quality and fleet-friendly production runs sized for container-load shipments.'
      icon: 'tabler:users-group'
    - title: Registration & Regulatory Support
      description: 'Complete registration documentation packages — acute toxicity data, residue trials, product chemistry dossiers and ICAMA compliance files — prepared to support your market authorization in target countries, reducing time-to-shelf for new product launches.'
      icon: 'tabler:file-certificate'
    - title: International Market Development
      description: 'Market-specific formulation adaptation, import protocol guidance and local regulatory insight for Africa, Southeast Asia, Latin America and the Middle East — helping brands enter new territories with formulations tuned to local crops, climates and application practices.'
      icon: 'tabler:world'
certifications_section:
  title: Certification & Compliance
  subtitle: 'The factory ships to global markets under a documented compliance system.'
  columns: 2
  items:
    - title: ISO 9001 Quality System
      description: 'Manufacturing facility operates under an ISO 9001 quality management system covering incoming raw material, in-process and final inspection.'
      icon: 'tabler:badge-check'
    - title: ISO 14001 Environmental
      description: 'Environmental management system certified under ISO 14001, covering waste treatment, emission control and sustainable production practices.'
      icon: 'tabler:leaf'
    - title: GMP Good Manufacturing Practice
      description: 'Production processes comply with Good Manufacturing Practice standards, ensuring traceability, batch consistency and controlled manufacturing environments for agrochemical output.'
      icon: 'tabler:clipboard-check'
    - title: BSCI Social Compliance
      description: 'Social responsibility audited under BSCI, covering working conditions and factory compliance.'
      icon: 'tabler:shield-check'
    - title: ICAMA Registration Support
      description: 'Full ICAMA registration documentation and support for products destined for China and ICAMA-recognized markets.'
      icon: 'tabler:certificate'
    - title: FAO/WHO Specifications
      description: 'Product specifications aligned with FAO/WHO standards for pesticide quality and international trade.'
      icon: 'tabler:flask'
    - title: Product Testing
      description: 'Stability testing, content analysis, physical property checks, shelf stability and sedimentation testing on every production line.'
      icon: 'tabler:test-pipe'
