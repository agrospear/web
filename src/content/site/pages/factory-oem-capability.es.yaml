services:
  - title: Diseno de formulacion e ingenieria
    description: Nuestro equipo interno de I+D trabaja con su concepto o especificacion para desarrollar formulaciones personalizadas en SC, EC, WP, WDG, SL, ME, CS y FS. Ofrecemos optimizacion de formulacion, seleccion de ingrediente activo y orientacion regulatoria.
  - title: Marca y etiquetado personalizados
    description: Etiquetado multilingue conforme a GHS, embalaje con etiqueta privada y colores de contenedor personalizados. Desarrollamos arte de etiqueta especifico de la marca, texto regulatorio y embalaje listo para el comercio minorista.
  - title: Personalizacion de materiales y especificaciones
    description: Elija entre herbicidas, insecticidas, fungicidas, PGR y tratamientos de semilla en multiples tipos de formulacion. Concentraciones personalizadas, sistemas de transporte y configuraciones de embalaje.
  - title: Embalaje y logistica
    description: Embalaje minorista personalizado, tambores y botellas con marca propia, paletizado y embalaje listo para exportacion preparado en casa.

moq_table:
  - product: Formulaciones agroquimicas
    standard_moq: 'Muestra 1–4 toneladas | Piloto 5 toneladas'
    custom_moq: 'Volumen 20+ toneladas por lote'
    lead_time: 25–35 dias

why_us:
  - title: Integracion vertical
    description: 'Somos propietarios de nuestra fabrica, formulaciones y cadena de suministro: sin intermediarios ni subcontratistas. Esto nos da control sobre la calidad, el coste y la entrega.'
  - title: Triple certificacion
    description: Gestion de calidad ISO 9001, gestion ambiental ISO 14001 y certificacion de cumplimiento social BSCI. Informes de auditoria de fabrica disponibles bajo peticion.
  - title: Soporte de registro ICAMA
    description: El registro ICAMA aplica a formulaciones destinadas a mercados regulados (alcance confirmado por proyecto). Las formulaciones personalizadas pueden registrarse mediante nuestro proceso establecido.
  - title: MOQ especifico por proyecto
    description: 'El MOQ se confirma segun la configuracion de tu proyecto: el co-branding de lotes pequeños parte de 5 toneladas y el volumen estandar corre en lotes de 20+ toneladas. Ayudamos a las marcas emergentes a lanzarse sin comprometer inventario en exceso.'

