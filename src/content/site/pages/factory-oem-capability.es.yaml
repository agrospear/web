answer:
  label: 'Respuesta directa'
  text: 'El MOQ se confirma segun la configuracion del proyecto, no con un numero fijo: cada proyecto pasa por las etapas de muestra (1–4 toneladas) y piloto (5 toneladas), con una produccion de volumen estandar de 20+ toneladas por lote. Las muestras estan listas en 7–12 dias; la produccion estandar se realiza en 25–35 dias tras la confirmacion del PO y el deposito.'
  verified: '2026-08'

intro: Agrospear ofrece servicios OEM y ODM integrales para marcas, distribuidores y agencias gubernamentales de todo el mundo. Con mas de 10 anos de experiencia en exportacion y una fabrica de 12.500 m2 certificada ISO 9001, ISO 14001 y BSCI, nos encargamos de todo, desde el diseno de formulacion y el soporte de registro hasta la produccion a gran escala, el embalaje y la gestion de exportacion.

