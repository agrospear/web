answer:
  label: 'Respuesta directa'
  text: 'La cantidad mínima de pedido se confirma según la configuración del proyecto, no con un número fijo: el desarrollo de muestra (1–4 toneladas) valida la formulación, los pedidos piloto (5 toneladas) prueban el mercado sobre plataformas existentes, la producción de volumen estándar corre en lotes de 20+ toneladas, y el co-branding de lotes pequeños parte de cantidades inferiores. Las muestras se envían en 7–12 días; la producción en serie tarda 25–35 días tras la confirmación de la orden de compra y el depósito, más 15–20 días cuando se requiere desarrollo de formulación nuevo.'
  verified: '2026-08'

content_html: |
  <h2>1. Preevaluación: qué buscar en una fábrica</h2>

  <h3>Certificados de cumplimiento</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistema de gestión de calidad</li>
    <li><strong>ISO 14001</strong> – Sistema de gestión medioambiental</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Auditorías de cumplimiento social</li>
    <li><strong>ICAMA</strong> – Documentación de registro de producto agroquímico</li>
  </ul>

  <h3>Capacidades de fabricación</h3>
  <ul>
    <li>Líneas de formulación (SC, EC, WP, WDG, SL, ME, CS, FS)</li>
    <li>Equipo de molienda de tamaño de partícula (molino de perlas, molino de arena)</li>
    <li>Laboratorio analítico (HPLC, GC, tamaño de partícula, viscosidad, cámaras de estabilidad)</li>
    <li>Capacidad de lote piloto interna</li>
    <li>Experiencia en preparación de paquete de datos de registro</li>
  </ul>

  <h3>Verificación de la experiencia</h3>
  <ul>
    <li>Años en la fabricación de agroquímicos (5+ años como mínimo)</li>
    <li>Número de químicos de formulación en plantilla</li>
    <li>Clientes OEM/ODM existentes (solicita referencias)</li>
    <li>Destinos de exportación: ¿ya envían a tu mercado objetivo?</li>
  </ul>

  <h2>2. Protocolos de control de calidad</h2>
  <p>Control de calidad de entrada de materiales: contenido de ingrediente activo (HPLC/GC según métodos CIPAC), perfil de impurezas, propiedades físicas (tamaño de partícula, viscosidad, pH), verificación de COA.</p>
  <p>Control de calidad en proceso: supervisión del contenido de ingrediente activo cada turno, comprobaciones de distribución de tamaño de partícula, verificación de viscosidad y pH, supervisión de tasa de suspensión para formulaciones SC/WP.</p>
  <p>Inspección final: análisis al 100% (contenido de ingrediente activo, propiedades físicas), Certificado de Análisis, inspección visual, verificación de etiquetado, ensayos con muestras aleatorias (AQL 2.5 o 4.0 según ISO 2859).</p>

  <h2>3. Lista de verificación de documentación de cumplimiento</h2>
  <ul>
    <li>Certificado de registro ICAMA (si aplica)</li>
    <li>Certificado de Análisis por lote</li>
    <li>Informe de ensayo de un laboratorio acreditado</li>
    <li>Fichas de datos de seguridad de materiales (MSDS/SDS)</li>
    <li>Documentación de cumplimiento de especificaciones FAO/OMS</li>
    <li>Lista de materiales con trazabilidad de proveedores</li>
    <li>Informe de inspección de fábrica</li>
  </ul>

  <h2>4. Negociación del MOQ</h2>
  <p>Los MOQ de las formulaciones agroquímicas los determinan la ruta de producción y la configuración del proyecto, no las conjeturas. Todos los proyectos OEM/ODM de Agrospear siguen tres etapas de cantidad distintas — muestra, piloto y volumen — y la lógica de cálculo completa se explica en nuestra <a href="/es/oem-moq-guide">Guía de MOQ y Branding Flexible</a>:</p>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Ruta de producción</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Plazos</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">Desarrollo de muestra (por formulación)</td><td class="p-3 border">1 – 4 toneladas</td><td class="p-3 border">Muestras en 7 – 12 días</td></tr>
      <tr><td class="p-3 border font-medium">Pedido piloto (plataformas existentes)</td><td class="p-3 border">5 toneladas</td><td class="p-3 border">Validación de mercado con materiales de stock</td></tr>
      <tr><td class="p-3 border font-medium">Lote de volumen estándar (por formulación)</td><td class="p-3 border">20+ toneladas</td><td class="p-3 border">25 – 35 días tras la orden de compra y el depósito</td></tr>
      <tr><td class="p-3 border font-medium">Formulación totalmente personalizada / marca blanca</td><td class="p-3 border">Confirmado por configuración</td><td class="p-3 border">Añade 15 – 20 días para desarrollo de formulación</td></tr>
    </tbody>
  </table>
  <p>Las cantidades de muestra, piloto y producción de volumen son diferentes: el desarrollo de muestra (1–4 toneladas) valida la formulación, los pedidos piloto (5 toneladas) prueban el mercado sobre plataformas existentes, y la producción de volumen estándar corre en lotes de 20+ toneladas — con tramos de precios por volumen a medida que aumenta el tamaño del pedido. Consigue por escrito el cálculo de MOQ, el plazo de entrega y las condiciones de pago para tu formulación concreta antes de comprometerte con un proveedor.</p>

  <h2>5. Logística y envío</h2>
  <p>Incoterms habituales: <strong>FOB</strong> (la fábrica entrega en el puerto de salida: el más común), <strong>EXW</strong> (el comprador gestiona todo el envío desde la puerta de la fábrica), <strong>CIF</strong> (la fábrica paga el flete y el seguro hasta el puerto de destino).</p>
  <p>Los productos agroquímicos se clasifican como mercancías peligrosas (el número UN varía según la formulación): asegúrate de que tu socio logístico maneja carga DG. El envasado en bidones (200 L) es estándar para formulaciones líquidas; WDG y WP usan bolsas de 25 kg. El tránsito marítimo de China a la UE suele tardar 25–35 días, y 7–12 días a la costa oeste de EE. UU., además del plazo de producción de 25–35 días.</p>

  <h2>6. Errores habituales</h2>
  <ul>
    <li><strong>Sin auditoría de fábrica:</strong> realiza o encarga siempre una auditoría de terceros (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Solo especificaciones verbales:</strong> hoja de especificaciones técnicas detallada firmada por ambas partes</li>
    <li><strong>Omitir la aprobación de muestras:</strong> aprobación por escrito de los lotes piloto antes de la producción en serie</li>
    <li><strong>Sin control de calidad durante la producción:</strong> inspección por terceros durante la producción (DUPRO) y antes del envío (PSI)</li>
    <li><strong>Ignorar los requisitos regulatorios:</strong> verifica el registro ICAMA, el cumplimiento de especificaciones FAO/OMS y la documentación específica del mercado antes de la producción</li>
  </ul>

  <h2>7. Por qué Agrospear</h2>
  <p>Agrospear fabrica formulaciones agroquímicas OEM/ODM desde 2012. Con unas instalaciones certificadas ISO 9001 e ISO 14001 de 12,500 m&sup2;, más de 25 ingenieros y soporte de registro ICAMA para mercados objetivo (alcance confirmado por proyecto), cumplimos todos los criterios de esta guía. Ofrecemos MOQ de prueba para nuevos socios y paquetes completos de documentación de cumplimiento.</p>
  <p>Revisa nuestros <a href="/es/oem-manufacturing">servicios de fabricación OEM/ODM agroquímica</a> o visita la <a href="/es/manufacturing/factory">planta de 12,500 m&sup2;</a> para ver los equipos y los procesos de control de calidad que hay detrás de cada paso anterior.</p>

