intro: 'A specification, no matter how detailed, cannot reveal how a formulation will actually perform until it is compounded, analyzed and tested for stability. That is why our Formulation Lab is designed to translate R&D data into a physical, validated sample as quickly and accurately as possible. Every new Agrospear formulation — and every significant custom build — passes through this workshop before the production commitment is made.'

content_html: |
  <h2>Where specification becomes product</h2>
  <p>The lab is equipped for simultaneous formulation compounding, analytical testing and stability evaluation. This parallel-workflow approach cuts sample lead time to 7–14 days from specification approval. When your application demands a specialised solution, we can move from concept to validated sample in under three weeks.</p>

  <h2>Workshop capabilities</h2>
  <table>
    <thead><tr><th>Workstation</th><th>Equipment</th><th>Purpose</th></tr></thead>
    <tbody>
      <tr><td>Weighing & dispensing</td><td>Precision balances (0.01 g), formula card system, ingredient barcode tracking</td><td>Accurate dispensing of active ingredients, co-formulants and solvents per master formula</td></tr>
      <tr><td>Formulation compounding</td><td>High-shear mixers, bead mill, sand mill, homogenizer</td><td>Preparation of SC, EC, WP, WDG, SL, ME, CS and FS formulations with controlled particle size distribution</td></tr>
      <tr><td>Filling & packaging</td><td>Semi-automatic filling line, drum sealer, label applicator</td><td>Packaging of sample formulations in drums from 1 L to 200 L with proper labeling</td></tr>
      <tr><td>Quality verification</td><td>HPLC, GC, laser particle size analyzer, viscometer, pH meter</td><td>Active ingredient content, particle size distribution, viscosity, pH, suspension rate and dispersion quality</td></tr>
      <tr><td>Stability evaluation</td><td>Temperature stability chambers (0 °C, 25 °C, 54 °C), cold/hot cycling rig</td><td>Accelerated stability testing, shelf-life estimation and cold stability verification</td></tr>
    </tbody>
  </table>

  <h2>The pilot batch journey — step by step</h2>
  <ol>
    <li><strong>Specification handover</strong> — The formulation package (target composition, formulation type, reference product data, performance requirements) is formally reviewed by the lab lead and the project engineer. Any manufacturing concerns are flagged and resolved before compounding begins.</li>
    <li><strong>Formulation compounding</strong> — The sample is produced according to the approved specification. Active ingredients are weighed, co-formulants are added in sequence, and the batch is processed through the appropriate equipment for the target formulation type (SC, EC, WP, WDG, SL, ME, CS or FS).</li>
    <li><strong>Initial analysis</strong> — The compounded sample undergoes analytical testing: active ingredient content by HPLC/GC, particle size distribution, viscosity, pH, suspension rate and emulsion stability as applicable to the formulation type.</li>
    <li><strong>Packaging & labeling</strong> — The sample is filled into appropriate containers with proper labeling including batch number, formulation code and hazard pictograms. All packaging is verified against the specification.</li>
    <li><strong>Stability testing</strong> — The sample enters the stability program: 0 °C cold stability (7 days), 54 °C accelerated storage (14 days), and thermal cycling (5 cycles). Physical properties are re-checked after each condition.</li>
    <li><strong>Field evaluation programme</strong> — Bioefficacy and crop safety evaluation, detailed below.</li>
    <li><strong>Sample review</strong> — A formal sign-off meeting is held with R&D, production, and quality teams. Any required formulation adjustments are documented and incorporated into the production release.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Field Evaluation Programme — Test Schedule</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 1</span>
        <span class="flex-1">Dose confirmation — application rate, spray volume and crop tolerance check</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 3</span>
        <span class="flex-1">Efficacy evaluation — pest/disease incidence assessment at target dose</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 7</span>
        <span class="flex-1">Residual activity — sustained control assessment and secondary pest impact</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 14</span>
        <span class="flex-1">Crop safety check — phytotoxicity evaluation at 1× and 2× recommended dose</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 21</span>
        <span class="flex-1">Extended efficacy — long-term control and yield impact assessment</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">Day 28</span>
        <span class="flex-1">Final assessment — comprehensive report with efficacy, crop safety and application data</span>
      </div>
    </div>
  </div>

  <h2>Custom formulation for unique applications</h2>
  <p>The Formulation Lab is where we solve the problems that standard product platforms cannot address. Recent examples include:</p>
  <ul>
    <li>A high-concentration lambda-cyhalothrin CS formulation for a European crop protection brand, with controlled-release microencapsulation and enhanced rainfastness — formulated, tested and validated at our facility.</li>
    <li>A combination herbicide SC formulation with two active ingredients for broad-spectrum weed control, validated across a 4-week multi-crop field trial program.</li>
    <li>A white-label fungicide WDG formulation with custom granule size distribution, where the pilot batch was used to validate dissolution rate, suspension stability and packaging compatibility before the client committed to volume production.</li>
  </ul>

  <h2>Our formulation team</h2>
  <p>The lab is staffed by eight multi-skilled formulation technicians, each cross-trained in at least two of the three core disciplines (compounding, analysis, stability testing). The team lead is a senior formulation chemist with 16 years of experience spanning custom one-off formulations to full production series. Every pilot batch is assigned a dedicated project engineer who serves as the single point of contact for the client throughout the formulation and test process.</p>

  <h2>Client involvement</h2>
  <p>We actively encourage our clients to attend key milestones during the pilot batch production — particularly the initial formulation review and the stability test results. Your operational feedback during these stages is invaluable in fine-tuning the formulation before it enters production. We do not formulate in a vacuum; we formulate in partnership with you.</p>
  <p>The field evaluation programme is also an opportunity for your team to familiarise themselves with the product's performance characteristics and application requirements, ensuring a smooth transition to production when the first volume batches are delivered.</p>

