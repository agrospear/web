answer:
  label: 'Straight answer'
  text: 'One factory serves every B2B route: OEM/ODM manufacturing with project-confirmed MOQ (sample 1–4 tons, pilot 5 tons, standard volume 20+ tons per batch; co-branding from lower quantities), private label on proven platforms, wholesale distribution and fleet programs for distributors and cooperatives. Every customer type maps to a specific solution set — samples in 7–14 days, production 25–35 days after PO and deposit.'
  verified: '2026-08'

