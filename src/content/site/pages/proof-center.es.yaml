answer:
  label: 'Respuesta directa'
  text: 'La cadena afirmación-evidencia es: cada afirmación de este sitio está respaldada por un registro, un certificado, una máquina, un documento o un registro de prueba — y cada uno de ellos puede revisarse. Agrospear es la división de desarrollo y fabricación agroquímica de Agrospear, la división de fabricación de Qingdao Vatrad Group Co., Ltd. (registrada en Qingdao desde 2012). La planta de 12,500 m² cuenta con gestión de calidad ISO 9001:2015, gestión medioambiental ISO 14001, documentación de registro ICAMA, cumplimiento social BSCI (informe de auditoría bajo petición) y documentación de registro ICAMA y COA de materias primas por pedido. Cada lote se prueba para verificar el contenido de ingrediente activo, las propiedades físicas y la estabilidad con auto-rechazo por encima de los límites de especificación, y los registros de lote se conservan con trazabilidad ERP de 10 años. La documentación se publica o se comparte, y la fábrica misma está abierta a auditorías.'
  verified: '2026-08'

