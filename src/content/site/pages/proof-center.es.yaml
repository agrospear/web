traceability:
  tagline: 'Un Lote, Seguido De La Materia Prima Al Bidón Embarcado'
  title: 'Cómo Es La Trazabilidad Real'
  body: |
    Cada lote recibe un **código de lote ERP de 10 años**. La cadena registrada bajo un mismo lote:

    - **Materia prima entrante** — COA del ingrediente activo de calidad técnica, número de lote, materia prima probada (contenido, impurezas, propiedades físicas)
    - **Pesaje y dosificación** — tarjeta de fórmula contra registro maestro de lote, cantidad registrada por ingrediente
    - **Mezcla y formulación** — línea, operario, parámetros de equipo por lote
    - **Llenado y envasado** — número de lote, tipo de bidón, lote de etiqueta
    - **Prueba** — contenido de ingrediente activo por HPLC/GC, propiedades físicas (viscosidad, pH, tamaño de partícula), datos de estabilidad contra límites de especificación
    - **Liberación** — checklist de 100 puntos por lote, firma del Director de QA por lote
    - **En adelante** — Certificado de Análisis con el envío; derecho de auditoría reservado en el contrato

    Pide el registro de control de calidad de muestra antes de tu primer pedido: es el mismo formato que recibes con tu envío.

faqs:
  tagline: 'FAQ'
  title: 'Preguntas De Evidencia Que Hacen Los Compradores'
  items:
    - q: '¿Esta página es solo para verificación y no sustituye la diligencia debida?'
      a: 'Correcto — esta página muestra dónde se puede verificar cada afirmación: registro de la entidad, certificados, máquinas, registros y una planta abierta a auditorías. Tus pasos habituales de diligencia debida (comprobación del registro, auditoría, inspección externa) siguen aplicándose y son bienvenidos.'
    - q: '¿Qué entidad debe aparecer en la documentación de mi pedido?'
      a: 'Los pedidos se formalizan con Qingdao Vatrad Group Co., Ltd., que opera como Agrospear (división de fabricación), con Agrospear como línea de producto agroquímico. Los contratos se firman por el Vicepresidente Comercial, el Ingeniero Jefe y el Director de QA.'
    - q: '¿Puedo obtener copias de los certificados antes de pedir?'
      a: 'Sí: los números de certificado y los registros de auditoría se facilitan bajo petición o durante una auditoría. La lista está publicada, nunca es "solo disponible bajo petición".'
    - q: '¿Cómo verifico yo mismo los registros de prueba del lote?'
      a: 'Cada lote se prueba para verificar el contenido de ingrediente activo, las propiedades físicas y la estabilidad contra los límites de especificación; los registros se vinculan a los números de lote y viajan con el Certificado de Análisis por lote. Puedes programar inspección previa al envío SGS, TÜV, BV o Intertek según ISO 2859-1 Nivel II.'
    - q: '¿Los certificados cubren también el envasado y el etiquetado?'
      a: 'La documentación de registro ICAMA y COA de materias primas aplica al producto formulado y al envasado del mismo pedido, y los checklists de control de calidad cubren el envío completo: formulación, bidón, etiqueta y paquete documental.'
    - q: '¿Qué pasa con la evidencia después del pedido?'
      a: 'La trazabilidad ERP del lote se conserva durante 10 años. Los SOP del SGC y las normas de inspección siguen descargables, y el comprador reserva un derecho de auditoría durante la producción según el contrato.'

