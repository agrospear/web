headline: 'Agrochemical Formulation Quality Guarantee & After-Sales Support'
subtitle: 'Agrospear stands behind the quality of every agrochemical formulation we manufacture. This Quality Guarantee sets forth the terms and coverage for your Agrospear product.'
seo:
  headline: 'Agrospear Agrochemical Quality Guarantee — Batch-Level Assurance'
  description: 'Agrospear guarantees active ingredient content, physical properties, and stability for every batch of agrochemical formulation produced. Full terms and conditions for Agrospear quality guarantee.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    This Quality Guarantee applies to Agrospear branded agrochemical formulations purchased directly from Agrospear or from an authorized Agrospear distributor. The effective date is the verifiable date of original purchase.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Guarantee Coverage & Duration</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Shelf Life</h3>
        <p class="text-sm text-gray-600 mt-1">Active ingredient content within ±5% of declared (SC, EC, WDG, WP)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Shelf Life</h3>
        <p class="text-sm text-gray-600 mt-1">Physical properties and formulation stability per FAO/WHO specifications</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Shelf Life</h3>
        <p class="text-sm text-gray-600 mt-1">Packaging integrity and labeling accuracy</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Shelf Life</h3>
        <p class="text-sm text-gray-600 mt-1">Certificate of Analysis (CoA) documentation for every batch</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Year</h3>
        <p class="text-sm text-gray-600 mt-1">Factory-supplied adjuvants and co-formulant accessories</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">Shelf Life*</h3>
        <p class="text-sm text-gray-600 mt-1">Distribution and commercial use — all components</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Commercial distribution use is covered for the full shelf life of the product when stored per Agrospear guidelines. Misuse or improper storage voids the guarantee.</p>
  </div>

  <h2>What Is Covered</h2>
  <h3>Active Ingredient Content (Shelf Life)</h3>
  <p>Agrospear guarantees that the active ingredient content of every batch will remain within ±5% of the declared content for the full shelf life of the product when stored according to published guidelines. This applies to all formulation types: SC, EC, WDG, WP, ME, and custom formulations.</p>

  <h3>Physical Properties and Stability (Shelf Life)</h3>
  <p>For all formulations, the physical properties — including suspension stability (SC), emulsion stability (EC), wettability and dispersibility (WDG/WP), and pourability — are guaranteed to meet FAO/WHO specifications for the full shelf life when stored per guidelines.</p>

  <h3>Packaging Integrity (Shelf Life)</h3>
  <p>Drums, bottles, and containers originally filled at the Agrospear factory are warranted against manufacturing defects that compromise product integrity — including leakage, contamination, or label illegibility.</p>

  <h3>Certificate of Analysis (Shelf Life)</h3>
  <p>Every production batch ships with a Certificate of Analysis (CoA) covering active ingredient content, physical properties, and accelerated stability test results. This documentation is the basis for guarantee claims.</p>

  <h3>Factory-Supplied Adjuvants (1 Year)</h3>
  <p>Adjuvants and co-formulant accessories manufactured by Agrospear are warranted against defects in material and workmanship for one year. This excludes third-party items, which are covered only by their respective manufacturer warranties.</p>

  <h2>What Is Not Covered</h2>
  <ul>
    <li>Cosmetic issues including label scuffing, drum discoloration, or packaging appearance changes</li>
    <li>Damage from improper storage — temperatures above 40 °C, freezing of liquid formulations, or exposure to direct sunlight</li>
    <li>Degradation from contamination, mixing with incompatible products, or improper handling</li>
    <li>Damage from negligence, improper use, accident, or normal wear and tear</li>
    <li>Active ingredient content deviations caused by storage beyond shelf life</li>
    <li>Performance issues caused by application errors, incorrect dosing, or adverse field conditions</li>
    <li>Third-party equipment, components, or co-formulants (covered by their respective manufacturers)</li>
  </ul>

  <h2>Manufacturer's Obligation & Remedy</h2>
  <p>Agrospear's sole and exclusive obligation is the replacement, at Agrospear's option, of any batch determined to be defective in materials or workmanship and covered under this guarantee. Replacement batches are produced and shipped at Agrospear's expense. Batches replaced under guarantee are warranted only for the unexpired portion of the original guarantee period.</p>

  <h2>Conditions of Guarantee</h2>
  <ul>
    <li><strong>Batch Records:</strong> The product must be traceable to its production batch via lot number on the CoA.</li>
    <li><strong>Storage:</strong> The product must be stored in accordance with Agrospear's published storage guidelines for the formulation type.</li>
    <li><strong>Cooperation:</strong> The purchaser must fully and promptly cooperate with Agrospear in all matters pertaining to guarantee claims, including providing retained samples for analysis.</li>
    <li><strong>Original Purchaser:</strong> This guarantee is extended exclusively to the original B2B purchaser and is not transferable.</li>
  </ul>

  <h2>Commercial Use</h2>
  <p>Products used for commercial distribution, government procurement, or institutional programs are covered for the full shelf life when stored per guidelines. Use contrary to label instructions or regulatory requirements voids the guarantee entirely.</p>

  <h2>How to Make a Quality Claim</h2>
  <p>Contact Agrospear or your authorized distributor with the batch lot number, Certificate of Analysis, and a detailed description of the issue. Agrospear will review the claim, analyze retained samples from the same batch, and provide instructions for resolution.</p>
  <p>For quality claim inquiries, please contact us through our <a href="/contact" class="text-sky-600 underline">contact page</a> with your order number and lot details.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Backed by a Documented Quality System</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Every batch is tested before shipping — <a href="/manufacturing/factory/quality-inspection" class="text-sky-600 underline">7-stage inspection gates</a> record results per lot number, and batches keep 5-year ERP traceability. Quality claims are adjudicated against these batch records and retained samples, not guesswork. See the <a href="/manufacturing/quality-control" class="text-sky-600 underline">full quality system</a> and download the actual <a href="/manufacturing/qcqa-documents" class="text-sky-600 underline">final inspection reports</a>.</p>
  </div>

  <h2>Third-Party Items</h2>
  <p>Equipment, components, or co-formulants manufactured by third parties (even if supplied by Agrospear) are covered exclusively by any warranty offered by their respective manufacturer. Agrospear expressly disclaims any guarantee responsibility for such third-party items.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    This guarantee statement is a summary of the complete Agrospear Manufacturer's Quality Guarantee. The full legal guarantee document governs all terms and conditions. Specifications subject to change without notice. Agrospear is the manufacturing division of Qingdao Vatrad Group.
  </p>
