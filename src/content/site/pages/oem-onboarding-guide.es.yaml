checklist:
  heading: 'Qué Preparar Antes de Tu Brief de Proyecto'
  body: |
    Cuanto más completo sea tu brief, más rápida y precisa será la cotización. Esto es lo que debes tener listo:

    - **Especificaciones de producto** — Ingrediente activo objetivo, concentración, tipo de formulación (SC, EC, WP, WDG), cultivo/plaga objetivo y mercado previsto. Si tienes especificaciones de producto de referencia o un perfil de formulación competidor, inclúyelas.
    - **Archivos de diseño de etiqueta** — Arte vectorial (AI, SVG o PDF) para etiquetas de producto, branding secundario y cualquier elemento de etiqueta regulatoria. Si el arte no está listo, un mood board o imágenes de referencia son suficientes para la factibilidad inicial.
    - **Volumen y cronograma del pedido** — Tu cantidad objetivo para el primer pedido y el calendario de temporada que necesitas cumplir. Incluso un rango aproximado ("5–10 toneladas para marzo") es suficiente para confirmar factibilidad y disponibilidad de cupo.
    - **Requisitos de cumplimiento** — Mercados objetivo (doméstico, LATAM, África, Sudeste Asiático, etc.) y cualquier requisito específico de registro o pruebas más allá de nuestro alcance estándar (ICAMA, FAO/OMS, ISO 9001).
    - **Rango de presupuesto** — Un presupuesto indicativo por tonelada o costo landed objetivo nos ayuda a recomendar la plataforma de formulación y el nivel de calidad adecuados. El precio exacto se confirma después de la revisión de I+D — nunca antes.

    Si aún no tienes todo esto, envía lo que tengas. Nosotros guiamos el resto.

evidence_review:
  tagline: 'Evidencia y verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricación en esta página son verificadas por nuestro equipo de ingeniería de fabricación en la planta de Laixi, Qingdao. Certificados, registros de inspección QC, informes de ensayos de estabilidad y análisis de contenido, y registros de trazabilidad por lote están disponibles a petición. Especificaciones verificadas por última vez 2026-08.'

faqs:
  tagline: FAQ
  title: 'Onboarding OEM — Preguntas Frecuentes'
  items:
    - q: '¿Cuánto tarda el proceso completo de onboarding?'
      a: 'La aprobación de muestras típicamente toma 2–4 semanas (incluyendo producción de muestras en 7–14 días y tu período de revisión). La primera serie de producción toma 6–8 semanas desde PO confirmado y depósito. Una formulación a medida añade 15–20 días de desarrollo. Cada puerta tiene un cronograma fijo que acuerdas por adelantado.'
    - q: '¿Necesito firmar un NDA antes de compartir mi formulación?'
      a: 'Un NDA está disponible de inmediato a petición — antes de que compartas cualquier especificación de formulación o diseño de etiqueta de propiedad. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado. La misma política se aplica a un lote de muestra que a un programa de contenedor.'
    - q: '¿Cuál es el pedido mínimo para una primera serie OEM?'
      a: 'El punto de entrada es escalonado: primero 1–4 toneladas de muestra (listas en 7–14 días), un pedido de prueba o piloto de 5 toneladas (producción en 25–35 días), y luego series de volumen estándar de 20+ toneladas por configuración aprobada. El co-branding de lotes pequeños parte desde cantidades inferiores cuando no se necesita etapa de desarrollo. Las tarifas de muestra se acreditan a tu pedido de producción.'
    - q: '¿Cómo se maneja la protección de IP durante el onboarding?'
      a: 'Tus formulaciones y especificaciones están protegidas bajo el NDA firmado antes de que se comparta cualquier información de propiedad. Todos los diseños de etiqueta, datos de BOM y archivos técnicos se almacenan en sistemas con control de acceso y trazabilidad de auditoría. En modo OEM, tú posees todo el IP. En modo ODM, el IP de la plataforma adaptada se comparte según acuerdo. En modo Private Label, el IP permanece con Agrospear y tú licencias la aplicación de marca.'
    - q: '¿Qué garantías de calidad aplican a un primer pedido?'
      a: 'Cada lote — muestra, prueba o volumen — pasa por el mismo sistema de inspección de 7 etapas: inspección de materia prima entrante, inspección de producto intermedio, mezcla y llenado, ensayos de estabilidad y análisis de contenido, QC de etiqueta y embalaje, verificación de documentación de cumplimiento, y embalaje y documentación final. La calidad nunca se reduce para pedidos más pequeños.'

