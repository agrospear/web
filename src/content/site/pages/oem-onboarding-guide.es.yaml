answer:
  label: 'Respuesta directa'
  text: 'Un onboarding OEM típico toma 2–4 semanas para la aprobación de muestras y 6–8 semanas para la primera serie de producción desde PO confirmado. Empiezas enviando un brief de proyecto (ingrediente activo, concentración, tipo de formulación, necesidades de cumplimiento). Respondemos en un día hábil, ofrecemos un NDA antes de que compartas detalles de propiedad, y producimos 1–4 toneladas de muestra de prototipo en 7–14 días para tu revisión y aprobación. Una vez congelada la muestra, la planificación de producción y la fabricación siguen con puertas de QC fijas en cada etapa. Cada paso está documentado y es trazable.'
  verified: '2026-08'

process_steps:
  tagline: Las Siete Puertas
  title: 'Flujo de Onboarding — Siete Puertas desde el Brief hasta la Entrega'
  subtitle: 'Cada puerta tiene una entrada definida, una salida definida y un cronograma que acuerdas por adelantado. Nunca avanzas past una puerta sin aprobación explícita.'
  steps:
    - step: 'Puerta 1'
      title: 'Consulta Inicial y NDA (Día 0)'
      desc: 'Envía un brief de proyecto a través de /contact con el ingrediente activo objetivo, concentración, tipo de formulación, volumen del pedido, requisitos de cumplimiento y cronograma. Un NDA está disponible de inmediato — antes de que compartas cualquier especificación de formulación o diseño de etiqueta de propiedad. Respuesta en un día hábil.'
    - step: 'Puerta 2'
      title: 'Revisión de Factibilidad y Cotización (Días 1–5)'
      desc: 'I+D revisa tu brief contra la capacidad de fabricación, disponibilidad de materias primas y alcance de cumplimiento. Recibes una cotización detallada con el cálculo de MOQ, tarifas de muestra (acreditadas hacia la producción) y segmentos de plazo — no un rango aproximado, un cronograma puerta por puerta.'
    - step: 'Puerta 3'
      title: 'Producción de Muestras (Días 6–17)'
      desc: '1–4 toneladas de lote prototipo producidas según tu especificación: precisión de composición, propiedades físicas, precisión de etiqueta, ajuste de embalaje. Evalúas la muestra antes de comprometerte con nada más. Las tarifas de muestra se acreditan a tu pedido de producción al firmar el contrato.'
    - step: 'Puerta 4'
      title: 'Revisión y Aprobación de Muestra (Días 18–21)'
      desc: 'Evalúas la muestra contra tus especificaciones — eficacia, propiedades físicas, fidelidad de etiqueta, embalaje, cumplimiento. Los ajustes se capturan en un BOM revisado y firma de etiqueta. La especificación congelada se convierte en la referencia de producción para todas las series posteriores.'
    - step: 'Puerta 5'
      title: 'Planificación de Preproducción (Días 22–28)'
      desc: 'Adquisición de materias primas, configuración de equipos, confirmación de embalaje y reserva de cupo de producción. Todos los materiales son inspeccionados a la entrada contra el BOM congelado. Se emite un cronograma de producción con fechas de puertas de QC antes de que comience la fabricación.'
    - step: 'Puerta 6'
      title: 'Producción y Puertas de QC (Días 29–55)'
      desc: 'La fabricación atraviesa el sistema de inspección de 7 etapas: inspección de materia prima entrante, inspección de producto intermedio, mezcla y llenado, ensayos de estabilidad y análisis de contenido, QC de etiqueta y embalaje, verificación de documentación de cumplimiento, y embalaje y documentación final. Cada puerta tiene criterios de aprobación/rechazo y registros de trazabilidad.'
    - step: 'Puerta 7'
      title: 'Envío y Revisión Post-Entrega (Días 56–63)'
      desc: 'Embalaje de grado exportación, documentación de cumplimiento (ICAMA, ISO 9001, especificaciones FAO/OMS) y coordinación de flete marítimo a 50+ países. Una revisión post-entrega captura lecciones aprendidas y refinamientos para el próximo ciclo de pedidos.'

