faqs:
  tagline: FAQ
  title: 'Formulaciones de pre-mezcla — Preguntas frecuentes'
  items:
    - q: '¿Qué combinaciones de pre-mezcla formuláis?'
      a: 'Insecticida + fungicida, insecticida de doble modo, fungicida de doble modo y combinaciones de herbicida + safener. Ejemplos habituales: tiametoxam + lambda-cialotrina SC, azoxistrobina + propiconazol SC, nicosulfuron + atrazina WDG. Pares de IA personalizados especificados por proyecto.'
    - q: '¿Las formulaciones de pre-mezcla son más complejas de desarrollar?'
      a: 'Sí. La compatibilidad entre activos, el diseño del sistema de coadyuvantes y la estabilidad térmica de cada componente deben validarse. Nuestro equipo de I+D realiza cribados de compatibilidad antes de la producción piloto y proporciona datos de estabilidad para la formulación combinada.'
    - q: '¿Las pre-mezclas requieren un registro separado?'
      a: 'En la mayoría de los mercados, sí — una pre-mezcla es un producto independiente que requiere su propio expediente de registro. Proporcionamos el paquete de datos completo: análisis de cinco lotes, estabilidad acelerada y a largo plazo, datos de toxicidad y eficacia de campo para el producto combinado.'
    - q: '¿Qué MOQ se aplica a las formulaciones de pre-mezcla?'
      a: 'Los lotes piloto parten de 5 toneladas para la validación de compatibilidad y estabilidad. La producción estándar arranca desde 20+ toneladas por SKU, con descuentos por volumen en umbrales de 50 t y 100 t. Los lotes de muestra para registro parten de 1–4 toneladas.'
    - q: '¿Qué tipos de formulación puede adoptar una pre-mezcla?'
      a: 'Los tipos principales son concentrados en suspensión (SC), concentrados emulsionables (EC) y gránulos dispersables en agua (WDG). La elección se guía por la solubilidad y forma física de cada activo, y recomendamos el tipo que mantiene la combinación física y químicamente estable durante su vida útil.'
    - q: '¿Cómo especifico una combinación personalizada de ingredientes activos?'
      a: 'Comparte tus activos objetivo, proporción, cultivo y mercado. Nuestro equipo de I+D realiza un cribado de compatibilidad y luego propone un sistema de coadyuvantes y un tipo de formulación con un programa de estabilidad. Una revisión técnica confirma las proporciones y la ruta de fabricación antes de la producción piloto.'
    - q: '¿Cuánto tarda la validación de estabilidad de una pre-mezcla?'
      a: 'El cribado de compatibilidad tarda unas 1–2 semanas. El ensayo de estabilidad acelerada (54 °C / 2 semanas o equivalente) corre en paralelo a la producción piloto, y se mantiene un estudio de estabilidad a largo plazo de 2 años mientras avanza tu registro.'
    - q: '¿Qué plazo de entrega de muestras puedo esperar?'
      a: 'Tras la confirmación de la formulación, las muestras físicas están disponibles en 7–14 días. Las enviamos con un certificado de análisis y una instantánea de estabilidad para que tu laboratorio valide la combinación antes de comprometerte con el volumen.'
    - q: '¿Cobráis por los ensayos de compatibilidad y estabilidad?'
      a: 'Para proyectos OEM dentro de nuestras plataformas de producto estándar, el cribado inicial de compatibilidad está incluido en el alcance del proyecto. Las combinaciones personalizadas que requieren I+D extensa o programas de estabilidad singulares se presupuestan y cotizan con transparencia antes de comenzar.'
    - q: '¿Las pre-mezclas pueden envasarse bajo mi marca privada?'
      a: 'Sí. Ofrecemos envases de botella, IBC, bidón y sobre con tu diseño de marca privada, y podemos unificar el embalaje entre los productos individuales y combinados de tu gama para una presencia de marca consistente.'

