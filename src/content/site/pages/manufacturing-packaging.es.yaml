faqs:
  tagline: FAQ
  title: 'Embalaje y etiquetado — Preguntas frecuentes'
  items:
    - q: '¿Diseñáis etiquetas o necesito proporcionar el arte?'
      a: 'Ambas opciones funcionan. Nuestro equipo de diseño desarrolla etiquetas listas para producción desde tu logo y guía de marca. Si tienes arte existente, lo adaptamos a nuestras especificaciones de impresión y requisitos regulatorios. En cualquier caso, apruebas la prueba de etiqueta antes de la producción.'
    - q: '¿Qué tamaños de embalaje están disponibles?'
      a: 'Formulaciones líquidas: 100 mL, 250 mL, 500 mL, 1 L, 5 L, 10 L, 20 L y 200 L. Formulaciones en polvo: 100 g, 250 g, 500 g, 1 kg, 5 kg, 10 kg y 25 kg. Tamaños personalizados disponibles bajo solicitud.'
    - q: '¿Los embalajes de exportación cumplen con DG?'
      a: 'Sí. Todo el embalaje de exportación cumple con las especificaciones de embalaje UN para transporte de mercancías peligrosas por mar (IMDG) y tierra (ADR). Grupo de embalaje, marca UN y nombre de envío correcto están marcados en cada caja exterior.'
    - q: '¿Se puede cambiar el embalaje entre pedidos?'
      a: 'Sí. Una vez que tus activos de marca están listos para producción, los reordenes pueden actualizar etiquetas, colores o embalaje en cualquier momento. Se aplican cantidades mínimas de pedido para materiales impresos personalizados, confirmadas por proyecto.'

