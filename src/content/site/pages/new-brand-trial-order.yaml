answer:
  label: 'Straight answer'
  text: 'Yes — you can launch an agrochemical brand with a low-MOQ trial order. The entry point is tiered rather than all-or-nothing: order a 1–4 ton sample batch first (ready in 7–12 days) to freeze your formulation, labeling and packaging; then place a pilot order of 5 tons (production in 25–35 days) to test real sell-through; finally scale into standard volume runs of 20+ tons per batch once the format is proven. Small-batch co-branding starts from lower quantities for operators that want branded products without any development stage at all. Your first volume order comes only when the data says it should.'
  verified: '2026-08'

trial_included:
  tagline: What the Trial Order Covers
  title: 'Everything a Launch Needs, Without the Overhead'
  subtitle: 'A trial order is not a downsized invoice — it is the same factory process, sized to a launching brand. Here is what every trial program includes.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Formulation Platform & Active Ingredient'
      desc: 'Field-tested herbicide, insecticide and fungicide platforms across SC, EC, WP, WDG, SL, ME, CS and FS formulations — the same platforms used by our volume clients, with established ICAMA production licenses.'
    - icon: L
      icon_bg: green
      title: 'Your Branding, Applied for Real'
      desc: 'Full label design with your brand, active ingredient declaration, regulatory text and safety statements. Small-batch co-branding uses Agrospear central branding with your logo on label and packaging.'
    - icon: P
      icon_bg: purple
      title: 'Packaging Options That Scale'
      desc: 'Start with generic drums with barcode stickers, upgrade to full-color branded packaging for later runs. Custom packaging carries an independent press minimum; surplus packaging is stored and released on schedule.'
    - icon: Q
      icon_bg: orange
      title: 'Factory-Level Quality Control'
      desc: 'Every batch passes the same active ingredient analysis (HPLC/GC), physical property testing per FAO/WHO specifications and accelerated stability verification that applies to any order, sample or volume.'
    - icon: D
      icon_bg: blue
      title: 'Export & Documentation'
      desc: 'ICAMA, ISO 9001, BSCI compliance documentation, Certificate of Analysis per batch, export-grade packing and ocean freight coordination to 50+ countries — from a sample batch to full programs.'
    - icon: T
      icon_bg: green
      title: 'Timeline You Can Plan Around'
      desc: 'Sample batches in 7–12 days, pilot production in 25–35 days after confirmed PO and deposit, and confirmed production slots for pre-season orders — so a launch lands in season, not after it.'

trial_steps:
  tagline: The Launch Roadmap
  title: 'From Idea to First Sell-Through in Six Gates'
  subtitle: 'The typical first launch runs 8–12 weeks from brief to delivered pilot order using existing platforms — longer when a bespoke formulation adds R&D development. Every gate has a date you agree in advance.'
  steps:
    - step: 'Gate 1'
      title: 'Product Brief & Engineering Review (Days 0–2)'
      desc: 'You share target formulation, order quantity, labeling and packaging intent. Engineering review completes within one business day, with NDA available before you share proprietary specs.'
    - step: 'Gate 2'
      title: 'Specification, MOQ & Quotation (Days 3–7)'
      desc: 'Itemized quotation with the exact MOQ calculation, sample fees and lead time segments. Sample fees are credited toward your production order upon contract sign-off.'
    - step: 'Gate 3'
      title: 'Sample Batch in 7–12 Days'
      desc: '1–4 ton sample batch validates active ingredient content, physical properties, label accuracy and packaging fitment. You test the product before committing to anything else.'
    - step: 'Gate 4'
      title: 'Pilot Order of 5 Tons (25–35 Days)'
      desc: 'Production on existing formulation platforms with standard materials and simplified packaging — the minimum commercial test that reflects real inventory conditions.'
    - step: 'Gate 5'
      title: 'Sell-Through & Feedback Window'
      desc: 'The important gate is in your market, not our factory: distributors and growers confirm the formulation, labeling and price point before you scale.'
    - step: 'Gate 6'
      title: 'Scale Into Volume Runs (20+ Tons)'
      desc: 'Once the format is proven, standard batch runs deliver full production efficiency, branded packaging and volume pricing. A volume program is the goal, not the requirement.'

