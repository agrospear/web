trial_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About Launching with a Trial Order'
  items:
    - q: 'Can I really launch an agrochemical brand without a volume order?'
      a: 'Yes. The entry point is tiered: 1–4 ton sample batches validate the formulation (ready in 7–12 days), a pilot order of 5 tons validates the market (production in 25–35 days), and volume runs of 20+ tons per batch follow only when sell-through proves the format. Small-batch co-branding starts from lower quantities when you want branded products without any development stage.'
    - q: 'How long does a full launch take, end to end?'
      a: 'Using existing formulation platforms, a typical first launch runs 8–12 weeks from product brief to delivered pilot order: sample batches in 7–12 days, pilot production in 25–35 days after confirmed PO and deposit. A bespoke formulation adds 15–20 days of R&D development.'
    - q: 'What does the price include — and what does it not?'
      a: 'Reference ranges are EXW Qingdao for the formulated product itself, including labeling application and standard QC. They are indicative: the final quotation is confirmed against your configuration — active ingredient, formulation type, label coverage, packaging and quantity — before any commitment. Freight, duties and customs clearance at destination are quoted separately.'
    - q: 'Do I have to buy 20 tons to get my brand on the label?'
      a: 'No. Small-batch co-branding puts your logo on label and packaging from lower quantities, and pilot orders of 5 tons support full label application at the same quality as volume production. What changes with quantity is unit price, not availability.'
    - q: 'What happens if I want to change the formulation after the trial?'
      a: 'Changes between trial and volume are normal and welcomed — that is the point of the trial. Formulation, labeling, packaging and accessories are re-priced against the new configuration, then frozen with label and BOM sign-off before the volume run.'
    - q: 'Do you sign an NDA before I share my formulations?'
      a: 'Yes. A Non-Disclosure Agreement is available before you share proprietary technical specifications or formulation details. We manufacture exclusively under the brands of our clients and never compete with them in any market — the same policy applies to a sample batch as to a volume program.'

