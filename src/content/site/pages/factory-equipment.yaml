answer:
  label: 'Straight answer'
  text: 'Our 20,000 m² factory runs PLC-controlled automatic weighing and dosing (±0.1% accuracy), high-shear mixers at 3,000–10,000 rpm plus sand mills for SC/WDG particle size control, spray dryers and fluid bed granulators for WDG/WP production, and a QC lab with HPLC/GC for active content analysis, laser particle size analyzers, and 54°C stability chambers for 14-day shelf stability verification.'
  verified: '2026-08'

categories:
  - title: Raw Material Preparation
    items:
      - name: Automatic Weighing & Dosing System
        spec: PLC-controlled, ±0.1% accuracy, 5-ton capacity
        desc: Computer-controlled automatic weighing and dosing system for technical-grade active ingredients, solvents, and adjuvants. Formulation software optimises material utilisation to below 3% waste.
      - name: Bulk Storage & Transfer System
        spec: Stainless steel tanks, 10–50 m3 capacity, nitrogen-blanketed
        desc: Stores and transfers solvents and liquid raw materials with controlled nitrogen blanket to prevent contamination and moisture ingress.

  - title: Compounding & Mixing
    items:
      - name: High-Shear Mixer
        spec: 3,000–10,000 rpm, 500–5,000 L capacity
        desc: High-shear mixer for compounding SC, EC, and SL formulations. Disperses active ingredients into carriers and ensures uniform premix before milling.
      - name: Premixing Tank
        spec: 1,000–5,000 L, jacketed, temperature-controlled
        desc: Temperature-controlled premixing tank for EC and SL formulations requiring precise dissolution and blending of active ingredients with emulsifiers.
      - name: Low-Speed Agitator
        spec: 50–200 rpm, 2,000–10,000 L
        desc: Low-speed agitator for WP and WDG slurry preparation and post-milling homogenization of suspension concentrates.

  - title: Formulation Processing
    items:
      - name: Sand Mill / Bead Mill
        spec: 0.1–50 μm particle size, 200–1,000 L/h throughput
        desc: Precision sand milling for SC and WDG formulations to achieve target particle size distributions (D50 1–5 μm for SC, D50 20–40 μm for WDG).
      - name: Spray Dryer
        spec: 50–200 kg/h evaporation rate, inlet 180–220°C
        desc: Spray dryer for converting milled WDG and WP slurries into dry dispersible granules with consistent particle size and moisture content.
      - name: Fluid Bed Granulator
        spec: 100–500 kg/batch
        desc: Fluid bed granulation for producing uniform WDG granules with controlled bulk density and dispersibility.

  - title: Filling & Packaging
    items:
      - name: Automatic Filling Line
        spec: 20–200 L drums, 100–1,000 mL bottles, ±0.2% accuracy
        desc: Automatic filling machine for drums, jerry cans, and bottles with precision volumetric filling and automatic weight verification.
      - name: Automatic Labeling Machine
        spec: Multi-language GHS label, 30–60 units/min
        desc: Automatic labeling machine applying GHS-compliant labels with batch number, date code, and multi-language regulatory text.
      - name: Inkjet Batch Coder
        spec: Continuous inkjet, batch/date/lot coding
        desc: Inkjet coder for permanent batch and date coding on containers and outer packaging for full traceability.

  - title: Testing & Quality Control
    items:
      - name: HPLC System
        spec: UV/VIS detector, CIPAC-compliant methods
        desc: High-performance liquid chromatography for active ingredient content quantification and impurity analysis per CIPAC methods.
      - name: GC System
        spec: FID/ECD detector, volatile and semi-volatile analysis
        desc: Gas chromatography for solvent analysis, volatile impurity profiling, and active content verification for EC and SL formulations.
      - name: Laser Particle Size Analyzer
        spec: 0.01–3,500 μm range, wet and dry dispersion
        desc: Laser diffraction particle size analysis for SC, WDG, and WP formulations to verify D50, D90, and span per specification.
      - name: Stability Chamber
        spec: 54°C ± 2°C, 40°C ± 2°C, CIPAC MT 46 compliant
        desc: Temperature-controlled stability chambers for 14-day accelerated stability testing and shelf-life verification per CIPAC MT 46.

