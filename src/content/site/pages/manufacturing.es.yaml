hero:
  tagline: Fabricación
  title: 'Centro de Fabricación Agroquímica'
  subtitle: 'Fábrica de agroquímicos de 12.500 m² en Qingdao, China — formulación OEM/ODM, producción, control de calidad y exportación para marcas de protección de cultivos en todo el mundo.'

answer:
  label: 'Respuesta directa'
  text: 'Agrospear opera una fábrica de agroquímicos de 12.500 m² en Qingdao (China) con más de 350 trabajadores, 6 líneas de producción y más de 20.000 toneladas de producción anual. Certificada ISO 9001, ISO 14001, BSCI e ICAMA. Servicios OEM/ODM desde lotes piloto de 5 toneladas hasta lotes estándar de 20+ toneladas, enviados a más de 50 países. Cada lote se prueba de estabilidad a 54 °C durante 14 días con trazabilidad completa de materiales.'
  verified: '2026-08'

intro:
  - Como división de fabricación de **Qingdao Vatrad Group Co., Ltd.**, Agrospear controla cada etapa de la fabricación de agroquímicos — desde el ingrediente activo bruto hasta el producto de protección de cultivos terminado. Nuestra planta alberga talleres dedicados a la mezcla, molienda, llenado, etiquetado y ensayos de calidad bajo un mismo techo.
  - Al integrar el diseño de formulación, la ingeniería, la creación de prototipos, la fabricación y los ensayos, eliminamos las ineficiencias de la fabricación por contrato y mantenemos el control directo sobre la calidad del producto, la selección de materias primas y los plazos de entrega.

