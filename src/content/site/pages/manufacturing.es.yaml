faqs:
  tagline: FAQ
  title: 'Fabricación — Preguntas Frecuentes'
  items:
    - q: '¿Qué capacidades de fabricación tiene Agrospear?'
      a: 'Fábrica de 12.500 m² con 6 líneas de producción, más de 350 trabajadores y más de 20.000 toneladas de capacidad anual. Mezclamos, molemos, llenamos, etiquetamos y enviamos productos agroquímicos en formulaciones SC, EC, WP, WDG, SL, ME, CS y FS con certificación ISO 9001 e ICAMA.'
    - q: '¿Cuál es el MOQ para fabricación?'
      a: 'El MOQ se confirma por configuración del proyecto: muestras 1–4 toneladas, pilotos desde 5 toneladas, volumen estándar 20+ toneladas por lote. El plazo de producción es de 25–35 días desde el PO confirmado.'
    - q: '¿Agrospear gestiona la exportación?'
      a: 'Sí. Enviamos a más de 50 países con documentación de exportación interna, despacho de aduanas y condiciones FOB Qingdao, CIF o DDP.'
    - q: '¿Cómo se controla la calidad?'
      a: 'Cada lote pasa un sistema de inspección de 7 etapas con ensayo de estabilidad a 54 °C durante 14 días, verificación de contenido activo por HPLC/GC y trazabilidad ERP de lotes de 10 años.'

