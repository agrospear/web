headline: 'Garantía de Calidad de Formulación Agroquímica y Soporte Posventa'
subtitle: 'Agrospear respalda la calidad de cada formulación agroquímica que fabrica. Esta Garantía de Calidad establece los términos y la cobertura de tu producto Agrospear.'
seo:
  headline: 'Garantía de Calidad Agrospear — Garantía a nivel de lote'
  description: 'Agrospear garantiza el contenido de ingrediente activo, las propiedades físicas y la estabilidad de cada lote de formulación agroquímica producido. Términos y condiciones completos de la garantía de calidad de Agrospear.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Esta Garantía de Calidad se aplica a formulaciones agroquímicas de marca Agrospear adquiridas directamente a Agrospear o a través de un distribuidor autorizado. La fecha efectiva es la fecha verificable de compra original.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Cobertura y Duración de la Garantía</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Vida útil</h3>
        <p class="text-sm text-gray-600 mt-1">Contenido de ingrediente activo dentro de ±5% del declarado (SC, EC, WDG, WP)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Vida útil</h3>
        <p class="text-sm text-gray-600 mt-1">Propiedades físicas y estabilidad de la formulación según especificaciones FAO/OMS</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Vida útil</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad del embalaje y precisión del etiquetado</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Vida útil</h3>
        <p class="text-sm text-gray-600 mt-1">Certificado de Análisis (CdA) para cada lote</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Año</h3>
        <p class="text-sm text-gray-600 mt-1">Adyuvantes y coformulantes suministrados de fábrica</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">Vida útil*</h3>
        <p class="text-sm text-gray-600 mt-1">Distribución y uso comercial — todos los componentes</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*El uso en distribución comercial está cubierto por la vida útil completa del producto cuando se almacena según las instrucciones de Agrospear. El uso inadecuado o almacenamiento incorrecto anula la garantía.</p>
  </div>

  <h2>Qué Está Cubierto</h2>
  <h3>Contenido de Ingrediente Activo (Vida Útil)</h3>
  <p>Agrospear garantiza que el contenido de ingrediente activo de cada lote permanecerá dentro de ±5% del contenido declarado durante toda la vida útil del producto cuando se almacene según las instrucciones publicadas. Esto aplica a todos los tipos de formulación: SC, EC, WDG, WP, ME y formulaciones a medida.</p>

  <h3>Propiedades Físicas y Estabilidad (Vida Útil)</h3>
  <p>Para todas las formulaciones, las propiedades físicas — incluyendo estabilidad de suspensión (SC), estabilidad de emulsión (EC), humectabilidad y dispersibilidad (WDG/WP) y vertibilidad — están garantizadas conforme a las especificaciones FAO/OMS durante toda la vida útil cuando se almacenan según las instrucciones.</p>

  <h3>Integridad del Embalaje (Vida Útil)</h3>
  <p>Los tambores, botellas y contenedores llenados originalmente en la fábrica de Agrospear están garantizados contra defectos de fabricación que comprometan la integridad del producto — incluyendo fugas, contaminación o ilegibilidad de etiquetas.</p>

  <h3>Certificado de Análisis (Vida Útil)</h3>
  <p>Cada lote de producción se envía con un Certificado de Análisis (CdA) que cubre el contenido de ingrediente activo, las propiedades físicas y los resultados de las pruebas de estabilidad acelerada. Esta documentación es la base para las reclamaciones de garantía.</p>

  <h3>Adyuvantes de Fábrica (1 Año)</h3>
  <p>Los adyuvantes y coformulantes fabricados por Agrospear están garantizados contra defectos de material y mano de obra durante un año. Esto excluye artículos de terceros, que están cubiertos únicamente por la garantía de sus respectivos fabricantes.</p>

  <h2>Qué No Está Cubierto</h2>
  <ul>
    <li>Problemas estéticos como rozaduras de etiqueta, decoloración del tambor o cambios de apariencia del embalaje</li>
    <li>Daños por almacenamiento inadecuado — temperaturas superiores a 40 °C, congelación de formulaciones líquidas o exposición a la luz solar directa</li>
    <li>Degradación por contaminación, mezcla con productos incompatibles o manipulación incorrecta</li>
    <li>Daños por negligencia, uso inadecuado, accidente o desgaste normal</li>
    <li>Desviaciones del contenido de ingrediente activo causadas por almacenamiento más allá de la vida útil</li>
    <li>Problemas de rendimiento causados por errores de aplicación, dosificación incorrecta o condiciones adversas en el campo</li>
    <li>Equipos, componentes o coformulantes de terceros (cubiertos por sus respectivos fabricantes)</li>
  </ul>

  <h2>Obligación del Fabricante y Resolución</h2>
  <p>La única y exclusiva obligación de Agrospear es la sustitución, a criterio de Agrospear, de cualquier lote que se determine defectuoso en materiales o mano de obra y esté cubierto por esta garantía. Los lotes de sustitución se producen y envían a cargo de Agrospear. Los lotes sustituidos bajo garantía solo están cubiertos por el período restante de la garantía original.</p>

  <h2>Condiciones de la Garantía</h2>
  <ul>
    <li><strong>Registros de Lote:</strong> El producto debe ser trazable a su lote de producción mediante el número de lote indicado en el CdA.</li>
    <li><strong>Almacenamiento:</strong> El producto debe almacenarse conforme a las instrucciones de almacenamiento publicadas por Agrospear para el tipo de formulación.</li>
    <li><strong>Cooperación:</strong> El comprador debe cooperar plena y puntualmente con Agrospear en todos los asuntos relativos a reclamaciones de garantía, incluido el envío de muestras retenidas para análisis.</li>
    <li><strong>Comprador Original:</strong> Esta garantía se extiende exclusivamente al comprador B2B original y no es transferible.</li>
  </ul>

  <h2>Uso Comercial</h2>
  <p>Los productos utilizados para distribución comercial, compras gubernamentales o programas institucionales están cubiertos por la vida útil completa cuando se almacenan según las instrucciones. El uso contrario a las instrucciones de la etiqueta o a los requisitos regulatorios anula la garantía completamente.</p>

  <h2>Cómo Presentar una Reclamación de Calidad</h2>
  <p>Contacta con Agrospear o tu distribuidor autorizado con el número de lote, el Certificado de Análisis y una descripción detallada del problema. Agrospear revisará la reclamación, analizará las muestras retenidas del mismo lote y proporcionará instrucciones para su resolución.</p>
  <p>Para consultas sobre reclamaciones de calidad, contacta con nosotros a través de nuestra <a href="/es/contact" class="text-sky-600 underline">página de contacto</a> con tu número de pedido y los datos del lote.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Respaldado por un Sistema de Calidad Documentado</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Cada lote se prueba antes del envío — <a href="/es/manufacturing/factory/quality-inspection" class="text-sky-600 underline">7 puertas de inspección</a> registran resultados por número de lote y los lotes mantienen trazabilidad ERP de 5 años. Las reclamaciones de calidad se resuelven con estos registros de lote y muestras retenidas, no con suposiciones. Consulta el <a href="/es/manufacturing/quality-control" class="text-sky-600 underline">sistema de calidad completo</a> y descarga los <a href="/manufacturing/qcqa-documents" class="text-sky-600 underline">informes de inspección final</a>.</p>
  </div>

  <h2>Artículos de Terceros</h2>
  <p>Equipos, componentes o coformulantes fabricados por terceros (incluso si son suministrados por Agrospear) están cubiertos exclusivamente por cualquier garantía ofrecida por su respectivo fabricante. Agrospear renuncia expresamente a cualquier responsabilidad de garantía sobre dichos artículos de terceros.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Esta declaración de garantía es un resumen de la Garantía de Calidad del Fabricante completa de Agrospear. El documento legal de garantía completo rige todos los términos y condiciones. Las especificaciones pueden cambiar sin previo aviso. Agrospear es la división de fabricación de Qingdao Vatrad Group.
  </p>
