      icon_bg: green
      title: 'ASEAN Harmonization'
      desc: 'ASEAN guidelines for harmonized pesticide registration support mutual recognition across member states. Documentation aligned with ASEAN testing guidelines and data requirements.'
      link_label: 'Registration support'
