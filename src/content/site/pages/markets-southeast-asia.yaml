crop_profiles:
  tagline: 'Crops & Pests'
  title: 'Key Crops and Target Pests — Southeast Asia'
  features:
    - icon: R
      icon_bg: green
      title: 'Rice — Brown Planthopper & Stem Borer'
      desc: 'Brown planthopper (Nilaparvata lugens) and yellow stem borer (Scirpophaga incertulas) are primary rice pests across ASEAN. SC formulations of buprofezin and EC formulations of chlorpyrifos for integrated pest management.'
      link_label: 'View insecticides'
      href: /products/insecticides
    - icon: P
      icon_bg: blue
      title: 'Oil Palm — Rhinoceros Beetle & Ganoderma'
      desc: 'Rhinoceros beetle (Oryctes) and basal stem rot (Ganoderma) threaten palm oil yields. EC formulations for beetle control, WP formulations of trifloxystrobin for disease management.'
      link_label: 'View fungicides'
      href: /products/fungicides
    - icon: B
      icon_bg: purple
      title: 'Rubber — Corynespora Leaf Fall'
      desc: 'Corynespora cassiicola leaf fall disease affects rubber plantations across Southeast Asia. SC and WP formulations of mancozeb and tebuconazole for disease control programs.'
      link_label: 'View fungicides'
      href: /products/fungicides
    - icon: V
      icon_bg: orange
      title: 'Vegetables — Diamondback Moth'
      desc: 'Diamondback moth (Plutella xylostella) and fruit borers damage cruciferous and solanaceous vegetables. WDG formulations of indoxacarb and SC formulations of chlorantraniliprole for resistance management.'
      link_label: 'View insecticides'
      href: /products/insecticides

