    - icon: T
      icon_bg: blue
      title: 'National Registration'
      desc: 'Individual country registration through DVS (Vietnam), DOA (Thailand), Pesticide Committee (Indonesia) and FPA (Philippines). Local dossier preparation and submission support.'
      link_label: 'Registration support'
