    - icon: S
      icon_bg: purple
      title: 'Tropical Stability Testing'
      desc: 'Accelerated stability at 54°C (CIPAC MT 46) and long-term at 30°C/75% RH for all ASEAN formulations. Adjuvant packages adjusted for high temperature and humidity.'
      link_label: 'View quality control'
      href: /manufacturing/quality-control

faqs:
  tagline: FAQ
  title: 'Southeast Asia Market — Frequently Asked Questions'
  items:
    - q: 'Which Southeast Asian countries do you supply?'
      a: 'We supply OEM products to distributors in Vietnam, Thailand, Indonesia, Philippines, Myanmar, Cambodia and Laos. Products are registered or in registration in key ASEAN markets.'
    - q: 'How do you ensure formulation stability in tropical climates?'
      a: 'All formulations undergo accelerated stability testing at 54°C (CIPAC MT 46) and long-term stability studies at 30°C/75% RH. We adjust adjuvant packages, preservative systems and packaging materials for tropical storage conditions.'
    - q: 'What packaging sizes work for Southeast Asian markets?'
      a: 'Smallholder-friendly packaging: 50 mL, 100 mL and 250 mL sachets and bottles with pictorial labels. Institutional sizes: 1 L and 5 L for plantation-scale buyers. Custom packaging sizes available for specific channel requirements.'
    - q: 'Do you support ASEAN harmonized registration?'
      a: 'Yes. We provide documentation aligned with ASEAN guidelines for harmonized pesticide registration: GLP study reports, five-batch analysis, residue data and formulation specifications. Our regulatory team supports submissions in target ASEAN countries.'

