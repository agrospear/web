  label: 'Respuesta directa'
  text: 'La fabricación de pesticidas de marca privada en Agrospear pone tu marca en plataformas de formulación probadas — sin etapa de I+D. Etiquetas personalizadas, embalaje con marca y documentación regulatoria incluidas. MOQ desde lotes piloto de 5 toneladas, producción en 25–35 días, enviado a más de 50 países desde nuestra fábrica certificada ISO 9001 e ICAMA en Qingdao, China.'
