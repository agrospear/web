process_steps:
  tagline: El Proceso
  title: 'Del Concepto de Marca al Primer Envío'
  subtitle: 'Un proceso simplificado diseñado para la velocidad — sin etapa de I+D significa menos tiempo al mercado.'
  steps:
    - step: '01'
      title: 'Selecciona Tu Plataforma'
      desc: 'Elige de las plataformas de formulación probadas de Agrospear — herbicidas, insecticidas, fungicidas o reguladores de crecimiento. Recomendamos la mejor opción para tu mercado objetivo y segmentos de cultivo.'
    - step: '02'
      title: 'Diseño de Marca y Embalaje'
      desc: 'Proporciona tu arte de etiqueta y especificaciones de embalaje, o trabaja con nuestro equipo de diseño interno. Etiquetas GHS conformes multilingües incluidas.'
    - step: '03'
      title: 'Muestra y Aprobación (7–12 Días)'
      desc: 'Se produce un lote de muestra física con tu marca para tu revisión. Precisión de etiqueta, ajuste de embalaje y calidad del producto verificados antes del compromiso de producción.'
    - step: '04'
      title: 'Producción y QC (25–35 Días)'
      desc: 'Fabricación a través del sistema de inspección de 7 etapas. Lotes piloto desde 5 toneladas, volumen estándar 20+ toneladas por formulación.'
    - step: '05'
      title: 'Embalaje y Envío'
      desc: 'Embalaje de exportación con tu documentación de marca y COA. Enviado a más de 50 países con condiciones FOB, CIF o DDP.'

faqs:
  tagline: FAQ
  title: 'Fabricación de Marca Privada — Preguntas Frecuentes'
  items:
    - q: '¿En qué se diferencia la marca privada de la fabricación OEM?'
      a: 'La fabricación OEM produce desde tu especificación de formulación existente — tú eres dueño del IP. La marca privada pone tu marca en una plataforma probada de Agrospear — sin I+D, MOQ más bajo y más rápido al mercado. Consulta nuestra comparación OEM vs Marca Privada para más detalles.'
    - q: '¿Cuál es el MOQ para marca privada?'
      a: 'Los lotes piloto parten de 5 toneladas sobre plataformas existentes. La producción de volumen estándar corre de 20+ toneladas por lote. Sin tarifa de desarrollo de formulación ya que la plataforma ya está probada.'
    - q: '¿Puedo personalizar la etiqueta y el embalaje?'
      a: 'Sí — etiquetas totalmente personalizadas con tu logo, colores de marca y nombres de producto. Etiquetas GHS conformes multilingües, embalaje con marca y especificaciones de tambor personalizadas. Nuestro equipo de diseño puede asistir.'
    - q: '¿Cuánto tarda el primer envío?'
      a: 'Sin etapa de I+D, el cronograma es más corto: muestra en 7–12 días, luego 25–35 días de producción desde PO confirmado. Cronograma total desde el primer contacto hasta el primer envío es típicamente 6–8 semanas.'
    - q: '¿Proporcionáis documentación regulatoria?'
      a: 'Sí. Datos de registro ICAMA, especificaciones FAO/OMS y documentación de cumplimiento por mercado están incluidos con cada pedido de marca privada.'

