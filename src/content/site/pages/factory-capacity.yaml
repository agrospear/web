answer:
  label: 'Straight answer'
  text: 'Factory capacity: 12,500 m2 across four specialized workshops, 20,000+ tons of agrochemical formulations per year, 350+ workers on two shifts, exporting to 50+ countries. MOQ is confirmed by project configuration — sample (1–4 tons), pilot (5 tons) and standard volume (20+ tons per batch); see our MOQ & Flexible Branding Guide for the full logic. Lead time 25–35 days, samples 7–12 days.'
  verified: '2026-08'

intro: Agrospear operates one of the largest dedicated agrochemical manufacturing facilities in Qingdao, China. Our 12,500 m2 factory is organized into four specialized workshops operating in parallel, giving us the capacity to produce over 20,000 tons annually across formulation and packaging lines.

