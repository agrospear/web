  payment: 'T/T 30% deposit + 70% balance. L/C, Western Union accepted.'

lead_time_explainer:
  tagline: 'Planning & Scheduling'
  title: 'How Capacity Translates Into Your Delivery'
  subtitle: 'Capacity is not a single number — here is how lead times are actually allocated.'
  items:
    - title: 'Capacity varies with your specification'
      body: 'Available slots shift with formulation type, concentration complexity, packaging and seasonal demand. During the spring/summer application season, lines run near full and sample slots book out first.'
    - title: 'Plan ahead of your launch season'
      body: 'Lock your sample confirmation and label artwork freeze early. Repeat orders are scheduled into your agreed recurring slot once the golden sample is archived.'
    - title: 'Three scheduling lanes'
      body: 'Samples enter the lab line first, initial orders slot into the nearest open production window, and repeat orders run in their recurring slot.'
    - title: 'Firm lead times after review'
      body: 'We confirm a firm lead time only after formulation, label artwork, packaging and quantity are reviewed — never as a fixed promise beforehand.'

