workshops:
  - title: SC/EC/SL Formulation Production
    description: '4 automated production lines for SC, EC, and SL formulations with a combined output of about 2,000 tons per month. High-shear mixing and sand milling stations run concurrently. Annual capacity: 20,000+ tons.'
    output: '20,000+ tons/year'
  - title: WDG/WP/ME Formulation Production
    description: 'Expanded production capacity for WDG, WP, and ME formulations utilizing additional spray drying and fluid bed granulation lines. Sand milling, spray drying, and packaging stations run concurrently.'
    output: 'Expanded WDG/WP capacity'
  - title: FS Seed Treatment Production
    description: 'Multi-purpose production lines for FS seed treatment formulations. Mixing stations, bead mills, and filling workstations are reconfigured based on order mix. Annual capacity: 3,000+ tons.'
    output: '3,000+ tons/year'
  - title: Filling & Packaging
    description: 'Dedicated filling and packaging area for drums, jerry cans, and bottles. Automatic filling lines, labeling machines, and checkweigher stations. Annual packaging capacity: 25,000+ units.'
    output: '25,000+ packaged units/year'

oem_capacity:
