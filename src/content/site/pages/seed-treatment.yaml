faqs:
  - question: 'What is the difference between film-coat and slurry seed treatment?'
    answer: 'Film-coat treatment applies a thin, uniform polymer-based layer around each seed, typically at 2–8 mL per kg seed, producing a dry, free-flowing finished product ideal for precision planting. Slurry treatment uses higher liquid volumes (10–30 mL per kg seed) and is common for cereals where high-throughput treatment lines are used. Agrospear formulates for both methods with matched viscosity and drying profiles.'
  - question: 'Can insecticide and fungicide AIs be combined in a single seed treatment?'
    answer: "Yes. Insecticide-fungicide seed treatment combinations are the industry standard for cereals and many vegetable crops. Common combinations include thiamethoxam + fludioxonil + metalaxyl-M for comprehensive seedling protection against soil insects, seed-borne fungi, and damping-off Oomycetes. Agrospear's CS and ZC formulation platforms maintain stability of each AI within the combined product."
  - question: 'What polymer and colorant systems are available?'
    answer: 'We offer a range of polymer film-former systems — PVA-based, PEG-based, and proprietary acrylic copolymers — selected for drying speed, dust-off reduction, and seed-flow characteristics. Colorant systems use pigment dispersions compliant with EU and North American seed-labeling regulations, available in standard and custom colors for brand differentiation.'
  - question: 'Which crops are covered by Agrospear seed treatment formulations?'
    answer: 'We develop seed treatment products for wheat, barley, maize, rice, soybean, cotton, sunflower, and a broad range of vegetable seeds including tomato, pepper, onion, and brassicas. Each crop requires specific dose-rate optimization and film-coat adjuvant tuning to account for seed size, surface texture, and germination sensitivity.'
body: |
  <h2>Advanced Seed Treatment Manufacturing for Early-Season Crop Protection</h2>
  <p>Seed treatment delivers crop protection at the most vulnerable stage of plant development — germination and emergence. Agrospear's seed treatment portfolio includes Flowable Concentrates for Seed Treatment (FS), Capsule Suspensions (CS), and Micro-Emulsions (ME), each formulated for precise dose delivery onto the seed surface. Core active ingredients include thiamethoxam (systemic insecticide, Group 4A), imidacloprid (systemic insecticide, Group 4A), fludioxonil (contact fungicide, Group 12), metalaxyl-M (systemic fungicide, Group 4), and tebuconazole (systemic fungicide, Group 3). These AIs are available as standalone products or in insecticide-fungicide combinations that protect seedlings from both soil-dwelling pests and seed-borne or soil-borne pathogens in a single application.</p>

  <h2>Polymer Film-Former and Colorant Systems</h2>
  <p>Modern seed treatment requires more than active ingredients: the delivery system — polymer film-formers, colorants, and processing aids — determines product performance in the treater and in the planter. Agrospear's polymer platform includes fast-drying acrylic copolymers for high-throughput cereal treatment lines, flexible PVA-based film-formers for irregular-surface vegetable seeds, and low-viscosity PEG systems for sensitive germplasm. Our pigment-dispersion colorants provide visual treatment verification, brand differentiation, and regulatory compliance for seed-lot identification. All polymer and colorant components undergo seed-safety germination-index testing before formulation approval.</p>

  <h2>Insecticide-Fungicide Combination Platforms</h2>
  <p>Single-AI seed treatments are increasingly insufficient against complex pest-pathogen complexes. Agrospear's CS and ZC formulation platforms enable stable co-suspension of insecticide and fungicide AIs with different physicochemical profiles — for example, a hydrophilic neonicotinoid alongside a hydrophobic DMI fungicide within a single micro-encapsulated or suspended matrix. These combinations reduce the number of treatment passes required, improve uniformity of AI distribution on the seed surface, and lower total dust-off values below 0.5 g/100 kg, meeting the strictest European dust-off standards for treated-seed handling safety.</p>

  <h2>Crop-Specific Dose Optimization and Germination Safety</h2>
  <p>Seed treatment phytotoxicity risk is inversely proportional to seed size: small-seeded vegetables and flowers are especially vulnerable to over-dosing or poor AI distribution. Agrospear's R&D laboratory conducts germination-index testing on every formulation across a range of dose rates, seed lots, and storage durations, confirming that treatment does not impair germination speed, seedling vigor, or emergence percentage. For cereals, we validate performance under cold-test conditions that simulate early-spring planting stress. This rigorous safety profiling ensures your branded seed treatment products deliver protection without compromising stand establishment.</p>

