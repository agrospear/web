meta:
  title: 'Conocimiento — Guías de formulación agroquímica y OEM | {SITE}'
  description: 'Guías sobre formulaciones agroquímicas, materiales, selección de productos y análisis del sector para marcas y profesionales.'
  keywords:
    - 'conocimiento agroquímico'
    - 'guía de formulación agroquímica'
    - 'materiales de protección de cultivos'
    - 'análisis industria agroquímica'
  dateModified: '2026-08'
hero:
  tagline: 'Gráfico de conocimiento'
  title: 'Centro de Conocimiento Agroquímico'
  subtitle: |
    Una base de conocimiento estructurada que cubre la tecnología de formulación agroquímica,
    el cumplimiento regulatorio, la ingeniería de productos y la planificación de protección de cultivos.
  taglineSection: 'Explora. Aprende. Abastece con confianza.'

clusters:
  tagline: 'Grupos de conocimiento'
  title: 'Explora por tema'
  subtitle: 'Análisis en profundidad de la tecnología, la regulación y la experiencia que hay detrás de cada producto Agrospear.'
  items:
    - title: 'Guías de compra de agroquímicos'
      description: 'Desde elegir tu primer tipo de formulación hasta programas avanzados de protección de cultivos: todo sobre abastecimiento agroquímico.'
      icon: 'tabler:lifebuoy'
      topics:
        - 'Cómo elegir tu primera formulación agroquímica'
        - 'Guía de tipo de formulación y aplicación'
        - 'Mejor formulación para programas de herbicidas, insecticidas, fungicidas y PGR'
        - 'Errores de compra de agroquímicos que debes evitar'
        - 'Comparativa: SC frente a EC frente a WP frente a WDG'
    - title: 'Ingeniería y tecnología de formulación'
      description: 'Guías técnicas sobre formulaciones agroquímicas: ingredientes activos, sistemas de coadyuvantes y procesos de fabricación.'
      icon: 'tabler:microscope'
      topics:
        - 'Tecnología de concentrado en suspensión (SC) en profundidad'
        - 'Especificaciones de concentrado emulsionable (EC)'
        - 'Métodos de formulación de gránulo dispersable en agua (WDG)'
        - 'Tecnología de coadyuvantes y métodos de diseño de etiqueta'
        - 'Selección de tipo de formulación y sistemas de envasado'
    - title: 'Regulación y cumplimiento'
      description: 'Conocimientos regulatorios esenciales para cada marca agroquímica: desde el registro ICAMA hasta las especificaciones FAO/OMS y los requisitos de etiquetado.'
      icon: 'tabler:shield'
      topics:
        - 'Lista de verificación y requisitos de registro ICAMA'
        - 'Cumplimiento de especificaciones FAO/OMS'
        - 'Guía de ensayos de estabilidad de formulación'
        - 'Almacenamiento de producto y gestión de vida útil'
        - 'Requisitos regulatorios de etiqueta y envasado'
    - title: 'Programas de protección de cultivos'
      description: 'Programas de herbicidas, insecticidas, fungicidas y PGR para todos los tipos de cultivos y condiciones de cultivo.'
      icon: 'tabler:plant'
      topics:
        - 'Diseño de programa de herbicidas para cultivos en hilera'
        - 'Planificación de programa de insecticidas para frutales'
        - 'Estrategias de programa de fungicidas para hortalizas'
        - 'Momento de aplicación y dosis de PGR'
        - 'Enfoques de manejo integrado de plagas'
    - title: 'Mercado agroquímico y negocio'
      description: 'Temas especializados de negocio agroquímico: distribución, marca privada, co-branding y entrada al mercado.'
      icon: 'tabler:heart'
      topics:
        - 'Lanzamiento de marca agroquímica de marca privada'
        - 'Oportunidades del mercado de biopesticidas'
        - 'Guía de inicio de negocio de distribución'
        - 'Planificación de demanda estacional e inventario'
        - 'Accesorios agroquímicos y elementos esenciales de envasado'
    - title: 'Comparativas y referencias de formulación'
      description: 'Comparativas lado a lado para ayudarte a tomar decisiones informadas.'
      icon: 'tabler:chart-bar'
      topics:
        - 'SC frente a EC: ¿qué tipo de formulación para tu mercado?'
        - 'Comparativa de materiales: WDG frente a WP'
        - 'Compromisos de ingrediente activo único frente a formulación premix'
        - 'Componentes de formulación agroquímica explicados'
        - 'Comparativa diseño de etiqueta frente a envasado en bloque'

