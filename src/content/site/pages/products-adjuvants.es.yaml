faqs:
  tagline: FAQ
  title: 'Formulaciones de coadyuvantes — Preguntas frecuentes'
  items:
    - q: '¿Qué tipos de coadyuvantes formuláis?'
      a: 'Tensioactivos no iónicos (NIS), expansores organosiliconados, concentrados de aceite vegetal (COC), aceites de semilla metilados (MSO), agentes de control de deriva, ayudas de depósito, agentes de resistencia a la lluvia y tampones de pH. Mezclas personalizadas para combinaciones cultivo-pulverización específicas.'
    - q: '¿Los coadyuvantes pueden co-marcar con mi línea de fitosanitarios?'
      a: 'Sí. Muchas marcas empaquetan coadyuvantes como compañeros de mezcla en tanque junto a sus formulaciones de pesticidas. Podemos coordinar el diseño de etiqueta y embalaje en toda tu línea de productos para una presentación de marca unificada.'
    - q: '¿Cuál es el MOQ para formulaciones de coadyuvantes?'
      a: 'Lotes piloto desde 5 toneladas; volumen estándar desde 20+ toneladas por SKU. Las formulaciones de coadyuvantes suelen tener requisitos de registro más simples, lo que permite una entrada más rápida al mercado.'
    - q: '¿Podéis formular compatibilidad de mezcla en tanque en todo mi programa de pulverización?'
      a: 'Sí. Realizamos cribado de compatibilidad de mezcla en tanque frente a los herbicidas, insecticidas, fungicidas y fertilizantes de tu programa, probando compatibilidad física, cambio de pH, formación de espuma y sedimentación. Luego ajustamos el tensioactivo o el sistema tampón para que tu programa pueda aplicarse en una sola pasada.'
    - q: '¿Qué significan "expansión, mojado y retención" para el rendimiento del coadyuvante?'
      a: 'La expansión es cuánto se aplana una gota sobre la superficie de la hoja, el mojado es lo bien que desplaza las ceras foliares, y la retención es cuánta pulverización permanece en la hoja frente a la que escurre. Probamos los tres parámetros (ángulo de contacto, tensión superficial dinámica e índice de retención) y ajustamos la mezcla de tensioactivos a tu tipo de cultivo y equipo.'
    - q: '¿Proporcionáis coadyuvantes de resistencia a la lluvia y anti-deriva?'
      a: 'Sí. Nuestros agentes de resistencia a la lluvia forman una película flexible que protege el depósito frente a la lluvia, y nuestros agentes de control de deriva aumentan el tamaño de gota y reducen las partículas finas para aplicación aérea y terrestre. Ambos pueden mezclarse en un único producto personalizado.'
    - q: '¿Cómo controláis la calidad en cada lote de coadyuvante?'
      a: 'Cada lote se libera frente a su estándar de referencia aprobado con controles de valor HLB, contenido activo, tensión superficial, pH, viscosidad y estabilidad de la emulsión. Proporcionamos un certificado de análisis con cada envío y mantenemos trazabilidad de lote vinculada a ERP para plena capacidad de retirada.'
    - q: '¿Cuáles son los requisitos de registro de los coadyuvantes frente a los pesticidas activos?'
      a: 'En la mayoría de los mercados los coadyuvantes se enfrentan a un registro simplificado frente a los productos fitosanitarios activos, lo que acorta el tiempo de llegada al mercado. Nuestro equipo prepara la documentación técnica y de seguridad requerida (FDS, COA, etiquetado GHS) para tu mercado de destino.'
    - q: '¿Los coadyuvantes pueden ser compatibles con programas orgánicos o de bajo insumo?'
      a: 'Sí. Podemos formular concentrados de aceite vegetal y mojantes compatibles con programas orgánicos o de bajo insumo, y validamos tu material frente a las listas de certificación pertinentes antes de formular.'
    - q: '¿Cuál es la vida útil típica de una formulación de coadyuvante?'
      a: 'La mayoría de nuestras formulaciones de coadyuvantes tienen una vida útil de 2–3 años en condiciones de almacenamiento recomendadas. Realizamos ensayos de estabilidad acelerada y a largo plazo según las guías FAO/WHO y confirmamos la estabilidad antes de la liberación.'

