intro: 'An agrochemical formulation is only as reliable as its homogenization. A single unmixed pocket or an uneven fill can compromise an entire batch — and in the field, inconsistent active ingredient content is not an inconvenience; it is a regulatory violation and a crop safety hazard. At {SITE.name}, we have invested in a dedicated Mixing & Filling Center that combines industrial-grade homogenization and filling equipment with rigorous process control and post-fill testing. Every batch we produce is documented, traceable, and certified to meet or exceed the requirements of FAO/WHO specifications and ICAMA registration standards.'

content_html: |
  <h2>The science behind the mix</h2>
  <p>Agrochemical mixing uses high-shear mechanical energy to reduce active ingredient particles to a controlled size distribution and distribute them uniformly throughout the carrier liquid. Unlike simple stirring, high-shear homogenization creates a true suspension or emulsion where every milliliter of product contains the same concentration of active ingredient — producing a batch that is homogeneous from first fill to last.</p>

  <h2>Mixing equipment and process control</h2>
  <p>Our mixing and filling centre is equipped with:</p>
  <table>
    <thead><tr><th>Equipment</th><th>Capacity / Specification</th><th>Application</th></tr></thead>
    <tbody>
      <tr><td>High-shear homogenizer 1</td><td>5,000 L, D90 &lt; 5 μm</td><td>SC main batch mixing, active ingredient wet milling</td></tr>
      <tr><td>High-shear homogenizer 2</td><td>2,000 L, D90 &lt; 3 μm</td><td>ME and micro-emulsion preparation, adjuvant blending</td></tr>
      <tr><td>CNC-controlled filling line</td><td>100–1,000 mL/min, ±0.5% accuracy</td><td>Liquid filling into drums, bottles and jugs; weight verification per unit</td></tr>
      <tr><td>WDG granulation line</td><td>Batch size 500–2,000 kg, fluid-bed dryer</td><td>Wet granulation, drying, sizing for water-dispersible granules</td></tr>
    </tbody>
  </table>
  <p>Every mixing vessel is equipped with closed-loop temperature and viscosity monitoring. Process parameters — shear rate, mixing time, cooling temperature, fill volume — are programmed per formulation type and recorded in our Manufacturing Execution System (MES) for full traceability.</p>

  <h2>Batch quality tests — every batch, every lot</h2>
  <p>Batch integrity is verified through a mandatory four-test protocol:</p>
  <ol>
    <li><strong>Visual inspection</strong> — 100 % of filled units are visually inspected for contamination, phase separation, incorrect fill level, or packaging defects. Reject rate threshold: 0.3 % of units.</li>
    <li><strong>Active ingredient content analysis</strong> — A sample from each batch is analyzed per CIPAC methods. Acceptable range: ±5% of declared content for most formulation types.</li>
    <li><strong>Stability testing</strong> — Every batch undergoes accelerated storage at 54 °C for 14 days per CIPAC MT 46. Active content must remain within specification after thermal stress.</li>
    <li><strong>Physical properties verification</strong> — Suspension rate (SC), emulsion stability (EC), wettability and dispersibility (WDG/WP), and pourability are tested per CIPAC methods and compared against the approved reference sample.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Particle Size Distribution — High-Shear vs Conventional Mixing (SC 250 g/L)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">High-Shear</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:95%"></div>
        </div>
        <span class="text-xs font-bold w-16 text-right">D90 3.2 μm</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Conventional</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:60%"></div>
        </div>
        <span class="text-xs font-bold w-16 text-right">D90 8.5 μm</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">FAO/WHO spec</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:45%"></div>
        </div>
        <span class="text-xs font-bold w-16 text-right">D90 &lt; 5 μm</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">High-shear homogenization consistently achieves 90-95 % of target particle size, well within FAO/WHO specifications for suspension concentrates.</p>
  </div>

  <h2>Professional expertise</h2>
  <p>Our mixing team is led by a senior process engineer with 11 years of experience in agrochemical formulation and homogenization. Each operator completes a 6-month in-house certification programme before being allowed to manage production batches. Recertification is required annually, including a practical mixing and fill test evaluated against our internal Grade-A standard (active content within ±2% of target).</p>

  <h2>Custom mixing solutions for unique requirements</h2>
  <p>We understand that one mixing specification does not fit every formulation. Our Mixing & Filling Center routinely develops custom processing parameters for clients with special requirements:</p>
  <ul>
    <li><strong>High-loading SC formulations</strong> — for formulations above 500 g/L active content, we validate homogenization parameters at elevated viscosity and document the process limits in the batch record.</li>
    <li><strong>Temperature-sensitive actives</strong> — for actives that degrade above 40 °C, we implement closed-loop cooling and reduced-shear protocols that maintain particle size without thermal exposure.</li>
    <li><strong>Multi-component tank mixes</strong> — formulations requiring in-line blending of two or more active ingredients are homogenized with sequential addition protocols to prevent precipitation or incompatibility.</li>
  </ul>

  <h2>Our commitment to you</h2>
  <p>Every batch we deliver carries our quality guarantee: if any lot fails content analysis or stability testing in normal storage within the shelf life, we replace the affected lot at no cost, and a root-cause investigation is performed to prevent recurrence. This is not simply a warranty — it is a commitment to continuous improvement driven by real-world batch data.</p>
  <p>When you choose {SITE.name}, you are choosing formulations that are engineered, tested, and documented — not just mixed. That is the difference between a product that sprays and a product that performs.</p>

