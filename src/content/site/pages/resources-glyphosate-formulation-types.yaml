hero:
  tagline: 'Resources'
  title: 'Glyphosate Formulation Types: SL, WP, SC Compared'

answer:
  label: 'Straight answer'
  text: 'The three main glyphosate formulations are SL 41% (soluble liquid — the global standard for foliar spray), WP (wettable powder — lower cost but dusty and less convenient), and SC (suspension concentrate — improved rainfastness and drift control). SL 41% accounts for over 80% of global glyphosate trade due to its ease of mixing, consistent efficacy and established registration history.'
  verified: '2026-08'

intro:
  - 'Glyphosate SL 41% (isopropylamine salt, equivalent to 360 g ae/L) dominates the market because it dissolves completely in water, has excellent tank-mix compatibility and requires no special agitation during spraying. The WP formulation, typically at 50-75% acid equivalent, costs less to produce and ship but requires more careful handling and mixing. SC formulations incorporate adjuvant systems that improve leaf surface retention and rainfastness, making them suitable for high-rainfall regions.'
  - 'Agrospear manufactures glyphosate SL 41% on dedicated production lines with CIPAC method 284 validation for active ingredient content, specific gravity and foam stability. Each batch undergoes 7-stage QC including HPLC verification of glyphosate acid equivalent, impurity profiling for N-nitrosoglyphosate, and accelerated stability testing at 54°C for 14 days.'

