hero:
  tagline: Tecnología
  title: Diseñado para el rendimiento
  subtitle: 'Cada formulación Agrospear se ingenia con control preciso del tamaño de partícula, sistemas avanzados de dispersión y estabilidad validada — materiales y métodos de fabricación probados en entornos agrícolas exigentes.'

sections:
  - title: Concentrado en Suspensión (SC)
    description: La molienda de alto corte reduce las partículas activas a 1–5 μm, suspendidas en un portador acuoso optimizado con agentes anti-sedimentación. Esto produce una formulación estable, vertible, con mínimo polvo y máxima biodisponibilidad para aplicación foliar y al suelo.
    imageAlt: Diagrama de formulación SC
  - title: Concentrado Emulsionable (EC)
    description: Formulación base solvente con paquetes emulsionantes que forman emulsiones aceite-en-agua estables al diluir. Optimizada para cobertura foliar rápida y resistencia al lavado por lluvia. Ensayada para estabilidad de emulsión, punto de inflamación y compatibilidad en frío.
    imageAlt: Capa de emulsión EC
  - title: Gránulo Dispersable en Agua (WDG)
    description: Partículas secadas por atomización o granuladas en plato que se dispersan rápidamente en agua sin generar polvo. Utilizadas en todos los modelos de herbicidas y fungicidas donde la seguridad del operador y la comodidad son prioritarias. Mantiene la dispersibilidad en aguas duras.
    imageAlt: Gránulo WDG
  - title: Polvo Mojable (WP)
    description: Polvo molido por flujo de aire con dispersantes y agentes humectantes integrados para suspensión rápida en el tanque de aspersión. Proporciona alta carga de ingrediente activo con eficacia de campo probada. Calidad verificada mediante ensayos de suspensibilidad y mojabilidad.
    imageAlt: Polvo WP

