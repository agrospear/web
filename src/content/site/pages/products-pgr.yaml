faqs:
  tagline: FAQ
  title: 'PGR Formulations — Frequently Asked Questions'
  items:
    - q: 'What PGR active ingredients do you formulate?'
      a: 'Gibberellic acid (GA3), gibberellin A4+A7, paclobutrazol, uniconazole, ethephon, chlormequat, mepiquat chloride, forchlorfenuron (CPPU), brassinolide, triacontanol and auxin-based products. Custom combinations are available.'
    - q: 'What is the MOQ for PGR formulations?'
      a: 'Due to lower application rates, PGR pilot batches start at 1–5 tons depending on the active ingredient and concentration. Standard volume from 5+ tons per SKU. Sample batches for registration from 500 kg.'
    - q: 'Do PGR formulations require special handling?'
      a: 'Yes — many PGRs are effective at very low concentrations (ppm levels), so formulation precision and homogeneity are critical. We test active content uniformity per batch and provide certificate of analysis with every shipment.'
    - q: 'Which PGR formulation types do you produce?'
      a: 'We produce Soluble Liquids (SL), Suspension Concentrates (SC), Wettable Powders (WP) and water-dispersible granule and tablet formats. The choice depends on the active ingredient, application method and regional preferences — for example GA3 is common as SL, while paclobutrazol is supplied as SC or WP.'
    - q: 'How do you ensure uniform active content at ppm-level rates?'
      a: 'We use high-shear dispersion and multi-stage homogenization, then verify active content uniformity by HPLC on a batch basis with a stated tolerance. This prevents hot spots that can over-regulate or under-respond in the crop.'
    - q: 'What is the application timing for major PGR actives?'
      a: 'GA3 is applied at flowering and fruit set for parthenocarpic set and thinning; paclobutrazol is a soil or foliar spray at early shoot growth for dormancy and vigor control; ethephon is applied pre-harvest for ripening and at tillering for lodging control. Our technical team provides per-crop timing guidance during product development.'
    - q: 'Do you supply registration data packages for PGRs?'
      a: 'Yes. We prepare the complete dossier — five-batch analysis, accelerated and long-term stability, analytical methods and label/safety data — so your PGR can be registered in your target markets without technical gaps.'
    - q: 'Can you formulate custom PGR combinations?'
      a: 'Yes. Common combinations include GA4+7 plus a cytokinin such as CPPU for fruit size, and GA3 plus a retardant for balanced vegetative/fruit balance. We validate compatibility and provide stability data before pilot production.'
    - q: 'What is the shelf life and temperature sensitivity of PGR formulations?'
      a: 'Most PGR formulations carry a 2-year shelf life and remain stable up to 54 °C in accelerated testing. For heat-sensitive actives we design stabilizing systems and recommend controlled storage conditions, documented in the stability report.'
    - q: 'What export documentation do you provide for PGR shipments?'
      a: 'We provide certificate of analysis, certificate of origin, fumigation certificate, MSDS/SDS, GHS-compliant labelling and phytosanitary documentation so customs clearance is smooth in your destination market.'

