hero:
  tagline: 'Guía de Cumplimiento'
  title: 'Cumplimiento Agroquímico por Mercado'
  subtitle: 'Cada mercado objetivo tiene requisitos distintos de registro, etiquetado y documentación. Esta guía mapea el panorama de cumplimiento para formulaciones agroquímicas en los principales mercados — China, UE, Norteamérica, África y LATAM — para que pueda especificar el alcance correcto al momento de la cotización, no después de la producción.'

answer:
  label: 'Respuesta rápida'
  text: 'Para la UE: el Reglamento 1107/2009 rige la autorización de productos fitosanitarios — preparamos la documentación FAO/OMS para su registro en la UE, alcance confirmado por proyecto. Para EE.UU.: documentación de soporte para registro EPA. Para África y LATAM: especificaciones FAO/OMS y documentación ICAMA. Todos los mercados: ISO 9001 (fábrica), BSCI (auditoría social) y trazabilidad por lote son estándar en toda nuestra producción independientemente del destino. El alcance y costos de cumplimiento se detallan en su cotización — sin sorpresas post-producción.'
  verified: '2026-08'

market_cards:
  tagline: Requisitos por Región
  title: 'Requisitos de Cumplimiento por Mercado Objetivo'
  subtitle: 'El alcance de certificación se confirma por proyecto durante la revisión de viabilidad. A continuación se muestran los requisitos típicos por mercado.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: CN
      icon_bg: red
      title: 'China'
      desc: 'Registro ICAMA obligatorio para fabricación y exportación. Especificaciones de producto según estándares GB. Certificación ISO 9001 de fábrica. Trazabilidad por lote y registros de análisis de contenido. Documentación completa para autorización de exportación.'
    - icon: EU
      icon_bg: blue
      title: 'Unión Europea'
      desc: 'Reglamento 1107/2009 para autorización de productos fitosanitarios. Documentación FAO/OMS para expediente de registro en la UE. Especificaciones de producto y ensayos de estabilidad según directrices CIPAC. Etiquetado en idioma oficial del país de destino. Auditoría social BSCI disponible.'
    - icon: US
      icon_bg: green
      title: 'Estados Unidos'
      desc: 'Documentación de soporte para registro EPA. Especificaciones de producto según directrices FAO/OMS. Requisitos de etiquetado según normas EPA y estado. Análisis de ingredientes activos y trazabilidad por lote disponibles. Requisitos FIFRA aplicables.'
    - icon: GL
      icon_bg: orange
      title: 'África / LATAM / Global'
      desc: 'Especificaciones FAO/OMS y documentación ICAMA para registro en mercados emergentes. Certificación de fábrica ISO 9001:2015. Auditoría de cumplimiento social BSCI. Trazabilidad por lote e informes de prueba disponibles para cualquier mercado. Alcance de certificación personalizado confirmado por proyecto.'

certifications_detail:
  heading: 'Nuestro Alcance de Certificación'
  body: |
    Las siguientes certificaciones se mantienen o están disponibles en toda nuestra producción. El alcance específico de certificación para su proyecto se confirma durante la revisión de viabilidad y se detalla en su cotización.

    - **ISO 9001:2015** — Sistema de gestión de calidad de fábrica, auditado anualmente por un tercero acreditado. Cubre todo el proceso de fabricación desde la inspección de materia prima entrante hasta el empaque final.
    - **ICAMA** — Instituto de Control de Agroquímicos del Ministerio de Agricultura de China. Registro obligatorio para fabricación y exportación. Documentación preparada para mercados objetivo.
    - **BSCI** — Auditoría de Iniciativa de Cumplimiento Social Empresarial. Cubre derechos laborales, seguridad laboral, cumplimiento ambiental y ética comercial. Disponible para todos los mercados.
    - **FAO/OMS** — Especificaciones de producto según directrices de la FAO y la OMS para plaguicidas. Documentación de especificaciones, métodos analíticos y ensayos de estabilidad disponibles por lote.
    - **Trazabilidad por Lote** — Cada lote de producción lleva registros numerados de materia prima, análisis de contenido, ensayos de estabilidad y resultados de inspección — conservados durante 10 años y disponibles para auditoría.

compliance_process:
  tagline: Cómo Funciona el Cumplimiento en Su Pedido
  title: 'Cumplimiento en el Flujo de Incorporación'
  subtitle: 'El cumplimiento no es un complemento — está integrado en cada puerta del proceso de incorporación.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: 1
      icon_bg: blue
      title: 'Puerta 1: Confirmación de Alcance'
      desc: 'Al hacer su consulta, especifica los mercados objetivo. Confirmamos qué certificaciones, pruebas y documentación aplican a su producto y destino específicos. El alcance de cumplimiento y cualquier costo asociado se detallan en la cotización.'
    - icon: 2
      icon_bg: green
      title: 'Puerta 3: Certificación de Muestras'
      desc: 'Las muestras se producen según el alcance de cumplimiento confirmado. Si se requieren análisis de laboratorio de terceros (FAO/OMS, EPA, registro nacional), coordinamos las pruebas a través de laboratorios acreditados. Los informes de prueba se entregan con la muestra.'
    - icon: 3
      icon_bg: purple
      title: 'Puerta 7: Paquete de Documentación'
      desc: 'Cada pedido de producción se envía con un paquete de documentación de cumplimiento: certificados de análisis, informes de prueba, registros de trazabilidad por lote, fichas de datos de seguridad y cumplimiento de etiquetado. La documentación es específica por mercado.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'Cumplimiento Agroquímico — Preguntas Frecuentes'
  items:
    - q: '¿Todas las formulaciones necesitan registro ICAMA?'
      a: 'El registro ICAMA es obligatorio para fabricación y exportación desde China. Preparamos la documentación ICAMA para todos los productos fabricados. Los documentos de destino para su mercado (FAO/OMS, EPA, etc.) se confirman por proyecto según los países de venta.'
    - q: '¿Proporcionáis especificaciones FAO/OMS?'
      a: 'Sí. Todas las formulaciones se documentan según las directrices FAO/OMS para especificaciones de plaguicidas. La documentación incluye especificaciones de producto, métodos analíticos y ensayos de estabilidad, disponibles por lote bajo solicitud.'
    - q: '¿Pueden gestionar la documentación para un mercado no listado aquí?'
      a: 'Sí. Hemos enviado a más de 50 países y podemos coordinar la certificación y documentación para la mayoría de los mercados. Díganos su país de destino durante la consulta y confirmaremos el alcance específico de cumplimiento y cualquier prueba o documentación adicional requerida.'
    - q: '¿Cómo se gestionan los costos de cumplimiento?'
      a: 'El alcance de cumplimiento y cualquier costo asociado (análisis de laboratorio de terceros, honorarios de registro) se detallan en su cotización durante la revisión de viabilidad. Sin cargos de cumplimiento post-producción. Las certificaciones estándar (ISO 9001, BSCI) son a nivel de fábrica y no añaden costo por unidad.'

