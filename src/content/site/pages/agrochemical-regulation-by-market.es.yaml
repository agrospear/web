meta:
  title: 'Regulación Agroquímica por Mercado | Soporte Registro OEM China | {SITE}'
  description: 'Cumplimiento por mercado para formulaciones agroquímicas: ICAMA (China), FAO/OMS, EPA (EE.UU.), Reg. 1107/2009 (UE), BSCI, ISO 9001. Pruebas y documentación por mercado.'
  dateModified: '2026-08-21'
  keywords:
