answer:
  label: 'Straight answer'
  text: 'We provide complete packaging and labeling services: custom label design from your brand assets, branded retail packaging, DG-compliant export cartons and point-of-sale displays. Our design team develops production-ready labels, leaflets and packaging artwork from your logo, brand colors or a rough concept. All packaging meets dangerous goods transport requirements.'
