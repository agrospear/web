faqs:
  tagline: FAQ
  title: 'Packaging & Labeling — Frequently Asked Questions'
  items:
    - q: 'Do you design labels or do I need to provide artwork?'
      a: 'Both options work. Our design team develops production-ready labels from your logo and brand guidelines. If you have existing artwork, we adapt it to our printing specifications and regulatory requirements. Either way, you approve the label proof before production.'
    - q: 'What packaging sizes are available?'
      a: 'Liquid formulations: 100 mL, 250 mL, 500 mL, 1 L, 5 L, 10 L, 20 L and 200 L. Powder formulations: 100 g, 250 g, 500 g, 1 kg, 5 kg, 10 kg and 25 kg. Custom sizes available on request for specific market requirements.'
    - q: 'Are your export packages DG-compliant?'
      a: 'Yes. All export packaging meets UN packaging specifications for dangerous goods transport by sea (IMDG) and land (ADR). Packaging group, UN mark and proper shipping name are marked on every outer case. DG documentation is prepared for customs clearance.'
    - q: 'Can packaging be changed between orders?'
      a: 'Yes. Once brand assets are production-ready, reorders can refresh labels, colors or packaging at any time. Minimum packaging order quantities apply for custom-printed materials and are confirmed per project.'

