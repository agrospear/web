answer:
  label: 'Straight answer'
  text: 'Formulations go through five controlled stages: material inspection (1–2 days), automatic weighing and dosing (<3% waste, 2–4 hours per batch), high-shear compounding with sand-milled particle size control (1–2 days per batch), formulation processing and granulation, and final filling with 100% specification and stability testing before packaging.'
  verified: '2026-08'

intro: Unlike brands that outsource production to third-party factories, Agrospear owns and operates its entire manufacturing chain. This vertical integration allows us to maintain strict quality control at every stage, respond quickly to custom requirements, and deliver consistent product quality batch after batch. Here is how a crop protection product is built in our facility.

steps:
  - step: '01'
    title: Material Receipt & Inspection
    description: Every incoming batch of technical-grade active ingredient, solvent, adjuvant, and packaging material is inspected against specification. Raw material samples are tested for active content by HPLC/GC, purity, moisture content, and physical properties before release to production. Non-conforming materials are quarantined and returned.
    duration: 1–2 days
  - step: '02'
    title: Automatic Weighing & Dosing
    description: <p>Approved materials are weighed and dosed by the automatic PLC-controlled system with ±0.1% accuracy. Computer-optimised batching calculates precise quantities for each formulation to minimise waste —typically below 3%. Weighed components are labelled by formulation and batch, then transferred to the compounding workshop.</p>
    duration: 2–4 hours per batch
  - step: '03'
    title: Compounding & High-Shear Mixing
    description: Active ingredients, dispersants, emulsifiers, and carriers are compounded in high-shear mixers at controlled speeds of 3,000–10,000 rpm. SC formulations are pre-mixed before sand milling. EC and SL formulations are blended in jacketed temperature-controlled tanks. Particle size is monitored throughout the process.
    duration: 1–2 days per batch
  - step: '04'
    title: Sand Milling & Formulation Processing
    description: SC and WDG formulations are processed through sand mills to achieve target particle size distributions (D50 1–5 μm for SC, D50 20–40 μm for WDG). WDG and WP products are produced by spray drying or fluid bed granulation. Each batch is checked for particle size, viscosity, pH, and suspensibility before proceeding.
    duration: 1–2 days per batch
  - step: '05'
    title: Labeling & Decoration
    description: Product containers are labeled using automatic labeling machines for multi-language GHS-compliant labels and inkjet coders for batch and date coding. Labels are verified against approved artwork and regulatory requirements.
    duration: 1–2 days
  - step: '06'
    title: Filling & Sealing
    description: Drums, jerry cans, and bottles are filled, sealed, and checked on automatic filling machines. Each batch follows a 100-point filling and packaging checklist with mandatory sign-off at each stage.
    duration: 1–2 days
  - step: '07'
    title: Quality Testing & Inspection
    description: 'Every completed batch undergoes mandatory quality gate: active content verification by HPLC/GC, specification check (suspensibility, pH, viscosity, particle size), and 14-day stability test at 54°C per CIPAC MT 46. Custom and prototype formulations also receive field efficacy verification where required.'
    duration: 14 days (stability)
  - step: '08'
    title: Packing & Shipping
    description: Finished products are palletized per procedure, packed in export-grade packaging, and loaded for shipment. Each package is labelled with product name, batch number, and destination. We coordinate with freight forwarders for FCL and LCL container shipments worldwide.
    duration: 1 day

evidence_gates:
  tagline: Inspection Evidence
  title: 'Every Stage Leaves a Record — Photos & Reports'
  subtitle: 'Below are the actual inspection photos and test-report dossiers from our seven controlled quality gates. Each PDF is a real bilingual record you can download and audit — the same records that back every batch in the 5-year ERP traceability archive. See the full 7-stage flow on /manufacturing/quality-control.'
  items:
    - title: 'PPM — Project Quality Planning'
      description: 'The pre-production meeting locks scope, the golden sample and the Quality Inspection Plan before the line starts. Unresolved items block production release.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download QIP (PDF)'
      image: https://assets.agrospear.com/site/quality/node01-ppm.avif
      alt: Pre-production meeting reviewing the golden sample and quality inspection plan for an OEM agrochemical order
    - title: 'IQC — Incoming Material Inspection'
      description: 'Every incoming batch of active ingredients, solvents and packaging is checked against the approved spec. Non-conforming lots are quarantined and rejected before release to the line.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download IQC reports (PDF)'
      image: https://assets.agrospear.com/site/quality/node02-iqc.avif
      alt: Incoming material inspection of active ingredients and components at the factory
    - title: 'IPQC / FAI — In-Process Control'
      description: 'The first article is verified against the locked baselines and every shift keeps patrol checks on the line. FAI approval version-locks formulation, specifications and BOM.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download IPQC reports (PDF)'
      image: https://assets.agrospear.com/site/quality/node03-ipqc-fai.avif
      alt: In-process inspection and first article check during agrochemical production
    - title: 'Stability & Specification Verification'
      description: '100% of completed batches — not a sample — get a 14-day stability test at 54°C with automatic reject for active content deviation above ±2%. One record per batch.'
      link: /manufacturing/qcqa-documents
      link_label: 'View QC/QA document library'
      image: https://assets.agrospear.com/site/quality/node04-airtightness.avif
      alt: Stability and specification verification testing of an agrochemical batch
    - title: 'FQC — Final Product Inspection'
      description: 'Finished batches are measured against specification limits and visually inspected under standard lighting against the approved golden sample.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download FQC reports (PDF)'
      image: https://assets.agrospear.com/site/quality/node05-fqc.avif
      alt: Final product inspection of finished agrochemical formulations before packing
    - title: 'PSI — Packaging & Pre-Shipment Inspection'
      description: 'The packed shipment is checked 100% against the customer-approved BOM — barcode scan (Grade ≥ B), container markings and packaging integrity before loading.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download PSI reports (PDF)'
      image: https://assets.agrospear.com/site/quality/node06-psi.avif
      alt: Pre-shipment inspection checking the packed agrochemical shipment against the BOM
    - title: 'Shipment Release & Traceability'
      description: 'Quality signs off the batch only when all six previous gates are closed. Batch numbers are mapped to the shipment and the dossier is handed over with the delivery.'
      link: /manufacturing/qcqa-documents
      link_label: 'Download release reports (PDF)'
      image: https://assets.agrospear.com/site/quality/node07-shipment-release.avif
      alt: Shipment release sign-off and batch traceability record handover
