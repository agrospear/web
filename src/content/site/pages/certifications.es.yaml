      link_label: 'Ver dosier de trazabilidad (PDF)'
    - title: '¿Quién inspeccionó y cuándo?'
      description: 'Cada registro lleva el rol del inspector, la fecha, las herramientas utilizadas y el resultado — sin firmas anónimas.'
      icon: '3'
