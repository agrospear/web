faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre nuestro sistema de calidad
  items:
    - q: '¿Puedo descargar los informes de inspección reales?'
      a: 'Sí. Los siete dosieres de informes bilingües de esta página — QIP, IQC, IPQC/FAI, calidad de formulación, FQC, PSI y liberación de envío — son registros controlados reales con los campos confidenciales eliminados. Muestran la estructura exacta, los métodos y los criterios de aceptación usados en cada pedido.'
    - q: '¿Cómo se mapean las siete puertas a mi proyecto?'
      a: 'Cada proyecto recibe un Plan de Inspección de Calidad (QIP) que define las puertas aplicables a su producto y mercado, el alcance de inspección en cada puerta y los registros que recibirá. Descargue la muestra del QIP en esta página para ver la estructura.'
    - q: '¿Son reales estas muestras de registros de inspección?'
      a: 'Sí. Las muestras siguen nuestra estructura real de registros controlados — cabecera de documento, lista de comprobación de inspección, criterios de aceptación, método, resultados, rol del inspector y disposición de liberación. Todos los valores identificativos se sustituyen por valores de demostración (códigos DEMO-*), por lo que no se expone ningún dato de cliente, etiqueta, pedido o precio.'
    - q: '¿Por qué están anonimizadas las muestras?'
      a: 'La confidencialidad del comprador es lo primero. Los nombres de clientes, los diseños de etiquetas, los detalles de pedido, la información de proveedores y los precios están protegidos por diseño. La anonimización permite a cualquier comprador potencial verificar nuestra estructura de registros y trazabilidad sin exponer el negocio de otro cliente.'
    - q: '¿Podemos recibir los informes de inspección completos de nuestro proyecto?'
      a: 'Sí. Para proyectos aprobados compartimos la documentación de calidad aplicable a su pedido — plan de inspección de calidad, informes de materiales entrantes, en proceso, calidad de formulación, final y embalaje, y autorización de liberación de envío — vinculada a su trazabilidad de lote. Los datos comerciales sensibles permanecen bajo NDA según lo acordado.'
    - q: '¿Qué contiene un registro de inspección a nivel de lote?'
      a: 'Cada registro vincula el lote de producción con la revisión de especificación aplicable, documenta cada ítem de inspección contra sus criterios de aceptación con el método y la herramienta utilizados, y se cierra con el rol del inspector, el estado del resultado y la disposición de liberación firmada por calidad.'
