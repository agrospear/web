meta:
  title: 'Control de calidad agroquímico — 7 etapas | Agrospear'
  description: 'Cómo se controla cada pedido agroquímico a medida: 7 etapas de inspección, desde la planificación hasta la liberación del envío, con informes bilingües descargables.'
  dateModified: '2026-08-15'
  keywords:
    - 'control de calidad agroquímico'
    - 'inspección fábrica pesticidas'
    - 'plan de inspección de calidad oem'
    - 'inspección pre-embarque agroquímico'
    - 'registro icama calidad'
    - 'iso 9001 agroquímico'
hero:
  tagline: Control de calidad para proyectos a medida
  title: 'Control de calidad para proyectos OEM agroquímicos a medida'
  subtitle: 'La calidad se verifica contra la muestra aprobada, la especificación técnica, el etiquetado, la lista de materiales y los requisitos de embalaje de cada proyecto — no contra una afirmación genérica. Desde las materias primas entrantes hasta la liberación del envío, nuestro proceso de inspección está estructurado para verificar la conformidad del producto en etapas de producción definidas. Impulsado por QINGDAO VATRAD GROUP, la fábrica agroquímica de 12.500 m² detrás de agrospear.'
stats:
  - value: 100%
    label: Lotes analizados
  - value: '7'
    label: Etapas de inspección controladas
  - value: FAO/OMS
    label: Estándares de especificación
  - value: ISO 9001
    label: Calidad certificada
quality_basis:
  tagline: Base de calidad
  title: 'Qué define la aceptación del producto'
  subtitle: 'Los criterios finales de aceptación se establecen antes de la liberación de producción. Estos documentos controlados del proyecto definen qué se va a fabricar, cómo se verifican los detalles clave y qué debe comprobarse antes del envío — aprobados con el comprador y congelados en el Plan de Inspección de Calidad (QIP). Cualquier solicitud de cambio pasa por un control de cambios documentado, nunca en silencio en la línea.'
  items:
    - title: 'Muestra aprobada'
      description: 'El lote de referencia físico firmado por el comprador. Cada producto terminado se compara con él en contenido de ingrediente activo, propiedades físicas y apariencia.'
      icon: tabler:medal
    - title: 'Especificación técnica'
      description: 'Ingrediente activo, tipo de formulación, concentración y parámetros físico-químicos bloqueados a un número de revisión. La FAI verifica la primera pieza contra esta revisión exacta.'
      icon: tabler:file-check
    - title: 'Arte aprobado'
      description: 'Diseño de etiqueta, colores de impresión y colocación aprobados y bloqueados por versión antes de la producción, para que cada contenedor salga con el aspecto que la marca aprobó.'
      icon: tabler:palette
    - title: 'BOM aprobada por el cliente'
      description: 'Lista de materiales — componentes de formulación, embalaje, etiquetas, plantillas CdA — confirmada por el comprador. El PSI comprueba la integridad del kit al 100% contra esta BOM.'
      icon: tabler:list-checks
    - title: 'Requisitos de embalaje y etiquetado'
      description: 'Especificaciones de tambor/botella, marcas, códigos de barras, contenido de etiquetas y marcas de envío fijadas por escrito. La legibilidad de códigos y la precisión del marcado se verifican en el PSI.'
      icon: tabler:package
tests:
  - title: Análisis de ingrediente activo
    description: Cada lote de producción se somete a cuantificación de ingrediente activo mediante métodos validados de HPLC o GC. Los resultados se comparan con el contenido declarado con tolerancia de ±5% según especificaciones FAO/OMS, garantizando potencia y eficacia.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-pressure-testing.webp
    alt: Análisis de ingrediente activo mediante HPLC para verificación de lote agroquímico
  - title: Ensayo de propiedades físicas
    description: 'Se realizan ensayos físicos específicos por formulación según directrices FAO/OMS: estabilidad de suspensión (SC), estabilidad de emulsión (EC), humectabilidad y dispersibilidad (WDG/WP), vertibilidad y espuma persistente. Estos verifican que el producto funcionará de forma fiable en el campo.'
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-production-department.webp
    alt: Ensayo de propiedades físicas de formulaciones agroquímicas según estándares FAO/OMS
  - title: Ensayo de estabilidad acelerada
    description: Los lotes se someten a almacenamiento acelerado a 54 °C durante 14 días según métodos CIPAC FAO/OMS. El contenido de ingrediente activo y las propiedades físicas se verifican antes y después, confirmando la vida útil y la integridad de la formulación.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-uv-resistance-testing.webp
    alt: Cámara de ensayo de estabilidad acelerada para formulaciones agroquímicas a 54°C
  - title: Detección de impurezas y subproductos
    description: Los ingredientes activos de grado técnico y las formulaciones terminadas se analizan para detectar impurezas relevantes y productos de degradación según especificaciones FAO/OMS, garantizando la seguridad del producto y el cumplimiento reglamentario.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-pvc-material-testing.webp
    alt: Análisis de detección de impurezas para productos técnicos y formulaciones agroquímicas
  - title: Ensayo de estabilidad a baja temperatura
    description: Las formulaciones líquidas (SC, EC, SL, ME) se almacenan a 0 °C durante 7 días según métodos CIPAC para verificar que no se produce cristalización, separación de fases ni sedimentación, garantizando la integridad del producto en almacenamiento y transporte en climas fríos.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-factory-exterior.webp
    alt: Cámara de ensayo de estabilidad a baja temperatura para formulaciones agroquímicas líquidas
  - title: Verificación de pH y densidad
    description: El pH y la densidad se miden según métodos CIPAC para cada lote. Estos parámetros sirven como indicadores críticos de calidad y deben estar dentro del rango especificado para el tipo de formulación.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-stock-boat-inventory.webp
    alt: Verificación de pH y densidad para control de calidad de formulación agroquímica
  - title: Dispersibilidad y suspensibilidad en agua
    description: Las formulaciones WDG y WP se ensayan para humectabilidad, dispersibilidad y suspensibilidad según métodos CIPAC/FAO. Estos parámetros determinan el rendimiento en campo y la uniformidad de pulverización, y deben cumplir la especificación antes de la liberación.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-sup-manufacturing.webp
    alt: Ensayo de dispersibilidad y suspensibilidad en agua para formulaciones WDG y WP
  - title: Compatibilidad de envase e integridad del sellado
    description: Los tambores, botellas y contenedores llenos se ensayan para fugas, integridad del sellado y compatibilidad entre la formulación y el material de embalaje. Cada contenedor lleno supera una verificación obligatoria de fugas antes del envío.
    image: https://assets.agrospear.com/images/agrospear/factory/agrospear-production-department-2.webp
    alt: Ensayo de compatibilidad de envase e integridad del sellado para embalaje agroquímico
qc_flow:
  tagline: Las 7 etapas de inspección
  title: 'Siete puertas de calidad controladas, de principio a fin'
  subtitle: 'Cada puerta está definida en el Plan de Inspección de Calidad del proyecto con su objeto de inspección, método, criterios de aceptación y registro de salida. Los dosieres de informes bilingües son registros controlados reales — abra cualquiera para ver la estructura real.'
  obj_label: Objeto de inspección
  method_label: Método de inspección
  criteria_label: Criterios de aceptación
  record_label: Registro de salida
  stages:
    - stage: ETAPA 01
      title: 'Planificación de calidad del proyecto (PPM)'
      summary: 'La reunión previa a la producción fija el alcance, las líneas base y el plan de inspección antes de arrancar la línea.'
      checks:
        - 'Se registran el nombre del producto, el código interno, el SKU del cliente, el número de pedido y la definición de lote.'
        - 'Se especifican el ingrediente activo, el tipo de formulación, la concentración, las especificaciones de embalaje y los requisitos reglamentarios del mercado objetivo.'
        - 'El archivo de etiqueta, su versión, los colores, la posición del logo y el texto reglamentario quedan bloqueados y aprobados.'
        - 'La BOM — cada componente por lote con cantidad, grado, proveedor y reglas de sustitución — es aprobada por el cliente.'
        - 'El embalaje, el etiquetado, los códigos de barras, el idioma de las fichas de seguridad y la inspección de terceros quedan fijados por escrito.'
      object: 'Alcance del proyecto frente a requisitos del cliente — formulación, concentración, etiquetado, embalaje, mercado objetivo y estándares aplicables.'
      method: 'Reunión previa a la producción con ventas, ingeniería y calidad; aprobación de la muestra dorada; emisión del Plan de Inspección de Calidad (QIP) para el pedido.'
      criteria: 'Las cinco líneas base aprobadas y congeladas antes de iniciar la producción en masa. Los puntos sin resolver bloquean la liberación de producción.'
      record: 'QIP + actas de la reunión previa, registros de muestra aprobada.'
      image: https://assets.agrospear.com/site/quality/node01-ppm.avif
      alt: Reunión previa a la producción revisando la muestra dorada y el plan de inspección de calidad de un pedido OEM agroquímico
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Descargar QIP (PDF)'
    - stage: ETAPA 02
      title: 'Inspección de materiales entrantes (IQC)'
      summary: 'Las materias primas se verifican contra la especificación aprobada del proveedor antes de entrar en producción.'
      checks:
        - 'Ingredientes activos de grado técnico verificados en identidad (HPLC/GC), contenido, perfil de impurezas y certificado de análisis contra la especificación aprobada.'
        - 'Coformulantes, disolventes, tensioactivos y adyuvantes comprobados en grado, pureza, apariencia y cumplimiento del COA del proveedor.'
        - 'Materiales de embalaje — tambores, botellas, tapas, etiquetas y cartones — verificados en especificación, precisión de impresión y compatibilidad.'
        - 'Certificados del proveedor (COA), declaraciones de materiales y documentos de cumplimiento reglamentario revisados por lote.'
        - 'Los lotes no conformes se cuarentenan y devuelven antes de que ningún material llegue a la línea.'
      object: 'Ingredientes activos, coformulantes, disolventes, materiales de embalaje y etiquetas contra la especificación aprobada y los certificados de ensayo del proveedor.'
      method: 'Verificación de identidad y ensayo (HPLC/GC); controles visuales y físicos; muestreo de lote según AQL; revisión de certificados de materiales; lista de proveedores aprobados.'
      criteria: 'Cumple la especificación y los certificados aprobados. Los lotes no conformes se cuarentenan y rechazan antes de su liberación a la línea.'
      record: 'Informes de ensayo IQC con referencias de lote y disposiciones.'
      image: https://assets.agrospear.com/site/quality/node02-iqc.avif
      alt: Inspección de materiales entrantes de ingredientes activos y coformulantes en la fábrica
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
    - stage: ETAPA 03
      title: 'Control en proceso y primera pieza (IPQC / FAI)'
      summary: 'Los métodos de formulación y los puntos de control se seleccionan según la plataforma de formulación aprobada y la configuración del proyecto. La primera pieza se comprueba contra las líneas base bloqueadas; cada turno mantiene controles de ronda en la línea.'
      checks:
        - 'La primera pieza se verifica contra la muestra aprobada, la especificación técnica, la BOM, el arte de etiqueta y los archivos de embalaje antes de iniciar la producción en masa.'
        - 'Se miden el contenido de ingrediente activo, el pH, la densidad y las propiedades físicas específicas de formulación; se confirman la etiqueta y el texto reglamentario.'
        - 'Los procesos de mezcla, molienda y llenado se comprueban en homogeneidad, tamaño de partícula y cumplimiento del peso de llenado.'
        - 'El llenado de contenedores, el sellado y el etiquetado se comprueban en precisión, nivel de llenado y alineación de etiquetas contra la BOM aprobada por el cliente.'
        - 'La aprobación FAI bloquea por versión el arte, la formulación y la BOM; las desviaciones van al flujo de decisión de retrabajo — nunca parches en línea.'
      object: 'Primera pieza y lotes en proceso — contenido de ingrediente activo, propiedades físicas, peso de llenado, posición de etiqueta e integridad del sellado.'
      method: 'Inspección de primera pieza (FAI) en el primer lote; controles de ronda por turno; ensayo de ingrediente activo y verificación de propiedades físicas en línea.'
      criteria: 'La aprobación FAI bloquea por versión el arte, la formulación y la BOM. Las desviaciones se derivan al flujo de decisión de retrabajo — nunca parches en línea.'
      record: 'Registro FAI, registros de ronda por turno, notas de retrabajo y disposición.'
      image: https://assets.agrospear.com/site/quality/node03-ipqc-fai.avif
      alt: Inspección en proceso y comprobación de primera pieza durante la producción agroquímica
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
    - stage: ETAPA 04
      title: 'Ensayo de calidad de formulación y estabilidad'
      summary: 'Cada lote terminado se somete a análisis completo de ingrediente activo y verificación de propiedades físicas antes del embalaje — el 100% de los lotes, no una muestra.'
      checks:
        - 'Contenido de ingrediente activo determinado por método validado HPLC/GC y comparado con el contenido declarado (tolerancia ±5% según FAO/OMS).'
        - 'Ensayos físicos específicos por formulación: estabilidad de suspensión (SC), estabilidad de emulsión (EC), humectabilidad/dispersibilidad (WDG/WP), vertibilidad y espuma persistente.'
        - 'Ensayo de estabilidad acelerada a 54 °C durante 14 días según métodos CIPAC — ingrediente activo y propiedades físicas verificados post-almacenamiento.'
        - 'pH, densidad y apariencia verificados y registrados por lote.'
        - 'Los lotes fallidos se cuarentenan, investigan bajo NCR y se reprocesan bajo instrucción o rechazan — no solo se re-verifican en el punto de fallo.'
      object: 'El 100% de los lotes de producción — análisis de ingrediente activo, ensayo de propiedades físicas y verificación de estabilidad acelerada.'
      method: 'Ensayo de ingrediente activo por HPLC/GC; ensayo de propiedades físicas según métodos CIPAC FAO/OMS; estabilidad acelerada 54 °C / 14 días.'
      criteria: 'Ingrediente activo dentro de ±5% del declarado, todas las propiedades físicas dentro de especificación, ensayo de estabilidad superado. Los lotes fallidos se cuarentenan y reprocesan o rechazan.'
      record: 'Informes de ensayo de calidad de formulación y estabilidad, uno por lote, vinculados a la trazabilidad del lote.'
      image: https://assets.agrospear.com/site/quality/node04-airtightness.avif
      alt: Ensayo de calidad de formulación y estabilidad de lote agroquímico
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descargar informes de formulación (PDF)'
    - stage: ETAPA 05
      title: 'Inspección final de producto (FQC)'
      summary: 'Los productos terminados se verifican y califican contra la muestra dorada aprobada.'
      checks:
        - 'Contenido de ingrediente activo confirmado por ensayo independiente de QC contra especificación.'
        - 'Apariencia física, color y olor comparados con la muestra de referencia aprobada.'
        - 'Inspección cosmética bajo iluminación controlada: alineación de etiqueta, calidad de impresión, integridad del contenedor, sellado de tapa.'
        - 'Comprobaciones funcionales: peso de llenado, integridad del sellado, legibilidad de etiquetas, escaneabilidad de código de barras.'
        - 'Configuración verificada contra la BOM y el SKU aprobados — embalaje, etiquetas, CdA y documentos reglamentarios.'
      object: 'Producto terminado frente a muestra dorada — contenido de ingrediente activo, apariencia, etiquetado, integridad de embalaje y CdA.'
      method: 'Ensayo de ingrediente activo; evaluación visual y cosmética bajo iluminación controlada; verificación de peso de llenado e integridad del sellado; ensayo de escaneo de código de barras.'
      criteria: 'Ingrediente activo dentro de tolerancia, grado cosmético según muestra aprobada, etiquetado correcto, todo el embalaje presente y sellado.'
      record: 'Informes FQC con firma del inspector y disposición.'
      image: https://assets.agrospear.com/site/quality/node05-fqc.avif
      alt: Inspección final de formulaciones agroquímicas terminadas antes del embalaje
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
    - stage: ETAPA 06
      title: 'Embalaje e inspección pre-embarque (PSI)'
      summary: 'El pedido embalado se comprueba en integridad, precisión del marcado y preparación para el envío.'
      checks:
        - 'Integridad del kit al 100% frente a la BOM: contenedores llenos, etiquetas, documentos CdA, fichas de seguridad — un set a la vez.'
        - 'Especificaciones del contenedor verificadas: tipo de tambor/botella, peso de llenado, integridad del sellado y precisión de etiquetas.'
        - 'Gráficos de etiqueta, nombre de marca, declaración de ingrediente activo, texto reglamentario y versiones de idioma verificados contra la revisión aprobada.'
        - 'Tipo, número, posición y legibilidad del código de barras verificados; marcas de envío, SKU, PO, número de cartón y cantidad correctos.'
        - 'Configuración de palet, envoltorio stretch y plan de carga del contenedor coinciden con la especificación de embalaje; peso bruto/neto verificado.'
      object: 'Pedido embalado — contenedores, etiquetas, CdA, FDS, embalaje — contra la BOM aprobada por el cliente y la especificación de embalaje.'
      method: 'Integridad del kit al 100% frente a la BOM; escaneo de código de barras (grado ≥ B); precisión del marcado de etiquetas; verificación de integridad del sellado; verificación de peso.'
      criteria: 'Kit al 100% según BOM, códigos de barras legibles, marcados correctos y embalaje seguro antes de la carga.'
      record: 'Listas de comprobación PSI y registros de embalaje por envío.'
      image: https://assets.agrospear.com/site/quality/node06-psi.avif
      alt: Inspección pre-embarque comprobando el pedido agroquímico embalado contra la BOM
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
    - stage: ETAPA 07
      title: 'Liberación de envío y trazabilidad'
      summary: 'Calidad firma la liberación del lote solo cuando las seis puertas anteriores están cerradas y todos los registros están completos.'
      checks:
        - 'El lote de producción, el número de pedido, el SKU, la cantidad y el recuento de contenedores coinciden con la lista de embalaje y la factura comercial.'
        - 'La especificación, la BOM, el arte de etiqueta y los archivos de embalaje están todos en la revisión aprobada vigente.'
        - 'Los registros IQC, FAI, en proceso, calidad de formulación, FQC y PSI están completos para el lote que se libera.'
        - 'Todas las no conformidades están resueltas, reprocesadas, reinspeccionadas y cerradas — sin elementos abiertos en la liberación.'
        - 'Campos de trazabilidad registrados por lote: código de proyecto, PO, SKU, revisiones de arte/BOM/embalaje, fecha de producción, inspector y números de registro.'
      object: 'Autorización de liberación del lote — puertas cerradas, registros completos, números de lote mapeados al envío.'
      method: 'Revisión de las seis puertas anteriores por calidad; ensamblado del dosier de trazabilidad del lote; entrega de registros con el envío.'
      criteria: 'Todas las puertas aprobadas por calidad; registros de lote y dosier de trazabilidad entregados al comprador o custodiados bajo NDA a petición.'
      record: 'Autorización de liberación de envío y dosier de trazabilidad del lote.'
      image: https://assets.agrospear.com/site/quality/node07-shipment-release.avif
      alt: Firma de liberación de envío y entrega de registros de trazabilidad de lote
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberación (PDF)'
system_map:
  tagline: El sistema de calidad
  title: 'Un sistema, cuatro estándares controlados'
  subtitle: 'Las siete puertas anteriores funcionan sobre cuatro estándares documentados, cada uno publicado como procedimiento controlado que puedes descargar y auditar. Juntos forman el SGC (QMS) detrás de cada pedido OEM/ODM — criterios de inspección, control de cambios, no conformidades y ensayos de laboratorio.'
  items:
    - title: 'Estándares de inspección y liberación'
      description: 'El QIP del proyecto impulsa cada puerta: objeto de inspección, método, criterios de aceptación y registro de salida por pedido. Incluye el marco QC de 4 etapas, la cadena de trazabilidad, el flujo de cuarentena, la matriz de defectos y el registro documental 00–15.'
      icon: tabler:clipboard-check
      link: /es/factory/quality-inspection
      link_label: 'Estándares de inspección y descargas QMS'
    - title: 'Control de cambios de retrabajo'
      description: 'Ningún cambio de parámetros de retrabajo sin control documentado: contención, clasificación de riesgo, bucle de cambio de 9 pasos, matriz de aprobación y validación. Cualquier cambio en especificaciones, muestras, BOM o criterios de aceptación aprobados requiere la aprobación escrita del cliente.'
      icon: tabler:git-branch
      link: /es/factory/quality-change-control
      link_label: 'Estándar de control de cambios'
    - title: 'Control de productos no conformes'
      description: 'Un bucle cerrado de 7 pasos bajo ISO 9001:2015 cláusula 8.7: identificar, poner en cuarentena, decidir según NCR, retrabajar o rechazar, reinspeccionar, liberar, corregir. Incluye la autoridad por gravedad, la matriz de disposición de defectos y la destrucción presenciada.'
      icon: tabler:alert-triangle
      link: /es/factory/non-conforming-control
      link_label: 'Estándar de control de productos no conformes'
    - title: 'Laboratorio de ensayos y equipos'
      description: 'El laboratorio de calidad opera independiente de la producción: HPLC, GC, análisis de tamaño de partícula, medidores de pH/densidad, cámaras de estabilidad y ensayos de viscosidad — con los procedimientos de calibración y ensayo detrás de nuestras afirmaciones publicadas.'
      icon: tabler:flask
      link: /es/factory/quality-lab
      link_label: 'Laboratorio de calidad y equipos de ensayo'
    - title: 'Laboratorio de I+D de formulación'
      description: 'El centro de I+D realiza desarrollo independiente de formulaciones, estudios de envejecimiento acelerado y soporte de registro, alimentando los estándares que usa la producción.'
      icon: tabler:microscope
      link: /es/randdcenter/quality-inspection-lab
      link_label: 'Laboratorio de formulación de I+D'
intelligence_cards:
  tagline: Documentación y trazabilidad
  title: 'Registros de calidad que respaldan la trazabilidad del proyecto'
  subtitle: 'Los registros de inspección se mantienen por lote de producción y se vinculan a la documentación aplicable del proyecto — revisión de especificación, revisión de etiqueta, BOM y requisitos de embalaje. Para proteger la confidencialidad del cliente, las muestras de esta página están anonimizadas: solo se muestran los campos estructurales (código de proyecto, producto/SKU, lote, etapa de inspección, ítem de inspección, criterios de aceptación, resultado, inspector, fecha y estado de liberación).'
  cards:
    - icon: 1
      icon_bg: blue
      title: Registro de inspección de materiales entrantes
      desc: 'Demuestra que las materias primas, los ingredientes activos y los coformulantes se verifican contra la especificación aprobada antes de su liberación a producción.'
