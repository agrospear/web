answer:
  label: 'Respuesta directa'
  text: 'La estabilidad equilibra la complejidad de la formulación con la vida útil: SC es la más exigente — requiere optimización del dispersante, control del tamaño de partícula y ajuste de viscosidad para resistir la sedimentación; EC es más fácil de estabilizar pero la migración del solvente debe controlarse; WDG ofrece la vida útil más larga debido a la baja actividad del agua; FS necesita polímeros formadores de película para la estabilidad de adherencia a la semilla. Una SC a 250 g/L con D50 < 3 µm y ≥ 95 % de suspensibilidad después de 14 días a 54 °C cumple especificación premium.'
  verified: '2026-08'

content_html: |
  <h2>Las Cuatro Clases Estándar de Estabilidad</h2>

  <h3>SC — Concentrado en Suspensión</h3>
  <ul>
    <li>Gestión de estabilidad más compleja — los sólidos suspendidos deben resistir la sedimentación</li>
    <li>Requiere optimización del dispersante y tamaño de partícula < 3 µm D50</li>
    <li>La viscosidad debe equilibrar la vertibilidad con el esfuerzo de fluencia anti-asentamiento</li>
    <li>Especificación premium: ≥ 95 % de suspensibilidad, sin sedimentación después de 14 d a 54 °C</li>
    <li>Ideal para: Herbicidas, fungicidas, aplicaciones foliares de alto valor</li>
  </ul>

  <h3>EC — Concentrado Emulsionable</h3>
  <ul>
    <li>Estabilidad física más simple — solución homogénea, sin sólidos suspendidos</li>
    <li>La estabilidad de la emulsión al diluir es el parámetro crítico</li>
    <li>La migración del solvente y la compatibilidad del contenedor deben controlarse</li>
    <li>Ideal para: Insecticidas sistémicos, absorción rápida por el cultivo</li>
  </ul>

  <h3>WDG — Granulado Dispersable en Agua</h3>
  <ul>
    <li>Vida útil más larga — la baja actividad del agua previene la hidrólisis</li>
    <li>La integridad del gránulo y la desintegración rápida deben mantenerse</li>
    <li>La absorción de humedad durante el almacenamiento es el riesgo principal</li>
    <li>Ideal para: Fungicidas y herbicidas premium, manejo sin polvo</li>
  </ul>

  <h3>FS — Tratamiento de Semillas Flowable</h3>
  <ul>
    <li>La estabilidad del polímero formador de película es crítica — debe adherirse a la semilla sin descascarillarse</li>
    <li>El colorante y el ingrediente activo deben permanecer distribuidos homogéneamente</li>
    <li>Se requiere estabilidad de almacenamiento a baja temperatura (prueba a 5 °C)</li>
    <li>Ideal para: Programas de tratamiento de semillas de cereales y hortalizas</li>
  </ul>

  <h2>Análisis de Estabilidad</h2>
  <p>La estabilidad de vida útil de una formulación agroquímica está gobernada por sus propiedades físico-químicas y la interacción entre el ingrediente activo, los coformulantes y el embalaje. A 54 °C de almacenamiento acelerado, una SC con D50 < 3 µm y un paquete de dispersante bien optimizado muestra aproximadamente un 30 % menos de sedimentación que una SC con D50 > 5 µm. La retención del contenido del ingrediente activo se determina principalmente por el pH y la estabilidad hidrolítica; la estabilidad secundaria está influida por la compatibilidad del contenedor y el oxígeno del espacio de cabeza.</p>

  <h2>Estabilidad por Tipo de Formulación y Condición de Almacenamiento</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Condición de Almacenamiento</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">SC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">EC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">WDG</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">FS</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">54 °C / 14 d (acelerado)</td><td class="p-3 border">≥ 97 % i.a., ≥ 90 % susp.</td><td class="p-3 border">≥ 97 % i.a., emulsión pasa</td><td class="p-3 border">≥ 97 % i.a., desint. < 60 s</td><td class="p-3 border">≥ 95 % i.a., sin descascarillado</td></tr>
      <tr><td class="p-3 border">40 °C / 75 % HR / 28 d</td><td class="p-3 border">≥ 97 % i.a., ≥ 92 % susp.</td><td class="p-3 border">≥ 98 % i.a., emulsión pasa</td><td class="p-3 border">≥ 98 % i.a., humedad < 2 %</td><td class="p-3 border">≥ 97 % i.a., película intacta</td></tr>
      <tr><td class="p-3 border">25 °C / 60 % HR / 24 meses</td><td class="p-3 border">≥ 97 % i.a., sin sedimentación</td><td class="p-3 border">≥ 98 % i.a., emulsión pasa</td><td class="p-3 border">≥ 98 % i.a., flujo libre</td><td class="p-3 border">≥ 97 % i.a., película uniforme</td></tr>
      <tr><td class="p-3 border">5 °C / 7 d (prueba fría)</td><td class="p-3 border">Sin cristalización</td><td class="p-3 border">Sin separación de fases</td><td class="p-3 border">N/A</td><td class="p-3 border">Sin gelificación, vertible</td></tr>
    </tbody>
  </table>

  <h2>Pruebas Aceleradas vs. Vida Útil Real</h2>
  <p>Una idea errónea habitual es que pasar 14 días a 54 °C garantiza 2 años de estabilidad de vida útil. En realidad, la prueba a 54 °C predice principalmente la degradación hidrolítica y la inestabilidad física a temperaturas elevadas; la vida útil real depende del tipo de contenedor, el espacio de cabeza y la distribución de temperatura de almacenamiento. Para afirmaciones robustas de vida útil, recomendamos datos de 54 °C (14 d), 40 °C/75 % HR (28 d) y 25 °C/60 % HR (12–24 meses), más una prueba fría a 5 °C para formulaciones líquidas.</p>

  <h2>Estándares de Estabilidad de Agrospear</h2>
  <ul>
    <li><strong>Productos SC:</strong> Serie SC Agrospear — D50 < 3 µm, ≥ 95 % de suspensibilidad después de 14 d a 54 °C, retención de contenido activo ≥ 97 %</li>
    <li><strong>Productos EC:</strong> Serie EC Agrospear — estabilidad de emulsión pasa (0 mL crema, 0 mL sedimento) en aguas CIPAC C y D, retención de contenido activo ≥ 98 %</li>
    <li><strong>Productos WDG:</strong> Serie WDG Agrospear — desintegración < 60 s, flujo libre después de 24 meses a 25 °C, absorción de humedad < 1 %</li>
  </ul>
  <p>Todas las formulaciones utilizan paquetes de coformulantes validados por pruebas de estabilidad aceleradas y a largo plazo según métodos CIPAC.</p>
  <p>Los parámetros de estabilidad, la selección de coformulantes y el embalaje son configurables para líneas personalizadas — descubra cómo <a href="/es/oem-manufacturing">diseñamos formulaciones para marcas OEM y de etiqueta privada</a> y recorra nuestras pruebas de estabilidad en la <a href="/es/manufacturing/factory">planta de fabricación</a>.</p>

