hero:
  tagline: Technology
  title: Built for Performance
  subtitle: Every Agrospear formulation is engineered with precision particle size control, advanced dispersion systems, and validated stability — materials and manufacturing methods tested for demanding agricultural environments.

sections:
  - title: Suspension Concentrate (SC)
    description: High-shear milling reduces active particles to 1–5 μm, suspended in an optimized aqueous carrier with anti-settling agents. This produces a stable, pourable formulation with minimal dust and maximum bioavailability for foliar and soil application.
    imageAlt: SC Formulation Diagram
  - title: Emulsifiable Concentrate (EC)
    description: Solvent-based formulation with emulsifier packages that form stable oil-in-water emulsions on dilution. Optimized for rapid leaf coverage and rain-fastness. Tested for emulsion stability, flash point, and cold compatibility.
    imageAlt: EC Emulsion Layer
  - title: Water Dispersible Granule (WDG)
    description: Spray-dried or pan-granulated particles that disperse rapidly in water without dust. Used on all herbicide and fungicide models where operator safety and convenience are priorities. Maintains dispersibility in hard water.
    imageAlt: WDG Granule
  - title: Wettable Powder (WP)
    description: Air-flow milled powder with built-in dispersants and wetting agents for rapid suspension in spray tanks. Provides high active loading with proven field efficacy. Quality verified by suspensibility and wettability testing.
    imageAlt: WP Powder

