answer:
  label: 'Straight answer'
  text: 'Every batch is inspected against published specifications before shipment: 100% active ingredient content testing by HPLC/GC, physical property verification (particle size, viscosity, pH, suspension rate), and accelerated stability testing per FAO/WHO specifications. The lab reports to the managing director, not production, and can halt any shipment.'
  verified: '2026-08'

intro: 'Every batch that leaves our facility carries the certification that it has passed a defined set of quality inspections and analytical tests. Our Quality & Inspection Lab is an independent function within the organisation — it reports directly to the managing director, not to production — ensuring that no commercial pressure can compromise the inspection gate. If a raw material batch or a finished product does not meet the published specification, the lab has the authority to halt shipment until the non-conformance is resolved.'

content_html: |
  <h2>Trust, but verify</h2>
  <p>The lab operates under a quality management system aligned with ISO 9001 principles, and our test methods are based on FAO/WHO, CIPAC, ISO and ASTM standards wherever applicable. We maintain detailed records of every test performed, creating a complete traceability chain from raw material receipt to final product delivery.</p>

  <h2>Test equipment and capabilities</h2>
  <table>
    <thead><tr><th>Equipment</th><th>Tests Performed</th><th>Standard / Method</th></tr></thead>
    <tbody>
      <tr><td>HPLC system (UV/DAD detector)</td><td>Active ingredient content, impurity profile, degradation products</td><td>CIPAC methods, FAO/WHO specs</td></tr>
      <tr><td>GC system (FID/ECD detector)</td><td>Active ingredient content (volatile AI), solvent residue analysis</td><td>CIPAC methods, internal protocols</td></tr>
      <tr><td>Laser particle size analyzer</td><td>Particle size distribution (D50, D90, span), droplet size for EC/ME</td><td>ISO 13320, CIPAC MT 187</td></tr>
      <tr><td>Rotational viscometer</td><td>Viscosity at specified shear rates, flow curve characterization</td><td>CIPAC MT 172, ISO 2555</td></tr>
      <tr><td>pH meter (calibrated)</td><td>pH of 1% aqueous dilution, pH of formulation</td><td>CIPAC MT 75.3</td></tr>
      <tr><td>Stability chambers (0 °C, 25 °C, 54 °C)</td><td>Accelerated storage stability, cold stability, shelf-life estimation</td><td>CIPAC MT 46, FAO/WHO guidelines</td></tr>
      <tr><td>Density meter (digital)</td><td>Density and specific gravity of liquid formulations</td><td>CIPAC MT 3.2, ISO 758</td></tr>
      <tr><td>Suspension rate test apparatus</td><td>Suspensibility of SC and WP formulations after 30 min standing</td><td>CIPAC MT 184, MT 15</td></tr>
      <tr><td>Emulsion stability test kit</td><td>Emulsion stability of EC and ME formulations (re-emulsification, creaming)</td><td>CIPAC MT 36, MT 41</td></tr>
      <tr><td>Water dispersibility tester</td><td>Wettability and dispersibility of WP and WDG formulations</td><td>CIPAC MT 53.3, MT 174</td></tr>
      <tr><td>Persistent foam test apparatus</td><td>Foam persistence after mixing in spray tank simulation</td><td>CIPAC MT 47.2</td></tr>
    </tbody>
  </table>

  <h2>The inspection gates — from raw material to delivery</h2>
  <p>Every batch follows a defined quality plan with mandatory inspection points. No batch can skip a gate; each gate must be signed off by a quality inspector before the next production stage begins.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Incoming raw material inspection</p>
            <p class="text-xs text-gray-500 mt-1">Technical-grade active ingredient, co-formulant batch, solvent lot — all checked against incoming specification and COA before release to production.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">In-process formulation check</p>
            <p class="text-xs text-gray-500 mt-1">First-off batch sample tested (content + physical properties) at start of each production shift.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Finished product analysis</p>
            <p class="text-xs text-gray-500 mt-1">Full analytical testing: active ingredient content by HPLC/GC, particle size, viscosity, pH, suspension rate. Any parameter outside specification limits auto-rejects. Data logged per batch number.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pre-delivery inspection</p>
            <p class="text-xs text-gray-500 mt-1">Complete batch inspected: drum seal integrity, label accuracy, hazard pictograms, no cosmetic defects. 100-point checklist.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Final certification</p>
            <p class="text-xs text-gray-500 mt-1">Test reports compiled, inspection records reviewed, Certificate of Analysis issued.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Standard checks on every batch</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">HPLC/GC</span>
      <span class="text-xs text-gray-500">Active ingredient content, every batch</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&plusmn; spec</span>
      <span class="text-xs text-gray-500">Any parameter outside limits triggers automatic rejection</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Batches analytically tested before release</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 9001</span>
      <span class="text-xs text-gray-500">Quality management system</span>
    </div>
  </div>

  <h2>Our quality team</h2>
  <p>The lab is staffed by a quality manager (10 years in agrochemical QA, ASQ Certified Quality Engineer), two quality inspectors (each with certification in analytical chemistry and formulation testing), and an analytical chemist responsible for all HPLC/GC and physical testing. The team undergoes annual proficiency testing through an independent third-party provider to ensure that our test results remain accurate and reproducible.</p>

  <h2>Independent testing for clients</h2>
  <p>Our Quality &amp; Inspection Lab is available for independent testing services. If you need to verify a raw material specification, validate a new co-formulant system, or obtain a third-party test report for a procurement qualification, we can perform the tests to the applicable standard and issue a certified test report.</p>
  <p>Examples of recent third-party testing work:</p>
  <ul>
    <li>Active ingredient content comparison of five competitive technical-grade raw materials for a European procurement programme.</li>
    <li>Accelerated stability study (54 °C + thermal cycling) for a new SC fungicide formulation with multiple active ingredients, with regular interim measurements at 7-day intervals.</li>
    <li>Particle size distribution validation of 50 pilot batches for a new WDG herbicide formulation.</li>
  </ul>

  <h2>Our commitment to you</h2>
  <p>When you receive an Agrospear shipment, you also receive its quality dossier — a compiled record of the test results that apply to your specific batch. Raw material COA, HPLC/GC content analysis, physical property test results, and pre-delivery inspection checklist. Every number is traceable. Every inspector is identified. This is not just paperwork — it is our promise that what we delivered is what we specified.</p>
  <p>If you ever have a quality concern, you can contact the lab directly — the contact details are printed on your Certificate of Analysis. We take every query seriously and commit to a formal investigation within 48 hours.</p>

  <h2>What happens if a batch fails inspection?</h2>
  <p>A failed batch never quietly disappears. The lab follows a fixed non-conformance workflow so the problem is contained, corrected and prevented from recurring:</p>
  <ul>
    <li><strong>Isolation</strong> — the batch is tagged, moved off the line and logged in the non-conformance register with the inspector's name and the failed criteria.</li>
    <li><strong>Rework or scrap</strong> — repairable defects (e.g. particle size, viscosity) are reworked by a certified operator and the reworked batch is re-tested to the same standard. Batches that cannot meet specification are scrapped, not downgraded.</li>
    <li><strong>Re-inspection</strong> — every reworked batch passes the full affected gate again before it can re-enter the packing line.</li>
    <li><strong>Release</strong> — only batches with all gates signed off leave the plant. The rejection rate, root cause and corrective action are summarised in your batch quality report.</li>
  </ul>

  <h2>Quality documentation you receive</h2>
  <p>Every batch ships with a document pack your QC team can audit against: the Certificate of Analysis (raw material lot numbers, active ingredient content, physical properties), HPLC/GC test records per batch number, the signed 100-point pre-delivery checklist, packing list and photographed record of your drums before loading.</p>

