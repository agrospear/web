hero:
  tagline: Laboratorio de control de calidad
  title: Laboratorio de ensayos y garantia de calidad
  subtitle: 'Laboratorio de calidad independiente con procesos ISO 9001: cada lote se prueba antes del envio'

answer:
  label: 'Respuesta directa'
  text: 'El 100% de los lotes se analizan para contenido activo por HPLC/GC, suspensibilidad (CIPAC MT 15) y estabilidad acelerada a 54 C durante 14 dias (CIPAC MT 46), con rechazo automatico si la desviacion del contenido activo supera ±2%. Los lotes de materia prima se verifican mediante certificado de analisis y prueba de identidad, y los controles en proceso se realizan en cada etapa de produccion con muestreo final AQL 2.5 segun ISO 2859.'
  verified: '2026-08'

intro: Agrospear opera un laboratorio de control de calidad dedicado que trabaja de forma independiente de la produccion. Cada lote de materia prima y cada formulacion agroquimica terminada pasa por protocolos de inspeccion documentados antes de su liberacion. Nuestro equipo de control de calidad informa directamente a la direccion, lo que garantiza decisiones de calidad imparciales.

highlights:
  - value: 100%
    label: Lotes analizados
    detail: Cada materia prima, cada producto terminado
  - value: 14 d
    label: Duracion de la prueba de estabilidad acelerada
    detail: A 54 C segun CIPAC MT 46
  - value: ±2%
    label: Desviacion maxima de contenido activo
    detail: Sobre el rango de especificacion
  - value: AQL 2.5
    label: Umbral de defectos graves
    detail: Segun el muestreo ISO 2859

test_procedures:
  - title: Inspeccion de materias primas
    description: Cada lote entrante de ingrediente activo, disolvente, tensioactivo, coadyuvante y componente de embalaje se prueba antes de su aceptacion. Se verifican el contenido activo por HPLC/GC, la humedad, el tamano de particula, el pH y la confirmacion de identidad. Los materiales no conformes se ponen en cuarentena y se devuelven.
    standards:
      - HPLC/GC (contenido activo)
      - CIPAC MT 15 (suspensibilidad)
      - ICAMA/FAMI-QS (identidad)
  - title: Puntos de control de calidad en proceso
    description: Los operadores de produccion realizan autoinspecciones en cada etapa. Los auditores de control de calidad realizan muestreos aleatorios durante todo el turno. Los controles de contenido activo se realizan tras la elaboracion. Los controles de tamano de particula y viscosidad se realizan tras la molienda. La verificacion de peso de llenado y par de apriete tras el llenado.
    standards:
      - CIPAC MT 15 (suspensibilidad)
      - Lista de control interna de 100 puntos
      - Muestreo ISO 2859
  - title: Prueba de estabilidad acelerada a 54 C
    description: Cada lote de formulacion se mantiene a 54 C durante 14 dias segun CIPAC MT 46. Se analiza el contenido activo, la suspensibilidad, la estabilidad de emulsion, el pH y el aspecto antes y despues. Cualquier lote que presente sedimentacion, separacion de fases o degradacion del contenido activo mas alla de la tolerancia activa una reinspeccion automatica del lote.
    standards:
      - CIPAC MT 46 (estabilidad)
      - Especificaciones FAO/OMS
  - title: Verificacion final de especificacion
    description: Las formulaciones terminadas se analizan contra la especificacion completa del proyecto — contenido activo, suspensibilidad, estabilidad de emulsion, pH, viscosidad, tamano de particula y aspecto. Cada lote se somete a verificacion analitica completa antes de la aprobacion de inspeccion final.
    standards:
      - CIPAC MT 36 (emulsion)
      - CIPAC MT 75 (tamano de particula)
      - Especificaciones FAO/OMS

equipment:
  - name: Sistema HPLC (contenido activo)
    spec: 'Detector UV/DAD, metodos validados segun CIPAC'
  - name: Sistema GC (AI volatil)
    spec: 'Detector FID/ECD, capacidad de headspace'
  - name: Camara de estabilidad
    spec: '54 C ±2 C, conforme a CIPAC MT 46'
  - name: Analizador de tamano de particula (difraccion laser)
    spec: 'Rango 0,01–3.500 µm'
  - name: Medidor de pH (calibrado)
    spec: 'Resolucion ±0,01, compensacion de temperatura'
  - name: Viscosimetro (rotacional)
    spec: 'Rango 0,3–6.000 mPa·s'
  - name: Aparato de prueba de suspensibilidad
    spec: 'Conforme a CIPAC MT 15'

lab_evidence:
  tagline: Dosieres de informes de ensayo
  title: 'Descarga los informes de ensayo de laboratorio reales'
  subtitle: 'Los mismos registros controlados bilingues contra los que cierra nuestro equipo de calidad — estructura, metodos, criterios y resultados, con los campos confidenciales eliminados. Cada dosier corresponde a una de las siete puertas de inspeccion.'
  items:
    - title: 'IQC — Informes de materiales entrantes'
      description: 'Verificacion de ingrediente activo, disolvente, tensioactivo y componentes contra la especificacion aprobada.'
      icon: tabler:file-certificate
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
    - title: 'IPQC — Informes en proceso y de primera pieza'
      description: 'Registros de primera pieza e inspeccion en proceso contra la revision bloqueada.'
      icon: tabler:file-check
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
    - title: 'Estabilidad — Registros acelerados y de vida util'
      description: 'Estabilidad acelerada a 54 C del 100% de los lotes, suspensionibilidad y verificacion de contenido activo.'
      icon: tabler:waves
      link: /es/manufacturing/qcqa-documents
      link_label: 'Ver biblioteca de documentos QC/QA'
    - title: 'FQC — Informes de prueba final del producto'
      description: 'Inspeccion final contra la muestra aprobada — contenido activo, propiedades fisicas y cumplimiento de especificacion.'
      icon: tabler:shield-check
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
    - title: 'PSI — Informes de embalaje y pre-embarque'
      description: 'Registros de integridad del kit, grado de codigo de barras, marcas de caja y resistencia a caidas.'
      icon: tabler:package
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
    - title: 'Liberacion de envio y dosier de trazabilidad'
      description: 'Autorizacion de liberacion y trazabilidad de lote vinculada a especificacion, etiqueta y BOM.'
      icon: tabler:history
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberacion (PDF)'
    - title: 'Dosier de calidad completo'
      description: 'Un pack que cubre todo el sistema documental — QIP, registros de puertas, trazabilidad y control de NCR.'
      icon: tabler:books
      link: https://assets.agrospear.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_AGROCHEMICAL_QUALITY_DOSSIER.pdf
      link_label: 'Descargar pack de documentacion (PDF)'

