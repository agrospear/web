faqs:
  - question: '¿Qué ventaja tiene una premezcla frente a la mezcla en tanque?'
    answer: 'La premezcla garantiza una distribución homogénea de los ingredientes activos en cada gota de aplicación, elimina riesgos de incompatibilidad física o química, reduce errores de dosificación y simplifica la logística de almacenamiento y transporte. Además, permite registrar el producto como una entidad farmacéutica única, lo que facilita los trámites regulatorios en muchos mercados.'
  - question: '¿Qué es una formulación ZC?'
    answer: 'ZC es una formulación combinada que integra una suspensión de partículas sólidas (como una SC) con microcápsulas de polímero (como una CS) en un solo producto. Permite combinar un ingrediente activo de liberación inmediata con otro de liberación controlada en una misma presentación, proporcionando un efecto de choque rápido seguido de una protección sostenida.'
  - question: '¿Cómo manejan la resistencia cuando combinan insecticidas y fungicidas?'
    answer: 'Aplicamos simultáneamente los criterios IRAC para insecticidas y FRAC para fungicidas. Cada combinación se diseña para que los ingredientes activos pertenezcan a grupos sin cruzados, de modo que la resistencia a uno no comprometa la eficacia del otro. Nuestro equipo técnico asesora sobre la rotación de premezclas entre ciclos productivos para mantener la presión de selección en niveles aceptables.'
  - question: '¿Cuántos ingredientes activos pueden combinarse en una sola formulación?'
    answer: 'Agrospear tiene experiencia en formulaciones de 2 y 3 ingredientes activos. Las más comunes son las combinaciones insecticida+fungicida (2 IA) y fungicida+fungicida (2-3 IA de distintos grupos FRAC). La viabilidad técnica depende de la compatibilidad química, la solubilidad de cada IA y la estabilidad del sistema coloidal. Nuestro laboratorio evalúa cada caso de forma individual.'
body: |
  <h2>Premezclas y mezclas en tanque multi-ingrediente activo</h2>
  <p>Las premezclas —co-formulaciones de dos o más ingredientes activos en un solo producto— representan una de las tendencias más dinámicas del mercado agroquímico global. Agrospear desarrolla y fabrica premezclas que combinan modos de acción complementarios para ampliar el espectro de control, reducir el número de aplicaciones y mitigar el riesgo de resistencia. A diferencia de la mezcla en tanque, donde el agricultor combina productos en el momento de la aplicación, la premezcla garantiza una homogeneidad perfecta y una estabilidad confirmada por ensayos de compatibilidad.</p>
  <p>Nuestra línea de premezclas incluye combinaciones insecticida+fungicida para tratamiento de semillas y foliar, combinaciones fungicida+fungicida de grupos FRAC cruzados para control de enfermedades complejas, y combinaciones herbicida+herbicida de grupos HRAC complementarios para ampliar el espectro de malezas controladas. Cada formulación se optimiza para maximizar la sinergia entre ingredientes activos y minimizar la antagonia.</p>

  <h2>Formulaciones CS, ZC y SC de última generación</h2>
  <p>La formulación CS (suspensión encapsulada) incorpora microcápsulas de polímero que liberan el ingrediente activo de forma gradual, extendiendo la ventana de protección y reduciendo la frecuencia de aplicación. Es especialmente útil para insecticidas sistémicos que deben proteger el cultivo durante varias semanas, como los neonicotinoides y los butenoloides en aplicaciones al suelo o al tronco.</p>
  <p>La formulación ZC es la innovación más significativa de nuestro portfolio de premezclas: combina una fase SC (partículas sólidas en suspensión) con una fase CS (microcápsulas) en un sistema coloidal estable. Esto permite que un ingrediente activo actúe de forma inmediata —el de la suspensión— mientras el otro se libera de manera sostenida —el de las microcápsulas—. El resultado es un producto que proporciona efecto de choque y residualidad en una sola aplicación, reduciendo costos operativos y exposiciones ambientales.</p>
  <p>Las formulaciones SC convencionales completan la línea para premezclas donde ambos ingredientes activos requieren liberación inmediata y no presentan incompatibilidad en solución. Nuestro laboratorio de I+D valida la estabilidad acelerada de cada formulación a 54 °C durante 14 días y a 0 °C durante 7 días, asegurando que el producto mantiene sus propiedades en las condiciones de almacenamiento más exigentes.</p>

  <h2>Manejo integrado de resistencia IRAC+FRAC</h2>
  <p>Cuando una premezcla combina un insecticida y un fungicida, los criterios de manejo de resistencia de ambas clasificaciones deben aplicarse simultáneamente. Agrospear diseña cada combinación para que los ingredientes activos pertenezcan a grupos IRAC y FRAC sin cruzados, de modo que la presión de selección sobre cada modo de acción se mantenga dentro de niveles aceptables. Esta estrategia es especialmente relevante en sistemas productivos intensivos —arroz, soja, hortalizas bajo invernadero— donde el número de aplicaciones por ciclo es elevado.</p>
  <p>Nuestro equipo técnico proporciona a cada cliente OEM un plan de rotación que alterna premezclas con productos de un solo ingrediente activo entre ciclos productivos, maximizando la protección del cultivo mientras preserva la vida útil de cada modo de acción. Este acompañamiento técnico, respaldado por datos de monitoreo de resistencia de más de 60 países, es parte del valor agregado que Agrospear ofrece a sus socios comerciales.</p>

  <div class="cta">
    <h3>Desarrolle sus premezclas con Agrospear</h3>
    <p>Con 20 000 m² de fábrica, 50 000+ toneladas de capacidad anual y certificaciones ISO 9001/14001, GMP, BSCI e ICAMA, Agrospear es su fabricante OEM/ODM para premezclas y mezclas multi-IA. Desde formulaciones ZC de última generación hasta combinaciones SC probadas en campo, fabricamos bajo su marca con la calidad y la innovación que su mercado exige.</p>
