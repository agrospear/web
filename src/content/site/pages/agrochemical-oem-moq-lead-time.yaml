answer:
  label: 'Straight answer'
  text: 'MOQ and lead time are project-specific, but the framework is fixed. Every custom agrochemical project moves through the same tiered stages: sample development (1–4 tons, ready in 7–12 days), trial and pilot orders (5 tons on existing platforms), and standard volume runs (20+ tons per production batch). Production lead time is 25–35 days from confirmed PO and deposit; if your project needs a new formulation, development adds 15–20 days before production begins. So a typical first project looks like this: samples in about 1–2 weeks, pilot batches in 4–6 weeks, and the first full run shipping roughly 6–8 weeks after order confirmation.'
  verified: '2026-08'

moq_lead_table:
  tagline: The Framework
  title: 'Custom Agrochemical MOQ & Lead Time Tiers at a Glance'
  subtitle: 'Every stage validates the next. You never jump straight from a drawing to a container — you confirm the formulation, the labeling and the packaging at each tier before committing to more volume.'
  headers:
    stage: Order Stage
    quantity: Typical Quantity
    lead_time: Lead Time
    best_for: Best For
  rows:
    - stage: 'Sample development'
      quantity: '1–4 tons'
      lead_time: '7–12 days'
      best_for: 'Validating formulation performance, active content, label design and packaging fit. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - stage: 'Trial / pilot order'
      quantity: '5 tons'
      lead_time: '25–35 days'
      best_for: 'Pre-season commercial testing, market validation and first sell-through using existing formulation platforms, standard materials and simplified packaging.'
    - stage: 'Standard volume run'
      quantity: '20+ tons per batch'
      lead_time: '25–35 days'
      best_for: 'Full production efficiency on complete production batches — zero material waste, uniform active content and amortized line setup. Custom formulations run at this tier.'
    - stage: 'Large-scale program'
      quantity: '100+ tons'
      lead_time: '25–35 days per batch, staggered shipments'
      best_for: 'Container-scale programs and seasonal supply chains, scheduled across multiple production batches so your warehouse and cash flow stay manageable.'

moq_drivers:
  tagline: What Drives Your MOQ
  title: 'The Six Factors That Decide Your Minimum Quantity'
  subtitle: 'MOQ is not a random number a sales team picks. It is calculated from the full product architecture — these components are evaluated together before quotation.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: F
      icon_bg: blue
      title: 'Formulation & Development'
      desc: 'Existing factory formulation platforms allow pilot orders from 5 tons. A bespoke formulation needs dedicated R&D, raw material procurement and stability testing, and development adds 15–20 days to the schedule.'
    - icon: A
      icon_bg: green
      title: 'Active Ingredient & Raw Material'
      desc: 'Standard active ingredients run in pilot quantities, while proprietary or seasonal actives require dedicated procurement runs with their own raw material minimums from the synthesizer.'
    - icon: L
      icon_bg: purple
      title: 'Label Design & Packaging'
      desc: 'A basic label can be printed in small runs, while full-color regulatory labels with multi-language compliance text need plate-up and proofing, which raises the practical batch size.'
    - icon: B
      icon_bg: orange
      title: 'Branded Packaging'
      desc: 'Custom drums and retail containers carry an independent printing press minimum. Order fewer units and we store the surplus and release it across your scheduled shipments.'
    - icon: C
      icon_bg: blue
      title: 'Co-Formulant Packages'
      desc: 'Standard adjuvants and dispersants follow sub-tier supplier batches. Fully custom co-formulant systems follow their own production minimums and compatibility testing.'
    - icon: S
      icon_bg: green
      title: 'Season & Payment Scheduling'
      desc: 'Orders placed in the pre-season window get confirmed production slots. Staggered shipment schedules for 100+ ton programs are confirmed at contract, not after production.'

moq_timeline:
  tagline: End-to-End Timeline
  title: 'From Product Brief to Shipped Formulations: Day by Day'
  subtitle: 'The full schedule for a typical custom agrochemical program. Existing formulation platforms compress into the left side of this timeline; a bespoke formulation adds the development stage.'
  steps:
    - step: 'Day 0'
      title: 'Submit Your Product Brief'
      desc: 'Formulation type, target quantity, active ingredient, label requirements and packaging specifications. Engineering review is completed within one business day.'
    - step: 'Days 1–2'
      title: 'Engineering Review & Feasibility'
      desc: 'Our engineering team checks formulation feasibility, raw material availability and compliance path, and confirms whether the project fits existing platforms or needs new development.'
    - step: 'Days 3–7'
      title: 'Specification & Itemized Quotation'
      desc: 'You receive the full specification with MOQ calculation, lead time segments and itemized costs — including any development fees — before any commitment.'
    - step: 'Days 7–12'
      title: 'Sample Development (1–4 tons)'
      desc: 'Physical sample produced and tested: active content analysis, physical properties, label accuracy and packaging fit. Sample fees are credited toward the production order on sign-off.'
    - step: '+15–20 days'
      title: 'Custom Formulation Development (bespoke formulations only)'
      desc: 'Only for projects with a new formulation: R&D, raw material procurement, compatibility testing and stability trials are completed before volume production can start.'
    - step: '25–35 days'
      title: 'Production After Confirmed PO & Deposit'
      desc: 'Full production batches, branded packaging, label application and 100-point quality checklist. Every batch runs through active content analysis and accelerated stability testing.'
    - step: '100+ tons'
      title: 'Staggered Shipment Scheduling'
      desc: 'Large programs ship across scheduled batches to match seasonal demand, warehouse capacity and payment milestones.'
    - step: 'Day 0–90'
      title: 'Typical First-Order Horizon'
      desc: 'From brief to delivered first run: roughly 6–8 weeks using existing platforms, 8–12 weeks including custom formulation development. Multi-batch and container programs extend beyond that by design.'

expedite:
  tagline: Keep the Schedule Short
  title: 'What Keeps Lead Time Tight'
  subtitle: 'Three levers let you compress the timeline without changing the fundamentals of production physics.'
  features:
    - icon: S
      icon_bg: blue
      title: 'Samples Are Fast by Default'
      desc: 'Sample development takes 7–12 days on every project. Use the sample round to freeze your spec so production never waits on late label decisions.'
    - icon: P
      icon_bg: green
      title: 'Production Slots Are Confirmed Upfront'
      desc: 'Pre-season orders lock confirmed production slots. Multiple clients booking the same slot is exactly why earlier deposits get earlier lines.'
    - icon: T
      icon_bg: purple
      title: 'Transparent Stage Gates'
      desc: 'Every gate — sample approval, BOM freeze, label freeze, PO and deposit — is agreed at contract with a date. You always know which day the clock restarts.'

scenarios:
  tagline: Three Realistic Entry Points
  title: 'Which Route Fits Your Project?'
  subtitle: 'The same factory, three different ways in. Pick the scenario closest to your situation and use it when you contact us.'
  features:
    - icon: A
      icon_bg: orange
      title: 'Startup Brand: Validate Before You Commit'
      desc: 'Order 1–4 tons of sample first (7–12 days), test biological efficacy and field performance, then place a pilot order of 5 tons to test sell-through before any full run. Total first-season exposure stays under 10 tons.'
    - icon: B
      icon_bg: blue
      title: 'Distributor or Retailer: Pilot, Then Scale'
      desc: 'A pilot order of 5 tons with simplified packaging carries you through the pre-season. After sell-through data comes back, scale into standard 20+ ton runs with branded packaging.'
    - icon: C
      icon_bg: green
      title: 'Established Brand: Full-Custom Container Programs'
      desc: 'Existing brands order 20+ tons per batch with bespoke formulations and full regulatory labeling. Custom formulation development adds 15–20 days; 100+ ton programs ship on staggered schedules.'

moq_quality:
  tagline: QC & Compliance
  title: 'The Same Quality System at Every Order Size'
  subtitle: 'A 1-ton sample and a 100+ ton program run through the same quality gates and the same compliance documentation. "Low MOQ" never means "low standard".'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: C
      icon_bg: blue
      title: 'Compliance Documents, Any Scale'
      desc: 'ICAMA, ISO 9001, BSCI and FAO/WHO certification documentation is provided with every order — including single samples — with certificate numbers supplied on request.'
    - icon: A
      icon_bg: green
      title: '100-Point Quality Checklist'
      desc: 'Every batch passes the same 100-point quality checklist regardless of size: raw materials, active content, physical properties, labeling, packaging and fill weight checked line by line.'
    - icon: P
      icon_bg: purple
      title: 'Active Content & Stability Testing'
      desc: 'Every batch is analyzed for active ingredient content and undergoes accelerated stability testing at 54 °C / 14 days. A content deviation above ±5% triggers automatic rejection — the same gate for a sample and a container.'
    - icon: R
      icon_bg: orange
      title: 'Homogenization & Fill Verification'
      desc: 'High-shear mixing parameters and fill accuracy are verified against the approved reference sample before any production run starts.'
    - icon: B
      icon_bg: blue
      title: 'ERP Batch Traceability (10 Years)'
      desc: 'Every batch carries lot-numbered production records — raw materials, operators, tests and inspection results — retained for 10 years and available for audit.'
    - icon: I
      icon_bg: green
      title: 'Third-Party Inspection Ready'
      desc: 'Batch production is ready for third-party inspection at any stage. Most clients also run our 7-stage inspection system or a pre-shipment inspection on volume programs.'

moq_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About MOQ & Lead Time'
  items:
    - q: 'What is the minimum order quantity for a custom agrochemical formulation?'
      a: 'It depends on the stage of your project: samples are 1–4 tons, co-branding small bulk starts from lower quantities, trial and pilot orders run 5 tons on existing platforms, and standard volume production runs 20+ tons per production batch. Custom formulations run at the volume tier. We confirm the exact calculation for your configuration before quotation.'
    - q: 'How long does an agrochemical sample take?'
      a: 'Sample development takes 7–12 days. The sample verifies active content, physical properties, label accuracy and packaging fit. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - q: 'How long does production take after I confirm the order?'
      a: 'Production lead time is 25–35 days from confirmed PO and deposit. If your project includes a bespoke formulation, development adds 15–20 days of R&D before production begins.'
    - q: 'Is MOQ calculated per order, per formulation or per label version?'
      a: 'MOQ may apply per formulation, label version, packaging configuration or total order. Because different active ingredients and co-formulant systems come from distinct raw material batches, ordering 20 tons split across 4 formulations creates 4 separate production requirements. We confirm the calculation against your SKU matrix.'
    - q: 'Can I start with just 1–4 tons to test the market?'
      a: 'Yes. A 1–4 ton sample order is the cheapest possible validation: active content, physical properties and label accuracy are confirmed before any financial commitment to a run. From there you step up to a 5-ton pilot order for commercial validation.'
    - q: 'Can a 100+ ton program ship in multiple batches?'
      a: 'Yes. Large-scale programs can be scheduled as staggered shipments across production batches, so seasonal supply arrives when needed and cash flow and warehouse space stay manageable. Schedules are confirmed at contract, not after production.'

