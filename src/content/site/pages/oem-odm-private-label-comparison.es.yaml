ip_rules:
  tagline: 'Protección de propiedad intelectual'
  title: 'Cómo protegemos tus formulaciones y marca'
  subtitle: 'Independientemente del modelo de colaboración, tus diseños de etiqueta, archivos de formulación y documentos de especificación siguen siendo de tu propiedad.'
  body: |
    **NDA antes del intercambio de archivos.** Firmamos un acuerdo de confidencialidad antes de cualquier intercambio de archivos técnicos — plazo estándar de respuesta en 4 horas laborables.

    **Sin reutilización de formulaciones.** Tus diseños de etiqueta, archivos de formulación y documentos de especificación nunca se comparten ni se venden a otros clientes. Las formulaciones OEM son exclusivamente tuyas. Los diseños ODM son aprobados por ti antes de la producción. Las plataformas de Marca Privada son estructuras compartidas, pero tus diseños de etiqueta y marca son exclusivos.

    **Solo B2B.** Fabricamos exclusivamente bajo las marcas de nuestros clientes. No vendemos a consumidores finales y no competimos con nuestros clientes en ningún mercado.

    **Propiedad de la formulación.** Las formulaciones a medida pagadas por el comprador son propiedad del comprador. Las almacenamos y mantenemos, pero no podemos usarlas para otros clientes sin autorización escrita.

faqs:
  tagline: 'Preguntas frecuentes'
  title: 'Preguntas comunes sobre OEM, ODM y Marca Privada'
  items:
    - q: '¿Puedo pasar de marca privada a OEM más adelante?'
      a: 'Sí. Muchos clientes empiezan con un lote de marca privada o piloto para validar el mercado, luego invierten en desarrollo de formulación a medida para un programa OEM completo una vez demostrada la demanda. La misma planta y sistema de QC soporta ambas vías.'
    - q: '¿ODM significa que la fábrica es dueña de mi marca?'
      a: 'No. Bajo ODM, tú eres propietario de tu marca, diseños de etiqueta y embalaje. La fábrica desarrolla la formulación a partir de tu brief y tú apruebas antes de la producción. La fábrica retiene la PI del proceso de desarrollo, pero la especificación de producto aprobada es tuya.'
    - q: '¿Es la marca privada de menor calidad que OEM?'
      a: 'No. Las tres vías pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación. Los productos de marca privada se fabrican sobre plataformas probadas y validadas con ensayos completos de estabilidad, análisis de contenido y el mismo checklist de producción.'
    - q: '¿Qué tal si no estoy seguro de qué modelo elegir?'
      a: 'Contáctanos con tu situación — nuestro equipo de I+D recomendará la vía más práctica según tus requisitos de producto, plazo y objetivos de volumen. Sin compromiso antes de la revisión de especificaciones.'
    - q: '¿Puedo obtener muestras antes de comprometerme con algún modelo?'
      a: 'Sí. 1–4 toneladas de muestra de prototipo salen en 7–12 días. El coste de la muestra se descuenta del pedido de volumen. Esto te permite evaluar la composición y calidad antes de cualquier compromiso de volumen.'

