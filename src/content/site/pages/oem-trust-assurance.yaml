trust_steps:
  tagline: 'A Real Case Study'
  title: 'How a Latin American Distributor Verified Us Before Ordering'
  subtitle: 'Seven verification steps a crop protection distributor completed before placing a 50-ton herbicide order —the same checklist is open to you.'
  steps:
    - step: '01'
      title: 'Official Entity Verification'
      desc: 'The buyer requested the Chinese Business Registration and export trade license. The legal entity behind Agrospear is Qingdao Vatrad Group Co., Ltd., a manufacturer registered since 2012 in Qingdao, Shandong —verified via the national registry under NDA.'
    - step: '02'
      title: 'Physical Factory & Site Audit'
      desc: 'A factory audit (in person and via video walkthrough) confirmed the 12,500 m² plant: four specialized workshops, 350+ workers, eight formulation lines and a monthly output of about 1,500 tons. The audit report is filed with the contract records.'
    - step: '03'
      title: 'People: Real Engineers, Not Sales Scripts'
      desc: 'The buyer spoke directly with the formulation engineering team — R&D lab, production and QC. The project specification and NDA were exchanged within 4 business hours, and an engineering review came back within one business day.'
    - step: '04'
      title: 'Paper: QMS, Certificates & Third-Party Inspection'
      desc: 'ISO 9001:2015, ICAMA registration documentation, and the QMS SOPs were reviewed. The buyer scheduled an SGS pre-shipment inspection per ISO 2859-1 Level II on the first volume order —and received a Certificate of Conformance per batch.'
    - step: '05'
      title: 'Data: Test Records Per Batch Number'
      desc: 'The buyer audited actual test records: every batch analyzed for active ingredient content per HPLC/GC, physical property testing per FAO/WHO specifications, and 10-year ERP batch traceability. Sample QC records were provided before the order.'
    - step: '06'
      title: 'Contract Protection'
      desc: 'The order contract covered brand licensing, an agreed territory exclusivity period, formulation ownership and buyout terms, and defined the data and records that transfer with the order. The buyer approved the golden sample at the factory before production.'
    - step: '07'
      title: 'Ongoing Governance'
      desc: 'Quarterly business reviews with the Sales VP and Chief Engineer, a reserved right to audit during production, and an escalation path to the QA Director for any quality dispute. The agreement was jointly signed by the Sales VP, Chief Engineer and QA Director.'

trust_faqs:
  tagline: 'FAQ'
  title: 'The 12 Concerns Buyers Ask Before Ordering'
  items:
    - q: 'Is Agrospear really a factory, or a trading company?'
      a: 'Agrospear is the agrochemical manufacturing division of Qingdao Vatrad Group Co., Ltd. We operate the 12,500 m² plant in Qingdao ourselves — formulation, production, filling and testing happen in one facility. There are no trading-company handoffs: the people who answer your questions are the people who formulate your products.'
    - q: 'Who exactly will I deal with during my project?'
      a: 'A named project engineer and a named QC contact, plus the department heads who sign your documents. You can ask to speak with the Chief Engineer, the QA Director or the factory director directly —before and after the order. No account-manager layer sits between you and the people doing the work.'
    - q: 'Can I visit or audit the factory?'
      a: 'Yes. We host factory visits in the Laixi Economic Development Zone, Qingdao, and support remote audits with live video walkthroughs. Audits can be arranged independently (your inspector or a third party such as SGS, BV or Intertek) and the audit schedule can be written into the contract.'
    - q: 'Will you sign an NDA before I share my formulation specs?'
      a: 'Yes. Our standard NDA is signed within 4 business hours of your request, before any proprietary specification, artwork or technical file is shared. Bilingual (English/Chinese) versions are available, and the document is countersigned by the factory director.'
    - q: 'How do I know your quality claims are real?'
      a: 'Every claim on this site has a document behind it: QMS SOPs and inspection standards are downloadable, anonymized quality-record samples are published, and test data is logged per batch number with 10-year ERP traceability. You can also schedule a third-party pre-shipment inspection at your choice.'
    - q: 'What happens if my products arrive with quality issues?'
      a: 'Every batch is tested before packing, and batch-level records allow root-cause tracing per lot number. The contract defines inspection, replacement and rework obligations, and the QA Director signs the batch release. Reworked batches are re-tested in full —never partially checked.'
    - q: 'Can you really test 100% of batches before shipping?'
      a: 'Yes —and the records prove it. Every production batch undergoes full active ingredient analysis (HPLC/GC), physical property verification per FAO/WHO specifications, and accelerated stability testing. Test logs are linked to each batch number and are part of the batch documentation.'
    - q: 'What certifications do you actually hold?'
      a: 'ISO 9001:2015 quality management, ICAMA pesticide production license, ISO 14001 environmental management, plus BSCI compliance for the facility. Certificate numbers and audit records are supplied on request or during an audit —the list is published, not "available on request only".'
    - q: 'Will my brand be safe —formulation, labeling and market?'
      a: 'Yes. Your brand, formulations and labeling are protected by NDA, brand licensing terms and formulation ownership clauses written into the contract. Custom formulations are kept for the brand and transferable. Territory and exclusivity terms are agreed in writing before production starts.'
    - q: 'What is your real MOQ?'
      a: 'MOQ is project-specific and explained on our MOQ guide: sample batches 1–4 tons, co-branding from lower quantities, pilot batches 5 tons, and standard volume 20+ tons per batch. Custom formulation development runs at the volume tier. The calculation is confirmed before quotation —no vague "low MOQ" numbers.'
    - q: 'What happens if production is late?'
      a: 'Lead time is confirmed after specification, artwork and packaging review —never promised beforehand. The contract covers scheduling, delay notification and the resolution path, and the quarterly business review tracks delivery performance against the agreed calendar.'
    - q: 'Who signs the contract documents on your side?'
      a: 'Orders and agreements are jointly signed by the Sales VP, the Chief Engineer and the QA Director —the three people accountable for commercial terms, engineering execution and quality release respectively. You receive the signed documents with the contract records.'

governance:
  tagline: 'Accountability Structure'
  title: 'Named Signatories & Reserved Rights'
  subtitle: 'Every commitment is tied to a named role —not to a sales department.'
  body: |
    **Joint sign-off.** Orders, quality plans and dispute resolutions are signed by three roles: the Sales VP (commercial terms), the Chief Engineer (engineering execution) and the QA Director (quality release). Bilingual SOPs are version-controlled and carry the same signature structure.

    **Reserved rights.** The buyer retains the right to audit production, review test records and hold batch release until inspection sign-off. Rework only happens under an approved change record, and release is validated by independent QC —never by the rework operators.

    **Records that transfer.** Batch test logs, certificates of conformance and inspection reports are delivered with each shipment, and ERP batch traceability is kept for 5 years. Formulation records and technical files transfer with the project when the contract so provides.

