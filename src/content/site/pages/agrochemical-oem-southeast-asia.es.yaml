faqs:
  - question: '¿Agrospear proporciona documentación de registro para los mercados ASEAN?'
    answer: "Sí. Agrospear prepara documentación para los sistemas de registro nacional de los miembros de ASEAN, incluyendo el Departamento de Servicios Veterinarios (DVS) de Malasia, el Departamento de Agricultura (DOA) de Tailandia, la División de Control de Plaguicidas (PCD) de Filipinas y la División de Protección Vegetal bajo MARDI. Los expedientes incluyen datos ICAMA, especificaciones FAO/OMS, certificados de ingrediente activo, análisis de cinco lotes e informes de propiedades fisicoquímicas alineados con las directrices de Límites Máximos de Residuos de ASEAN."
  - question: '¿Qué formulaciones son eficaces contra el saltador pardo del arroz?'
    answer: "Para el control del saltador pardo (Nilaparvata lugens) en arroz, Agrospear recomienda formulaciones SC de pymetrozina o dinotefurano para derribe rápido, formulaciones WDG de buprofezina para supresión del estadio ninfal, y formulaciones EC de etiprol o isoprocarb como socios de rotación en programas de manejo de resistencia. Las formulaciones FS de tratamiento de semilla de clothianidin proporcionan protección temprana en sistemas de siembra directa comunes en el Sudeste Asiático."
  - question: '¿Puede Agrospear formular para el manejo de enfermedades de la palma aceitera?'
    answer: "Sí. Aunque la pudrición basal del tallo por Ganoderma no tiene tratamiento curativo, Agrospear fabrica formulaciones SC y WP a base de hexaconazol y benomilo para programas profilácticos de riego al suelo e inyección al tronco. Para insectos plaga de la palma aceitera — escarabajo rinoceronte (Oryctes rhinoceros) y bagworms — Agrospear ofrece formulaciones EC y ME de cipermetrina y clorantraniliprol con sistemas adyuvantes resistentes a la lluvia adaptados a entornos de plantación de alta precipitación."
  - question: '¿Cuánto tarda el envío a puertos del Sudeste Asiático?'
    answer: "El flete marítimo desde Qingdao a Singapur, Bangkok o Yakarta suele tardar de 2 a 3 semanas. Los servicios directos a Port Klang y Laem Chabang son las rutas más rápidas. La entrega DDP incluye despacho de aduanas y transporte terrestre. También se disponen términos FOB Qingdao y CIF."
  - question: '¿Qué pruebas de calidad se realizan para formulaciones de clima tropical?'
    answer: "Todas las formulaciones se someten a pruebas de estabilidad acelerada a 54°C durante 14 días según CIPAC MT 46, confirmando el contenido de ingrediente activo, las propiedades físicas y la estabilidad de emulsión tras almacenamiento tropical simulado. Pruebas adicionales de ciclos térmicos entre 0°C y 50°C validan escenarios de interrupción de la cadena de frío. Pruebas de suspensibilidad, vertibilidad y espuma persistente se realizan en cada lote SC y WDG para asegurar el rendimiento en el tanque de pulverización bajo condiciones de campo de temporada monzónica."
body: |
  <h2>Complejos Plaga-Enfermedad Dominantes del Sudeste Asiático</h2>
  <p>El Sudeste Asiático produce más de 200 millones de toneladas de arroz anualmente, y el saltador pardo (Nilaparvata lugens) sigue siendo la plaga más destructiva — causando quemadura por salto que puede destruir un cultivo entero en días cuando las poblaciones se disparan. La piricularia del arroz (Magnaporthe oryzae) y la pudrición de la vaina (Rhizoctonia solani) añaden una merma crónica de rendimiento en Vietnam, Tailandia, Indonesia y Filipinas. La palma aceitera, que abarca más de 20 millones de hectáreas solo en Indonesia y Malasia, enfrenta la pudrición basal del tallo por Ganoderma — una enfermedad letal sin tratamiento curativo que mata progresivamente las plantaciones maduras. La marchitez Fusarium del banano Raza Tropical 4 se ha extendido por el Delta del Mekong y Mindanao, amenazando la producción de exportación Cavendish. La antracnosis del mango (Colletotrichum gloeosporioides) limita la calidad de la fruta en Tailandia y Filipinas. Las plataformas de formulación de Agrospear están construidas para estas presiones exactas, con sistemas adyuvantes resistentes a la lluvia, ingredientes activos estables a los UV y empaques de grado tropical.</p>

  <h2>Alineación Regulatoria ASEAN y Registro Nacional</h2>
  <p>El Grupo de Trabajo Sectorial de ASEAN sobre Cultivos ha desarrollado directrices armonizadas para los requisitos de datos de registro de plaguicidas y Límites Máximos de Residuos, pero la implementación sigue a nivel nacional. El Departamento de Servicios Veterinarios (DVS) de Malasia bajo la Ley de Plaguicidas de 1974 requiere registro separado para cada formulación y claim de etiqueta. El DOA de Tailandia bajo la Ley de Sustancias Peligrosas procesa registros a través de una revisión de comité que promedia 12–18 meses. La Autoridad de Fertilizantes y Plaguicidas de Filipinas procesa a través de la PCD con un marco de requisitos de datos alineado con las directrices FAO/OMS. El Departamento de Protección Vegetal de Vietnam registra bajo la Circular 21/2015/TT-BNNPTNT con requisitos específicos de datos de estabilidad para formulaciones tropicales. Agrospear prepara documentación de registro dirigida a cada vía nacional, con datos ICAMA, especificaciones FAO/OMS e informes de análisis de cinco lotes formateados para la plantilla de expediente de la autoridad nacional específica.</p>

  <h2>Experiencia en Formulación para la Agricultura Monzónica</h2>
  <p>La instalación de 20.000 m² de Agrospear produce formulaciones diseñadas para el ciclo monzónico húmedo-seco del Sudeste Asiático. Las formulaciones SC con alta suspensibilidad y agentes anti-sedimentación aseguran una aplicación uniforme de pulverización incluso tras el almacenamiento en almacenes de plantación sin aire acondicionado. Las formulaciones ME y CS microencapsuladas proporcionan liberación sostenida bajo lluvia intensa — una ventaja crítica en la pulverización de plantaciones de palma aceitera y caucho durante la temporada monzónica. Los gránulos WDG dispersables en agua eliminan la exposición al polvo para los agricultores de arroz que aplican con mochila de pulverización en arrozales inundados. Las formulaciones EC con paquetes emulsionantes optimizados resisten el lavado durante la ventana de 4–6 horas de resistencia a la lluvia que exige la programación monzónica. Cada lote se prueba para suspensibilidad (CIPAC MT 15), estabilidad de emulsión (CIPAC MT 36) y espuma persistente (CIPAC MT 47) — benchmarks de calidad que aseguran el rendimiento en el campo cuando las condiciones de pulverización distan mucho de ser ideales.</p>

