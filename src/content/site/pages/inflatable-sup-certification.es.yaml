meta:
  title: "Certificación de Formulación Agroquímica — Guía de ICAMA, FAO/OMS, ISO 9001 y conformidad"
  description: "Alcance de certificación para fabricación de formulaciones agroquímicas: ICAMA, FAO/OMS, BSCI, ISO 9001, trazabilidad por lote. Números de certificado disponibles por proyecto."
  dateModified: "2026-08-20"

sections:
  - title: "Respuesta directa"
    directAnswer:
      answer: "Agrospear posee certificaciones BSCI, ISO 9001 e ICAMA, y prepara documentación FAO/OMS por proyecto. ICAMA es obligatorio para fabricación y exportación desde China; FAO/OMS se prepara según el mercado de destino."
      condition: "El alcance varía según mercado objetivo y configuración del producto. Números y validez disponibles por proyecto."
      value: "BSCI · ISO 9001 · ICAMA · FAO/OMS · Trazabilidad por Lote"
      verifiedDate: "2026-08-20"
      sourceType: "certificate"
    body: |
      La certificación debe indicarse con precisión. Afirmaciones genéricas como "FAO/OMS en todos los productos" pueden generar desconfianza si el comprador descubre que el alcance es más limitado.

      | Certificación | Alcance | Autoridad | Aplica a |
      |---------------|---------|-----------|----------|
      | BSCI | Auditoría de responsabilidad social | amfori BSCI | Instalación de fabricación |
      | ISO 9001 | Sistema de gestión de calidad | Organismo certificador | Instalación de fabricación |
      | ICAMA | Registro de agroquímicos China | Ministerio de Agricultura | Todas las formulaciones fabricadas |
      | FAO/OMS | Especificaciones de plaguicidas | FAO/OMS | Formulaciones según mercado de destino |
      | Trazabilidad por Lote | Registros de producción y análisis | Interno | Todos los lotes de producción |
evidence_review:
  tagline: 'Evidencia y verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricación en esta página son verificadas por nuestro equipo de ingeniería de fabricación en la planta de Laixi, Qingdao. Certificados, registros de inspección QC, informes de análisis de contenido y estabilidad, y registros de trazabilidad por lote están disponibles a petición. Especificaciones verificadas por última vez 2026-08.'
