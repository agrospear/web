role_boundary:
  tagline: 'Qué somos — y qué no somos'
  title: 'Una fábrica verificable, nunca una afirmación que debas tomar al pie de la letra'
  subtitle: 'La diferencia entre una fábrica y una mesa comercial es simple: detrás de cada afirmación hay un documento, una persona o una máquina.'
  features:
    - icon: A
      icon_bg: blue
      title: 'Qué somos — un fabricante verificable'
      desc: '· Una entidad legal registrada: Qingdao Vatrad Group Co., Ltd. — datos del registro compartidos bajo NDA o durante la auditoría · Una fábrica física: 20.000 m² en la Zona de Desarrollo Económico de Laixi, Qingdao, con 4 talleres especializados, 200+ trabajadores y 8 líneas de formulación automatizadas · Un equipo de fabricación: las personas que responden tus preguntas son las que formulan tus productos · Documentos reales: SOP de QMS, estándares de inspección y registros de calidad anonimizados descargables · Verificación independiente bienvenida: inspecciones SGS, BV o Intertek a tu elección, según ISO 2859-1 Nivel II'
      link: /es/manufacturing/factory'
      link_label: 'Visita la página de la fábrica'
    - icon: B
      icon_bg: green
      title: 'Qué no somos — el perfil de mesa comercial'
      desc: '· Sin trading: no reenviamos tu pedido a una tercera fábrica ni añadimos márgenes de intermediario · Sin marca propia sobre tus productos: tú eres dueño de la marca, el mercado y el cliente · Sin mínimos vagos: el MOQ se calcula a partir de los requisitos de lote de formulación y se confirma por proyecto · Sin certificados "solo bajo petición": la lista está publicada y los registros de auditoría se pueden revisar · Sin afirmaciones solo verbales: contenido de ingrediente activo, datos de estabilidad y trazabilidad documentados por número de lote'
      link: /es/oem-moq-guide'
      link_label: 'Consulta la guía MOQ transparente'

trust_steps:
  tagline: 'Un caso real'
  title: 'Cómo nos verificó un distribuidor latinoamericano antes de pedir'
  subtitle: 'Siete pasos de verificación que completó un distribuidor de protección de cultivos antes de realizar un pedido de 50 toneladas de herbicida — la misma lista de verificación está abierta para ti.'
  steps:
    - step: '01'
      title: 'Verificación oficial de la entidad'
      desc: 'El comprador solicitó el Registro Mercantil chino y la licencia de comercio exterior. La entidad legal detrás de Agrospear es Qingdao Vatrad Group Co., Ltd., fabricante registrado desde 2012 en Qingdao, Shandong — verificado en el registro nacional bajo NDA.'
    - step: '02'
      title: 'Auditoría física de la fábrica'
      desc: 'Una auditoría de fábrica (presencial y por videollamada) confirmó la planta de 20.000 m²: cuatro talleres especializados, 200+ trabajadores, ocho líneas de formulación y una producción mensual de unas 1.500 toneladas. El informe de auditoría queda archivado con los registros del contrato.'
    - step: '03'
      title: 'Personas: ingenieros reales, no guiones de venta'
      desc: 'El comprador habló directamente con el equipo de ingeniería de formulación — laboratorio de I+D, producción y QC. La especificación del proyecto y el NDA se intercambiaron en 4 horas laborables, y la revisión de ingeniería llegó en un día laborable.'
    - step: '04'
      title: 'Papel: QMS, certificados e inspección de terceros'
      desc: 'Se revisaron ISO 9001:2015, documentación de registro ICAMA y los SOP de QMS. El comprador programó una inspección pre-embarque SGS según ISO 2859-1 Nivel II en el primer pedido de volumen — y recibió un Certificado de Conformidad por lote.'
    - step: '05'
      title: 'Datos: registros de ensayo por número de lote'
      desc: 'El comprador auditó registros de ensayo reales: cada lote analizado por contenido de ingrediente activo mediante HPLC/GC, ensayo de propiedades físicas según especificaciones FAO/OMS y trazabilidad ERP de lote de 5 años. Se entregaron registros de QC de muestra antes del pedido.'
    - step: '06'
      title: 'Protección contractual'
      desc: 'El contrato cubrió licencia de marca, un periodo acordado de exclusividad territorial, titularidad y compra de la formulación, y definió los datos y registros que se transfieren con el pedido. El comprador aprobó la muestra dorada en la fábrica antes de la producción.'
    - step: '07'
      title: 'Gobernanza continua'
      desc: 'Revisiones trimestrales de negocio con el VP de Ventas y el Ingeniero Jefe, derecho reservado a auditar durante la producción y una vía de escalado al Director de QA para cualquier disputa de calidad. El acuerdo fue firmado conjuntamente por el VP de Ventas, el Ingeniero Jefe y el Director de QA.'

trust_faqs:
  tagline: 'FAQ'
  title: 'Las 12 preguntas que hacen los compradores antes de pedir'
  items:
    - q: '¿Agrospear es realmente una fábrica o una empresa comercial?'
      a: 'Agrospear es la división de fabricación agroquímica de Qingdao Vatrad Group Co., Ltd. Operamos nosotros mismos la planta de 20.000 m² en Qingdao — formulación, producción, llenado y ensayos ocurren en una sola instalación. No hay intermediarios: las personas que responden tus preguntas son las que formulan tus productos.'
    - q: '¿Con quién exactamente trataré durante mi proyecto?'
      a: 'Con un ingeniero de proyecto designado y un contacto de QC designado, además de los jefes de departamento que firman tus documentos. Puedes pedir hablar directamente con el Ingeniero Jefe, el Director de QA o el director de fábrica — antes y después del pedido. Ninguna capa de gestores de cuenta se interpone entre tú y las personas que hacen el trabajo.'
    - q: '¿Puedo visitar o auditar la fábrica?'
      a: 'Sí. Organizamos visitas a la fábrica en la Zona de Desarrollo Económico de Laixi, Qingdao, y apoyamos auditorías remotas con recorridos en vivo por videollamada. Las auditorías pueden organizarse de forma independiente (tu inspector o un tercero como SGS, BV o Intertek) y el calendario de auditoría puede escribirse en el contrato.'
    - q: '¿Firmaréis un NDA antes de que comparta mis especificaciones de formulación?'
      a: 'Sí. Nuestro NDA estándar se firma en 4 horas laborables desde tu solicitud, antes de compartir cualquier especificación, arte o archivo técnico patentado. Hay versiones bilingües (inglés/chino) y el documento está contrafirmado por el director de fábrica.'
    - q: '¿Cómo sé que vuestras afirmaciones de calidad son reales?'
      a: 'Cada afirmación de este sitio tiene un documento detrás: los SOP de QMS y los estándares de inspección son descargables, se publican muestras anonimizadas de registros de calidad y los datos de ensayo se registran por número de lote con trazabilidad ERP de lotes de 5 años. También puedes programar una inspección pre-embarque de terceros a tu elección.'
    - q: '¿Qué pasa si mis productos llegan con problemas de calidad?'
      a: 'Cada lote se prueba antes del embalaje y los registros por lote permiten rastrear la causa raíz por número de lote. El contrato define las obligaciones de inspección, sustitución y retrabajo, y el Director de QA firma la liberación del lote. Los lotes retrabajados se vuelven a probar por completo — nunca de forma parcial.'
    - q: '¿Podéis probar realmente el 100% de los lotes antes de enviar?'
      a: 'Sí — y los registros lo demuestran. Cada lote de producción se somete a análisis completo de ingrediente activo (HPLC/GC), verificación de propiedades físicas según especificaciones FAO/OMS y ensayo de estabilidad acelerada. Los registros de ensayo se vinculan a cada número de lote y forman parte de la documentación del lote.'
    - q: '¿Qué certificaciones tenéis realmente?'
      a: 'Gestión de calidad ISO 9001:2015, licencia de producción de pesticidas ICAMA, gestión ambiental ISO 14001 y cumplimiento BSCI de la instalación. Los números de certificado y los registros de auditoría se entregan bajo petición o durante una auditoría — la lista está publicada, no es "solo disponible bajo petición".'
    - q: '¿Mi marca estará a salvo — formulación, etiquetado y mercado?'
      a: 'Sí. Tu marca, formulaciones y etiquetado quedan protegidos por NDA, términos de licencia de marca y cláusulas de titularidad de formulación escritas en el contrato. Las formulaciones personalizadas se conservan para la marca y son transferibles. Los términos de territorio y exclusividad se acuerdan por escrito antes de la producción.'
    - q: '¿Cuál es vuestro MOQ real?'
      a: 'El MOQ es específico de cada proyecto y se explica en nuestra guía de MOQ: lotes de muestra de 1–4 toneladas, co-branding desde cantidades menores, lotes piloto de 5 toneladas y volumen estándar de 20+ toneladas por lote. El desarrollo de formulación personalizada se ejecuta en el nivel de volumen. El cálculo se confirma antes de cotizar — sin números "MOQ bajo" vagos.'
    - q: '¿Qué pasa si la producción se retrasa?'
      a: 'El plazo de entrega se confirma después de revisar especificación, arte y embalaje — nunca se promete de antemano. El contrato cubre la programación, la notificación de retrasos y la vía de resolución, y la revisión trimestral de negocio hace seguimiento del cumplimiento de entregas frente al calendario acordado.'
    - q: '¿Quién firma los documentos del contrato por vuestra parte?'
      a: 'Los pedidos y acuerdos se firman conjuntamente por el VP de Ventas, el Ingeniero Jefe y el Director de QA — las tres personas responsables respectivamente de los términos comerciales, la ejecución de ingeniería y la liberación de calidad. Recibes los documentos firmados con los registros del contrato.'

governance:
  tagline: 'Estructura de responsabilidad'
  title: 'Firmantes designados y derechos reservados'
  subtitle: 'Cada compromiso está vinculado a un rol designado — no a un departamento de ventas.'
  body: |
    **Firma conjunta.** Los pedidos, planes de calidad y resoluciones de disputas se firman por tres roles: el VP de Ventas (términos comerciales), el Ingeniero Jefe (ejecución de ingeniería) y el Director de QA (liberación de calidad). Los SOP bilingües están controlados por versión y llevan la misma estructura de firmas.

    **Derechos reservados.** El comprador conserva el derecho de auditar la producción, revisar los registros de ensayo y retener la liberación del lote hasta la firma de la inspección. El retrabajo solo ocurre bajo un registro de cambio aprobado, y la liberación la valida QC independiente — nunca los operadores del retrabajo.

    **Registros que se transfieren.** Los registros de ensayo por lote, los certificados de conformidad y los informes de inspección se entregan con cada envío, y la trazabilidad ERP de lotes se conserva durante 5 años. Los registros de formulación y los archivos técnicos se transfieren con el proyecto cuando el contrato lo establece.

