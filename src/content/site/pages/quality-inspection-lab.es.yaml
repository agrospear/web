answer:
  label: 'Respuesta directa'
  text: 'Cada lote se inspecciona contra las especificaciones publicadas antes del envío: análisis de contenido de ingrediente activo al 100 % por HPLC/GC, verificación de propiedades físicas (tamaño de partícula, viscosidad, pH, tasa de suspensión) y ensayos de estabilidad acelerada según especificaciones FAO/OMS. El laboratorio informa al director general, no a producción, y puede detener cualquier envío.'
  verified: '2026-08'

intro: 'Todo lote que sale de nuestra instalación lleva la certificación de haber superado un conjunto definido de inspecciones de calidad y ensayos analíticos. Nuestro Laboratorio de Calidad e Inspección es una función independiente dentro de la organización — informa directamente al director general, no a producción — de modo que ninguna presión comercial pueda comprometer el punto de inspección. Si un lote de materia prima o un producto terminado no cumple la especificación publicada, el laboratorio tiene autoridad para detener el envío hasta que la no conformidad quede resuelta.'

content_html: |
  <h2>Confiar, pero verificar</h2>
  <p>El laboratorio opera con un sistema de gestión de calidad alineado con los principios de la ISO 9001, y nuestros métodos de ensayo se basan en las normas FAO/OMS, CIPAC, ISO y ASTM siempre que son aplicables. Mantenemos registros detallados de cada ensayo realizado, creando una cadena de trazabilidad completa desde la recepción de la materia prima hasta la entrega final del producto.</p>

  <h2>Equipo de ensayo y capacidades</h2>
  <table>
    <thead><tr><th>Equipo</th><th>Ensayos realizados</th><th>Norma / Método</th></tr></thead>
    <tbody>
      <tr><td>Sistema HPLC (detector UV/DAD)</td><td>Contenido de ingrediente activo, perfil de impurezas, productos de degradación</td><td>Métodos CIPAC, espec. FAO/OMS</td></tr>
      <tr><td>Sistema GC (detector FID/ECD)</td><td>Contenido de ingrediente activo (IA volátil), análisis de residuos de solventes</td><td>Métodos CIPAC, protocolos internos</td></tr>
      <tr><td>Analizador láser de tamaño de partícula</td><td>Distribución de tamaño de partícula (D50, D90, span), tamaño de gota para EC/ME</td><td>ISO 13320, CIPAC MT 187</td></tr>
      <tr><td>Viscosímetro rotacional</td><td>Viscosidad a tasas de cizalla especificadas, caracterización de curva de flujo</td><td>CIPAC MT 172, ISO 2555</td></tr>
      <tr><td>pH-metro (calibrado)</td><td>pH de la dilución acuosa al 1%, pH de la formulación</td><td>CIPAC MT 75.3</td></tr>
      <tr><td>Cámaras de estabilidad (0 °C, 25 °C, 54 °C)</td><td>Estabilidad de almacenamiento acelerada, estabilidad en frío, estimación de vida útil</td><td>CIPAC MT 46, directrices FAO/OMS</td></tr>
      <tr><td>Densímetro digital</td><td>Densidad y gravedad específica de formulaciones líquidas</td><td>CIPAC MT 3.2, ISO 758</td></tr>
      <tr><td>Equipo de ensayo de tasa de suspensión</td><td>Suspensibilidad de formulaciones SC y WP tras 30 min de reposo</td><td>CIPAC MT 184, MT 15</td></tr>
      <tr><td>Kit de ensayo de estabilidad de emulsión</td><td>Estabilidad de emulsión de formulaciones EC y ME (reemulsificación, cremado)</td><td>CIPAC MT 36, MT 41</td></tr>
      <tr><td>Probador de dispersibilidad en agua</td><td>Mojabilidad y dispersibilidad de formulaciones WP y WDG</td><td>CIPAC MT 53.3, MT 174</td></tr>
      <tr><td>Equipo de ensayo de espuma persistente</td><td>Persistencia de espuma tras mezcla en simulación de tanque de pulverización</td><td>CIPAC MT 47.2</td></tr>
    </tbody>
  </table>

  <h2>Los puntos de inspección — del material a la entrega</h2>
  <p>Cada lote sigue un plan de calidad definido con puntos de inspección obligatorios. Ningún lote puede saltarse un control; cada control debe ser firmado por un inspector de calidad antes de que comience la siguiente fase de producción.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspección del material entrante</p>
            <p class="text-xs text-gray-500 mt-1">Ingrediente activo de calidad técnica, lote de coformulante, lote de solvente — todo se comprueba contra la especificación de entrada y el COA antes de liberarlo a la producción.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Control de formulación en proceso</p>
            <p class="text-xs text-gray-500 mt-1">La primera muestra de lote se ensaya (contenido + propiedades físicas) al inicio de cada turno de producción.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Análisis del producto terminado</p>
            <p class="text-xs text-gray-500 mt-1">Análisis completo: contenido de ingrediente activo por HPLC/GC, tamaño de partícula, viscosidad, pH, tasa de suspensión. Cualquier parámetro fuera de los límites de especificación se rechaza automáticamente. Los datos se registran por número de lote.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspección previa a la entrega</p>
            <p class="text-xs text-gray-500 mt-1">Lote completo inspeccionado: integridad del sello del bidón, exactitud de la etiqueta, pictogramas de peligro, sin defectos cosméticos. Lista de comprobación de 100 puntos.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Certificación final</p>
            <p class="text-xs text-gray-500 mt-1">Se compilan los informes de ensayo, se revisan los registros de inspección y se emite el Certificado de Análisis.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Controles estándar en cada lote</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">HPLC/GC</span>
      <span class="text-xs text-gray-500">Contenido de ingrediente activo, cada lote</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&plusmn; espec.</span>
      <span class="text-xs text-gray-500">Cualquier parámetro fuera de límites dispara el rechazo automático</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Lotes analizados antes de la liberación</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 9001</span>
      <span class="text-xs text-gray-500">Sistema de gestión de calidad</span>
    </div>
  </div>

  <h2>Nuestro equipo de calidad</h2>
  <p>El laboratorio cuenta con un responsable de calidad (10 años en control de calidad agroquímica, Ingeniero de Calidad Certificado ASQ), dos inspectores de calidad (cada uno con certificación en química analítica y ensayos de formulación) y un químico analítico responsable de todos los ensayos HPLC/GC y físicos. El equipo se somete anualmente a pruebas de competencia con un proveedor externo independiente para garantizar que nuestros resultados sigan siendo precisos y reproducibles.</p>

  <h2>Ensayos independientes para clientes</h2>
  <p>Nuestro Laboratorio de Calidad e Inspección está disponible para servicios de ensayos independientes. Si necesitas verificar una especificación de materia prima, validar un nuevo sistema de coformulantes u obtener un informe de ensayo de terceros para una cualificación de compra, podemos realizar los ensayos conforme a la norma aplicable y emitir un informe de ensayo certificado.</p>
  <p>Ejemplos de trabajos recientes de ensayos para terceros:</p>
  <ul>
    <li>Comparación del contenido de ingrediente activo de cinco materias primas competitivas de calidad técnica para un programa europeo de compras.</li>
    <li>Estudio de estabilidad acelerada (54 °C + ciclado térmico) de una nueva formulación SC fungicida con múltiples ingredientes activos, con mediciones intermedias regulares a intervalos de 7 días.</li>
    <li>Validación de la distribución de tamaño de partícula de 50 lotes piloto para una nueva formulación WDG herbicida.</li>
  </ul>

  <h2>Nuestro compromiso contigo</h2>
  <p>Cuando recibes un envío de Agrospear, también recibes su expediente de calidad — un registro recopilado de los resultados de ensayo que se aplican a tu lote concreto. COA de materia prima, análisis de contenido por HPLC/GC, resultados de propiedades físicas y lista de comprobación de la inspección previa a la entrega. Cada cifra es trazable. Cada inspector está identificado. No es solo papeleo: es nuestra promesa de que lo que entregamos es exactamente lo que especificamos.</p>
  <p>Si alguna vez tienes una duda de calidad, puedes contactar directamente con el laboratorio — los datos de contacto figuran impresos en tu Certificado de Análisis. Nos tomamos cada consulta en serio y nos comprometemos a abrir una investigación formal en un plazo de 48 horas.</p>

  <h2>¿Qué ocurre si un lote no supera la inspección?</h2>
  <p>Un lote no conforme nunca desaparece en silencio. El laboratorio sigue un flujo de no conformidad fijo para contener, corregir y evitar que el problema se repita:</p>
  <ul>
    <li><strong>Aislamiento</strong> — el lote se etiqueta, se retira de la línea y se registra en el registro de no conformidades con el nombre del inspector y los criterios no superados.</li>
    <li><strong>Reparación o desecho</strong> — los defectos reparables (por ejemplo, tamaño de partícula, viscosidad) los corrige un operario certificado y el lote reparado se vuelve a ensayar con el mismo estándar. Los lotes que no pueden cumplir la especificación se desechan, no se degradan.</li>
    <li><strong>Reinspección</strong> — cada lote reparado vuelve a pasar el control afectado completo antes de reincorporarse a la línea de embalaje.</li>
    <li><strong>Liberación</strong> — solo salen de la planta los lotes con todos los controles firmados. La tasa de rechazo, la causa raíz y la acción correctiva se resumen en tu informe de calidad del lote.</li>
  </ul>

  <h2>Documentación de calidad que recibes</h2>
  <p>Cada lote se envía con un paquete documental que tu equipo de control de calidad puede auditar: Certificado de Análisis (números de lote de materias primas, contenido de ingrediente activo, propiedades físicas), registros de ensayo HPLC/GC por número de lote, la lista firmada de 100 puntos de la inspección previa a la entrega, lista de embalaje y registro fotográfico de tus bidones antes de la carga.</p>

