how_to_choose:
  title: How to Choose the Right Formulation
  cards:
    - title: SC vs EC
      description: Choose SC for solid actives requiring low dust and high suspensibility (herbicides, fungicides). Choose EC for liquid or soluble actives needing fast crop uptake (insecticides). SC is water-based and safer to handle; EC has superior foliar penetration.
    - title: WP vs WDG
      description: Choose WP for established registrations and lowest production cost. Choose WDG for premium positioning with dust-free granule handling, accurate dosing, and better operator safety. WDG commands a price premium in most markets.
    - title: SL vs FS
      description: Choose SL for water-soluble herbicide actives (glyphosate, paraquat) applied at high spray volumes. Choose FS for seed treatment applications requiring film-forming polymers, colourants, and low-dust application to seed.

