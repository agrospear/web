  title: Formulation Selector
  subtitle: Formulation types, specifications, and recommended uses for every Agrospear product.

categories:
  sc: Suspension Concentrates (SC) — stable aqueous suspensions of solid active ingredients. Low dust, high safety, excellent tank-mix compatibility. Ideal for foliar application.
  ec: Emulsifiable Concentrates (EC) — solvent-based formulations that form stable emulsions on dilution. Fast uptake, broad-spectrum efficacy. Ideal for insecticides and systemic action.
  wp_wdg: Wettable Powders (WP) and Water-Dispersible Granules (WDG) — solid formulations for low-cost, high-active-content delivery. WP for speed of production; WDG for dust-free handling.
  sl_fs: Soluble Liquids (SL) and Flowable Seed Treatments (FS) — fully soluble or flowable formulations. SL for water-soluble actives; FS for seed treatment with film-forming and colourant.

