meta:
  title: 'Agrochemical Certification Guide | ICAMA & FAO/WHO Compliance | OEM Supplier | {SITE}'
  description: "Certification scope for agrochemical manufacturing: ICAMA registration, FAO/WHO specifications, ISO 9001, BSCI. Certificate details available per project on request."
  dateModified: "2026-08-20"
  keywords:
    - 'agrochemical certification'
    - 'ICAMA registration'
    - 'FAO WHO compliance'
    - 'pesticide quality standard'

sections:
  - title: "Direct Answer"
    directAnswer:
      answer: "Agrospear holds ISO 9001, BSCI and supports ICAMA registration and FAO/WHO specification compliance. ICAMA registration applies to products destined for the Chinese market — not universally 'all products'."
      condition: "Certification scope varies by target market and product configuration. Certificate numbers, validity and issuing authorities are available per project on request."
      value: "ISO 9001 · BSCI · ICAMA · FAO/WHO · Batch Traceability"
      verifiedDate: "2026-08-20"
      sourceType: "certificate"
    body: |
      Certification is a key procurement concern and must be stated precisely.
      Blanket claims like "ICAMA on all products" can create trust issues if a buyer
      later discovers the scope is narrower than expected.

  - title: "Certification details"
    body: |
      | Certification | Scope | Authority | Applies to |
      |---------------|-------|-----------|------------|
      | ISO 9001 | Quality management system | Certifying body (available on request) | Manufacturing facility |
      | BSCI | Social responsibility audit | amfori BSCI | Manufacturing facility |
      | ICAMA | Chinese pesticide registration | Ministry of Agriculture, PRC | Products destined for Chinese market |
      | FAO/WHO | International quality specifications | FAO/WHO | Applicable agrochemical products per market |
      | Batch Traceability | Production records & test reports | Internal QA system | Every production batch |

  - title: "Important scope notes"
    body: |
      - **ICAMA** registration applies to products configured for Chinese market sale. A product built for
        US or African distribution does not carry ICAMA registration unless specifically requested.
      - **ISO 9001** covers the manufacturing facility's quality management system, not individual
        product certification.
      - **FAO/WHO** specification compliance covers product quality benchmarks — documentation available for
        importers who must register products in destination countries.
      - Certificate numbers, validity dates and issuing authorities are available per project on
        request. We do not publish certificate numbers publicly for security reasons.
      - Third-party inspection available through SGS, TÜV, BV or Intertek for any shipment.

  - title: "How to request certification documents"
    body: |
      During the inquiry process, specify your target markets and we will confirm which
      certifications apply to your specific product configuration. Certificate copies
      (with redacted commercial details where needed) are provided as part of the
       project documentation package.

