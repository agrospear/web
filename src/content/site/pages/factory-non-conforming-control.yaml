hero:
  tagline: Non-Conforming Product Control
  title: Isolation, Rework & Re-Inspection Process for Non-Conforming Products
  subtitle: 'At QINGDAO VATRAD GROUP.,LTD., a non-conforming batch never flows on. Any product or component that fails the defined acceptance criteria is identified, recorded against a Non-Conformance Report (NCR), labelled and segregated, assessed for affected scope, and dispositioned at the right authority level. Permitted rework follows controlled instructions, corrected items are re-inspected against the original acceptance criteria — including complete re-testing where required — and product ships only after authorized quality sign-off. This page presents our controlled standard under ISO 9001:2015 Clause 8.7 and the traceability evidence behind it.'
  actions:
    - text: Download NCP Control SOP (PDF)
