nc_severity:
  tagline: Defect Severity & Authority
  title: Severity Classification & Disposition Authority
  subtitle: Not every non-conformance is handled at the same level — disposition authority scales with defect severity, from line-level sign-off to Material Review Board and customer concession.
  headers:
    severity: Severity
    examples: Typical Examples
    authority: Disposition Authority & Control
    control: Release Condition
  rows:
    - severity: 'Minor'
      examples: 'Carton corner crease, slight non-critical label misalignment'
      authority: 'Section QC lead + line supervisor on-site sign-off, replace or release'
      control: 'Recorded on the NCR; no impact on product function or customer requirements'
    - severity: 'Major'
      examples: 'Active content below specification, suspensibility out of range, missing accessory'
      authority: 'QC Manager + Technical Engineer issue a controlled rework instruction (SRI)'
      control: '100% independent re-test of the original failed and affected characteristics before release'
    - severity: 'Critical'
      examples: 'Wrong active ingredient, formulation contamination, customer label misprint or concentration deviation'
      authority: 'Material Review Board (MRB) decision; written customer concession where required'
      control: 'No release without authorized concession; otherwise mandatory witnessed physical destruction'

nc_matrix:
  tagline: Engineering Protocol Matrix
  title: Agrochemical Defect Disposition & Re-Inspection Matrix
  subtitle: Standard engineering protocols applied to the most common manufacturing deviations — the same quantified parameters customers can verify during audits.
  headers:
    defect: Defect Category
    protocol: Controlled Disposition Protocol
    validation: Independent Re-Inspection & Validation
  rows:
    - defect: 'Active Content Below Specification'
      protocol: 'Isolate the batch. Re-analyze by HPLC/GC with duplicate injections. If confirmed low, evaluate raw material lot and compounding records for root cause.'
      validation: 'Complete re-analysis by independent QC; active content must meet specification ±2% after rework or adjustment.'
    - defect: 'Suspensibility Below 90%'
      protocol: 'Quarantine the shift lot. Evaluate particle size distribution by laser diffraction. Re-mill through sand mill if D50 out of specification.'
      validation: 'Re-test suspensibility per CIPAC MT 15; particle size distribution verification; full specification re-check.'
    - defect: 'pH or Viscosity Out of Range'
      protocol: 'Adjust with approved buffer or viscosity modifier under controlled SRI instruction. Record adjustment volume and mixing parameters.'
      validation: 'Re-test pH and viscosity per CIPAC methods; stability verification at 54°C for 7 days after adjustment.'
    - defect: 'Label / Branding Typo'
      protocol: 'Immediate labeling line stop. Hold all labeled containers. Review the label artwork revision with the client; zero unapproved alterations.'
      validation: 'Spectrophotometer color check (Delta E ≤ 1.5); 100% visual text verification against the client-approved label PDF.'
    - defect: 'Packaging Mismatch / Missing SKU'
      protocol: 'Quarantine the export pallet. Unbox and perform a 100% itemized BOM check (container, label, cap, insert, batch code).'
      validation: 'Inline dynamic electronic checkweigher validation (±30 g variance); optical 2D barcode scanner verification.'

nc_scrap:
  tagline: Zero Market Leakage
  title: Witnessed Scrap & Destruction — Zero-Defect Anti-Diversion Protocol
  body: |
    Overseas brand partners need certainty that failed batches will never reach secondary retail, grey markets or e-commerce channels. Batches that cannot be brought into conformity are destroyed under a witnessed, recorded protocol:

    **1. Container de-identification.** Under QA Director supervision, all labels, batch codes, and brand markings are removed or permanently obliterated. Container caps and seals are removed, eliminating any salvageable branded components.

    **2. Formulation neutralization.** The non-conforming formulation is chemically neutralized per approved waste treatment protocol, rendering the active ingredient inactive and the product permanently unsuitable for any agricultural or commercial use.

    **3. Video & photo vault.** The destruction is recorded as an uncut 1080p video with close-ups of the batch label, the de-identification process, the neutralization and the final weighed scrap pile. The video is hashed (SHA-256) and archived on a controlled server for ≥ 5 years.

    **4. Certified waste disposal.** All formulation residue and packaging fragments are weighed, logged in the outbound ledger and transported only by qualified hazardous-waste disposal partners — no residue leaves the facility through any other channel.

    > **Brand protection guarantee:** QINGDAO VATRAD GROUP CO., LTD. guarantees 100% destruction of non-reworkable out-of-spec agrochemical products. Zero factory seconds or compromised products will ever enter secondary retail, grey markets or e-commerce channels. The Scrap & Destruction Certificate (VAT-QA-SCRAP-CERT-2026) records the product, batch, MRB conclusion, witness photos and dual sign-off by the QA Director and Plant Manager.

