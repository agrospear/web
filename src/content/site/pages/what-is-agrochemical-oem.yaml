answer:
  label: 'Straight answer'
  text: 'An agrochemical formulation is the physical form in which an active ingredient is delivered for crop protection — liquid formulations like SC, EC and WP, or dry formulations like WDG and DP. The formulation determines how the product mixes, sprays, and performs in the field. A well-designed formulation maximizes biological efficacy, storage stability, and user safety while meeting regulatory requirements for your target market.'
