meta:
  title: "Agrochemical OEM MOQ — Minimum Order Quantities Explained"
  description: "Clear MOQ tiers for custom agrochemical manufacturing: co-branding, pilot, 20+ ton volume per batch. Decision tree by customization level."
  dateModified: "2026-08-20"
  keywords:
    - 'OEM MOQ'
    - 'minimum order'
    - 'agrochemical manufacturing'

sections:
  - title: "Direct Answer"
    directAnswer:
      answer: "Existing-platform pilot runs start at 5 tons; standard volume MOQ is 20+ tons per batch."
      condition: "Specific MOQ depends on active ingredient, formulation type, packaging and whether custom formulation development is needed."
      value: "Co-branding from lower quantities · 5 tons pilot · 20+ tons standard volume"
      verifiedDate: "2026-08-20"
      sourceType: "factory-record"
    body: |
      MOQ at Agrospear is tiered by customization level, not a single flat number.
      Each tier corresponds to a specific production scenario:

      | Scenario | MOQ | Unit | Condition |
      |----------|-----|------|-----------|
      | Existing platform, label overlay only | Lower quantities | per design | Same formulation, same packaging, same concentration |
      | Custom label / packaging on existing platform | 5 tons | pilot batch | Same formulation; new label design requires visual proof |
      | Standard volume production (any platform) | 20+ tons | per batch | Per formulation batch; multiple SKUs = separate batches |
      | New formulation / custom development | 20+ tons | production run | Formulation development adds 15–20 days; one-time R&D fee |

  - title: "What counts as a 'production batch'?"
    body: |
      A standard production batch of 20+ tons produces product ready for filling and packaging.
      Each distinct SKU — meaning a different concentration, formulation type
      or packaging specification — requires its own batch and therefore its own MOQ.

      This is why the MOQ is stated "per batch" rather than "per design": two packaging configurations
      of the same formulation are two batches, two MOQs.

  - title: "Co-branding vs pilot vs volume"
    body: |
      **Co-branding (lower quantities)**: Your brand applied to an existing platform that is already in
      production for another brand. No label changes beyond the brand placement. Fastest route
      to a branded sample.

      **Pilot batch (5 tons)**: Custom label design, packaging, or concentration on an
      existing formulation platform. Requires visual proof approval before production. Ideal for market
      testing a new look.

      **Volume production (20+ tons per batch)**: Full production run with any combination of
      customization. This is the standard commercial tier.

  - title: "Custom formulation MOQ"
    body: |
      When your design requires a new formulation (not just new labeling on an existing product),
      dedicated R&D must be completed. This runs at the volume tier (20+ tons) because
      the formulation investment requires a production run to amortize. Development adds 15–20 days to
      the standard lead time.

      Formulation ownership: you own the custom formulation. It is stored at our facility and used exclusively for
      your production runs.

  - title: "Sample orders"
    body: |
      Pre-production samples are available at 1–4 tons for composition and quality confirmation.
      These are produced to your spec and typically take 7–14 days. Sample cost is credited
      against your first volume order.

