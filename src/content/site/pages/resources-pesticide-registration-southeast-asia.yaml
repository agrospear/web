answer:
  label: 'Straight answer'
  text: 'ASEAN pesticide registration remains country-specific despite harmonization efforts — each member state (Thailand, Vietnam, Indonesia, Philippines, Malaysia) requires its own submission with local bio-efficacy trials. Typical registration timelines range from 12-24 months, and most countries require ICAMA certificates, complete formulation specifications, GLP toxicity studies and residue data for food crops.'
  verified: '2026-08'

intro:
  - 'The ASEAN Harmonized Classification and Labelling of Chemicals (AHLC) provides a framework but pesticide registration authority rests with each national body: the Department of Agriculture in Thailand, the Plant Protection Department in Vietnam, the Directorate General of Pest Control in Indonesia and the Fertilizer and Pesticide Authority in the Philippines. Mutual recognition of data is increasing under the ASEAN Guidelines on Maximum Residue Limits, but separate national dossiers are still required.'
  - 'OEM buyers should partner with a manufacturer that provides complete data packages including ICAMA registration from China, CIPAC analytical methods, five-batch analysis, acute and chronic toxicity dossiers, and environmental fate studies. Agrospear supplies full registration documentation for all OEM formulations and has active registrations in 8+ ASEAN markets.'

