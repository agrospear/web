hero:
  tagline: 'Compliance Guide'
  title: 'Agrochemical Compliance by Market'
  subtitle: 'Every target market has distinct registration, labeling and documentation requirements. This guide maps the compliance landscape for agrochemical products across major markets — China, EU, North America, Africa, LATAM and beyond — so you can specify the right scope at quotation time, not after production.'

answer:
  label: 'Quick answer'
  text: 'For China: ICAMA registration is mandatory for products sold domestically — we register models destined for the Chinese market, scope confirmed per project. For EU: Regulation 1107/2009 and CLP labeling apply. For USA: EPA registration and state-level requirements apply. For Africa and LATAM: country-specific registration with FAO/WHO specification support. All markets: ISO 9001 (factory) and batch-level traceability are standard across our production regardless of destination. Compliance scope and costs are itemized in your quotation — no post-production surprises.'
  verified: '2026-08'

market_cards:
  tagline: Requirements by Region
  title: 'Compliance Requirements by Target Market'
  subtitle: 'Registration scope is confirmed per project during the feasibility review. The following shows typical requirements by market.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: CN
      icon_bg: blue
      title: 'China'
      desc: 'ICAMA registration mandatory. FAO/WHO specification compliance. ISO 9001 factory certification. Product-specific efficacy and toxicology data per active ingredient. Labeling per Chinese pesticide labeling standards. Batch-level traceability required.'
    - icon: EU
      icon_bg: green
      title: 'European Union'
      desc: 'Regulation 1107/2009 for active substance approval. CLP labeling (GHS classification). REACH (chemical safety) where applicable. Product-specific dossier per member state or zonal assessment. BSCI social audit available.'
    - icon: US
      icon_bg: purple
      title: 'United States'
      desc: 'EPA registration for pesticide products. State-level registration (California DPR, etc.). FIFRA labeling requirements. Toxicology and residue data per EPA data requirements. FTC labeling for country-of-origin.'
    - icon: GL
      icon_bg: orange
      title: 'Africa / LATAM / Global'
      desc: 'FAO/WHO specifications as quality benchmark. Country-specific registration with local authorities. Import documentation and conformity assessment per destination. ISO 9001 factory certification. Custom registration scope confirmed per project.'

certifications_detail:
  heading: 'Our Certification Scope'
  body: |
    The following certifications are held or available across our production. Specific certification scope for your project is confirmed during the feasibility review and itemized in your quotation.

    - **ISO 9001:2015** — Factory quality management system, audited annually by accredited third party. Covers the full manufacturing process from incoming raw material inspection through final packaging.
    - **ICAMA registration** — Applied to products destined for the Chinese market. Registration dossier prepared per project — efficacy, toxicology, residue and environmental fate data compiled and submitted.
    - **FAO/WHO specifications** — International quality benchmarks for agrochemical products. Specifications met per project for export markets.
    - **BSCI** — Business Social Compliance Initiative audit. Covers labor rights, workplace safety, environmental compliance and business ethics. Available for all markets.
    - **Batch traceability** — Full batch-level traceability with production records retained for 10 years. Available for any market inspection or audit.

compliance_process:
  tagline: How Compliance Works in Your Order
  title: 'Compliance in the Onboarding Flow'
  subtitle: 'Compliance is not an add-on — it is integrated into every gate of the onboarding process.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: 1
      icon_bg: blue
      title: 'Gate 1: Scope Confirmation'
      desc: 'At inquiry, you specify target markets. We confirm which registrations, tests and documentation apply to your specific product and destination. Compliance scope and any associated costs are itemized in the quotation.'
    - icon: 2
      icon_bg: green
      title: 'Gate 3: Sample Documentation'
      desc: 'Samples are produced to the confirmed compliance scope. If third-party lab testing is required (ICAMA, EPA, FAO/WHO), we coordinate testing through accredited laboratories. Test reports are delivered with the sample.'
    - icon: 3
      icon_bg: purple
      title: 'Gate 7: Documentation Package'
      desc: 'Every production order ships with a compliance documentation package: certificates of conformity, test reports, batch traceability records, material safety data and labeling compliance. Documentation is market-specific.'

faqs:
  tagline: FAQ
  title: 'Agrochemical Compliance — Frequently Asked Questions'
  items:
    - q: 'Do all agrochemical products need ICAMA registration?'
      a: 'ICAMA registration is required for products sold in the Chinese market. We register products destined for China with scope confirmed per project. Products shipped to non-Chinese markets follow the registration requirements of their destination country.'
    - q: 'Are your products FAO/WHO specification compliant?'
      a: 'Yes. All products can be manufactured to meet FAO/WHO specifications. Specification compliance is confirmed per project and documented with test reports. FAO/WHO specifications provide internationally recognized quality benchmarks accepted by most importing countries.'
    - q: 'Can you handle registration for a market not listed here?'
      a: 'Yes. We have shipped to 50+ countries and can coordinate registration and documentation for most markets. Tell us your destination country during the inquiry and we will confirm the specific registration scope and any additional testing or documentation required.'
    - q: 'How are compliance costs handled?'
      a: 'Compliance scope and any associated costs (third-party lab testing, registration fees) are itemized in your quotation during the feasibility review. No post-production compliance charges. Standard certifications (ISO 9001) are factory-level and do not add per-unit cost.'

