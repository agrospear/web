faqs:
  - question: '¿Qué tipos de formulaciones de herbicidas ofrece Agrospear?'
    answer: 'Producimos formulaciones SC (concentrado en suspensión), EC (emulsionable), WDG (gránulos dispersables en agua), WP (polvo mojable) y SL (solución líquida). Cada formulación se adapta al modo de acción del ingrediente activo, el cultivo objetivo y las preferencias del mercado destino.'
  - question: '¿Cómo manejan la resistencia de malezas a herbicidas?'
    answer: 'Aplicamos los criterios de clasificación HRAC para rotar modos de acción. Nuestro equipo de I+D desarrolla mezclas con sitios de acción complementarios y formulaciones que maximizan la eficacia con dosis reducidas, reduciendo la presión de selección sobre las poblaciones de malezas.'
  - question: '¿Cuál es el pedido mínimo para herbicidas personalizados?'
    answer: 'El MOQ por etapa es: muestra 1-4 t, piloto 5 t, producción estándar 20+ t. El plazo de entrega es de 25-35 días desde la confirmación de la orden y especificaciones.'
  - question: '¿Pueden fabricar herbicidas con registro para un país específico?'
    answer: 'Sí. Contamos con certificación ICAMA y experiencia en adaptar formulaciones a los requisitos regulatorios de más de 60 países. Proporcionamos documentación técnica completa para respaldar los trámites de registro local.'
body: |
  <h2>Control selectivo y no selectivo de malezas</h2>
  <p>El portfolio de herbicidas de Agrospear abarca tanto productos selectivos —que eliminan malezas sin afectar el cultivo— como herbicidas de contacto total para barbecho químico, siembra directa y limpieza de bordos. Los selectivos se formulan para aprovechar la diferencia fisiológica entre la especie cultivada y la maleza diana, ya sea por metabolismo diferencial, posición de la yema de crecimiento o absorción radial. Los no selectivos, a base de glifosato, glufosinato o paraquat, se destinan a situaciones donde se requiere una eliminación completa de la vegetación antes de la siembra o entre ciclos productivos.</p>
  <p>Nuestra línea selectiva cubre los principales grupos HRAC: inhibidores de ALS (grupo 2), de ACCasa (grupo 1), de PPO (grupo 14), sintetizadores de auxinas (grupo 4) e inhibidores de EPSPS (grupo 9). Cada formulación se optimiza para maximizar la selectividad al cultivo mientras se asegura un control superior de malezas gramíneas y de hoja ancha.</p>

  <h2>Formulaciones pre y post-emergentes</h2>
  <p>Los herbicidas pre-emergentes forman una barrera química en el perfil del suelo que impide la germinación o el establecimiento de plántulas de malezas. Agrospear formula productos pre-emergentes en SC y WDG que garantizan una liberación sostenida del ingrediente activo durante 4-8 semanas, con baja lixiviación y alta residualidad even en suelos livianos. Las formulaciones WDG ofrecen ventajas logísticas: menor volumen de transporte, estabilidad térmica superior y dosificación precisa.</p>
  <p>En post-emergencia, nuestras formulaciones EC y SL proporcionan una rápida absorción foliar y translocación sistémica. El vehículo emulsionable del EC facilita la penetración cuticular, mientras que las soluciones SL de glifosato se complementan con surfactantes optimizados para maximizar la absorción en condiciones de estrés hídrico. Todos los productos incluyen coadyuvantes específicos que reducen la deriva y mejoran la cobertura en aplicaciones de volumen bajo.</p>

  <h2>Manejo de resistencia según criterios HRAC</h2>
  <p>La resistencia de malezas es uno de los desafíos más críticos de la agricultura moderna. Agrospear sigue estrictamente la clasificación HRAC de modos de acción y trabaja con sus clientes para diseñar programas de manejo que roten sitios de acción, integren control mecánico y limiten el número de aplicaciones del mismo grupo por ciclo. Nuestro laboratorio analiza poblaciones de malezas con sospecha de resistencia y ajusta las formulaciones en consecuencia, incorporando segundos ingredientes activos con modo de acción distinto para restaurar el nivel de control.</p>
  <p>Las premezclas con doble sitio de acción (por ejemplo, ALS + PPO, o ACCasa + sintetizador de auxinas) representan una proporción creciente de nuestros despachos OEM. Estas combinaciones no solo amplían el espectro de control sino que reducen significativamente la presión de selección sobre cada modo de acción individual, prolongando la vida útil de los herbicidas en el mercado destino.</p>

